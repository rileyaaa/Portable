name: One-time Portable r2 release request

# Owner-requested one-shot dispatcher. The formal release stays manual and
# performs all ten rounds itself. Remove this bootstrap after verified release.
on:
  push:
    branches: [main]
    paths: [.github/workflows/request-release-r2.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
concurrency:
  group: portable-r2-request
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'ci: request Portable r2 after ten fresh rounds [portable-r2]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out only the reviewed release preparation files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/workflows/release.yml
            /.github/scripts/prepare-release-r2.py
      - name: Prepare README and push without rewriting concurrent work
        id: source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-release-r2.py
          git add -- README.md
          test "$(git diff --cached --name-only)" = 'README.md'
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: describe Portable r2 fixes and ten-round release gate'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch full Windows validation, ten rounds and verified publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current" = "$SOURCE_COMMIT"
          tags=$(git ls-remote --tags origin refs/tags/v0.166.0-portable.2)
          test -z "$tags"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=v0.166.0-portable.2 -f publish_release=true -f check_set=full
          echo "DISPATCHED_FULL_WINDOWS_TEN_ROUND_GATE=$SOURCE_COMMIT"
