name: "01 - 一键更新便携包（开发验证）"

# Single no-input entry, development-only. Supported Node/CLI updates join the verified runtime candidate. Unreviewed
# full-tool plans remain blocked; no Release is published by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-portable-development-auto-upgrade
  cancel-in-progress: false

jobs:
  metadata_gate:
    name: Inspect current official Tool versions before using Windows
    if: ${{ github.ref == 'refs/heads/development/latest-codex-portable-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      tool_updates: ${{ steps.versions.outputs.updates }}
      codex_updates: ${{ steps.codex_version.outputs.codex_updates }}
    steps:
      - name: Checkout only trusted read-only version inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/maintenance/03-update-route.py
            /tool/auto-tool-updates.py
            /tool/installed-tools.json
            /tool/full-stable-upgrade-plan.json
            /tool/python-build-manifest.json
            /tool/automation/versions.json
            /.github/maintenance/01-combined-candidate.py
            /.github/maintenance/01-check-codex-stable.py
            /.github/maintenance/01-upgrade-runtime.py
            /tool/runtime-manifest.json
            /tests/test_combined_candidate.py
            /tests/test_codex_metadata_preflight.py
      - name: Use pinned metadata-only Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Test combined Git candidate hashing and Codex discovery without Windows
        run: |
          python -E -s -B -m unittest discover -s tests -p test_combined_candidate.py -v
          python -E -s -B -m unittest discover -s tests -p test_codex_metadata_preflight.py -v
      - name: Check latest published official stable Codex without downloading binaries
        id: codex_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -E -s -B .github/maintenance/01-check-codex-stable.py
      - name: Discover authenticated official Tool updates and reviewed full plan
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -E -s -B tool/auto-tool-updates.py check
          python -E -s -B .github/maintenance/03-update-route.py
      - name: Reject unreviewed full Tool plan before Windows checkout
        env:
          AUTO_CHANGES: ${{ steps.versions.outputs.updates }}
          REVIEWED_CHANGES: ${{ steps.versions.outputs.full_plan_changes }}
          CODEX_CHANGES: ${{ steps.codex_version.outputs.codex_updates }}
        run: |
          set -euo pipefail
          if [[ "$AUTO_CHANGES" != "true" && "$AUTO_CHANGES" != "false" ]] ||
             [[ "$CODEX_CHANGES" != "true" && "$CODEX_CHANGES" != "false" ]] ||
             [[ "$REVIEWED_CHANGES" != "true" && "$REVIEWED_CHANGES" != "false" ]]; then
            echo "::error::Tool discovery returned an unverified decision"
            exit 1
          fi
          if [[ "$REVIEWED_CHANGES" == "true" ]]; then
            echo 'FULL_TOOL_UPDATE_NOT_IMPLEMENTED=BLOCKED; no Windows or LFS checkout' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The reviewed full-tool plan needs a separately checked combined candidate"
            exit 1
          fi
          echo "OFFICIAL_AUTO_TOOL_UPDATES=$AUTO_CHANGES" >> "$GITHUB_STEP_SUMMARY"
          echo "OFFICIAL_CODEX_UPDATES=$CODEX_CHANGES" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$AUTO_CHANGES" == 'false' && "$CODEX_CHANGES" == 'false' ]]; then
            echo 'NO_UPDATES_NEEDED=PASS; Windows and LFS checkout skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Reviewed full Tool plan unchanged; candidate can proceed to Windows verification.' >> "$GITHUB_STEP_SUMMARY"
          fi
  upgrade:
    needs: metadata_gate
    if: ${{ needs.metadata_gate.result == 'success' && (needs.metadata_gate.outputs.codex_updates == 'true' || needs.metadata_gate.outputs.tool_updates == 'true') && github.ref == 'refs/heads/development/latest-codex-portable-20261106' }}
    permissions:
      contents: read
    outputs:
      update_needed: ${{ steps.official.outputs.update_needed }}
      codex_update_needed: ${{ steps.official.outputs.codex_needed }}
      tool_update_needed: ${{ needs.metadata_gate.outputs.tool_updates }}
      release_url: ${{ steps.official.outputs.release_url }}
      version: ${{ steps.official.outputs.version }}
      archive_sha256: ${{ steps.official.outputs.archive_sha256 }}
      changelog_date: ${{ steps.official.outputs.changelog_date }}
      candidate_sha256: ${{ steps.candidate.outputs.sha256 }}
      tool_candidate_sha256: ${{ steps.tool_candidate.outputs.sha256 }}
    runs-on: windows-latest
    timeout-minutes: 125
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out full source and hydrate existing Git LFS binaries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Lint three official YAMLs with pinned actionlint
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\.github\maintenance\check-actionlint.ps1
          if ($LASTEXITCODE -ne 0) { throw 'actionlint failed.' }

      - name: Fast preflight - maintenance contracts and real bundled Tool audit
        timeout-minutes: 9
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @('test_maintenance_workflows.py','test_mode_copies.py','test_upgrade_roundtrip.py')) {
            & .\tool\python\python.exe -E -s -B -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { throw "Preflight regression failed: $suite" }
          }
          # Check installed Tool/Windows support first, before expensive
          # repeated disposable child processes or downloading any candidate.
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\.github\maintenance\02-tool-compatibility.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Tool environment or native compatibility failed.' }

      - name: Discover official Node and CLI tool updates
        id: tool_auto
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -E -s -B .\tool\auto-tool-updates.py check
          if ($LASTEXITCODE -ne 0) { throw 'Official Tool stable discovery failed.' }

      - name: Inspect reviewed full Tool update plan
        id: tool_reviewed
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -E -s -B .\.github\maintenance\03-update-route.py
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed full Tool plan failed.' }

      - name: Recheck Tool metadata decisions before candidate staging
        timeout-minutes: 2
        env:
          AUTO_UPDATES: ${{ steps.tool_auto.outputs.updates }}
          FULL_UPDATES: ${{ steps.tool_reviewed.outputs.full_plan_changes }}
          PRECHECK_AUTO_UPDATES: ${{ needs.metadata_gate.outputs.tool_updates }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AUTO_UPDATES -notin @('true','false') -or
              $env:FULL_UPDATES -cne 'false' -or
              $env:AUTO_UPDATES -cne $env:PRECHECK_AUTO_UPDATES) {
            throw 'Tool update decision changed between the metadata gate and Windows runner.'
          }
          'SUPPORTED_TOOL_DISCOVERY=VERIFIED; full Tool plan unchanged' |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Discover latest official Codex stable and verify upstream SHA256
        id: official
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_UPDATE_NEEDED: ${{ needs.metadata_gate.outputs.tool_updates }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TOOL_UPDATE_NEEDED -notin @('true','false')) { throw 'Missing verified Tool update decision.' }
          $tmp = Join-Path $env:GITHUB_WORKSPACE 'tmp/codex-portable-manual-upgrade'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $plan = Join-Path $tmp 'verified-upstream.json'
          & .\tool\python\python.exe -B .\.github\maintenance\01-upgrade-runtime.py --metadata --repo . --plan $plan
          if ($LASTEXITCODE -ne 0) { throw 'Official stable discovery or metadata verification failed.' }
          $current = (Get-Content -LiteralPath '.\tool\runtime-manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $day = [DateTime]::UtcNow.ToString('yyyy-MM-dd')
          "UPGRADE_CHANGELOG_DATE=$day" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "changelog_date=$day" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "UPGRADE_VERSION=$current" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path -LiteralPath $plan -PathType Leaf)) {
            'codex_needed=false' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=$current" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            if ($env:TOOL_UPDATE_NEEDED -eq 'true') {
              'update_needed=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              'CODEX_ALREADY_CURRENT=PASS; only supported Tool updates are pending.' |
                Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            } else {
              'update_needed=false' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              'CODEX_AND_SUPPORTED_TOOLS_CURRENT=PASS; no candidate or Release needed.' |
                Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            return
          }
          $approved = Get-Content -LiteralPath $plan -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($approved.prerelease -or $approved.release_url -notmatch '^https://github\.com/openai/codex/releases/tag/rust-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Automatic Codex upgrade requires an official stable release.'
          }
          'codex_needed=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'update_needed=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_url=$($approved.release_url)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "UPGRADE_PLAN=$plan" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPGRADE_TEMP=$tmp" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPGRADE_VERSION=$($approved.version)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPGRADE_TAG=$($approved.tag)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$($approved.version)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_sha256=$($approved.archive.sha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Official Release: $($approved.release_url)" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'Channel: official stable; Tool candidates require the same combined Windows verification.' |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Download only the official canonical Windows x64 archive
        if: ${{ success() && steps.official.outputs.codex_needed == 'true' }}
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release download $env:UPGRADE_TAG --repo openai/codex --pattern 'codex-package-x86_64-pc-windows-msvc.tar.gz' --dir $env:UPGRADE_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Official Windows runtime download failed.' }
          $archive = Join-Path $env:UPGRADE_TEMP 'codex-package-x86_64-pc-windows-msvc.tar.gz'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Downloaded upstream package is missing.' }
          "UPGRADE_ARCHIVE=$archive" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply verified archive using only the trusted maintenance script
        if: ${{ success() && steps.official.outputs.codex_needed == 'true' }}
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B .\.github\maintenance\01-upgrade-runtime.py --apply --repo . --version $env:UPGRADE_VERSION --plan $env:UPGRADE_PLAN --archive $env:UPGRADE_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Unsupported upstream layout or code adaptation. No commit or release will be made.' }

      - name: Inspect candidate native runtime without a repository write token
        if: ${{ success() && steps.official.outputs.codex_needed == 'true' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $reported = & .\codex.exe --version
          if ($LASTEXITCODE -ne 0 -or (($reported -join [Environment]::NewLine).Trim() -cne ('codex-cli ' + $env:UPGRADE_VERSION))) {
            throw 'Native Codex version did not match the target.'
          }
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $models = & .\codex.exe debug models --bundled
          if ($LASTEXITCODE -ne 0) { throw 'Official model catalog export failed.' }
          $json = ($models -join [Environment]::NewLine)
          $null = $json | ConvertFrom-Json
          $catalog = Join-Path $env:UPGRADE_TEMP 'bundled-models.json'
          [IO.File]::WriteAllText($catalog, $json, (New-Object Text.UTF8Encoding($true)))
          "UPGRADE_MODELS=$catalog" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export existing model catalog only when Codex is already current
        if: ${{ success() && steps.official.outputs.codex_needed == 'false' && needs.metadata_gate.outputs.tool_updates == 'true' }}
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $models = & .\codex.exe debug models --bundled
          if ($LASTEXITCODE -ne 0) { throw 'Existing official model export failed.' }
          $json = ($models -join [Environment]::NewLine)
          $null = $json | ConvertFrom-Json
          $temp = Join-Path $env:GITHUB_WORKSPACE 'tmp/codex-portable-manual-upgrade'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $catalog = Join-Path $temp 'bundled-models.json'
          [IO.File]::WriteAllText($catalog, $json, (New-Object Text.UTF8Encoding($true)))
          "UPGRADE_MODELS=$catalog" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and commit runtime-only local checkpoint before staging Tool
        if: ${{ success() && steps.official.outputs.codex_needed == 'true' }}
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          & git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS is required for runtime update.' }
          & git add -u
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage runtime files.' }
          & .\tool\python\python.exe -E -s -B .\.github\maintenance\01-upgrade-runtime.py --check-index --repo .
          if ($LASTEXITCODE -ne 0) { throw 'Codex stage exceeds exact runtime allowlist or LFS hash.' }
          & git -c core.whitespace=cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Codex stage contains malformed metadata.' }
          & git -c user.name='runtime-verifier' -c user.email='verifier@users.noreply.github.com' commit -m ('test(runtime): local-only checkpoint ' + $env:UPGRADE_VERSION)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot checkpoint verified runtime stage locally.' }
          'CODEX_RUNTIME_CHECKPOINT=PASS; no remote writes' |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Prepare SHA256 pinned official Tool stage next to the Codex checkpoint
        if: ${{ success() && needs.metadata_gate.outputs.tool_updates == 'true' }}
        id: tool_candidate
        timeout-minutes: 28
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -E -s -B .\tool\auto-tool-updates.py plan
          if ($LASTEXITCODE -ne 0) { throw 'Official Tool asset discovery failed.' }
          $plan = Get-Content -LiteralPath '.\tmp\auto-tool-update-plan.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($plan.candidates).Count -lt 1) { throw 'Official Tool update plan is unexpectedly empty.' }
          if (@($plan.candidates | Where-Object { $_.tool -ceq 'node' }).Count -eq 1) {
            & git lfs install --local
            if ($LASTEXITCODE -ne 0) { throw 'Node candidate requires LFS.' }
          }
          'TOOL_AUTO_UPDATE_PLAN=1' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:TOOL_AUTO_UPDATE_PLAN = '1'
          & .\tool\python\python.exe -E -s -B .\tool\update-tools.py prepare --group tools --day $env:UPGRADE_CHANGELOG_DATE
          if ($LASTEXITCODE -ne 0) { throw 'Official SHA-256 Tool payload staging failed.' }
          & git add -A -- tool .gitattributes
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage Tool files.' }
          & .\tool\python\python.exe -E -s -B .\tool\update-tools.py lint-staged --group tools
          if ($LASTEXITCODE -ne 0) { throw 'Tool staged scope or first-party metadata rejected.' }
          $digestLine = (& .\tool\python\python.exe -E -s -B .\tool\update-tools.py digest --group tools) -join ''
          $shaMatch = [regex]::Match([string]$digestLine, '^TOOL_DIFF_SHA256=([a-f0-9]{64})$')
          if ($LASTEXITCODE -ne 0 -or -not $shaMatch.Success) { throw 'Tool digest invalid.' }
          "sha256=$($shaMatch.Groups[1].Value)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & .\tool\python\python.exe -E -s -B .\tool\update-tools.py verify --group tools
          if ($LASTEXITCODE -ne 0) { throw 'Native Tool version verification failed.' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\.github\maintenance\02-tool-compatibility.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updated Tool native compatibility failed.' }

      - name: Hash exact combined runtime and Tool stage for trusted writer
        if: ${{ success() && steps.official.outputs.update_needed == 'true' }}
        id: candidate
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & .\tool\python\python.exe -E -s -B .\.github\maintenance\01-combined-candidate.py --repo . --base $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot hash combined candidate index.' }
          $lines = @($output | Where-Object { $_ -match '^COMBINED_CANDIDATE_SHA256=[a-f0-9]{64}$' })
          if ($lines.Count -ne 1) { throw 'Missing unique verified combined digest.' }
          $hash = $lines[0].Split('=')[1]
          "sha256=$hash" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Combined diff SHA256: $hash" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Fail-closed compatibility, Windows preflight and packaging checks
        if: ${{ success() && steps.official.outputs.update_needed == 'true' }}
        timeout-minutes: 19
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_runtime_package.py','test_mode_copies.py','test_tui_fullscreen.py','test_release_package.py','test_upgrade_roundtrip.py')) {
            & .\tool\python\python.exe -B -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "Runtime upgrade regression failed: $test" }
          }
          & .\tool\python\python.exe -B .\.github\maintenance\02-compatibility.py --repo . --native
          if ($LASTEXITCODE -ne 0) { throw 'Updated variable/schema audit failed. Nothing will be committed.' }
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoProfile -ExecutionPolicy Bypass -File .\tests\test_portable_config.ps1 -BundledModelsPath $env:UPGRADE_MODELS
          if ($LASTEXITCODE -ne 0) { throw 'Model/launcher compatibility regression failed.' }
          & $ps -NoProfile -ExecutionPolicy Bypass -File .\tests\test_runtime_preflight.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows native preflight regression failed.' }
          & $ps -NoProfile -ExecutionPolicy Bypass -File .\tests\test_cli_model_options.ps1
          if ($LASTEXITCODE -ne 0) { throw 'CLI option compatibility regression failed.' }

      - name: Make an unpushed local stable candidate checkpoint before Windows parity tests
        if: ${{ success() && steps.official.outputs.update_needed == 'true' }}
        timeout-minutes: 5
        env:
          EXPECTED_COMBINED_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UPGRADE_VERSION -match '-') { throw 'Prereleases are never committed.' }
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $staged = @( & git diff --cached --name-only )
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the local Tool stage.' }
          if ($staged.Count -gt 0) {
            & git commit -m ('test(combined): unpushed Windows candidate ' + $env:UPGRADE_VERSION)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit the Tool checkpoint locally.' }
          }
          $checkpoint = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkpoint -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid local combined candidate SHA.' }
          & .\tool\python\python.exe -E -s -B .\.github\maintenance\01-combined-candidate.py --repo . --base $env:GITHUB_SHA --expected $env:EXPECTED_COMBINED_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Committed Windows candidate differs from the staged combined digest.' }
          "CANDIDATE_LOCAL_SHA=$checkpoint" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare isolated environment for stable-only precommit Windows tests
        if: ${{ success() && steps.official.outputs.update_needed == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'tmp/windows-release-state'
          $state = @{
            HOME = 'home'; USERPROFILE = 'home'; APPDATA = 'appdata'; LOCALAPPDATA = 'localappdata';
            PROGRAMDATA = 'programdata'; ALLUSERSPROFILE = 'programdata';
            TEMP = 'temp'; TMP = 'temp'; TMPDIR = 'temp';
            XDG_CACHE_HOME = 'cache'; XDG_CONFIG_HOME = 'config'; XDG_DATA_HOME = 'data'; XDG_STATE_HOME = 'state';
            CODEX_HOME = 'codex-home'; CODEX_SQLITE_HOME = 'sqlite'; GH_CONFIG_DIR = 'gh'
          }
          foreach ($name in $state.Keys) {
            $path = Join-Path $base $state[$name]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'PIP_CONFIG_FILE=nul' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'PYTHONDONTWRITEBYTECODE=1' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'POWERSHELL_TELEMETRY_OPTOUT=1' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $modules = Join-Path $base 'cache/modules'
          New-Item -ItemType Directory -Force -Path $modules | Out-Null
          "PSModulePath=$modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

          $modelCatalog = Join-Path $base 'bundled-models.json'
          if (-not (Test-Path -LiteralPath $env:UPGRADE_MODELS -PathType Leaf)) { throw 'Candidate model catalog is missing.' }
          Copy-Item -LiteralPath $env:UPGRADE_MODELS -Destination $modelCatalog -Force

      - name: Windows PowerShell 5.1 - test_portable_config
        if: ${{ success() && steps.official.outputs.update_needed == 'true' }}
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_portable_config.ps1 -BundledModelsPath .\tmp\windows-release-state\bundled-models.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression failure: test_portable_config' }

      - name: Windows PowerShell 5.1 - test_portable_paths
