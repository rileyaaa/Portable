name: Stable tool refresh - independent HTTP, Excel and timezone candidates (one time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/refresh-http-stable.yml]
permissions: {}
concurrency:
  group: stable-tool-refresh-http
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.event.before == '7b922aeaac1fffac037e02feec800dcb0f91d6ea' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 7b922aeaac1fffac037e02feec800dcb0f91d6ea
      TARGET_BRANCH: dev/stable-tool-refresh
    steps:
      - name: Preserve tracked bytes and isolate CI module cache
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git configuration failed' }
          $dir = Join-Path $env:RUNNER_TEMP ('http-refresh-pscache-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $dir
          ('PSModuleAnalysisCachePath=' + (Join-Path $dir 'ModuleAnalysisCache')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Confirm source candidate, frozen references and clean checkout
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -cne $env:BASE) { throw 'Wrong checkout or parent' }
          $changed = @(git diff --name-only $env:BASE HEAD)
          if ($changed.Count -ne 6 -or @('.github/workflows/refresh-http-stable.yml','tests/check_office_data_stable_refresh.py','tests/stage_office_data_stable_refresh.py','tests/stage_http_stable_refresh.py','tests/stage_stable_batch.py','DEVELOPMENT.md' | Where-Object { $changed -cnotcontains $_ }).Count -ne 0) { throw 'Unexpected trigger changes' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved' }
          }
          $fixed = @(git diff --name-only 080cb33557ea4ac857425704866bd94fdc4a9c6d HEAD -- env.ps1 run-codex.ps1 codex.exe codex-code-mode-host.exe codex-path tool/runtime-manifest.json tool/python tool/python-packages.in.txt tool/python-packages.lock.txt tool/node tool/automation Version_History)
          if ($LASTEXITCODE -ne 0 -or $fixed.Count -ne 0) { throw 'Unexpected fixed runtime change' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS verification failed' }
      - name: Existing source regressions before dependency replacement
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast
          from pathlib import Path
          for p in ("tool/portable-ssh.py","tests/test_portable_ssh.py","home/skills/pdf-library/scripts/pdf_library.py","tests/test_pdf_library_database.py","tests/check_http_stable_refresh.py","tests/stage_http_stable_refresh.py","tests/stage_stable_batch.py","tests/check_office_data_stable_refresh.py","tests/stage_office_data_stable_refresh.py"):
              ast.parse(Path(p).read_text(encoding="utf-8"),filename=p)
          print("SOURCE_AST=PASS")
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Source syntax failed' }
          foreach ($test in @('test_portable_ssh.py','test_pdf_library_database.py','test_pdf_library.py','test_login_json_http.py')) {
            & .\tool\python\python.exe -B -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE) { throw "Source regression failed: $test" }
          }
          Write-Output 'SSH_PDF_HTTP_SOURCE_REGRESSIONS=PASS'
      - name: Independently verify and stage fixed HTTP, Excel and timezone candidates
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/stage_stable_batch.py
          if ($LASTEXITCODE) { throw 'Batch integrity or rollback failed; do not push' }
      - name: Full existing Python and Node regression suite
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Full Python regression failed' }
          foreach ($test in @('test_portable_npm.js','test_automation.js')) {
            & .\tool\node\node.exe --test (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Node regression failed: $test" }
          }
      - name: Existing Windows PowerShell path isolation and setup regressions
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_python_setup.ps1','test_portable_paths.ps1','test_launcher_smoke.ps1','test_runtime_preflight.ps1','test_npm_entrypoints.ps1','test_automation_paths.ps1','test_automation_process.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Windows regression failed: $test" }
          }
      - name: Actual common-mode and relocated tools with read-only browser discovery
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('normal','unknown','browser-check')) {
            & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py $mode
            if ($LASTEXITCODE) { throw "Native common-mode probe failed: $mode" }
          }
      - name: Actual YOLO browser, persistence, native MCP and Office PDF
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser
          if ($LASTEXITCODE) { throw 'Native YOLO probe failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
          if ($LASTEXITCODE) { throw 'Real browser persistence and cleanup failed' }
          & .\tool\python\python.exe -B tests/check_browser_mcp_stdio.py
          if ($LASTEXITCODE) { throw 'Real stdio MCP failed' }
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Native MCP integration failed' }
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py documents
          if ($LASTEXITCODE) { throw 'Native Office/PDF probe failed' }
      - name: Final LFS and customer input integrity, no archive or artifact
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.\Microsoft\Windows\PowerShell\ModuleAnalysisCache') { throw 'Unexpected checkout PowerShell module cache after native tests' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Candidate worktree became dirty during native regression' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS gate failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input integrity failed' }
          Write-Output 'BATCH_STABLE_WINDOWS_NATIVE_VALIDATION=PASS'
          Write-Output 'Real Windows processes with synthetic model/inputs; no real account, devices, optional renderers or formula calculation tested.'
      - name: Push only validated fast-forward development commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne "refs/heads/$env:TARGET_BRANCH" -or $env:TARGET_BRANCH -cne 'dev/stable-tool-refresh') { throw 'Wrong target branch' }
          $current = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:GITHUB_SHA HEAD
          if ($LASTEXITCODE) { throw 'Candidate not descended from exact trigger' }
          $count = [int](git rev-list --count "$env:GITHUB_SHA..HEAD")
          if ($LASTEXITCODE -ne 0 -or $count -gt 3) { throw 'Unexpected local commit count' }
          if ($count -eq 0) { Write-Output 'NO_DEPENDENCY_CANDIDATE_PASSED; native source gate passed'; return }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved before push' }
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          try {
            & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
            if ($LASTEXITCODE) { throw 'Validated development-only push failed' }
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
          }
          $after = (git ls-remote origin "refs/heads/$env:TARGET_BRANCH") -join ''
          if ($LASTEXITCODE -ne 0 -or $after -cne ($current + [char]9 + "refs/heads/$env:TARGET_BRANCH")) { throw 'Development push readback mismatch' }
          foreach ($ref in @('refs/heads/main','refs/tags/v0.172.0-portable.1')) {
            $remote = (git ls-remote origin $ref) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:FROZEN + [char]9 + $ref)) { throw 'Frozen ref changed' }
          }
          Write-Output "VALIDATED_DEV_COMMIT=$current"
          Write-Output 'NO_RELEASE_NO_ARTIFACT_NO_MAIN_CHANGE'
