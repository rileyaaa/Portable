name: One-time 0.166.0 r1 repack and r2 retirement

# Owner-authorized one-shot replacement. The production release workflow remains
# workflow_dispatch only. This bootstrap deletes itself after verified success.
on:
  push:
    branches: [main]
    paths: [.github/workflows/repack-0166-r1-once.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-0166-r1-repack
  cancel-in-progress: false

jobs:
  replace:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'ci: dispatch verified 0.166.0 r1 and retire r2 [one-shot-0166-r1]')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact reviewed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /codex-package.json
            /tool/runtime-manifest.json
            /.github/workflows/release.yml
            /.github/workflows/repack-0166-r1-once.yml

      - name: Verify source, requested tag and older release before dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          grep -q '^  workflow_dispatch:' .github/workflows/release.yml
          ! grep -q '^  push:' .github/workflows/release.yml
          test -z "$(git ls-remote --tags origin refs/tags/v0.166.0-portable.1)"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.1" >/dev/null 2>&1; then
            echo 'Target r1 release already exists; refusing to overwrite'
            exit 1
          fi
          test -z "$(git ls-tree --name-only HEAD -- codex-exec-server.exe)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          runtime=json.loads(Path('tool/runtime-manifest.json').read_text())
          metadata=json.loads(Path('codex-package.json').read_text())
          assert runtime['version']=='0.166.0'
          assert len(runtime['files'])==6
          assert 'codex-exec-server.exe' not in runtime['files']
          assert 'execServer' not in metadata
          assert metadata['entrypoint']=='codex.exe'
          assert 'v0.166.0-portable.1' in Path('.github/workflows/release.yml').read_text()
          print('LOCAL_ONLY_R1_LAYOUT=PASS')
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.2" > "$RUNNER_TEMP/old-r2.json"
          python3 - "$RUNNER_TEMP/old-r2.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          assert obj['id']==428857381, 'Old r2 release identity changed'
          assert obj['tag_name']=='v0.166.0-portable.2' and not obj['draft']
          assert obj['target_commitish']=='f449b939bb027b4e3e1537d1b375d7552db23ed8'
          assert len(obj['assets'])==3
          print('OLD_R2_DELETION_GUARD=PASS')
          PY

      - name: Dispatch full Windows validation, ten fresh rounds and r1 publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version=v0.166.0-portable.1 \
            -f publish_release=true \
            -f check_set=full
          echo "REQUESTED_R1_BUILD_SOURCE=$GITHUB_SHA"

      - name: Await newly dispatched Windows job (never use stale results)
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for n in $(seq 1 40); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=5" --jq '.workflow_runs[0].id // empty')
            if test -n "$run_id"; then break; fi
            sleep 5
          done
          test -n "$run_id" || { echo 'Fresh release run was never created'; exit 1; }
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')" = "$GITHUB_SHA"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')" = 'success'
          echo "FULL_WINDOWS_TEN_ROUND_RELEASE=PASS run=$run_id"

      - name: Verify the new published r1 before touching the old r2
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.1" > "$RUNNER_TEMP/new-r1.json"
          python3 - "$RUNNER_TEMP/new-r1.json" "$GITHUB_SHA" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          commit=sys.argv[2]
          assert obj['tag_name']=='v0.166.0-portable.1'
          assert not obj['draft'] and not obj['prerelease']
          assert obj['target_commitish']==commit, 'Release source differs from audited commit'
          expected={
              'Codex-Portable-v0.166.0-portable.1-windows-x64.zip',
              'release-manifest.json',
              'SHA256SUMS',
          }
          assert {x['name'] for x in obj['assets']}==expected
          assert all(x['state']=='uploaded' and x['size']>0
                     and x.get('digest','').startswith('sha256:')
                     for x in obj['assets'])
          print('REPACK_R1_PUBLISHED_AND_THREE_ASSETS_VERIFIED=PASS')
          PY
          tag_sha=$(git ls-remote --tags origin refs/tags/v0.166.0-portable.1 | cut -f1)
          test "$tag_sha" = "$GITHUB_SHA"

      - name: Retire only the exact known r2 Release and Git tag
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.2" > "$RUNNER_TEMP/verify-old-r2.json"
          python3 - "$RUNNER_TEMP/verify-old-r2.json" <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding='utf-8'))
          assert obj['id']==428857381
          assert obj['tag_name']=='v0.166.0-portable.2'
          assert obj['target_commitish']=='f449b939bb027b4e3e1537d1b375d7552db23ed8'
          assert not obj['draft'] and len(obj['assets'])==3
          print('OLD_R2_IDENTITY_RECHECK=PASS')
          PY
          gh release delete v0.166.0-portable.2 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.2" >/dev/null 2>&1; then
            echo 'Old r2 Release still exists'
            exit 1
          fi
          test -z "$(git ls-remote --tags origin refs/tags/v0.166.0-portable.2)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.164.0-portable.1" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.166.0-portable.1" > /dev/null
          echo "OLD_R2_RELEASE_AND_TAG_DELETED=PASS"

      - name: Remove temporary push bootstrap and verify main is still protected
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          git rm -- .github/workflows/repack-0166-r1-once.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/repack-0166-r1-once.yml'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove completed one-shot r1 repack bootstrap'
          commit=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$commit"
          echo "ONE_SHOT_BOOTSTRAP_REMOVED=PASS"
          echo "REPACK_PUBLISHED=https://github.com/$GITHUB_REPOSITORY/releases/tag/v0.166.0-portable.1"
