name: Fixed system seed and scoped f2py repair; isolated OCR feasibility
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/fixed-seed-f2py-ocr.yml]
permissions: {}
concurrency:
  group: portable-fixed-seed-f2py-ocr
  cancel-in-progress: false
jobs:
  ocr:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve exact bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Isolated UCRT64 publisher lock, archive checks, DLL closure, and actual Chinese recognition
        id: probe
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          $root=$pwd.Path
          $scratch=Join-Path $root 'tmp/ocr-feasibility-env'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          foreach ($key in @('HOME','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP','TMPDIR','PROGRAMDATA','ALLUSERSPROFILE','PUBLIC')) {
            [Environment]::SetEnvironmentVariable($key,$scratch,'Process')
          }
          $env:PSModuleAnalysisCachePath=Join-Path $scratch 'ps-module-cache'
          $env:PATH=(Join-Path $env:SystemRoot 'System32')
          & .\tool\python\python.exe -I -B tests/check_msys2_ocr_feasibility.py (Join-Path $root 'tmp/ocr-feasibility-report.json')
          if ($LASTEXITCODE) { throw 'Technical OCR feasibility incomplete; no fallback integrated' }
      - name: Upload only synthetic JSON evidence, not binaries or extracted notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msys2-ocr-feasibility-evidence
          path: tmp/ocr-feasibility-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve technical failure status
        if: always() && steps.probe.outcome != 'success'
        run: throw 'OCR feasibility not passed'
  candidate:
    needs: [ocr]
    if: always() && github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: powershell
    env:
      BASE: a2871a2a9be66f4969dca866fe5d58827ccb7093
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Verify exact narrow source scope and previous completed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.before -cne $env:BASE -or (git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source or parent' }
          $prior=Invoke-RestMethod -Uri 'https://api.github.com/repos/rileyaaa/Portable/actions/runs/45747282942' -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'User-Agent'='portable-fixed-seed'}
          if ($prior.status -cne 'completed' -or (Test-Path -LiteralPath '.github/workflows/sandbox-cache-paths-followup.yml')) { throw 'Prior run not finalized' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@('refs/heads/dev/stable-tool-refresh',$env:GITHUB_SHA))) {
            $actual=(git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -or $actual -cne ($pair[1]+[char]9+$pair[0])) { throw 'Frozen or dev ref changed' }
          }
          @'
          import json,os,subprocess
          from pathlib import Path
          j=json.loads(Path("tests/sandbox_cache_paths_45747282942.json").read_bytes())
          rows=[r["detail"] for r in j["probe"]["rows"] if r["item"]=="fixed embedded system cache source membership and all bytes"]
          assert len(rows)==2 and all(r["verified"] for r in rows) and rows[0]["files"]==rows[1]["files"]
          delta=rows[0]["runtime_delta_against_pristine"]
          assert delta==rows[1]["runtime_delta_against_pristine"]
          expected={"home/skills/.system/"+n for k in ("added","removed","changed") for n in delta[k]}
          expected.update({"tool/bin/f2py.cmd","tool/\u5de5\u5177\u66f4\u65b0\u8bf4\u660e.md",
            "tests/check_sandbox_cache_paths.py","tests/system_skills_0172_windows_seed.json",
            "tests/fixed_seed_f2py_followup_45747282942.md","tests/check_fixed_seed_f2py.py",
            "tests/check_msys2_ocr_feasibility.py",".github/workflows/fixed-seed-f2py-ocr.yml"})
          actual={n.decode("utf-8") for n in subprocess.check_output(["git","diff","--name-only","-z",os.environ["BASE"],"HEAD"]).split(b"\0") if n}
          assert actual==expected,(sorted(actual-expected),sorted(expected-actual))
          print("NARROW_SCOPE="+str(len(actual)))
          '@ | & .\tool\python\python.exe -I -B -
          if ($LASTEXITCODE) { throw 'Unexpected changes or prior evidence mismatch' }
          'FIXED_SCOPE_CONFIRMED=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NATIVE_REPORT=$(Join-Path $pwd 'tmp/fixed-seed-f2py-native.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_REPORT=$(Join-Path $pwd 'tmp/fixed-seed-f2py-build.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Retrieve separate tiny OCR research evidence
        id: ocr_evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: msys2-ocr-feasibility-evidence
          path: tmp/ocr-feasibility-evidence
      - name: Check changed source syntax and existing package inputs
        id: policy
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          git lfs fsck
          if ($LASTEXITCODE) { throw 'Missing pinned runtime payload' }
          & .\tool\python\python.exe -I -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in map(Path, ['tests/check_fixed_seed_f2py.py','tests/check_sandbox_cache_paths.py','tests/check_msys2_ocr_feasibility.py'])]"
          if ($LASTEXITCODE) { throw 'Python syntax failure' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input check failed' }
      - name: Build actual corrected candidate once
        id: build
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $json=& .\tool\python\python.exe -B tool/package-release.py --version v0.172.0-portable.2
          if ($LASTEXITCODE) { throw 'Corrected ZIP build failed' }
          $joined=$json -join [Environment]::NewLine
          $value=$joined | ConvertFrom-Json
          if ($value.source_commit -cne $env:GITHUB_SHA) { throw 'Wrong candidate source' }
          [IO.File]::WriteAllText($env:BUILD_REPORT,$joined,(New-Object Text.UTF8Encoding($false)))
          foreach ($key in @('archive','manifest','checksums')) {
            "$key=$($value.$key)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Output ("FIXED_ZIP_SHA256="+$value.archive_sha256+" files="+$value.file_count)
      - name: Exact moved candidate, two native starts, scoped Chinese f2py signature
        id: native
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          & .\tool\python\python.exe -B tests/check_fixed_seed_f2py.py $env:BUILD_REPORT $env:NATIVE_REPORT
          if ($LASTEXITCODE) { throw 'Actual corrected candidate not qualified for download' }
          $r=Get-Content -LiteralPath $env:NATIVE_REPORT -Raw | ConvertFrom-Json
          $b=Get-Content -LiteralPath $env:BUILD_REPORT -Raw | ConvertFrom-Json
          if ($r.metadata.completed -ne $true -or $r.metadata.zip_verified -ne $true -or $r.metadata.archive_sha256 -cne $b.archive_sha256 -or $r.metadata.source_commit -cne $env:GITHUB_SHA) { throw 'Missing exact candidate evidence' }
      - name: Upload corrected pristine candidate only, never OCR research or Release
        id: upload
        if: steps.native.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Codex-Portable-0.172.0-fixed-seed-f2py-candidate-${{ github.run_id }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.manifest }}
            ${{ steps.build.outputs.checksums }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download the exact candidate for independent hash readback
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Codex-Portable-0.172.0-fixed-seed-f2py-candidate-${{ github.run_id }}
          path: tmp/fixed-seed-candidate-readback-${{ github.run_id }}
      - name: Check exact three downloadable members
        id: readback
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $b=Get-Content -LiteralPath $env:BUILD_REPORT -Raw | ConvertFrom-Json
          $read=Join-Path $pwd ('tmp/fixed-seed-candidate-readback-'+$env:GITHUB_RUN_ID)
          if (@(Get-ChildItem -LiteralPath $read -Recurse -Force -File).Count -ne 3) { throw 'Unexpected artifact members' }
          foreach ($key in @('archive','manifest','checksums')) {
            $source=$b.$key
            $target=Join-Path $read (Split-Path -Leaf $source)
            if (-not (Test-Path -LiteralPath $target -PathType Leaf) -or (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash) { throw 'Candidate readback differs' }
          }
          Write-Output 'FIXED_CANDIDATE_READBACK=PASS'
      - name: Preserve independent evidence, remove temporary trigger, no release
        if: always() && env.FIXED_SCOPE_CONFIRMED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_JOB: ${{ needs.ocr.result }}
          OCR_EVIDENCE: ${{ steps.ocr_evidence.outcome }}
          POLICY: ${{ steps.policy.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NATIVE: ${{ steps.native.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          READBACK: ${{ steps.readback.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh"
          start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"]
          assert os.environ["GITHUB_REF"]==branch
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def git(*args):return subprocess.check_output(["git",*args])
          def rev():return git("rev-parse","HEAD").decode().strip()
          def ref(name):
              v,n=git(*cfg,"ls-remote","origin",name).decode().strip().split("\t")
              assert n==name
              return v
          assert rev()==ref(branch)==start
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          assert not git("status","--porcelain=v1","--untracked-files=all")
          def read(p):
              p=Path(p)
              return json.loads(p.read_bytes()) if p.exists() else {"completed":False,"rows":[]}
          native=read(os.environ["NATIVE_REPORT"])
          ocr=read("tmp/ocr-feasibility-evidence/ocr-feasibility-report.json")
          steps={k:os.environ[k] for k in ("OCR_JOB","OCR_EVIDENCE","POLICY","BUILD","NATIVE","UPLOAD","DOWNLOAD","READBACK")}
          result={"run_id":os.environ["GITHUB_RUN_ID"],"source_commit":start,
            "prior_evidence":"tests/sandbox_cache_paths_45747282942.json","prior_record":"a2871a2a9be66f4969dca866fe5d58827ccb7093",
            "prior_witness_count_corrected_by_evidence":2,"native":native,"ocr_feasibility":ocr,"workflow_steps":steps,
            "artifact":{"id":os.environ["ARTIFACT_ID"],"url":os.environ["ARTIFACT_URL"],"readback":steps["READBACK"],
              "verified_downloadable":steps["READBACK"]=="success" and steps["NATIVE"]=="success","retention_days":14},
            "fixed_system_seed_and_f2py_native_qualified":steps["NATIVE"]=="success" and native.get("metadata",{}).get("completed",False),
            "ocr_integrated":False,"ocr_distribution_qualified":False,"whole_package_all_pass_claim":False,
            "unresolved":["Existing files without ordinary token write ACL remain denied; no ACL change.",
              "SSH protected private directory under restricted token; no safe change.",
              "Chinese Windows.Media.Ocr unavailable on prior two images; MSYS2 experiment is separate, no distribution claim.",
              "Fixed f2py whitespace splitting, Android Unicode argument limitations and HTTPX optional CLI closure remain documented."],
            "prior_course_and_office_evidence_retained":True}
          target=Path("tests/fixed_seed_f2py_ocr_"+os.environ["GITHUB_RUN_ID"]+".json")
          assert not target.exists()
          target.write_text(json.dumps(result,indent=2,ensure_ascii=True)+"\n",encoding="utf-8")
          notes=Path("DEVELOPMENT.md")
          url="https://github.com/rileyaaa/Portable/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          notes.write_bytes(notes.read_bytes()+("\n\n## Fixed native system seed and scoped f2py UTF-8; independent OCR experiment\n\n"
              "Source "+start+"; "+url+". Raw result: "+target.as_posix()+
              ". Two prior exact system manifests agree; sentinel-only prior fixture error corrected. Actual candidate targeted native qualification="+str(result["fixed_system_seed_and_f2py_native_qualified"])+
              "; verified downloadable="+str(result["artifact"]["verified_downloadable"])+
              "; OCR feasibility technical recognition="+str(ocr.get("technical_recognition_passed",False))+
              ". OCR is not integrated or qualified for redistribution. Other known limits retained. No earlier broad suite rerun, permission change or official Release.\n").encode())
          workflow=".github/workflows/fixed-seed-f2py-ocr.yml"
          git("rm","--",workflow);git("add","--",str(target),"DEVELOPMENT.md")
          assert {n.decode("utf-8") for n in git("diff","--cached","--name-only","-z").split(b"\0") if n}=={workflow,target.as_posix(),"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record repaired seed/f2py and isolated OCR feasibility; remove temporary trigger")
          final=rev();assert ref(branch)==start
          subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("FIXED_FINAL_DEV="+final,flush=True)
          print("FIXED_RESULT="+json.dumps({"candidate_native":result["fixed_system_seed_and_f2py_native_qualified"],"artifact":result["artifact"],"ocr_technical":ocr.get("technical_recognition_passed",False)},ensure_ascii=True),flush=True)
          raise SystemExit(1)
          '@ | & .\tool\python\python.exe -I -B -
          if ($LASTEXITCODE) { throw 'Remaining full qualification limitations; independent evidence retained' }
