name: Windows P3 browser inventory (one-time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths:
      - .github/workflows/windows-p3-browser-inventory-once.yml
permissions:
  contents: read
concurrency:
  group: portable-p3-browser-inventory-once
  cancel-in-progress: false
jobs:
  p3-inventory:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      P3_BASE: e13c99e35db592472f380497ff4c2bc040163568
      P3_BLOB: a3f367c0b3d196fca6e171527a9d2858453311f8
      P3_WORKFLOW: .github/workflows/windows-p3-browser-inventory-once.yml
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Deny any other trigger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_REPOSITORY -cne 'rileyaaa/Portable' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_REF -cne 'refs/heads/dev/stable-tool-refresh' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              $e.ref -cne $env:GITHUB_REF -or $e.before -cne $env:P3_BASE -or
              $e.after -cne $env:GITHUB_SHA -or $e.head_commit.id -cne $env:GITHUB_SHA -or
              $e.created -ne $false -or $e.deleted -ne $false -or $e.forced -ne $false) {
            throw 'Unexpected P3 trigger'
          }
          Write-Output 'P3_TRIGGER=PASS'
      - name: Checkout only the reviewed source and workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            /tool/automation/install-browser.py
            /.github/workflows/windows-p3-browser-inventory-once.yml
          sparse-checkout-cone-mode: false
      - name: Run actual installer check against disposable synthetic files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import contextlib
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import runpy
          import stat
          import struct
          import subprocess
          import sys
          import tempfile

          def require(ok, label):
              if not ok:
                  raise RuntimeError(label)

          def mark(label):
              print(label + "=PASS", flush=True)

          require(os.name == "nt" and struct.calcsize("P") == 8
                  and sys.version_info >= (3, 11), "WINDOWS_X64_PYTHON_REQUIRED")
          print("P3_PYTHON=" + sys.version.split()[0])
          base = os.environ["P3_BASE"]
          head = os.environ["GITHUB_SHA"]
          rel = "tool/automation/install-browser.py"
          os.environ["GIT_NO_LAZY_FETCH"] = "1"

          def git(*args):
              return subprocess.check_output(["git", *args], timeout=30)

          require(git("rev-list", "--parents", "-n", "1", "HEAD").decode().split()
                  == [head, base], "P3_WRONG_PARENT")
          require(git("diff-tree", "--no-commit-id", "--name-status", "--no-renames",
                      "-r", base, head).decode().splitlines()
                  == ["A\t" + os.environ["P3_WORKFLOW"]], "P3_WRONG_FILE_SET")
          source = git("cat-file", "blob", f"{base}:{rel}")
          blob = hashlib.sha1(f"blob {len(source)}\0".encode() + source).hexdigest()
          require(blob == os.environ["P3_BLOB"]
                  and git("cat-file", "blob", f"{head}:{rel}") == source,
                  "P3_WRONG_SOURCE")
          mark("P3_SOURCE")

          denied = []
          def offline(event, args):
              if event.startswith("socket.") or event in (
                  "subprocess.Popen", "os.system", "os.startfile", "os.startfile/2",
                  "os.exec", "os.spawn", "os.posix_spawn"
              ):
                  denied.append(event)
                  raise RuntimeError("P3_EXTERNAL_OPERATION")
          sys.addaudithook(offline)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def snapshot(root):
              entries, pending = {}, [root]
              while pending:
                  for p in pending.pop().iterdir():
                      st = p.lstat()
                      require(not getattr(st, "st_file_attributes", 0) & 0x400
                              and not stat.S_ISLNK(st.st_mode), "P3_FIXTURE_LINK")
                      name = p.relative_to(root).as_posix()
                      if stat.S_ISDIR(st.st_mode):
                          entries[name] = ("dir",)
                          pending.append(p)
                      else:
                          require(stat.S_ISREG(st.st_mode) and st.st_nlink == 1,
                                  "P3_FIXTURE_FILE_TYPE")
                          entries[name] = ("file", p.read_bytes())
              return entries

          revision, version = "1727472", "158.0.8127.88"
          prefix = f"tool/automation/browsers/chromium-{revision}"
          url = ("https://storage.googleapis.com/chrome-for-testing-public/"
                 f"{version}/win64/chrome-win64.zip")
          with tempfile.TemporaryDirectory(prefix="portable-p3-",
                                           dir=os.environ["RUNNER_TEMP"]) as tmp:
              root = Path(tmp).absolute()
              def put(name, data):
                  p = root / name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(data)
                  return p

              installer = put(rel, source)
              require(installer.read_bytes() == source, "P3_SOURCE_COPY")
              put("env.ps1", b"# synthetic fixture\n")
              pe = bytearray(128)
              pe[:2] = b"MZ"
              pe[60:64] = (64).to_bytes(4, "little")
              pe[64:70] = b"PE\0\0\x64\x86"
              locale = f"{prefix}/chrome-win64/locales/en.pak"
              files = {f"{prefix}/chrome-win64/chrome.exe": bytes(pe),
                       locale: b"locale-A"}
              metadata = b"synthetic archive metadata only"
              versions = {"browser": {
                  "version": version, "revision": revision,
                  "revisionSource": "chrome-for-testing", "channel": "stable",
                  "downloadUrl": url,
                  "executable": f"browsers/chromium-{revision}/chrome-win64/chrome.exe"}}
              manifest = {
                  "schemaVersion": 1, "platform": "win32-x64",
                  "browserVersion": version, "revision": revision,
                  "archive": {"sourceUrl": url, "resolvedUrl": url,
                              "size": len(metadata), "sha256": sha(metadata)},
                  "fileCount": len(files),
                  "uncompressedBytes": sum(map(len, files.values())),
                  "files": {k: {"size": len(v), "sha256": sha(v)}
                            for k, v in files.items()}}
              put("tool/automation/versions.json", json.dumps(versions).encode())
              put("tool/automation/browser-manifest.json", json.dumps(manifest).encode())
              sentinel = put("cache/browser/profile/Default/Preferences", b"p3-preserve")
              put("cache/browser/profile/Local State", b"synthetic state")
              other = put("tool/automation/browsers/chromium-9999/keep.txt", b"other")
              profile = root / "cache/browser/profile"
              profile_before = snapshot(profile)
              sentinel_sha = sha(b"p3-preserve")

              def check(label, state):
                  before = snapshot(root)
                  stdout, stderr = io.StringIO(), io.StringIO()
                  argv = sys.argv[:]
                  try:
                      sys.argv = [str(installer), "--check"]
                      with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
                          try:
                              runpy.run_path(str(installer), run_name="__main__")
                          except SystemExit as exc:
                              rc = exc.code
                          else:
                              raise RuntimeError("P3_NO_CLI_EXIT")
                  finally:
                      sys.argv = argv
                  expected = 0 if state == "verified" else 1
                  require(type(rc) is int and rc == expected and not stderr.getvalue(), label)
                  report = json.loads(stdout.getvalue())
                  require(report["state"] == state and report["verified"] is (expected == 0)
                          and report["version"] == version and report["files"] == len(files)
                          and prefix in report["action"], label)
                  require(snapshot(root) == before and snapshot(profile) == profile_before
                          and sha(sentinel.read_bytes()) == sentinel_sha
                          and other.read_bytes() == b"other" and not denied, label + "_PRESERVE")
                  mark(label)

              check("P3_MISSING_REVISION", "missing")
              for name, data in files.items():
                  put(name, data)
              check("P3_COMPLETE", "verified")
              extra = put(f"{prefix}/chrome-win64/locales/unlisted.pak", b"extra")
              check("P3_EXTRA_REJECTED", "incomplete")
              extra.unlink()
              target = root / locale
              target.unlink()
              check("P3_MISSING_REJECTED", "incomplete")
              put(locale, files[locale])
              target.write_bytes(b"X" * len(files[locale]))
              check("P3_CORRUPT_REJECTED", "incomplete")
              put(locale, files[locale])
              check("P3_RESTORED", "verified")
              require(snapshot(profile) == profile_before
                      and sha(sentinel.read_bytes()) == sentinel_sha, "P3_PROFILE_CHANGED")
              mark("P3_PROFILE")
              print("P3_PROFILE_SHA256=" + sentinel_sha)
              require(other.read_bytes() == b"other", "P3_OTHER_REVISION_CHANGED")
              mark("P3_OTHER_REVISION")
          require(not root.exists() and not denied, "P3_CLEANUP_OR_EXTERNAL_OPERATION")
          mark("P3_CLEANUP")
          mark("P3_WINDOWS_INVENTORY")
          '@
          $output = @($probe | python -I -S -B -)
          $rc = $LASTEXITCODE
          $output | Write-Output
          if ($rc -ne 0) { throw 'Windows P3 inventory failed' }
          $expected = @(
            'P3_SOURCE=PASS',
            'P3_MISSING_REVISION=PASS',
            'P3_COMPLETE=PASS',
            'P3_EXTRA_REJECTED=PASS',
            'P3_MISSING_REJECTED=PASS',
            'P3_CORRUPT_REJECTED=PASS',
            'P3_RESTORED=PASS',
            'P3_PROFILE=PASS',
            'P3_PROFILE_SHA256=92bb89ab623b572b2645ee90f389014b7da4643fc5187c6bbd511ff5eeca0a2e',
            'P3_OTHER_REVISION=PASS',
            'P3_CLEANUP=PASS',
            'P3_WINDOWS_INVENTORY=PASS'
          )
          if ($output.Count -ne ($expected.Count + 1) -or
              $output[0] -cnotmatch '^P3_PYTHON=[0-9]+\.[0-9]+\.[0-9]+[a-z0-9]*$') {
            throw 'Missing or unexpected P3 output'
          }
          for ($i = 0; $i -lt $expected.Count; $i++) {
            if ($output[$i + 1] -cne $expected[$i]) { throw 'Incomplete P3 coverage' }
          }
          (@('P3_TRIGGER=PASS') + $output + @('P3_OUTPUT_GATE=PASS')) |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Output 'P3_OUTPUT_GATE=PASS'
