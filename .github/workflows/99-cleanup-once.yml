name: "99 - Final Actions history cleanup"
on:
  push:
    branches: [main]
    paths: [".github/workflows/99-cleanup-once.yml"]
permissions:
  actions: write
  contents: read
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove remaining old runs and current cleanup record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'rileyaaa/Codex-Portable' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          mapfile -t ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[].id")
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [[ "$id" != "$GITHUB_RUN_ID" ]] || continue
            done_flag=0
            for attempt in 1 2 3; do
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null; then
                done_flag=1
                echo "Removed old run: $id"
                break
              fi
              sleep 3
            done
            [[ "$done_flag" -eq 1 ]] || { echo "Failed to remove run: $id" >&2; exit 1; }
          done
          echo "All older runs removed; attempting self-run deletion."
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
