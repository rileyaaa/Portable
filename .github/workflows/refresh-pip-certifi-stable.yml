r EXE\u3002\n\n"+"\u539f AC #45556915855 \u5df2\u901a\u8fc7\u65b0\u65e7\u5165\u53e3\u3001\u5b98\u65b9 wheel \u4e0e\u5b9e\u9645\u4f9d\u8d56\u66ff\u6362\u68c0\u67e5\uff0c\u6700\u540e\u9519\u8bef\u662f\u542b pip \u81ea\u8eab\u7684 CMD \u5b89\u88c5\u89e6\u53d1 Windows \u5b98\u65b9\u81ea\u4fee\u6539\u4fdd\u62a4\u300226.1.2 \u4e0e 26.3 \u7684\u4e0a\u6e38 protect_pip_from_modification_on_windows \u5b9e\u73b0\u4e00\u81f4\uff1b\u9879\u76ee\u672c\u6765\u53ea\u627f\u8bfa\u53d7\u63a7\u6682\u5b58\u548c\u5305\u5185 python -m pip \u7ef4\u62a4\u56fa\u5b9a\u96c6\uff0c\u4e0d\u627f\u8bfa CMD \u81ea\u66f4\u65b0\u3002\u672c\u6b21\u4ece\u76f8\u540c\u56fa\u5b9a wheel \u96c6\u5408\u5bf9\u7167\uff1a\u4e24\u7248\u4e09\u4e2a CMD \u542b pip \u7684\u5b89\u88c5\u5747\u987b\u5b9e\u9645\u8fd4\u56de 1\u3001\u63d0\u793a\u5b98\u65b9\u6a21\u5757\u5165\u53e3\u3001\u7a7a\u76ee\u6807\u65e0\u5199\u5165\uff1b\u4ec5\u5b98\u65b9\u6a21\u5757\u5165\u53e3\u5728\u72ec\u7acb\u76ee\u6807\u5b89\u88c5 pip\u3002\u4e09\u4e2a CMD \u5206\u522b\u5728\u4e2d\u6587/\u7a7a\u683c\u6682\u5b58\u76ee\u6807\u6210\u529f\u79bb\u7ebf\u5b89\u88c5\u540c\u4e00 certifi wheel\uff0c\u6838\u5bf9\u5b98\u65b9\u5b57\u8282\u3001\u8bb8\u53ef\u8bc1\u3001\u5b9e\u9645 RECORD\u3001\u7248\u672c\u548c\u8fd0\u884c\u65f6\u5feb\u7167\uff1b\u4e0d\u4fee\u6539\u4fdd\u62a4\u51fd\u6570\u3001argv\u3001CMD\u3001helper \u6216\u6743\u9650\u3002\u53e6\u4fee\u590d\u4e0a\u8f6e\u65e5\u5fd7\u4e2d AST \u5c40\u90e8\u53d8\u91cf body \u8986\u76d6\u4e0b\u8f7d\u5b57\u8282\u5bfc\u81f4 pip wheel \u5927\u5c0f\u88ab\u9519\u8bef\u6253\u5370\u4e3a 1 \u7684\u8bca\u65ad\u5b57\u6bb5\uff0c\u5b9e\u9645\u5de5\u4ef6\u54c8\u5e0c\u95e8\u7981\u672a\u6539\u53d8\u3002\n\n"+"\u539f AC #45559215211 \u5df2\u901a\u8fc7\u4e24\u7248 pip \u81ea\u66f4\u65b0\u4fdd\u62a4\u3001\u4e09\u4efd CMD \u666e\u901a wheel \u5b89\u88c5\u53ca\u5b98\u65b9\u6a21\u5757\u5165\u53e3\uff0c\u9996\u6b21\u5931\u8d25\u662f\u63d0\u4ea4\u8303\u56f4\u95e8\u7981\u53d1\u73b0 checkout \u6839\u76ee\u5f55\u4e0b\u672a\u8ddf\u8e2a Microsoft/Windows/PowerShell/ModuleAnalysisCache\u3002\u72ec\u7acb CI \u7cbe\u7b80\u5b50\u8fdb\u7a0b\u73af\u5883\u7f3a\u5c11 PSModuleAnalysisCachePath\uff0c\u5b9e\u9645 CMD \u6709 Windows PowerShell 5.1 \u524d\u7f6e\u8def\u5f84\u68c0\u67e5\uff0c\u751f\u4ea7 run-codex.ps1 \u672c\u6765\u5df2\u8bbe\u7f6e\u8be5\u53d8\u91cf\u3002\u4ec5 CI \u5728\u672c\u8f6e\u72ec\u5360\u4e34\u65f6 cwd \u5bf9\u7167\u65e7\u9ed8\u8ba4\u8def\u5f84\uff08\u8bb0\u5f55\u662f\u5426\u590d\u73b0\uff0c\u4e0d\u628a\u672a\u590d\u73b0\u89c6\u4f5c\u5df2\u8bc1\u5b9e\uff09\uff0c\u663e\u5f0f\u628a\u540e\u7eed\u5b50\u8fdb\u7a0b\u6a21\u5757\u7f13\u5b58\u6307\u5411 RUNNER_TEMP \u4e0b\u65b0\u5efa\u72ec\u5360\u666e\u901a\u76ee\u5f55\uff1b\u7531\u771f\u5b9e PowerShell 5.1 \u542f\u52a8\u548c\u5408\u6210\u6a21\u5757\u53d1\u73b0\u9a8c\u8bc1\u65b0\u6587\u4ef6\u521b\u5efa\u3001\u8bfb\u5199\u6253\u5f00\u548c\u540e\u7eed\u5b50\u8fdb\u7a0b\u547d\u4ee4\u53d1\u73b0\u3002\u4fdd\u6301\u7f13\u5b58\u542f\u7528\uff0c\u4e0d\u7528 NUL\uff0c\u4e0d\u6539\u53d8\u7528\u6237 PowerShell \u73af\u5883\u6216\u751f\u4ea7\u811a\u672c\uff1b\u68c0\u67e5\u6bcf\u6b21 pip/CMD \u8c03\u7528\u53ca\u6682\u5b58\u7ed3\u675f\u540e checkout \u7f13\u5b58\u7f3a\u5931\uff0c\u9000\u51fa\u65f6\u53ea\u9500\u6bc1\u672c\u8f6e TemporaryDirectory\uff0c\u539f\u5019\u9009\u8303\u56f4\u95e8\u7981\u9010\u5b57\u4fdd\u7559\uff0c\u539f\u751f\u56de\u5f52\u540e\u518d\u8981\u6c42\u5e72\u51c0\u5de5\u4f5c\u6811\u3002\u82e5\u7f13\u5b58\u4ecd\u843d\u5165 checkout\uff0c\u62d2\u7edd\u63d0\u4ea4\uff0c\u4e0d\u5ffd\u7565\u6216\u6e05\u7406\u672a\u77e5\u6587\u4ef6\u3002\u56e0\u4e0a\u8f6e runner \u672c\u5730\u5019\u9009\u672a\u63a8\u9001\u4e14\u6ca1\u6709\u4e0a\u4f20\u5de5\u4ef6\uff0c\u5fc5\u987b\u4ece\u56fa\u5b9a\u5df2\u9a8c\u6765\u6e90\u91cd\u65b0\u6784\u9020\u5019\u9009\uff0c\u4e0d\u58f0\u79f0\u590d\u7528\u5df2\u4e22\u5931\u7684\u672c\u5730\u63d0\u4ea4\u3002\n\n"+"AC #45561829261 \u5df2\u590d\u73b0 pip.cmd \u524d\u7f6e PowerShell 5.1 \u5728\u7cbe\u7b80\u73af\u5883\u4e0b\u5411 cwd \