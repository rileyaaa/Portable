      - name: Push only validated fast-forward development commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne "refs/heads/$env:TARGET_BRANCH" -or $env:TARGET_BRANCH -cne 'dev/stable-tool-refresh') { throw 'Wrong target branch' }
          $current = (git rev-parse HEAD).Trim()
          if ((git rev-parse 'HEAD^').Trim() -cne $env:GITHUB_SHA) { throw 'Candidate not direct child' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved before push' }
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          try {
            & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
            if ($LASTEXITCODE) { throw 'Validated development-only push failed' }
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
          }
          $after = (git ls-remote origin "refs/heads/$env:TARGET_BRANCH") -join ''
          if ($LASTEXITCODE -ne 0 -or $after -cne ($current + [char]9 + "refs/heads/$env:TARGET_BRANCH")) { throw 'Development push readback mismatch' }
          foreach ($ref in @('refs/heads/main','refs/tags/v0.172.0-portable.1')) {
            $remote = (git ls-remote origin $ref) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:FROZEN + [char]9 + $ref)) { throw 'Frozen ref changed' }
          }
          Write-Output "VALIDATED_DEV_COMMIT=$current"
          Write-Output 'NO_RELEASE_NO_ARTIFACT_NO_MAIN_CHANGE'
