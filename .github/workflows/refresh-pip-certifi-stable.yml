          edit("DEVELOPMENT.md",[("# \u5f00\u53d1\u4e0e\u7ef4\u62a4\u8bb0\u5f55\n\n","# \u5f00\u53d1\u4e0e\u7ef4\u62a4\u8bb0\u5f55\n\n"+"## 2026-11-25\uff1a\u7a33\u5b9a\u5de5\u5177\u66f4\u65b0\u5f00\u53d1\u5206\u652f\uff0c\u7b2c\u4e8c\u7ec4 pip / certifi\n\n\u56fa\u5b9a Python 3.14.10 x64 \u4e0d\u52a8\uff0c\u4ec5\u4ece\u5df2\u9a8c 350bb6eb \u66f4\u65b0 pip 26.1.2 \u2192 26.3\uff08MIT\uff09\u548c certifi 2026.5.20 \u2192 2026.11.20\uff08MPL-2.0\uff09\u3002\u4e24\u4e2a\u5b98\u65b9 PyPI py3-none-any wheel \u7684 URL \u4e0e SHA-256 \u5df2\u9501\u5b9a\uff0c\u4f7f\u7528\u65e2\u6709 Python/pip \u5728\u5305\u5185\u72ec\u7acb\u6682\u5b58\u4f4d\u7f6e\u8fdb\u884c hash-only/no-index/no-deps \u5b89\u88c5\uff1b\u5b8c\u6574\u6838\u5bf9 wheel RECORD\u3001\u6240\u6709\u5b98\u65b9\u8f7d\u8377\u548c\u8bb8\u53ef\u8bc1\uff0c\u786e\u8ba4\u65e7 RECORD \u5f52\u5c5e\u3001\u65e0\u91cd\u590d\u5143\u6570\u636e\u300149 \u4e2a\u4f9d\u8d56\u7248\u672c\u4e2d\u4ec5\u4e24\u9879\u53d8\u5316\u3002\u4e09\u4efd\u672a\u66b4\u9732\u5230 PATH \u7684\u5386\u53f2 vendor pip EXE \u4fdd\u7559\u539f\u5b57\u8282\uff08\u4e0d\u6267\u884c\uff09\uff0c\u65b0 RECORD \u8bb0\u5f55\u5176\u771f\u5b9e\u6458\u8981\uff0c\u5b98\u65b9 pip \u4ee3\u7801\u53ca dist-info \u5176\u4ed6\u539f\u59cb wheel \u5b57\u8282\u4e0d\u6539\uff1b\u539f\u53ef\u642c\u8fc1 CMD \u548c setup \u4fee\u590d\u95e8\u7981\u4e0d\u6539\u3002\u65b0 pip \u4fdd\u7559\u5176\u4e0a\u6e38\u81ea\u5e26 certifi 2026.10.23\uff0c\u9876\u5c42 certifi \u4e3a 2026.11.20\uff0c\u4e0d\u624b\u5de5\u6df7\u6362\uff1bpip \u9ed8\u8ba4\u4ecd\u6309\u4e0a\u6e38\u4f7f\u7528\u7cfb\u7edf truststore \u4e0e vendored certifi\uff0c\u4e0d\u5ba3\u79f0\u5b8c\u5168\u9694\u79bb OS \u4fe1\u4efb\u5e93\u3002\u901a\u8fc7\u5b9e\u9645\u5b98\u65b9 HTTPS \u4e0b\u8f7d\u3001\u72ec\u7acb\u79bb\u7ebf\u91cd\u65b0\u5b89\u88c5\u3001\u9501\u5b9a\u4e0e\u4f9d\u8d56\u95ed\u5305\u3001\u5e38\u7528/YOLO \u539f\u751f pip \u4e0e CA \u8def\u5f84/\u73af\u5883\u3001\u4e2d\u6587\u642c\u8fc1\u3001Office/PDF\u3001\u6d4f\u89c