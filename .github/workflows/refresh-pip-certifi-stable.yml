      - name: Commit only the exact candidate locally
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib, subprocess
          root=pathlib.Path.cwd()
          site="tool/python/Lib/site-packages/"
          prefixes=tuple(site+x+"/" for x in ("pip","certifi","pip-26.1.2.dist-info","pip-26.3.dist-info","certifi-2026.5.20.dist-info","certifi-2026.11.20.dist-info"))
          exact={"tool/python-packages.in.txt","tool/python-packages.lock.txt","tool/\u5de5\u5177\u66f4\u65b0\u8bf4\u660e.md","DEVELOPMENT.md","tests/check_pip_certifi_refresh.py","tests/check_codex_tool_discovery.py"}
          def git(*args): return subprocess.check_output(["git",*args],cwd=root)
          def names(*args): return set(git(*args).decode("utf-8").split("\0"))-{""}
          def allowed(p): return p in exact or p.startswith(prefixes)
          changed=names("diff","--no-renames","--name-only","-z")|names("ls-files","--others","--exclude-standard","-z")
          assert exact.issubset(changed) and all(allowed(p) for p in changed), ("Unexpected scope",sorted(p for p in changed if not allowed(p)))
          git("add","-A","--",*[p[:-1] for p in prefixes],*sorted(exact))
          staged=names("diff","--cached","--no-renames","--name-only","-z")
          assert staged==changed and all(allowed(p) for p in staged)
          assert not git("diff","--name-only","-z")
          assert not git("ls-files","--others","--exclude-standard","-z")
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Refresh pinned pip 26.3 and certifi 2026.11.20 after controlled wheel staging")
