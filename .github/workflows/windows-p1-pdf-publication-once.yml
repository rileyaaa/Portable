name: Windows P1-R2 PDF publication recovery (one-time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths:
      - .github/workflows/windows-p1-pdf-publication-once.yml
permissions:
  contents: read
concurrency:
  group: portable-p1-pdf-publication-once
  cancel-in-progress: false
jobs:
  p1-recovery:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      P1_BASE: e76427692ea7e780d1d0c9a85b031fc47e6423b0
      P1_PATH: .github/workflows/windows-p1-pdf-publication-once.yml
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Verify one-time trigger
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_REPOSITORY -cne 'rileyaaa/Portable' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_REF -cne 'refs/heads/dev/stable-tool-refresh' -or
              $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              $e.ref -cne $env:GITHUB_REF -or $e.before -cne $env:P1_BASE -or
              $e.after -cne $env:GITHUB_SHA -or $e.head_commit.id -cne $env:GITHUB_SHA -or
              $e.created -ne $false -or $e.deleted -ne $false -or $e.forced -ne $false) {
            throw 'Unexpected P1 trigger'
          }
          Write-Output 'P1_TRIGGER=PASS'
      - name: Checkout only tracked source and required native runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/windows-p1-pdf-publication-once.yml
            /home/skills/pdf-library/scripts/pdf_library.py
            /home/skills/pdf/scripts/portable_safety.py
            /tool/optional-python-manifest.json
            /tool/python/*.dll
            /tool/python/*.pyd
            /tool/python/python.exe
            /tool/python/python314._pth
            /tool/python/python314.zip
            /tool/python/Lib/site-packages/pymupdf/
            /tool/python/Lib/site-packages/fitz/
            /tool/python/Lib/site-packages/pymupdf-1.26.6.dist-info/
            /tool/python/Lib/site-packages/pymupdf4llm/
            /tool/python/Lib/site-packages/pymupdf4llm-0.2.9.dist-info/
            /tool/python/Lib/site-packages/tabulate/
            /tool/python/Lib/site-packages/tabulate-0.9.0.dist-info/
      - name: Actual Win32 sharing failure and PDF recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = @'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path

          def need(ok, label):
              if not ok:
                  raise RuntimeError(label)

          base, head = os.environ['P1_BASE'], os.environ['GITHUB_SHA']
          os.environ['GIT_NO_LAZY_FETCH'] = '1'
          os.environ['GIT_ALLOW_PROTOCOL'] = 'file'
          def git(*args, input=None):
              return subprocess.check_output(['git', *args], input=input, timeout=120)
          need(git('rev-list', '--parents', '-n', '1', 'HEAD').decode().split()
               == [head, base], 'P1_PARENT')
          need(git('diff-tree', '--no-commit-id', '--name-status', '--no-renames',
                   '-r', base, head).decode().splitlines()
               == ['A\t' + os.environ['P1_PATH']], 'P1_FILE_SET')
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          fixed = {
              'home/skills/pdf-library/scripts/pdf_library.py': '57e0d193df21be7b47997731403e1c3a5deaf2f5',
              'home/skills/pdf/scripts/portable_safety.py': '984c2fc21ede54d2c9e3a77e77ae8a99e48faecd',
              'tool/optional-python-manifest.json': '5e71d1343abfadfd514b7e417c6b38a241b7b866',
          }
          manifest = git('cat-file', 'blob', base + ':tool/optional-python-manifest.json')
          need(blob(manifest) == fixed['tool/optional-python-manifest.json'], 'P1_MANIFEST')
          versions = {'PyMuPDF': '1.26.6', 'pymupdf4llm': '0.2.9', 'tabulate': '0.9.0'}
          packages = [p for p in json.loads(manifest)['packages'] if p['name'] in versions]
          need({p['name']: p['version'] for p in packages} == versions, 'P1_PINS')
          hashes = {n: h for p in packages for n, h in p['files'].items()}
          need(len(hashes) == 134, 'P1_DEPENDENCY_COUNT')
          runtime = {}
          for entry in git('ls-tree', '-z', base + ':tool/python').split(b'\0'):
              if not entry:
                  continue
              meta, name = entry.decode().split('\t')
              mode, kind, sha = meta.split()
              if name.endswith(('.dll', '.pyd')) or name in ('python.exe', 'python314._pth', 'python314.zip'):
                  need(kind == 'blob' and mode in ('100644', '100755'), 'P1_RUNTIME_TYPE')
                  runtime['tool/python/' + name] = sha
          need(all('tool/python/' + n in runtime for n in
                   ('python.exe', 'python314.dll', 'python314.zip', 'python314._pth',
                    '_sqlite3.pyd', 'sqlite3.dll', '_ctypes.pyd')), 'P1_RUNTIME_MISSING')
          paths = sorted(set(runtime) | set(fixed) | set(hashes))
          batch = git('cat-file', '--batch', input=''.join(base + ':' + n + '\n' for n in paths).encode())
          with tempfile.TemporaryDirectory(prefix='portable-p1-', dir=os.environ['RUNNER_TEMP']) as tmp:
              root = Path(tmp).absolute() / 'Package'
              root.mkdir()
              pos = 0
              for name in paths:
                  need(not Path(name).is_absolute() and '..' not in Path(name).parts, 'P1_PATH')
                  end = batch.index(b'\n', pos)
                  sha, kind, size = batch[pos:end].decode().split()
                  pos = end + 1
                  data = batch[pos:pos + int(size)]
                  pos += int(size)
                  need(batch[pos:pos+1] == b'\n' and kind == 'blob' and blob(data) == sha,
                       'P1_RAW_BLOB')
                  pos += 1
                  need(not data.startswith(b'version https://git-lfs.github.com/spec/v1'), 'P1_LFS_POINTER')
                  if name in fixed or name in runtime:
                      need(sha == (fixed | runtime)[name], 'P1_FIXED_BLOB')
                  if name in hashes:
                      need(hashlib.sha256(data).hexdigest() == hashes[name], 'P1_WHEEL_BYTES')
                  p = root / name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(data)
              need(pos == len(batch), 'P1_BATCH_TRAILING_DATA')
              print('P1_SOURCE_AND_TRACKED_DEPS=PASS', flush=True)
              for name in ('env.ps1', 'codex.exe'):
                  (root / name).write_bytes(b'synthetic marker, never execute')
              scratch = root / 'tmp'
              scratch.mkdir()
              system = os.environ['SystemRoot']
              env = {'SystemRoot': system, 'WINDIR': system,
                     'PATH': str(root / 'tool/python') + ';' + str(Path(system) / 'System32')}
              env.update({k: str(scratch) for k in ('TMP', 'TEMP', 'HOME', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA', 'PROGRAMDATA')})
              test = r'''
          import contextlib, ctypes, hashlib, importlib.metadata, importlib.util, io
          import json, os, re, sqlite3, struct, sys
          from ctypes import wintypes as W
          from pathlib import Path

          def need(ok, label):
              if not ok:
                  raise RuntimeError(label)
          def mark(label):
              print(label + '=PASS', flush=True)
          root = Path.cwd()
          py = root / 'tool/python'
          need(os.name == 'nt' and struct.calcsize('P') == 8 and sys.version_info[:2] == (3, 14)
               and Path(sys.executable) == py / 'python.exe' and sys.flags.isolated,
               'P1_NATIVE_RUNTIME')
          need(all(Path(p).absolute().is_relative_to(py) for p in sys.path), 'P1_SYS_PATH')
          denied, events = [], []
          def audit(event, args):
              if event.startswith('socket.') or event in ('subprocess.Popen', 'os.system', 'os.startfile', 'os.startfile/2', 'os.exec', 'os.spawn'):
                  denied.append(event)
                  raise RuntimeError('P1_EXTERNAL_OPERATION')
              if event in ('os.rename', 'os.remove'):
                  events.append((event, args))
          sys.addaudithook(audit)
          with contextlib.redirect_stdout(io.StringIO()):
              import pymupdf, pymupdf4llm, tabulate, _sqlite3
          for module, name, version in ((pymupdf, 'PyMuPDF', '1.26.6'),
                                        (pymupdf4llm, 'pymupdf4llm', '0.2.9'),
                                        (tabulate, 'tabulate', '0.9.0')):
              need(Path(module.__file__).is_relative_to(py) and importlib.metadata.version(name) == version, 'P1_IMPORT_IDENTITY')
          need(Path(_sqlite3.__file__).is_relative_to(py), 'P1_SQLITE_PATH')
          print('P1_RUNTIME=' + sys.version.split()[0] + ';SQLite=' + sqlite3.sqlite_version)
          mark('P1_NATIVE_DEPS')
          spec = importlib.util.spec_from_file_location('pdf_library', root / 'home/skills/pdf-library/scripts/pdf_library.py')
          product = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(product)
          def cli(*args, rc=0, fragment=None):
              out, err = io.StringIO(), io.StringIO()
              with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                  actual = product.main([str(a) for a in args])
              need(actual == rc, 'P1_CLI_RC')
              if rc:
                  need(not out.getvalue() and (fragment is None or fragment in err.getvalue()), 'P1_CLI_REFUSAL')
                  return err.getvalue()
              need(not err.getvalue(), 'P1_CLI_STDERR')
              return out.getvalue()
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def pdf(path, text):
              with pymupdf.open() as doc:
                  doc.new_page().insert_text((50, 60), text)
                  doc.save(path)
          def state(lib):
              with contextlib.closing(sqlite3.connect((lib / '_index.sqlite3').as_uri() + '?mode=ro', uri=True)) as db:
                  need(db.execute('PRAGMA integrity_check').fetchall() == [('ok',)], 'P1_SQLITE_INTEGRITY')
                  need(db.execute('PRAGMA journal_mode').fetchone()[0] == 'delete', 'P1_JOURNAL_MODE')
                  need(db.execute('SELECT count(*) FROM pages p LEFT JOIN documents d ON p.document=d.document WHERE d.document IS NULL').fetchone()[0] == 0, 'P1_ORPHAN_PAGE')
                  return tuple(db.execute('SELECT * FROM ' + t + ' ORDER BY 1,2').fetchall() for t in ('documents', 'pages', 'pending_output'))
          k = ctypes.WinDLL('kernel32', use_last_error=True)
          create = k.CreateFileW
          create.argtypes = [W.LPCWSTR, W.DWORD, W.DWORD, W.LPVOID, W.DWORD, W.DWORD, W.HANDLE]
          create.restype = W.HANDLE
          close = k.CloseHandle
          close.argtypes, close.restype = [W.HANDLE], W.BOOL
          invalid = ctypes.c_void_p(-1).value
          def open_handle(p, access, share):
              h = create(str(p), access, share, None, 3, 0x80, None)
              error = ctypes.get_last_error()
              return h, error
          def delete_access(p, blocked):
              h, error = open_handle(p, 0x10000, 7)
              if h != invalid:
                  need(close(h), 'P1_HANDLE_CLOSE')
              need((h == invalid and error == 32) if blocked else h != invalid, 'P1_DELETE_SHARE_CONTROL')

          for operation in ('REPLACE', 'DELETE'):
              source = root / 'work' / operation / 'input'
              source.mkdir(parents=True)
              lib = source.parent / 'library'
              target = source / 'target.pdf'
              pdf(source / 'anchor.pdf', 'Anchor retained without any modification')
              pdf(target, 'OriginalTarget initial synthetic document')
              build = ('build', '--input', source, '--library', lib, '--ocr', 'none')
              need(json.loads(cli(*build))['documents'] == 2, 'P1_INITIAL_BUILD')
              md = lib / 'manuals/target.md'
              anchor = lib / 'manuals/anchor.md'
              old, anchor_bytes = md.read_bytes(), anchor.read_bytes()
              reports = {n: (lib / n).read_bytes() for n in product.REPORTS}
              initial = state(lib)
              need(not initial[2] and b'OriginalTarget' in old, 'P1_INITIAL_STATE')
              need(json.loads(cli('verify', '--library', lib))['documents'] == 2, 'P1_INITIAL_VERIFY')
              target.unlink()
              if operation == 'REPLACE':
                  pdf(target, 'UpdatedTarget committed synthetic document')
              delete_access(md, False)
              lock, error = open_handle(md, 0x80000000, 3)
              need(lock != invalid, 'P1_LOCK_OPEN')
              try:
                  delete_access(md, True)
                  start = len(events)
                  message = cli(*build, rc=1)
                  need(re.search(r'\[WinError (32|5)\]', message) is not None, 'P1_NOT_WINDOWS_FILE_ERROR')
                  need(any((event == 'os.rename' and operation == 'REPLACE' and Path(args[1]) == md) or
                           (event == 'os.remove' and operation == 'DELETE' and Path(args[0]) == md)
                           for event, args in events[start:]), 'P1_NO_ACTUAL_PUBLICATION_ATTEMPT')
                  need(md.read_bytes() == old, 'P1_LOCKED_BYTES')
              finally:
                  need(close(lock), 'P1_LOCK_CLOSE')
              delete_access(md, False)
              committed = state(lib)
              need(all([r for r in committed[i] if r[0] == 'anchor.pdf'] ==
                       [r for r in initial[i] if r[0] == 'anchor.pdf'] for i in (0, 1)), 'P1_ANCHOR_INDEX')
              need(len(committed[2]) == 1, 'P1_PENDING_COUNT')
              singleton, name, previous, desired, token = committed[2][0]
              need(singleton == 1 and name == 'target.pdf' and previous == digest(old)
                   and re.fullmatch('[0-9a-f]{32}', token or ''), 'P1_DURABLE_CLAIM')
              docs = [r for r in committed[0] if r[0] == name]
              pages = [r for r in committed[1] if r[0] == name]
              if operation == 'REPLACE':
                  wanted = ('# target\n\n' + '\n'.join(r[2] for r in pages)).encode('utf-8')
                  need(len(docs) == len(pages) == 1 and pages[0][1] == 1 and docs[0][4] == 1
                       and docs[0][1] == digest(target.read_bytes()) and docs[0][2] == desired == digest(wanted)
                       and b'UpdatedTarget' in wanted and desired != previous, 'P1_DESIRED_INDEX')
              else:
                  need(desired is None and not docs and not pages, 'P1_DELETE_INDEX')
              mark('P1_LOCK_' + operation)
              def preserved():
                  need(state(lib) == committed and anchor.read_bytes() == anchor_bytes
                       and all((lib / n).read_bytes() == b for n, b in reports.items()), 'P1_STATE_CHANGED')
                  need(not list((root / 'tmp').glob('.pdf-library-*')) and
                       not list((root / 'tmp').glob('pdf-ownership-*')), 'P1_SCRATCH_LEFT')
              for args in (('search', '--library', lib, '--query', 'Anchor'),
                           ('read', '--library', lib, '--document', 'anchor.pdf', '--pages', '1'),
                           ('verify', '--library', lib)):
                  cli(*args, rc=1, fragment='Unfinished Markdown/index update')
              preserved()
              mark('P1_PENDING_READS_' + operation)
              def refuses(data, message):
                  before = md.stat()
                  cli(*build, rc=1, fragment=message)
                  after = md.stat()
                  need(md.read_bytes() == data and (before.st_ino, before.st_mtime_ns) == (after.st_ino, after.st_mtime_ns), 'P1_USER_BYTES_CHANGED')
                  preserved()
              refuses(old, 'Pending Markdown publication is uncertain')
              mark('P1_UNLOCKED_RETRY_REFUSED_' + operation)
              edited = b'Explicit synthetic user edit\n'
              md.write_bytes(edited)
              refuses(edited, 'refusing to overwrite user changes')
              mark('P1_MANUAL_EDIT_' + operation)
              md.write_bytes(old)
              refuses(old, 'Pending Markdown publication is uncertain')
              mark('P1_RESTORED_PREVIOUS_REFUSED_' + operation)
              # Explicit fixture-user reconciliation, not a product repair API.
              if operation == 'REPLACE':
                  md.write_bytes(wanted)
                  need(digest(md.read_bytes()) == desired, 'P1_RECONCILE_BYTES')
              else:
                  md.unlink()
              count = 2 if operation == 'REPLACE' else 1
              need(json.loads(cli(*build))['documents'] == count, 'P1_RETRY_BUILD')
              need(state(lib) == (committed[0], committed[1], []), 'P1_FINAL_INDEX')
              need(json.loads(cli('verify', '--library', lib))['documents'] == count, 'P1_FINAL_VERIFY')
              need(json.loads(cli('search', '--library', lib, '--query', 'OriginalTarget')) == [], 'P1_STALE_SEARCH')
              if operation == 'REPLACE':
                  need(md.read_bytes() == wanted and 'UpdatedTarget' in cli('read', '--library', lib, '--document', name, '--pages', '1'), 'P1_FINAL_MARKDOWN')
                  hits = json.loads(cli('search', '--library', lib, '--query', 'UpdatedTarget'))
                  need(len(hits) == 1 and hits[0]['document'] == name and hits[0]['page'] == 1, 'P1_FINAL_SEARCH')
              else:
                  need(not md.exists(), 'P1_FINAL_DELETE')
              report = (lib / 'SHA256.md').read_text(encoding='utf-8')
              if operation == 'REPLACE':
                  need(f'| {name} | `{docs[0][1]}` | `{desired}` |' in report, 'P1_FINAL_REPORT')
              else:
                  need('| target.pdf |' not in report, 'P1_FINAL_REPORT')
              need(anchor.read_bytes() == anchor_bytes and not denied, 'P1_FINAL_BOUNDARY')
              mark('P1_RECONCILED_' + operation)
          mark('P1_NATIVE_RECOVERY')
          '''
              child = subprocess.run([str(root / 'tool/python/python.exe'), '-I', '-B', '-'],
                                     input=test.encode('ascii'), cwd=root, env=env,
                                     capture_output=True, timeout=180)
              print(child.stdout.decode('ascii')[-2000:], end='', flush=True)
              if child.returncode or child.stderr:
                  raise RuntimeError('P1_NATIVE_FAILED: ' + child.stderr.decode('utf-8', 'replace')[-1000:])
          need(not Path(tmp).exists(), 'P1_CLEANUP')
          print('P1_CLEANUP=PASS', flush=True)
          '@
          $output = @($probe | python -I -S -B -)
          $rc = $LASTEXITCODE
          $output | Write-Output
          if ($rc -ne 0) { throw 'P1 native test failed' }
          $expected = @('P1_SOURCE_AND_TRACKED_DEPS=PASS','P1_RUNTIME','P1_NATIVE_DEPS=PASS')
          foreach ($op in @('REPLACE','DELETE')) {
            foreach ($case in @('LOCK','PENDING_READS','UNLOCKED_RETRY_REFUSED','MANUAL_EDIT','RESTORED_PREVIOUS_REFUSED','RECONCILED')) {
              $expected += "P1_${case}_${op}=PASS"
            }
          }
          $expected += @('P1_NATIVE_RECOVERY=PASS','P1_CLEANUP=PASS')
          if ($output.Count -ne $expected.Count -or $output[1] -cnotmatch '^P1_RUNTIME=3\.14\.\d+;SQLite=\d+\.\d+\.\d+$') {
            throw 'P1 incomplete output'
          }
          for ($i=0; $i -lt $expected.Count; $i++) {
            if ($i -ne 1 -and $output[$i] -cne $expected[$i]) { throw 'P1 incomplete coverage' }
          }
          (@('P1_TRIGGER=PASS') + $output + @('P1_OUTPUT_GATE=PASS')) |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Output 'P1_OUTPUT_GATE=PASS'
