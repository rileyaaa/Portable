# Temporary owner-authorized review bridge; removed before final publication.
name: One-time final source review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Export committed source and pinned upstream definitions only
        shell: python
        run: |
          import ast,hashlib,json,pathlib,subprocess,urllib.request,zipfile
          root=pathlib.Path.cwd()
          scratch=root/'tmp/final-source-review'
          scratch.mkdir(parents=True,exist_ok=False)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          inventory=[]
          for record in subprocess.check_output(['git','ls-tree','-rz','--full-tree','HEAD']).split(b'\0'):
              if not record:continue
              header,raw_name=record.split(b'\t',1)
              mode,kind,sha=header.decode().split()
              inventory.append({'path':raw_name.decode('utf-8'),'mode':mode,'type':kind,'git_blob':sha})
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.html','.css','.toml','.rules','.sh'}
          selected=[row for row in inventory if row['type']=='blob' and not row['path'].startswith(excluded) and (pathlib.PurePosixPath(row['path']).suffix.lower() in suffixes or row['path'] in {'.gitattributes','.gitignore'})]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+row['path'] for row in selected)+'\n',text=True,check=True)
          manifest=json.loads((root/'tool/runtime-manifest.json').read_text(encoding='utf-8-sig'))
          upstream='https://raw.githubusercontent.com/openai/codex/rust-v'+manifest['version']+'/codex-rs/'
          archive=scratch/'source-review.zip'
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED) as z:
              for row in selected:
                  name=row['path'];path=root/name
                  assert not path.is_symlink() and path.is_file(),name
                  data=path.read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['git_blob'],name
                  if name.endswith('.py'):ast.parse(data.decode('utf-8-sig'),filename=name)
                  z.writestr('source/'+name,data)
              for name in ('core/config.schema.json','features/src/lib.rs','model-provider-info/src/lib.rs','protocol/src/openai_models.rs','cli/src/main.rs'):
                  data=urllib.request.urlopen(upstream+name,timeout=30).read()
                  z.writestr('upstream/'+name,data)
              z.writestr('inventory.json',json.dumps(inventory,ensure_ascii=False,indent=2))
              z.writestr('review-meta.json',json.dumps({'source_commit':commit,'runtime_version':manifest['version'],'selected_count':len(selected),'total_tracked':len(inventory),'excluded_payload_prefixes':excluded},indent=2))
          print('REVIEW_SNAPSHOT_COMMIT='+commit)
          print('REVIEW_SOURCE_FILES='+str(len(selected)))
          print('REVIEW_ARCHIVE_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest())
      - name: Upload private short-lived review material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-source-review
          path: tmp/final-source-review/source-review.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove this job's scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-source-review"
