# Temporary owner-authorized repair bridge; removed before final publication.
name: Instruction helper repair and fresh review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/codex-instruct.py
            /tests/
            /DEVELOPMENT.md
      - name: Reproduce the old guard and apply only the tested helper repair
        shell: python
        run: |
          import ast,base64,hashlib,io,pathlib,sys,unittest,zlib
          root=pathlib.Path.cwd();p=root/'tool/codex-instruct.py';raw=p.read_bytes()
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(raw)=='ea782ed9c9a9d61f0b89bc558be899b0acb7d193'
          encoded=''
          tests=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(tests).hexdigest()=='ec359c25b0bf2c85ef5696358c5112624356589b9502023f758ea79c84ea2c7b'
          test_path=root/'tests/test_instruction_installer.py'
          assert not test_path.exists();test_path.write_bytes(tests)
          sys.path.insert(0,str(root/'tests'))
          suite=unittest.defaultTestLoader.loadTestsFromName('test_instruction_installer.InstructionInstallerTests.test_linked_ancestor_rejected_before_marker_probe')
          result=unittest.TextTestRunner(stream=io.StringIO()).run(suite)
          assert len(result.failures)==1 and not result.errors and not result.skipped,'Baseline must reproduce the reviewed defect.'
          print('BASELINE_DEFECT_REPRODUCED=PASS')
          text=raw.decode('utf-8');lines=text.splitlines(keepends=True)
          node=next(n for n in ast.parse(text).body if isinstance(n,ast.FunctionDef) and n.name=='package_root')
          new='''def package_root() -> Path:
              script = Path(os.path.abspath(__file__))
              raw = script.parents[1]
              # Inspect from the filesystem root down before probing package markers.
              # Resolving first would erase a linked ancestor and silently trust its target.
              for entry in (*reversed(script.parents), script):
                  if _is_reparse(entry):
                      raise SystemExit(f"Refusing linked instruction-helper entry path: {entry}")
                  if entry == script:
                      _reject_existing_hardlink(entry, "instruction helper")
                  elif not entry.is_dir():
                      raise SystemExit(f"Invalid instruction-helper ancestor: {entry}")
              for name in ("codex.exe", "env.ps1"):
                  marker = raw / name
                  if _is_reparse(marker) or not marker.is_file():
                      raise SystemExit(f"Invalid or linked portable package marker: {marker}")
                  _reject_existing_hardlink(marker, "package marker")
              return raw
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          output=(''.join(lines[:node.lineno-1])+new+''.join(lines[node.end_lineno:])).encode('utf-8')
          assert blob(output)=='8bdb85803f3de019a8f28991333905400185eba1','Repair differs from tested bytes.'
          p.write_bytes(output)
      - name: Run all new synthetic instruction-helper regressions
        shell: bash
        run: python -B -m unittest discover -s tests -p test_instruction_installer.py -v
      - name: Record the cause and bounded repair, then commit
        id: commit
        shell: python
        run: |
          import os,pathlib,subprocess
          path=pathlib.Path('DEVELOPMENT.md');text=path.read_text(encoding='utf-8')
          anchor='## 2026-10-24：Windows 验证与 npm 目录边界'
          record='**模型指令安装入口：** 单独调用 `tool/codex-instruct.py` 时，旧根目录定位会先解析上级链接，绕过入口祖先检查；已用合成包复现。现从文件系统根向下校验完整入口链，再检查普通、单链接的包标记，不先跟随链接目标；仅修改该助手的根定位，不改变指令内容、持久配置格式、认证或启动器。新增 11 项回归覆盖上级/包根/工具目录链接、脚本与标记硬链接、缺失标记、正常安装、改名搬迁及自定义包内 home；Linux 合成测试通过，随后以全新检出复查和完整 Windows 验收作为发布前置条件。'
          assert text.count(anchor)==1 and '**模型指令安装入口：**' not in text
          path.write_text(text.replace(anchor,anchor+'\n\n'+record,1),encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','tool/codex-instruct.py','tests/test_instruction_installer.py','DEVELOPMENT.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          subprocess.run(['git','commit','-m','fix: reject linked instruction-helper entry ancestors before package probes'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          print('REPAIR_COMMIT='+commit)
  recheck:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Independently verify exact repair scope and complete source inventory
        shell: python
        run: |
          import ast,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd()
          paths=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-tree','-rz','--name-only','HEAD']).split(b'\0') if p]
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.html','.css','.toml','.rules','.sh'}
          selected=[p for p in paths if not p.startswith(excluded) and (pathlib.PurePosixPath(p).suffix.lower() in suffixes or p in {'.gitattributes','.gitignore'})]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in selected)+'\n',text=True,check=True)
          base='44b843da89cc553ef7e2ba3e18b01e955a274687'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',base],check=True)
          changed={p.decode('utf-8') for p in subprocess.check_output(['git','diff','--name-only','-z',base,'HEAD']).split(b'\0') if p}
          assert changed=={'tool/codex-instruct.py','tests/test_instruction_installer.py','DEVELOPMENT.md','.github/workflows/cli-scope-once.yml'},changed
          old=subprocess.check_output(['git','show',base+':tool/codex-instruct.py']).decode('utf-8')
          new=(root/'tool/codex-instruct.py').read_text()
          def without_root(text):
              lines=text.splitlines(keepends=True);node=next(n for n in ast.parse(text).body if isinstance(n,ast.FunctionDef) and n.name=='package_root')
              return ''.join(lines[:node.lineno-1]+lines[node.end_lineno:])
          assert without_root(old)==without_root(new),'Unrelated helper code changed.'
          counts={'python':0,'javascript':0,'json':0,'bat':0}
          for p in selected:
              file=root/p
              if p.endswith('.py'):ast.parse(file.read_text(encoding='utf-8-sig'),filename=p);counts['python']+=1
              elif p.endswith(('.js','.cjs','.mjs')):subprocess.run(['node','--check',p],check=True,capture_output=True,timeout=15);counts['javascript']+=1
              elif p.endswith('.json'):json.loads(file.read_text(encoding='utf-8-sig'));counts['json']+=1
              elif p.endswith('.bat') and '/' not in p:
                  b=file.read_bytes();b.decode('ascii');assert b'\n' not in b.replace(b'\r\n',b''),p;counts['bat']+=1
          launcher=(root/'run-codex.ps1').read_text(encoding='utf-8-sig')
          settings=re.findall(r'^\s*\$env:(CODEX_\w+)\s*=\s*"([^"]*)"',(root/'env.ps1').read_text(encoding='utf-8-sig'),re.M)
          consumers=launcher+(root/'login-json.ps1').read_text(encoding='utf-8-sig')
          assert len(settings)==42 and all(name in consumers for name,value in settings)
          manifest=(root/'tool/runtime-manifest.json').read_bytes()
          pin=re.search(r'\$ExpectedRuntimeManifestSha256\s*=\s*"([0-9a-fA-F]{64})"',launcher)[1].lower()
          assert hashlib.sha256(manifest).hexdigest()==pin
          workflow=(root/'.github/workflows/release.yml').read_text()
          assert workflow.count('if: $'+"{{ success() && inputs.publish_release && inputs.check_set == 'full' }}")==2
          assert "-m unittest discover -s tests -p 'test_*.py'" in workflow
          print('FRESH_SOURCE_REVIEW=PASS '+json.dumps(counts,sort_keys=True))
      - name: Fresh Python synthetic regression suites
        shell: python
        run: |
          import sys,unittest
          sys.path.insert(0,'tests')
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_instruction_installer','test_mode_copies','test_login_json_http','test_android_guard','test_android_extension','test_helper_relocation','test_office_output_boundaries'])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==58 and result.wasSuccessful() and not result.skipped
      - name: Fresh PowerShell syntax and production-policy regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($_.FullName+': '+($errors.Message -join '; '))};$count++
          }
          foreach($name in @('test_cli_model_options','test_permission_display','test_extension_policy','test_extension_migration')){
            & pwsh -NoProfile -NonInteractive -File (Join-Path $PWD ('tests/'+$name+'.ps1'))
            if($LASTEXITCODE -ne 0){throw ('Fresh regression failed: '+$name)}
          }
          Write-Output "FRESH_POWERSHELL_REVIEW=PASS count=$count (Linux/PS7; Windows remains mandatory)"
