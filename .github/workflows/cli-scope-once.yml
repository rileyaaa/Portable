# Temporary owner-authorized repair bridge; remove before official publication.
name: Instruction boundary repair and independent recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/codex-instruct.py
            /tests/test_instruction_installer.py
            /DEVELOPMENT.md
      - name: Apply byte-pinned reviewed patch only
        shell: python
        run: |
          import base64,hashlib,pathlib,subprocess,zlib
          before={'tool/codex-instruct.py':'8bdb85803f3de019a8f28991333905400185eba1','tests/test_instruction_installer.py':'064b89dd0d807f7a151f62c50334ae3f04a7792a','DEVELOPMENT.md':'56196a5e888c4feaa6fc837ec9bffa01383568a1'}
          after={'tool/codex-instruct.py':'d8c4adc48605978d4fcfcd2374a75342412ce9bc','tests/test_instruction_installer.py':'be4d78ec71960ef778147e8fe5502ca6da3c74a8','DEVELOPMENT.md':'412cfb11050dc9af286b6659a4f7d4c4da08c791'}
          def blob(name):
              data=pathlib.Path(name).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name,sha in before.items(): assert blob(name)==sha,name
          payload=''
          # Correct only transport transcription; the decoded patch identity is mandatory.
          payload=payload.replace('5FiHH65','5FiH65').replace('TX16zz70','TX16z70')
          patch=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a4dd2abffcca0ec0b99cf77b6a38b6c017b6bb982d5955c99d87227b5a425212'
          scratch=pathlib.Path('tmp/final-instruction-repair');scratch.mkdir(parents=True,exist_ok=False)
          path=scratch/'repair.patch';path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          for name,sha in after.items(): assert blob(name)==sha,name
          subprocess.run(['git','diff','--check'],check=True)
      - name: Run all nineteen synthetic instruction tests
        shell: bash
        run: python -B -m unittest discover -s tests -p test_instruction_installer.py -v
      - name: Commit only reviewed production helper, tests and existing document
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tool/codex-instruct.py tests/test_instruction_installer.py DEVELOPMENT.md
          git diff --cached --check
          git commit -m 'fix: validate instruction paths before metadata and stage writes only in tmp'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Delete the downloaded review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/final-instruction-repair/gh
        shell: bash
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/12563752490"
      - name: Remove owned repair scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-instruction-repair"
  recheck:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          fetch-depth: 2
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Independently inspect complete inventory and exact repair scope
        shell: python
        run: |
          import ast,hashlib,pathlib,subprocess
          paths=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-tree','-rz','--name-only','HEAD']).split(b'\0') if p]
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.psd1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.rules','.toml','.css','.html','.sh'}
          selected=[p for p in paths if not p.startswith(excluded) and (pathlib.PurePosixPath(p).suffix.lower() in suffixes or p in ('.gitignore','.gitattributes'))]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in selected)+'\n',text=True,check=True)
          changed=set(subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines())
          assert changed=={'tool/codex-instruct.py','tests/test_instruction_installer.py','DEVELOPMENT.md'},changed
          expected={'tool/codex-instruct.py':'d8c4adc48605978d4fcfcd2374a75342412ce9bc','tests/test_instruction_installer.py':'be4d78ec71960ef778147e8fe5502ca6da3c74a8','DEVELOPMENT.md':'412cfb11050dc9af286b6659a4f7d4c4da08c791'}
          for name,sha in expected.items():
              data=pathlib.Path(name).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,name
          counts={'python':0,'javascript':0}
          for name in selected:
              if name.endswith('.py'): ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'),filename=name);counts['python']+=1
              if name.endswith(('.js','.cjs','.mjs')): subprocess.run(['node','--check',name],check=True,capture_output=True);counts['javascript']+=1
          assert sum(pathlib.PurePosixPath(p).name.lower()=='codex.exe' for p in paths)==1
          for name in [p for p in selected if '/' not in p and p.endswith('.bat')]:
              data=pathlib.Path(name).read_bytes();data.decode('ascii');assert b'\n' not in data.replace(b'\r\n',b''),name
          subprocess.run(['git','diff','--check'],check=True)
          print('FRESH_INVENTORY',len(paths),'SOURCE_SYNTAX',counts,'EXACT_REPAIR_SCOPE=PASS')
      - name: Fresh cross-platform synthetic regression suites
        shell: python
        run: |
          import pathlib,sys,unittest
          sys.path.insert(0,str(pathlib.Path('tests').resolve()))
          modules=['test_android_extension','test_android_guard','test_helper_relocation','test_instruction_installer','test_login_json_http','test_mode_copies','test_office_output_boundaries','test_python_lock','test_release_package']
          def flatten(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite): yield from flatten(item)
                  else: yield item
          tests=list(flatten(unittest.defaultTestLoader.loadTestsFromNames(modules)))
          native='test_python_lock.PythonLockTests.test_runtime_repair_accepts_current_defaults_and_missing_packages'
          assert sum(t.id()==native for t in tests)==1
          print('NOT_RUN_IN_LINUX_SOURCE_CHECK:',native,'(requires complete bundled Windows payload; mandatory in full Windows release)')
          selected=[t for t in tests if t.id()!=native]
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          if not result.wasSuccessful() or result.skipped: raise SystemExit('Fresh synthetic regression did not fully pass.')
          print('FRESH_PYTHON_PASS',result.testsRun)
      - name: Fresh PowerShell syntax and actual production policy functions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($_.FullName+': '+($errors.Message -join '; ')) }
            $count++
          }
          foreach ($name in @('test_cli_model_options','test_permission_display','test_extension_policy','test_extension_migration','test_browser_login_flow','test_system_policy','test_python_setup')) {
            & pwsh -NoLogo -NoProfile -File (Join-Path 'tests' ($name+'.ps1'))
            if ($LASTEXITCODE -ne 0) { throw ('Fresh production policy regression: '+$name) }
          }
          Write-Output "FRESH_POWERSHELL_PARSE=$count; Linux/PS7 does not replace Windows release validation."
