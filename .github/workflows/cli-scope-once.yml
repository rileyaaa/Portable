# Temporary owner-authorized dispatch bridge; delete immediately after this push.
name: Final Windows release handoff
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GH_CONFIG_DIR: ${{ github.workspace }}/tmp/final-release-handoff/gh
    steps:
      - name: Require successful review and a manual-only final source tree
        shell: python
        run: |
          import base64,json,os,pathlib,subprocess,time
          pathlib.Path('tmp/final-release-handoff').mkdir(parents=True,exist_ok=False)
          repo=os.environ['GITHUB_REPOSITORY'];bridge=os.environ['GITHUB_SHA']
          def get(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True,timeout=30))
          reviewed='79876d4a286df2828c4a807b0b7f743123383bee'
          prior=get('actions/runs/40085598917')
          assert prior['status']=='completed' and prior['conclusion']=='success'
          assert prior['head_sha']=='b3a6d860b607b003b49d946dcf5c55204c4a530b'
          bridge_delta=get('compare/'+reviewed+'...'+bridge)
          assert bridge_delta['status']=='ahead'
          assert len(bridge_delta['files'])==1 and bridge_delta['files'][0]['filename']=='.github/workflows/cli-scope-once.yml'
          deadline=time.monotonic()+120
          while time.monotonic()<deadline:
              final=get('git/ref/heads/main')['object']['sha']
              if final!=bridge:
                  diff=get('compare/'+bridge+'...'+final)
                  assert diff['status']=='ahead'
                  assert len(diff['files'])==1 and diff['files'][0]['filename']=='.github/workflows/cli-scope-once.yml' and diff['files'][0]['status']=='removed'
                  break
              time.sleep(3)
          else:
              raise SystemExit('Temporary workflow removal was not confirmed; nothing dispatched.')
          release_file=get('contents/.github/workflows/release.yml?ref='+final)
          workflow=base64.b64decode(release_file['content']).decode('utf-8')
          assert '  workflow_dispatch:' in workflow and '\n  push:' not in workflow
          assert workflow.count('if: $'+"{{ success() && inputs.publish_release && inputs.check_set == 'full' }}")==2
          releases=get('releases?per_page=100')
          tag='v2026.10.24.2'
          assert not any(r['tag_name']==tag for r in releases),'Existing release or draft must not be overwritten.'
          payload=json.dumps({'ref':'main','inputs':{'version':tag,'publish_release':'true','check_set':'full'}})
          subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True,timeout=30)
          print('FINAL_WINDOWS_DISPATCHED='+final)
          print('RELEASE_TAG='+tag)
      - name: Remove this handoff scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-release-handoff"
