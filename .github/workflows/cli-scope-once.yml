# Temporary documentation-only task. No release or workflow dispatch permissions.
name: Record completed independent review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /DEVELOPMENT.md
      - name: Consolidate the completed review result in the existing paragraph
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          path=pathlib.Path('DEVELOPMENT.md');data=path.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='412cfb11050dc9af286b6659a4f7d4c4da08c791'
          text=data.decode('utf-8')
          old='另以全新检出复查，完整 Windows 验收和发行附件回读仍为发布前置条件，最终结果以对应 Release 与 Actions 为准。'
          new='修复后独立运行 40105103992 在全新 runner 检出提交复查，81 项 Python 合成测试、42 份 PowerShell 解析及 CLI/权限提示/扩展迁移与持久化等生产函数回归全部通过，未发现新的可复现问题。Linux/PS7 不替代 Windows；完整 Windows 验收和发行附件回读仍为发布前置条件，最终结果以对应 Release 与 Actions 为准。'
          assert text.count(old)==1
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','DEVELOPMENT.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','docs: record fresh independent instruction boundary verification'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('DOCUMENTATION_ONLY_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
