# Temporary owner-authorized repair bridge; removed before final publication.
name: Instruction helper repair and fresh review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/codex-instruct.py
            /tests/
            /DEVELOPMENT.md
      - name: Recover the recorded repair and verification scripts
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/instruction-repair-code/gh
        run: |
          import ast,base64,hashlib,json,os,pathlib,subprocess
          scratch=pathlib.Path('tmp/instruction-repair-code');scratch.mkdir(parents=True,exist_ok=False)
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/cli-scope-once.yml?ref=2d825a87f4f102e35c1ac7b966779bdbc7e4dd29'
          record=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          raw=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='b973b9c8a1af517d7695cddc8d0d999fc4786749'
          text=raw.decode('utf-8')
          def extract(name):
              section=text.split('      - name: '+name+'\n',1)[1]
              body=section.split('        run: |\n',1)[1]
              lines=[]
              for line in body.splitlines():
                  if line and not line.startswith('          '):break
                  lines.append(line[10:] if line else '')
              return '\n'.join(lines)+'\n'
          apply=extract('Reproduce the old guard and apply only the tested helper repair')
          assert apply.count('JA/dMya')==1
          apply=apply.replace('JA/dMya','JA/dzfMya')
          # YAML has already removed its indentation. Preserve the tested Python
          # function indentation; the resulting Git blob is checked by apply.py.
          lines=apply.splitlines(keepends=True)
          removed=[line for line in lines if line.startswith("new='\\n'.join(")]
          assert len(removed)==1
          apply=''.join(line for line in lines if line not in removed)
          ast.parse(apply)
          (scratch/'apply.py').write_text(apply,encoding='utf-8')
          (scratch/'record.py').write_text(extract('Record the cause and bounded repair, then commit'),encoding='utf-8')
      - name: Reproduce baseline and apply exact tested source bytes
        shell: bash
        run: python -B tmp/instruction-repair-code/apply.py
      - name: Run all new synthetic instruction-helper regressions
        shell: bash
        run: python -B -m unittest discover -s tests -p test_instruction_installer.py -v
      - name: Record and commit only the bounded repair
        id: commit
        shell: bash
        run: python -B tmp/instruction-repair-code/record.py
      - name: Remove owned repair script copies
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/instruction-repair-code"
  recheck:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Load the independent review on a fresh checkout
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/instruction-review-code/gh
        run: |
          import base64,hashlib,json,os,pathlib,subprocess
          scratch=pathlib.Path('tmp/instruction-review-code');scratch.mkdir(parents=True,exist_ok=False)
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/cli-scope-once.yml?ref=2d825a87f4f102e35c1ac7b966779bdbc7e4dd29'
          record=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          raw=base64.b64decode(record['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='b973b9c8a1af517d7695cddc8d0d999fc4786749'
          text=raw.decode('utf-8')
          def extract(name):
              section=text.split('      - name: '+name+'\n',1)[1]
              body=section.split('        run: |\n',1)[1]
              lines=[]
              for line in body.splitlines():
                  if line and not line.startswith('          '):break
                  lines.append(line[10:] if line else '')
              return '\n'.join(lines)+'\n'
          (scratch/'source-review.py').write_text(extract('Independently verify exact repair scope and complete source inventory'),encoding='utf-8')
          (scratch/'python-tests.py').write_text(extract('Fresh Python synthetic regression suites'),encoding='utf-8')
          (scratch/'powershell-tests.ps1').write_text(extract('Fresh PowerShell syntax and production-policy regressions'),encoding='utf-8')
      - name: Independent source, configuration and bounded-diff checks
        shell: bash
        run: python -B tmp/instruction-review-code/source-review.py
      - name: Fresh 58-case Python regression
        shell: bash
        run: python -B tmp/instruction-review-code/python-tests.py
      - name: Fresh PowerShell syntax and policy regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tmp/instruction-review-code/powershell-tests.ps1
      - name: Remove owned review script copies
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/instruction-review-code"
