# Temporary owner-authorized review bridge; remove before final publication.
name: Final independent source review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-scope-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Export exact tracked first-party text and complete inventory
        shell: python
        run: |
          import ast, hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path.cwd()
          scratch=root/'tmp'/'final-review-export'
          scratch.mkdir(parents=True,exist_ok=False)
          inventory=[]
          for record in subprocess.check_output(['git','ls-tree','-rz','--full-tree','HEAD']).split(b'\0'):
              if not record: continue
              header,name=record.split(b'\t',1)
              mode,kind,sha=header.decode('ascii').split()
              inventory.append({'path':name.decode('utf-8'),'mode':mode,'type':kind,'sha':sha})
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.psd1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.rules','.toml','.css','.html','.sh'}
          wanted=[r for r in inventory if r['type']=='blob' and r['mode'] in ('100644','100755') and not r['path'].startswith(excluded) and (pathlib.PurePosixPath(r['path']).suffix.lower() in suffixes or r['path'] in ('.gitignore','.gitattributes'))]
          assert not any(r['path']=='env.local.ps1' or r['path'].startswith(('home/auth','login_json/','cache/','tmp/','work/')) for r in wanted)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+r['path'] for r in wanted)+'\n',text=True,check=True)
          counts={'python':0,'javascript':0}
          with zipfile.ZipFile(scratch/'source-review.zip','x',compression=zipfile.ZIP_DEFLATED) as out:
              for r in wanted:
                  data=(root/r['path']).read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==r['sha'],r['path']
                  text=data.decode('utf-8-sig')
                  if r['path'].endswith('.py'):
                      ast.parse(text,filename=r['path']);counts['python']+=1
                  elif r['path'].endswith(('.js','.cjs','.mjs')):
                      subprocess.run(['node','--check',r['path']],check=True,capture_output=True);counts['javascript']+=1
                  out.writestr('source/'+r['path'],data)
              out.writestr('inventory.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':inventory,'exported':[r['path'] for r in wanted]},ensure_ascii=False,indent=2))
          print('TRACKED_FILES',len(inventory),'EXPORTED_TEXT',len(wanted),'PARSE_OK',counts)
          print('SOURCE_ARCHIVE_SHA256',hashlib.sha256((scratch/'source-review.zip').read_bytes()).hexdigest())
      - name: Parse PowerShell and check synchronized mode copies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($_.FullName + ': ' + ($errors.Message -join '; ')) }
            $count++
          }
          Write-Output "POWERSHELL_PARSE_OK=$count (Linux syntax check only)"
          python -B -m unittest discover -s tests -p test_mode_copies.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Mode copies differ.' }
          python -B -m unittest discover -s tests -p test_instruction_installer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Instruction helper regression.' }
      - name: Upload short-lived private review material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-source-review
          path: tmp/final-review-export/source-review.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove owned export scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-review-export"
