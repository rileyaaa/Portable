name: Windows local LFS scanner boundary (one-time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths:
      - .github/workflows/windows-lfs-local-scanner-once.yml
permissions:
  contents: read
jobs:
  lfs-local-scanner:
    runs-on: windows-2025
    timeout-minutes: 6
    env:
      LS_PARENT: 3141ca1b3fc535e1371598567f7f437248fdae68
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Verify one-time push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_REPOSITORY -cne 'rileyaaa/Portable' -or $env:GITHUB_REF -cne 'refs/heads/dev/stable-tool-refresh' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ARCH -cne 'X64' -or $PSVersionTable.PSEdition -cne 'Core' -or -not [Environment]::Is64BitProcess -or
              $e.before -cne $env:LS_PARENT -or $e.after -cne $env:GITHUB_SHA -or $e.ref -cne $env:GITHUB_REF -or
              $e.head_commit.id -cne $env:GITHUB_SHA -or $e.created -ne $false -or $e.deleted -ne $false -or $e.forced -ne $false) { throw 'LS_TRIGGER_OR_ENV' }
          Write-Output 'LS_TRIGGER=PASS'
          Write-Output 'LS_LFS_HYDRATION=NOT_RUN'
          Write-Output 'CW_BAT_STATUS=NOT_RUN'
          Write-Output 'LS_PHASE=INITIAL_SOURCE_CHECKOUT_MAY_USE_NETWORK'
      - name: Acquire pinned Git objects without LFS hydration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /清理缓存.bat
            /清理缓存.ps1
            /run-codex.ps1
            /env.ps1
            /tool/automation/portable-automation.ps1
            /codex.exe
            /.github/workflows/windows-cache-whatif-once.yml
      - name: Owned Git objects and local LFS scanner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'LS_SOURCE_CHECKOUT=PASS'
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $git = (Get-Command git.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $cursor = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          while ($cursor) {
            $i = Get-Item -LiteralPath $cursor -Force
            if (-not $i.PSIsContainer -or ($i.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'OG_UNSAFE_PARENT' }
            $cursor = [IO.Path]::GetDirectoryName($cursor.TrimEnd('\'))
          }
          $owned = Join-Path $env:RUNNER_TEMP ('owned-lfs-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $owned -ErrorAction Stop
          $script = Join-Path $owned 'probe.py'
          $probe = @'
          import hashlib, json, os, re, shutil, stat, struct, subprocess, sys, zlib
          from pathlib import Path

          BASE = '1dc8e7a442e54332b5ffcf93421ec6116de9389a'
          TREE = 'efa66809452cae18a8745601bd7dfd0402f867e9'
          PARENT = '3141ca1b3fc535e1371598567f7f437248fdae68'
          PARENT_TREE = '4fe6c9024acb1aa0f069e444ba9304d73b37cb12'
          OLD = '.github/workflows/windows-cache-whatif-once.yml'
          OLD_BLOB = '8b0d7aadcd62433b35b0a8975d87679a460bd3d4'
          NEW = '.github/workflows/windows-lfs-local-scanner-once.yml'
          ORIGIN = 'https://github.com/rileyaaa/Portable.git'
          PINS = {'\u6e05\u7406\u7f13\u5b58.bat': '6a6023c9b6d2f58c9ec7be507406c7e8dc94a582',
                  '\u6e05\u7406\u7f13\u5b58.ps1': 'aa92566c7618e47f429fee2949c34832c0dd87b6',
                  'run-codex.ps1': '2eaac598eaf07eadf725a58308d8e81672a3e2bb',
                  'env.ps1': 'fee7920e3e12a56c9f5a7f3693de360c1f49a760',
                  'tool/automation/portable-automation.ps1': 'ac585e936fb4d8ddbe44ba12fa047069032297c3',
                  '.gitattributes': 'f6e24317bd3cbf5157715b7d304ecbef3361a0a9',
                  'codex.exe': '8a502114b89f0053a19ed1f561b7263306bec0f8'}
          OID = '3f42b12274b353ecb3ec555e6c8d0a43f6c6cb29c3a546179bc12dee4855deb6'
          SIZE = 416707888
          SPEC = 'https://git-lfs.github.com/spec/v1'
          DENY = re.compile(rb'^(url\.|credential\.|http\.|lfs\.|remote\..*\.lfsurl)')
          CORE = set(b'core.repositoryformatversion core.filemode core.bare core.logallrefupdates core.ignorecase core.symlinks'.split())
          REQUIRED = set(b'core.repositoryformatversion core.filemode core.bare'.split())
          REMOTE = {b'remote.origin.url', b'remote.origin.fetch'}
          FORMAT = b'lfs.repositoryformatversion'
          SUFFIX = b'\n[lfs]\n\trepositoryformatversion = 0\n'


          def need(ok, label):
              if not ok: raise RuntimeError(label)


          def ordinary(p, directory):
              s = p.lstat()
              need(not stat.S_ISLNK(s.st_mode) and not getattr(s, 'st_file_attributes', 0) & 0x400 and
                   (stat.S_ISDIR(s.st_mode) if directory else stat.S_ISREG(s.st_mode) and s.st_nlink == 1), 'OG_UNSAFE_ENTRY')
              return s


          def plain(p):
              p = Path(p).absolute()
              if os.name == 'nt': need(re.fullmatch(r'[A-Za-z]:', p.drive) and '..' not in p.parts and ':' not in str(p)[2:], 'OG_LOCAL_PATH')
              for q in (*reversed(p.parents), p): ordinary(q, True)
              return p


          def inventory(root):
              result, pending = {}, [plain(root)]
              while pending:
                  for p in pending.pop().iterdir():
                      isdir = stat.S_ISDIR(p.lstat().st_mode)
                      s = ordinary(p, isdir)
                      result[p.relative_to(root).as_posix()] = None if isdir else (s.st_size, s.st_mtime_ns)
                      if isdir: pending.append(p)
              return result


          def no_alternates(obj):
              need(not any(os.path.lexists(obj/'info'/n) for n in ('alternates','http-alternates')), 'OG_ALTERNATES_FORBIDDEN')


          def config_digest(p):
              ordinary(p, False)
              with p.open('rb') as f: return hashlib.file_digest(f, 'sha256').digest()


          def canonical(kind, raw):
              return f'{kind} {len(raw)}\0'.encode('ascii') + raw


          def object_id(kind, raw):
              return hashlib.sha1(canonical(kind,raw)).hexdigest()


          class Owned:
              def __init__(self, scope, gitexe, system_env):
                  self.scope, self.gitexe = scope, gitexe
                  scope.mkdir(); self.repo = scope/'git'; self.repo.mkdir()
                  self.template = scope/'empty-template'; self.template.mkdir()
                  home = scope/'home'; home.mkdir()
                  temp = scope/'tmp'; temp.mkdir()
                  empty = scope/'empty-config'; empty.touch(exist_ok=False)
                  self.env = dict(system_env, HOME=str(home), USERPROFILE=str(home), APPDATA=str(home), LOCALAPPDATA=str(home),
                                  TEMP=str(temp), TMP=str(temp), TMPDIR=str(temp), XDG_CONFIG_HOME=str(home),
                                  GIT_CONFIG_NOSYSTEM='1', GIT_CONFIG_GLOBAL=str(empty), GIT_CONFIG_SYSTEM=str(empty),
                                  GIT_ATTR_NOSYSTEM='1', GIT_ALLOW_PROTOCOL='', GIT_PROTOCOL_FROM_USER='0', GIT_NO_LAZY_FETCH='1',
                                  GIT_NO_REPLACE_OBJECTS='1', GIT_OPTIONAL_LOCKS='0', GIT_TERMINAL_PROMPT='0', GIT_LFS_SKIP_SMUDGE='1')
                  self.git('init', '--template='+str(self.template), '--object-format=sha1', '--initial-branch=probe')
                  self.config = self.repo/'.git/config'; self.objects = self.repo/'.git/objects'
                  self.gate(self.config, False)
                  self.git('remote', 'add', 'origin', ORIGIN)
                  self.gate(self.config, True)
                  self.baseline = config_digest(self.config)
                  self.imported = {}
                  self.integrity()

              def run(self, *args, data=None, source=None):
                  e = dict(self.env)
                  if source is not None:
                      need(args == ('cat-file','--batch'), 'OG_SOURCE_COMMAND')
                      e['GIT_OBJECT_DIRECTORY'] = str(source)
                  try:
                      return subprocess.run([self.gitexe, *args], cwd=self.repo, env=e, input=data,
                                            stdin=subprocess.DEVNULL if data is None else None, capture_output=True, timeout=40)
                  except subprocess.TimeoutExpired: raise RuntimeError('OG_GIT_TIMEOUT') from None

              def git(self, *args, data=None, source=None):
                  r = self.run(*args, data=data, source=source)
                  need(r.returncode == 0 and not r.stderr, 'OG_SOURCE_OBJECT_READ_FAILED' if source is not None else 'OG_GIT_COMMAND_FAILED')
                  return r.stdout

              def keys(self, path):
                  ordinary(path, False)
                  raw = self.git('config','--file',str(path),'--no-includes','--null','--name-only','--list')
                  need(raw.endswith(b'\0'), 'OG_CONFIG_KEY_FORMAT')
                  return raw[:-1].split(b'\0')

              def gate(self, path, origin=True, expected=None):
                  names = self.keys(path); keys = set(names)
                  need(not any(DENY.match(k) for k in names), 'OG_ORIGINAL_DENY')
                  need(len(keys) == len(names), 'OG_CONFIG_DUPLICATE')
                  need((REQUIRED | (REMOTE if origin else set())) <= keys <= (CORE | (REMOTE if origin else set())), 'OG_CONFIG_UNKNOWN_KEY')
                  if expected is not None: need(config_digest(path) == expected, 'OG_CONFIG_CHANGED')

              def integrity(self):
                  self.gate(self.config, True, self.baseline)
                  no_alternates(self.objects)
                  need(not any(os.path.lexists(self.repo/'.git'/p) for p in ('hooks','config.worktree','shallow','commondir','lfs')), 'OG_INHERITED_METADATA')

              def batch(self, requested, source=None):
                  need(0 < len(requested) <= 128 and all(re.fullmatch(r'[0-9a-f]{40}', k) for k in requested), 'OG_OBJECT_REQUEST')
                  raw = self.git('cat-file','--batch', data=('\n'.join(requested)+'\n').encode('ascii'), source=source)
                  pos, result = 0, {}
                  for oid, kind in requested.items():
                      end = raw.find(b'\n', pos); need(end >= pos, 'OG_OBJECT_HEADER')
                      parts = raw[pos:end].split(b' ')
                      need(parts != [oid.encode(), b'missing'], 'OG_LOCAL_OBJECT_MISSING')
                      need(len(parts) == 3 and parts[:2] == [oid.encode(), kind.encode()] and parts[2].isdigit(), 'OG_OBJECT_HEADER')
                      size = int(parts[2]); start = end+1; pos = start+size+1
                      need(size <= 2*1024*1024 and raw[pos-1:pos] == b'\n', 'OG_OBJECT_BOUND')
                      body = raw[start:pos-1]; packed = canonical(kind,body)
                      need(len(body) == size and hashlib.sha1(packed).hexdigest() == oid, 'OG_OBJECT_HASH')
                      result[oid] = (body, packed)
                  need(pos == len(raw), 'OG_OBJECT_TRAILING_BYTES')
                  return result

              def put_object(self, oid, kind, packed):
                  need(oid not in self.imported, 'OG_OBJECT_DUPLICATE')
                  p = self.objects/oid[:2]/oid[2:]; p.parent.mkdir(exist_ok=True)
                  with p.open('xb') as f: f.write(zlib.compress(packed))
                  self.imported[oid] = kind

              def import_batch(self, requested, source):
                  objects = self.batch(requested, source)
                  for oid, (_, packed) in objects.items(): self.put_object(oid, requested[oid], packed)
                  verified = self.batch(requested)
                  need(verified == objects, 'OG_OBJECT_READBACK')
                  return {oid: body for oid, (body, _) in verified.items()}

              def tree_closure(self, roots, source):
                  pending = set(roots); count = 0
                  while pending:
                      selected = sorted(pending)[:128]; pending.difference_update(selected)
                      requested = {oid:'tree' for oid in selected if oid not in self.imported}
                      if not requested: continue
                      for body in self.import_batch(requested, source).values():
                          pos = 0
                          while pos < len(body):
                              space = body.find(b' ',pos); end = body.find(b'\0',space+1)
                              need(pos < space < end and end+21 <= len(body), 'OG_TREE_FORMAT')
                              mode, name, oid = body[pos:space], body[space+1:end], body[end+1:end+21].hex()
                              need(name and b'/' not in name and mode in (b'40000',b'100644',b'100755',b'120000'), 'OG_TREE_ENTRY')
                              if mode == b'40000' and oid not in self.imported: pending.add(oid)
                              pos = end+21
                      count += len(requested); need(count <= 2000, 'OG_TREE_BOUND')
                  return count

              def exact_loose_set(self):
                  files = {k for k,v in inventory(self.objects).items() if v is not None}
                  need(all(re.fullmatch(r'[0-9a-f]{2}/[0-9a-f]{38}',k) for k in files) and {k.replace('/','') for k in files} == set(self.imported), 'OG_UNEXPECTED_OBJECT')
                  no_alternates(self.objects)


          def negative_controls(o):
              cases = [
                  ('URL', b'[url "https://example.invalid/"]\n insteadOf = https://github.com/\n', 'OG_ORIGINAL_DENY'),
                  ('HTTP', b'[http]\n proxy = http://example.invalid/\n', 'OG_ORIGINAL_DENY'),
                  ('LFS', b'[lfs]\n url = https://example.invalid/\n', 'OG_ORIGINAL_DENY'),
                  ('CREDENTIAL', b'[credential]\n helper = synthetic\n', 'OG_ORIGINAL_DENY'),
                  ('INCLUDE', b'[include]\n path = poison.cfg\n', 'OG_CONFIG_UNKNOWN_KEY'),
                  ('INCLUDEIF', b'[includeIf "gitdir:**"]\n path = poison.cfg\n', 'OG_CONFIG_UNKNOWN_KEY'),
                  ('HOOKS', b'[core]\n hooksPath = synthetic\n', 'OG_CONFIG_UNKNOWN_KEY'),
                  ('REMOTE_OTHER', b'[remote "other"]\n url = https://example.invalid/\n', 'OG_CONFIG_UNKNOWN_KEY'),
                  ('REMOTE_LFS', b'[remote "origin"]\n lfsurl = https://example.invalid/\n', 'OG_ORIGINAL_DENY'),
                  ('DUPLICATE', b'[remote "origin"]\n url = https://example.invalid/\n', 'OG_CONFIG_DUPLICATE'),
                  ('SAME_KEY_VALUE', None, 'OG_CONFIG_CHANGED'),
              ]
              d = o.scope/'negative'; d.mkdir(); (d/'poison.cfg').write_bytes(b'[invalid\n')
              for label, suffix, expected in cases:
                  p = d/(label+'.cfg'); shutil.copyfile(o.config,p)
                  if suffix is None:
                      o.git('config','--file',str(p),'--no-includes','--replace-all','remote.origin.url','https://example.invalid/synthetic')
                  else:
                      with p.open('ab') as f: f.write(b'\n'+suffix)
                  try: o.gate(p, True, o.baseline)
                  except RuntimeError as exc: need(str(exc) == expected, 'OG_NEGATIVE_WRONG_REASON')
                  else: raise RuntimeError('OG_NEGATIVE_ACCEPTED')
                  print('OG_NEGATIVE='+label+':REJECT',flush=True)
              o.integrity(); print('OG_NEGATIVES=11/11',flush=True)
              print('OG_OWNED_CONFIG=PASS',flush=True)


          def commit_info(raw):
              headers = raw.split(b'\n\n',1)[0].splitlines()
              trees = [x[5:].decode('ascii') for x in headers if x.startswith(b'tree ')]
              parents = [x[7:].decode('ascii') for x in headers if x.startswith(b'parent ')]
              need(len(trees)==1 and all(re.fullmatch(r'[0-9a-f]{40}', x) for x in trees+parents), 'OG_COMMIT_HEADER')
              return trees[0], parents


          def entries(o, tree):
              result = {}
              for record in o.git('ls-tree','-r','-t','-z',tree).split(b'\0'):
                  if not record: continue
                  meta,name = record.split(b'\t',1); mode,kind,oid = meta.split(b' ')
                  path = name.decode('utf-8','strict')
                  need(path not in result and kind in (b'blob',b'tree'), 'OG_TREE_LEAF')
                  result[path] = (mode.decode('ascii'),kind.decode('ascii'),oid.decode('ascii'))
              return result


          def pointer(oid, size):
              return f'version {SPEC}\noid sha256:{oid}\nsize {size}\n'.encode('ascii')


          def verify_product(o, source, head):
              original = inventory(source); no_alternates(source)
              commits = o.import_batch({head:'commit',PARENT:'commit',BASE:'commit'},source)
              bt,bp = commit_info(commits[BASE]); pt,pp = commit_info(commits[PARENT]); ht,hp = commit_info(commits[head])
              need(bt == TREE and pt == PARENT_TREE and pp == ['2f9aef88d34eb2d60aa9b4e9b29bed02d2a98e7e'] and hp == [PARENT], 'OG_FIXED_COMMIT_TREE')
              count = o.tree_closure((bt,pt,ht), source)
              base,prev,now = (entries(o,t) for t in (bt,pt,ht))
              def sole_add(before,after,path,blob=None):
                  ancestors = {p.as_posix() for p in Path(path).parents if p.as_posix()!='.'}
                  need(path not in before and path in after and after[path][:2]==('100644','blob'), 'OG_DELTA_FILE')
                  need(blob is None or after[path][2]==blob, 'OG_DELTA_BLOB')
                  need(all(before.get(p,())[:2]==after.get(p,())[:2]==('040000','tree') for p in ancestors), 'OG_DELTA_ANCESTORS')
                  need({k:v for k,v in before.items() if k not in ancestors}=={k:v for k,v in after.items() if k not in ancestors|{path}}, 'OG_DELTA_EXTRA')
              sole_add(base,prev,OLD,OLD_BLOB); sole_add(prev,now,NEW)
              need('.lfsconfig' not in now and [k for k in now if k.rsplit('/',1)[-1].casefold()=='codex.exe']==['codex.exe'], 'OG_LFS_PATH_SCOPE')
              need(all(base.get(p)==('100644','blob',oid) for p,oid in PINS.items()), 'OG_PRODUCT_PIN')
              blobs = o.import_batch({**{oid:'blob' for oid in PINS.values()},OLD_BLOB:'blob'},source)
              p = pointer(OID,SIZE)
              need(len(p)==134 and blobs[PINS['codex.exe']]==p, 'OG_POINTER_BYTES')
              need(b'codex.exe filter=lfs diff=lfs merge=lfs -text' in blobs[PINS['.gitattributes']].splitlines(), 'OG_LFS_ATTRIBUTE')
              o.exact_loose_set(); o.integrity(); need(inventory(source)==original,'OG_SOURCE_OBJECT_METADATA_CHANGED')
              print('OG_IMPORTED='+json.dumps({'commits':3,'trees':count,'blobs':len(blobs),'total':len(o.imported)}),flush=True)
              print('OG_FIXED_COMMIT_TREE=PASS',flush=True)
              print('OG_SOLE_WORKFLOW_DELTAS=PASS',flush=True)
              print('OG_NO_ALTERNATES=PASS',flush=True)
              print('OG_FIXED_PRODUCT_PINS=PASS;count=5',flush=True)
              print('OG_POINTER=PASS;bytes=134;oid='+OID+';size='+str(SIZE),flush=True)
              print('OG_SOURCE_METADATA_UNCHANGED=PASS',flush=True)
              print('OG_LOCAL_OBJECT_READBACK=PASS',flush=True)
              return original


          def start_lfs(o):
              o.integrity(); before = inventory(o.scope)
              r = o.run('lfs','version')
              need(r.returncode==0 and not r.stderr and re.fullmatch(rb'git-lfs/3\.7\.0 \([^;\r\n]+; windows amd64; go [^\r\n]+\)\r?\n',r.stdout), 'LS_FIXED_VERSION_REQUIRED')
              need(inventory(o.scope)==before,'LS_VERSION_SIDE_EFFECT')
              o.integrity()
              raw = o.config.read_bytes(); names = o.keys(o.config)
              need(raw.endswith(b'\n') and FORMAT not in names,'LS_BASE_CONFIG')
              expected = raw+SUFFIX
              with o.config.open('ab') as f: f.write(SUFFIX)
              o.lfs_hash = hashlib.sha256(expected).digest(); o.lfs_keys = set(names)|{FORMAT}
              lfs_gate(o)
              print('LS_VERSION=3.7.0;windows/amd64',flush=True)
              print('LS_OWNED_CONFIG_TRANSITION=PASS',flush=True)


          def lfs_gate(o):
              names = o.keys(o.config)
              need(len(names)==len(set(names)) and set(names)==o.lfs_keys and config_digest(o.config)==o.lfs_hash,'LS_CONFIG_CHANGED')
              o.exact_loose_set()
              need(set(o.repo.iterdir())=={o.repo/'.git'},'LS_WORKTREE_CHANGED')
              need(not any(os.path.lexists(o.repo/'.git'/p) for p in ('hooks','index','config.worktree','shallow','commondir')), 'LS_UNEXPECTED_METADATA')
              storage = o.repo/'.git/lfs'
              if storage.exists(): need(all(v is None and k in ('objects','tmp') for k,v in inventory(storage).items()),'LS_STORAGE_NOT_EMPTY')


          def decode_rows(raw):
              def unique(pairs):
                  d = dict(pairs); need(len(d)==len(pairs),'LS_JSON_DUPLICATE_KEY'); return d
              need(len(raw)<=65536,'LS_JSON_BOUND')
              try: doc = json.loads(raw,object_pairs_hook=unique)
              except (ValueError,UnicodeError): raise RuntimeError('LS_JSON_INVALID') from None
              need(type(doc) is dict and set(doc)=={'files'},'LS_JSON_SCHEMA')
              rows = doc['files']; need(rows is None or type(rows) is list,'LS_JSON_SCHEMA')
              rows = [] if rows is None else rows
              for x in rows:
                  need(type(x) is dict and set(x)=={'name','size','checkout','downloaded','oid_type','oid','version'},'LS_JSON_SCHEMA')
                  need(type(x['name']) is str and type(x['size']) is int and x['size']>0 and
                       type(x['checkout']) is bool and type(x['downloaded']) is bool and
                       x['oid_type']=='sha256' and type(x['oid']) is str and re.fullmatch(r'[0-9a-f]{64}',x['oid']) and x['version']==SPEC,'LS_JSON_FIELD')
              return rows


          def row(name, oid, size):
              return dict(name=name,size=size,checkout=False,downloaded=False,oid_type='sha256',oid=oid,version=SPEC)


          def single(rows, oid, size):
              need(len(rows)==1,'LS_NOT_SINGLE')
              need(rows[0]==row('codex.exe',oid,size),'LS_POINTER_IDENTITY')


          def scan(o, ref, label):
              lfs_gate(o); before=inventory(o.scope)
              need(re.fullmatch(r'[0-9a-f]{40}',ref),'LS_REF')
              r=o.run('lfs','ls-files','--json','--include=codex.exe','--exclude=',ref)
              print('LS_SCAN_RC='+label+':'+str(r.returncode),flush=True)
              need(r.returncode==0 and not r.stderr,'LS_SCANNER_FAILED')
              rows=decode_rows(r.stdout)
              lfs_gate(o); after=inventory(o.scope)
              need(all(after.get(k,False)==v for k,v in before.items()),'LS_METADATA_CHANGED')
              allowed={'git/.git/lfs','git/.git/lfs/objects','git/.git/lfs/tmp'}
              need(all(k in allowed and after[k] is None for k in after.keys()-before.keys()),'LS_UNEXPECTED_INITIALIZATION')
              print('LS_SCAN='+json.dumps({'case':label,'count':len(rows),'added':sorted(after.keys()-before.keys())},ensure_ascii=True),flush=True)
              return rows


          def build_controls(o):
              # No working-tree file or LFS object is created, only Git pointer/tree/commit objects.
              def store(kind, raw):
                  oid=object_id(kind,raw)
                  if oid not in o.imported: o.put_object(oid,kind,canonical(kind,raw))
                  need(o.batch({oid:kind})[oid][0]==raw,'LS_SYNTH_READBACK')
                  return oid
              def tree(items):
                  return store('tree',b''.join(mode+b' '+name.encode()+b'\0'+bytes.fromhex(oid) for name,mode,oid in sorted(items)))
              def commit(target, other, nested=None):
                  items=[('codex.exe',b'100644',target),('unrelated.bin',b'100644',other)]
                  if nested: items.append(('nested',b'40000',tree([('codex.exe',b'100644',nested)])))
                  t=tree(items)
                  return store('commit',f'tree {t}\nauthor Synthetic <synthetic@example.invalid> 1 +0000\ncommitter Synthetic <synthetic@example.invalid> 1 +0000\n\nSynthetic scanner control\n'.encode())
              good='1'*64; size=17
              target=store('blob',pointer(good,size)); other=store('blob',b'owned unrelated data')
              missing_other=object_id('blob',b'absent unrelated data')
              missing_target=object_id('blob',pointer('2'*64,size))
              malformed=store('blob',b'version '+SPEC.encode()+b'\noid sha256:invalid\nsize 17\n')
              wrong_oid=store('blob',pointer('3'*64,size)); wrong_size=store('blob',pointer(good,size+1))
              nested=store('blob',pointer('4'*64,size))
              refs={ 'FULL':commit(target,other), 'MISSING_OTHER':commit(target,missing_other),
                     'MISSING_TARGET':commit(missing_target,other), 'MALFORMED':commit(malformed,other),
                     'WRONG_OID':commit(wrong_oid,other), 'WRONG_SIZE':commit(wrong_size,other),
                     'EXTRA_SELECTED':commit(target,other,nested) }
              for oid in (missing_other,missing_target):
                  need(o.git('cat-file','--batch',data=(oid+'\n').encode())==(oid+' missing\n').encode(),'LS_SYNTH_MISSING_NOT_MISSING')
              o.exact_loose_set(); o.integrity()
              return refs,good,size


          def synthetic_controls(o):
              refs,good,size=build_controls(o)
              start_lfs(o)
              for label,ref in refs.items():
                  rows=scan(o,ref,label)
                  if label in ('FULL','MISSING_OTHER'):
                      single(rows,good,size); print('LS_CONTROL='+label+':PASS',flush=True); continue
                  if label in ('MISSING_TARGET','MALFORMED'): need(rows==[],'LS_CONTROL_EXPECTED_EMPTY')
                  if label=='WRONG_OID': need(rows==[row('codex.exe','3'*64,size)],'LS_CONTROL_WRONG_OID')
                  if label=='WRONG_SIZE': need(rows==[row('codex.exe',good,size+1)],'LS_CONTROL_WRONG_SIZE')
                  if label=='EXTRA_SELECTED': need(sorted(rows,key=lambda x:x['name'])==[row('codex.exe',good,size),row('nested/codex.exe','4'*64,size)],'LS_CONTROL_EXTRA_SELECTION')
                  expected='LS_POINTER_IDENTITY' if label in ('WRONG_OID','WRONG_SIZE') else 'LS_NOT_SINGLE'
                  try: single(rows,good,size)
                  except RuntimeError as exc: need(str(exc)==expected,'LS_CONTROL_WRONG_REASON')
                  else: raise RuntimeError('LS_CONTROL_ACCEPTED')
                  print('LS_CONTROL='+label+':REJECT',flush=True)
              print('LS_CONTROLS=7/7',flush=True)


          def main():
              need(os.name=='nt' and struct.calcsize('P')==8 and sys.flags.isolated and sys.dont_write_bytecode and hasattr(hashlib,'file_digest'), 'OG_WINDOWS_REQUIRED')
              need(len(sys.argv)==5,'OG_ARGS')
              scope,checkout=plain(sys.argv[1]),plain(sys.argv[2]); head,gitexe=sys.argv[3:]
              need(scope.parent==plain(os.environ['RUNNER_TEMP']) and scope.name.startswith('owned-lfs-') and set(scope.iterdir())=={Path(__file__).absolute()},'OG_OWNED_SCOPE')
              need(re.fullmatch(r'[0-9a-f]{40}',head) and head not in (BASE,PARENT) and Path(gitexe).is_absolute(),'OG_INPUTS')
              source=plain(checkout/'.git/objects'); no_alternates(source)
              win=Path(os.environ['SystemRoot']); cmd=win/'System32/cmd.exe'; need(cmd.is_file(),'OG_SYSTEM_PATH')
              e={'SystemRoot':str(win),'WINDIR':str(win),'SystemDrive':win.drive,'COMSPEC':str(cmd),'PATH':str(Path(gitexe).parent)+';'+str(cmd.parent)}
              print('LS_PHASE=LOCAL_OBJECTS_ONLY',flush=True)
              o=Owned(scope/'product',gitexe,e); negative_controls(o)
              source_before=verify_product(o,source,head)
              print('LS_PHASE=LOCAL_SCANNER_ONLY',flush=True)
              synthetic_controls(Owned(scope/'synthetic',gitexe,e))
              start_lfs(o); rows=scan(o,BASE,'PRODUCT'); single(rows,OID,SIZE)
              final=o.batch({**{oid:'blob' for oid in PINS.values()},OLD_BLOB:'blob'})
              need(final[PINS['codex.exe']][0]==pointer(OID,SIZE),'LS_FINAL_POINTER')
              lfs_gate(o); print('LS_FINAL_PINNED_BLOB_READBACK=PASS',flush=True)
              need(inventory(source)==source_before,'OG_SOURCE_OBJECT_METADATA_CHANGED')
              print('LS_PRODUCT_ROW='+json.dumps(rows[0],ensure_ascii=True),flush=True)
              print('LS_PRODUCT_SINGLE_POINTER=PASS',flush=True)
              print('LS_SOURCE_METADATA_UNCHANGED=PASS',flush=True)
              inventory(scope); shutil.rmtree(scope); need(not scope.exists(),'LS_OWNED_CLEANUP')
              print('LS_OWNED_CLEANUP=PASS',flush=True)
              print('LS_LOCAL_SCANNER_GATE=PASS',flush=True)


          if __name__=='__main__':
              try: main()
              except BaseException as exc:
                  label=str(exc) if isinstance(exc,RuntimeError) and re.fullmatch(r'(OG|LS)_[A-Z0-9_]+',str(exc)) else 'LS_UNCLASSIFIED_FAILURE'
                  print(label,file=sys.stderr,flush=True); sys.exit(1)
          '@
          [IO.File]::WriteAllText($script, $probe, [Text.UTF8Encoding]::new($false))
          & $python -I -S -B $script $owned $env:GITHUB_WORKSPACE $env:GITHUB_SHA $git
          if ($LASTEXITCODE -ne 0) { throw 'LS_BLOCKED_OR_INCONCLUSIVE; owned scope retained when possible' }
