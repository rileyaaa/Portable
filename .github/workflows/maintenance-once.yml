# One-time maintenance bridge authorized by the owner; remove after this task.
name: One-time maintenance review
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Remove the already downloaded source review artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/$GH_REPO/actions/artifacts/12547719636"
      - name: Check out real runtime and first-party sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare owned package-local state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'tmp/maintenance-launcher-state'
          $state = @{ HOME='home'; USERPROFILE='home'; APPDATA='appdata'; LOCALAPPDATA='localappdata'; PROGRAMDATA='programdata'; ALLUSERSPROFILE='programdata'; TEMP='temp'; TMP='temp'; TMPDIR='temp'; XDG_CONFIG_HOME='config'; XDG_CACHE_HOME='cache'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; CODEX_HOME='codex-home'; CODEX_SQLITE_HOME='sqlite'; GH_CONFIG_DIR='gh' }
          foreach ($name in $state.Keys) {
            $path = Join-Path $base $state[$name]
            New-Item -ItemType Directory -Path $path -Force | Out-Null
            "$name=$path" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'PYTHONDONTWRITEBYTECODE=1' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'PIP_CONFIG_FILE=nul' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          'POWERSHELL_TELEMETRY_OPTOUT=1' | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          $modules = Join-Path $base 'modules'
          New-Item -ItemType Directory -Path $modules -Force | Out-Null
          "PSModulePath=$modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real ordinary, relocated and maintenance launcher offline smoke
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_launcher_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Full launcher integration failed.' }
      - name: Remove only this job's state
        if: always()
        shell: powershell
        run: |
          $state = Join-Path $env:GITHUB_WORKSPACE 'tmp/maintenance-launcher-state'
          if (Test-Path -LiteralPath $state) { Remove-Item -LiteralPath $state -Recurse -Force }
