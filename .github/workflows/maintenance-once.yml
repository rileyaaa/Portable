# Temporary owner-authorized maintenance bridge; delete before final publication.
name: One-time maintenance review
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DEVELOPMENT.md
            /tool/portable-process.ps1
            /tool/codex-instruct.py
            /tests/test_codex_instruct.py
      - name: Apply the exact reviewed repair batch
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import ast, base64, hashlib, json, pathlib, shutil, subprocess, zlib
          encoded = ''
          bundle = json.loads(zlib.decompress(base64.b64decode(encoded)))
          allowed = {'tool/portable-process.ps1','tool/codex-instruct.py','tests/test_codex_instruct.py','DEVELOPMENT.md'}
          if set(bundle['expected']) != allowed or set(bundle['result']) != allowed:
              raise SystemExit('Unexpected patch scope')
          for name, expected in bundle['expected'].items():
              found = subprocess.run(['git','rev-parse','HEAD:'+name], capture_output=True, text=True)
              if expected is None:
                  if found.returncode == 0: raise SystemExit('New test already exists')
              elif found.returncode or found.stdout.strip() != expected:
                  raise SystemExit('Changed baseline: '+name)
          scratch = pathlib.Path('tmp/maintenance-apply')
          scratch.mkdir(parents=True, exist_ok=False)
          try:
              patch = scratch / 'reviewed.patch'
              patch.write_text(bundle['patch'], encoding='utf-8')
              subprocess.run(['git','apply','--check',str(patch)], check=True)
              subprocess.run(['git','apply',str(patch)], check=True)
              for name, expected in bundle['result'].items():
                  data = pathlib.Path(name).read_bytes()
                  actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  if actual != expected: raise SystemExit('Patched bytes mismatch: '+name)
                  if name.endswith('.py'): ast.parse(data.decode('utf-8'), filename=name)
              subprocess.run(['python','-B','-m','unittest','discover','-s','tests','-p','test_codex_instruct.py','-v'], check=True)
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','--',*sorted(allowed)], check=True)
              subprocess.run(['git','diff','--cached','--check'], check=True)
              subprocess.run(['git','commit','-m','fix: support Unicode launcher paths and reject linked instruction roots'], check=True)
              subprocess.run(['git','push','origin','HEAD:main'], check=True)
          finally:
              shutil.rmtree(scratch)
