# Temporary owner-authorized review bridge; remove before final publication.
name: One-time maintenance review
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Inspect complete inventory and first-party source
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import ast, hashlib, json, pathlib, re, subprocess, urllib.request
          root=pathlib.Path.cwd()
          scratch=root/'tmp'/'final-source-review'
          scratch.mkdir(parents=True,exist_ok=False)
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.md','.json','.yml','.yaml','.txt'}
          wanted=[p for p in paths if not p.startswith(excluded) and pathlib.PurePosixPath(p).suffix.lower() in suffixes]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in wanted)+'\n',text=True,check=True)
          print('TRACKED_FILES',len(paths),'SELECTED_TEXT_FILES',len(wanted))
          print('ROOTS',json.dumps(sorted(set(p.split('/')[0] for p in paths)),ensure_ascii=False))
          print('PROJECT_DOCS',[p for p in wanted if p.endswith('.md') and not p.startswith(('home/','tool/licenses/'))])
          python_count=0; js_count=0
          for p in wanted:
              if p.endswith('.py'):
                  ast.parse((root/p).read_text(encoding='utf-8-sig'),filename=p); python_count+=1
              elif p.endswith(('.js','.cjs','.mjs')):
                  subprocess.run(['node','--check',p],check=True,capture_output=True); js_count+=1
          print('PYTHON_AST_OK',python_count,'JS_PARSE_OK',js_count)
          for p in [p for p in wanted if '/' not in p and p.endswith('.bat')]:
              b=(root/p).read_bytes(); b.decode('ascii')
              assert b'\n' not in b.replace(b'\r\n',b''),p
          print('ROOT_BAT_ASCII_CRLF_OK')
          subprocess.run(['python','-B','-m','unittest','discover','-s','tests','-p','test_mode_copies.py','-v'],check=True)
          manifest=json.loads((root/'tool/runtime-manifest.json').read_text(encoding='utf-8-sig'))
          version=manifest['version']
          upstream='https://raw.githubusercontent.com/openai/codex/rust-v'+version+'/codex-rs/'
          for name,path in [('schema','core/config.schema.json'),('features','features/src/lib.rs'),('provider','model-provider-info/src/lib.rs')]:
              data=urllib.request.urlopen(upstream+path,timeout=40).read()
              (scratch/(name+'.txt')).write_bytes(data)
          schema=json.loads((scratch/'schema.txt').read_text())
          print('PINNED_SCHEMA_VERSION',version,'TOP_LEVEL_FIELDS',','.join(sorted(schema.get('properties',{}))))
          texts={p:(root/p).read_text(encoding='utf-8-sig') for p in wanted if p.endswith(('.ps1','.py','.js','.bat'))}
          env=texts['env.ps1']; runner=texts['run-codex.ps1']
          defaults=re.findall(r'^\s*\$env:(CODEX_\w+)\s*=\s*"([^"]*)"',env,re.M)
          print('CODEX_DEFAULT_COUNT',len(defaults))
          for name,value in defaults:
              consumers=[]
              for p,t in texts.items():
                  if p=='env.ps1' or p.startswith(('tests/','Version_History/')): continue
                  lines=[i for i,l in enumerate(t.splitlines(),1) if name in l and not l.lstrip().startswith(('#','rem '))]
                  if lines: consumers.append(p+':'+','.join(map(str,lines[:8])))
              print('SETTING',name,'DEFAULT',repr(value),'CONSUMERS',';'.join(consumers))
          print('LAUNCHER_FUNCTIONS')
          for i,l in enumerate(runner.splitlines(),1):
              if re.match(r'^function ',l): print(i,l)
          print('GENERATED_CONFIG_STATEMENTS')
          for i,l in enumerate(runner.splitlines(),1):
              if 'AppendLine(' in l and any(x in l for x in (' = ','[features]','[windows]','[sandbox','[model_providers','[shell_environment','[tui')): print(i,l.strip())
          features=(scratch/'features.txt').read_text()
          print('PINNED_FEATURE_COMPATIBILITY')
          for key in sorted(set(re.findall(r'AppendLine\("([a-z_]+) =',runner))):
              if key in features:
                  hit=features.find('key: "'+key+'"')
                  if hit>=0: print(key,features[max(0,hit-60):hit+240].replace('\n',' '))
          print('FIRST_PARTY_SOURCE_INVENTORY')
          for p in sorted(texts):
              if p.startswith('tests/') or p.startswith('Version_History/') or p.startswith('home/.agents/'): continue
              print(p,len(texts[p].splitlines()))
      - name: Parse every selected PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($_.FullName + ': ' + ($errors.Message -join '; ')) }
            $count++
          }
          Write-Output "POWERSHELL_PARSE_OK=$count (not a Windows execution substitute)"
      - name: Clean owned review downloads
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-source-review"
