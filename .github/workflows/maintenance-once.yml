# Temporary owner-authorized maintenance bridge; remove before final publication.
name: One-time maintenance review
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DEVELOPMENT.md
            /env.ps1
            /tests/test_launcher_smoke.ps1
            /.github/workflows/release.yml
      - name: Check gate scripts and prepare concise existing documentation
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import pathlib, re, subprocess
          root=pathlib.Path.cwd()
          scratch=root/'tmp'/'final-gate-review'
          scratch.mkdir(parents=True,exist_ok=False)
          workflow=(root/'.github/workflows/release.yml').read_text()
          assert workflow.count('      - name: Windows PowerShell 5.1 - test_launcher_smoke')==1
          assert 'REMOTE_ASSET_READBACK=PASS' in workflow
          assert '  push:' not in workflow and '  schedule:' not in workflow
          blocks=[]
          lines=workflow.splitlines()
          for i,line in enumerate(lines):
              if line=='        run: |':
                  body=[]
                  for following in lines[i+1:]:
                      if following and not following.startswith('          '): break
                      body.append(following[10:] if following else '')
                  blocks.append('\n'.join(body)+'\n')
          assert len(blocks)==20
          for n,body in enumerate(blocks):
              (scratch/('gate-'+str(n)+'.ps1')).write_text(body,encoding='utf-8-sig')
              if "import importlib.util, json, pathlib, sys" in body:
                  code=body.split("@'\n",1)[1].split("\n'@",1)[0]
                  compile(code,'verify-upload.py','exec')
          env=(root/'env.ps1').read_text(encoding='utf-8-sig')
          defaults=re.findall(r'^\s*\$env:(CODEX_\w+)\s*=\s*"([^"]*)"',env,re.M)
          assert len(defaults)==42
          assert '$env:CODEX_INSTALL_DIR = $Script:CodexPortableRoot' in env
          assert '$env:CODEX_PYTHON = Join-Path' in env
          doc=root/'DEVELOPMENT.md'
          blob=subprocess.check_output(['git','hash-object','DEVELOPMENT.md'],text=True).strip()
          assert blob=='b772fb2313705d7ec10ac54cee7b0ba3ebb1b529', 'Concurrent documentation edit; do not overwrite'
          text=doc.read_text(encoding='utf-8')
          anchor='## 2026-10-24：Windows 验证与 npm 目录边界'
          assert text.count(anchor)==1
          record='**收尾复核与发布门禁：** 按固定 0.164.0 上游 schema、feature 定义和当前生产引用复核 42 项字面量默认设置及 2 项派生路径，未将仅预留工具路径当作已安装功能。源码检查 40067858314 通过 97 份 Python AST、11 份 JavaScript 语法、38 份 PowerShell 语法、5 个 BAT 的 ASCII/CRLF 和模式副本检查；其中 PowerShell 解析在 Linux/PS7 执行，不代替 Windows 运行。正式工作流保留原有全量检查，补入真实 BAT/客户端完整启动回归，并以固定客户端的只读 features/list 检查生成配置的实际加载与关闭开关，避免仅靠 --version 推断配置有效。上传先创建 draft，重新下载三个附件、比对 SHA-256 并逐项验证 ZIP/来源清单后才公开为非预发布；测试、下载和验证材料只使用本次包内 tmp。最终发布结果以对应完整 Windows 运行及 Release 附件为准。'
          text=text.replace(anchor,anchor+'\n\n'+record,1)
          old='| `test_portable_config.ps1` | 13 项通过，2 项导出检查跳过；升级时另曾用匹配 0.163.0 的实际 bundled JSON 完成全部 15 项 |'
          assert text.count(old)==1
          text=text.replace(old,'| `test_portable_config.ps1` | Windows 全量运行 40064538870 中 15 项通过，包含固定 0.164.0 客户端实际导出目录；离线无导出输入时另两项明确跳过 |',1)
          anchor='| `test_browser_smoke.ps1` |'
          assert text.count(anchor)==1
          position=text.index(anchor)
          row='| `test_launcher_smoke.ps1` | 普通、中文/空格搬迁及维护入口三组真实 BAT/原生启动已通过专项 40066085104；新增客户端配置消费断言与全部正式门禁一同复验，不使用真实账号 |\n'
          text=text[:position]+row+text[position:]
          doc.write_text(text,encoding='utf-8')
          print('WORKFLOW_INLINE_SCRIPTS',len(blocks),'DOCUMENTATION_CHANGE=PREPARED')
      - name: Parse release scripts and the native configuration consumer test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(Get-ChildItem -LiteralPath tmp/final-gate-review -Filter *.ps1 | ForEach-Object FullName)
          $paths+=Join-Path $PWD 'tests/test_launcher_smoke.ps1'
          foreach ($path in $paths) {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($path + ': ' + ($errors.Message -join '; ')) }
          }
          Write-Output 'PASS release inline scripts and launcher test parse (Windows execution remains mandatory)'
      - name: Commit only the existing development document
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- DEVELOPMENT.md
          test "$(git diff --cached --name-only)" = 'DEVELOPMENT.md'
          git commit -m 'docs: record configuration review and final release gates'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Remove owned review scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/final-gate-review"
