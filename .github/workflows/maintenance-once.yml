# One-time owner-authorized bridge. Delete this file before it dispatches release.yml.
name: One-time final release dispatch
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Dispatch only the reviewed commit with this bridge removed
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json, os, pathlib, time, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          bridge=os.environ['GITHUB_SHA']
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Codex-Portable-final-dispatch'}
          def request(path,body=None):
              payload=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(base+path,data=payload,headers=headers,method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          head=bridge
          for attempt in range(48):
              head=request('/git/ref/heads/main')['object']['sha']
              if head!=bridge: break
              time.sleep(5)
          if head==bridge: raise SystemExit('Bridge removal was not observed within the finite deadline.')
          comparison=request('/compare/'+bridge+'...'+head)
          changed=comparison.get('files',[])
          if comparison.get('ahead_by')!=1 or comparison.get('behind_by')!=0 or len(changed)!=1 or changed[0]['filename']!='.github/workflows/maintenance-once.yml' or changed[0]['status']!='removed':
              raise SystemExit('Unexpected concurrent change; refusing automatic publication.')
          try:
              request('/git/ref/tags/v2026.10.24')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          else:
              raise SystemExit('Release tag already exists; refusing overwrite.')
          if request('/git/ref/heads/main')['object']['sha']!=head:
              raise SystemExit('main changed before dispatch.')
          request('/actions/workflows/release.yml/dispatches',{'ref':'main','inputs':{'version':'v2026.10.24','publish_release':'true','check_set':'full'}})
          print('MANUAL_FULL_RELEASE_DISPATCHED source_commit='+head+' version=v2026.10.24')
