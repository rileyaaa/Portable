# One-time maintenance bridge authorized by the owner; remove after this task.
name: One-time maintenance review
on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - name: Check out only the process helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tool/portable-process.ps1
      - name: Probe compiler paths without credentials or runtime changes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE ('tmp/compiler-probe-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $base | Out-Null
          $probe = Join-Path $base 'probe.ps1'
          @'
          param([string]$Scratch,[string]$Mode)
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $env:TEMP=$Scratch; $env:TMP=$Scratch; $env:TMPDIR=$Scratch
          [Environment]::CurrentDirectory=$Scratch
          Set-Location -LiteralPath $Scratch
          $source='public sealed class PortableCompilerProbe { public static int Value { get { return 42; } } }'
          try {
            if ($Mode -eq 'default') {
              Add-Type -TypeDefinition $source -ErrorAction Stop
            } elseif ($Mode -eq 'parameters') {
              $cp=New-Object CodeDom.Compiler.CompilerParameters
              $cp.GenerateInMemory=$true
              $cp.TempFiles=New-Object CodeDom.Compiler.TempFileCollection($Scratch,$false)
              [void]$cp.ReferencedAssemblies.Add('System.dll')
              Add-Type -TypeDefinition $source -CompilerParameters $cp -ErrorAction Stop
            } else {
              $runtime=[Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory()
              $csc=Join-Path $runtime 'csc.exe'
              $cs=Join-Path $Scratch 'probe.cs'; $dll=Join-Path $Scratch 'probe.dll'; $rsp=Join-Path $Scratch 'probe.rsp'
              [IO.File]::WriteAllText($cs,$source,(New-Object Text.UTF8Encoding($true)))
              [IO.File]::WriteAllText($rsp,('/nologo /target:library /utf8output /out:"'+$dll+'" "'+$cs+'"'),(New-Object Text.UTF8Encoding($true)))
              $si=New-Object Diagnostics.ProcessStartInfo
              $si.FileName=$csc; $si.Arguments='@"'+$rsp+'"'; $si.WorkingDirectory=$Scratch; $si.UseShellExecute=$false; $si.CreateNoWindow=$true
              $si.RedirectStandardOutput=$true; $si.RedirectStandardError=$true
              $si.EnvironmentVariables['TEMP']=$Scratch; $si.EnvironmentVariables['TMP']=$Scratch
              $p=New-Object Diagnostics.Process; $p.StartInfo=$si
              [void]$p.Start(); $o=$p.StandardOutput.ReadToEndAsync(); $e=$p.StandardError.ReadToEndAsync()
              if(-not $p.WaitForExit(30000)){ $p.Kill(); throw 'Compiler timed out.' }
              if($p.ExitCode -ne 0){throw ($o.Result + $e.Result)}
              $p.Dispose()
              [void][Reflection.Assembly]::Load([IO.File]::ReadAllBytes($dll))
            }
            Write-Output ('RESULT '+$Mode+' PASS '+[PortableCompilerProbe]::Value)
          } catch {
            Write-Output ('RESULT '+$Mode+' FAIL '+$_.Exception.ToString())
          }
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          try {
            foreach($mode in @('default','parameters','direct')) {
              $scratch=Join-Path $base ($mode+' '+[char]0x642c+[char]0x8fc1)
              New-Item -ItemType Directory -Path $scratch | Out-Null
              $si=New-Object Diagnostics.ProcessStartInfo
              $si.FileName=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
              $si.Arguments='-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$probe+'" -Scratch "'+$scratch+'" -Mode '+$mode
              $si.UseShellExecute=$false; $si.CreateNoWindow=$true; $si.RedirectStandardOutput=$true; $si.RedirectStandardError=$true
              foreach($name in @('TEMP','TMP','TMPDIR','HOME','USERPROFILE','APPDATA','LOCALAPPDATA','PROGRAMDATA','ALLUSERSPROFILE','XDG_CACHE_HOME','XDG_CONFIG_HOME')) { $si.EnvironmentVariables[$name]=$scratch }
              $si.EnvironmentVariables['PSModuleAnalysisCachePath']=Join-Path $scratch 'ModuleAnalysisCache'
              $si.EnvironmentVariables['PSModulePath']=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/Modules'
              $p=New-Object Diagnostics.Process; $p.StartInfo=$si
              [void]$p.Start(); $o=$p.StandardOutput.ReadToEndAsync(); $e=$p.StandardError.ReadToEndAsync()
              if(-not $p.WaitForExit(60000)){ & (Join-Path $env:SystemRoot 'System32/taskkill.exe') /PID $p.Id /T /F; throw 'Probe timed out.' }
              Write-Output $o.Result; Write-Output $e.Result; $p.Dispose()
            }
          } finally { Remove-Item -LiteralPath $base -Recurse -Force }
