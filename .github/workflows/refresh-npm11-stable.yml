              names=[m.filename.rstrip("/") for m in members]
              assert len({n.casefold() for n in names})==len(names), "Duplicate or case-colliding ZIP paths"
              relative=[n[len(prefix):] for n in names if n.startswith(prefix)]
              top=sorted({n.split("/",1)[0] for n in relative if n})
              packages=sorted({n[len("node_modules/"):].split("/",1)[0] for n in relative if n.startswith("node_modules/") and n[len("node_modules/"):]})
              npm_entries=[n for n in relative if n.startswith("node_modules/npm/")]
              corepack_entries=[n for n in relative if n.casefold()=="node_modules/corepack" or n.casefold().startswith("node_modules/corepack/")]
              corepack_shims=[n for n in top if n.casefold() in ("corepack","corepack.cmd","corepack.ps1")]
              print("NODE_ZIP_LAYOUT="+json.dumps({"sha256":node_zip_sha,"roots":roots,"top_level":top,"node_modules_children":packages,"npm_entries":len(npm_entries),"npm_manifest":"node_modules/npm/package.json" in relative,"corepack_entries":len(corepack_entries),"corepack_shims":corepack_shims},ensure_ascii=True),flush=True)
              assert not corepack_entries and not corepack_shims, "Unexpected bundled Corepack in fixed Node ZIP; stop"
              assert "npm" in packages and "node_modules/npm/package.json" in relative, "Fixed Node ZIP missing npm manifest"
              exe=z.read(prefix+"node.exe")
              assert sha(exe)==node_exe_sha and exe==node.read_bytes()
              for name,folder in node_packages.items():
                  component_prefix=prefix+"node_modules/"+name+"/"
                  seen=set()
                  for m in z.infolist():
                      if not m.filename.startswith(component_prefix) or m.is_dir():continue
                      p=m.filename[len(component_prefix):]
                      assert p and all(part and part not in (".","..",".git") and not part.endswith((" ",".")) and not re.search(r'[<>:"\\|?*\x00-\x1f]',part) and not re.fullmatch(r"(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\..*)?",part,re.I) for part in p.split("/"))
                      assert p.casefold() not in seen and m.file_size<25*1024*1024 and not stat.S_ISLNK(m.external_attr>>16) and not (m.flag_bits&1)
                      seen.add(p.casefold())
                      folder[p]=z.read(m)
                  assert folder and json.loads(folder["package.json"])["name"]==name, "Invalid bundled component: "+name
          npm_manifest=json.loads(node_packages["npm"]["package.json"])
          assert npm_manifest["name"]=="npm" and npm_manifest["version"]==old
          print("NODE_ZIP_NPM_IDENTITY=PASS "+npm_manifest["version"]+" files="+str(len(node_packages["npm"])),flush=True)
          print("NODE_ZIP_COREPACK_ABSENCE=PASS independent official registry source required",flush=True)
          print("OFFICIAL_NODE_WINDOWS_ZIP_AND_BUNDLED_EXE=PASS "+node_zip_sha,flush=True)
          del blob,exe
          
          def strict_lf(data):
              # The only allowed text conversion is uniform CRLF <-> LF. Never trim
              # whitespace, BOMs, final newlines, case, Markdown or binary bytes.
              try:data.decode("utf-8","strict")
              except UnicodeError:return None
              if b"\0" in data:return None
              bare=data.replace(b"\r\n",b"")
              if b"\r" in bare or (b"\r\n" in data and b"\n" in bare):return None
              return data.replace(b"\r\n",b"\n")
          def kind(a,b):
              if a is None or b is None:return "absent"
              if a==b:return "exact"
              la,lb=strict_lf(a),strict_lf(b)
              return "eol-only" if la is not None and lb is not None and la==lb else "content"
          def stats(data):
              if data is None:return None
              return {"bytes":len(data),"sha256":sha(data),"crlf":data.count(b"\r\n"),"bare_lf":data.count(b"\n")-data.count(b"\r\n"),"bare_cr":data.count(b"\r")-data.count(b"\r\n")}
          def raw_tree(folder):
              rel=folder.relative_to(root).as_posix()+"/"
              # Compare actual HEAD tree, index stage-zero entries, and all ordinary
              # on-disk files. Do not let a working-tree filter substitute for Git blobs.
              tree={}
              for rec in git("ls-tree","-r","-z","HEAD","--",rel).split(b"\0"):
                  if not rec:continue
