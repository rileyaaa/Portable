              for label,rows in (("WORKTREE_DELTAS",worktree_deltas),("UNKNOWN_OFFICIAL_PROVENANCE",unknown),("REGISTRY_CONTENT_OR_PATH_DELTAS",registry_deltas),("OFFICIAL_ORIGIN_FILES_OMITTED",node_missing),("REGISTRY_FILES_OMITTED",registry_missing)):
