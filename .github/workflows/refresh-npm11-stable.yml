              cp0,cm0,_,_=verified("corepack","0.35.0",cp_old_sri,"MIT")
              cp1,cm1,_,_=verified("corepack","0.36.0",cp_new_sri,"MIT",signature=True)
              assert cm0["engines"]["node"]==cm1["engines"]["node"]=="^22.22.2 || ^24.15.0 || >=26.0.0"
              assert cm0["name"]==cm1["name"]=="corepack" and cm0["version"]=="0.35.0" and cm1["version"]=="0.36.0"
              print("COREPACK_STANDALONE_OFFICIAL_LAYOUT="+json.dumps({"old":{"version":cm0["version"],"top_level":sorted({p.split("/",1)[0] for p in cp0}),"files":len(cp0),"sri":cp_old_sri},"new":{"version":cm1["version"],"top_level":sorted({p.split("/",1)[0] for p in cp1}),"files":len(cp1),"sri":cp_new_sri},"source":"registry.npmjs.org","bundled_in_node_zip":False},ensure_ascii=True),flush=True)
              cp_result=provenance("corepack",core,cp0)
              scratch=root/"tmp"
              scratch.mkdir(exist_ok=True);ordinary(scratch,True)
              with tempfile.TemporaryDirectory(prefix="corepack-origin-audit-",dir=scratch) as temp:
                  own=Path(temp);ordinary(own,True)
                  # Both probes use only verified bytes in owned temporary copies, even
                  # if the repository's old payload is not yet proven.
                  for version,payload in (("0.35.0",cp0),("0.36.0",cp1)):
                      target=own/version;target.mkdir()
                      for p,data in payload.items():
                          f=target.joinpath(*p.split("/"));f.parent.mkdir(parents=True,exist_ok=True)
                          with f.open("xb") as out:out.write(data)
                      assert files(target)==payload
                  area=own/"synthetic-project";child=area/"child";child.mkdir(parents=True)
                  (area/"package.json").write_text('{"name":"synthetic-project","version":"1.0.0","packageManager":"npm@11.21.3"}',encoding="ascii")
                  (area/".corepack.env").write_text("COREPACK_ENABLE_DOWNLOAD_PROMPT=0\n",encoding="ascii")
                  env={k:os.environ[k] for k in ("SystemRoot","WINDIR","SystemDrive","ComSpec","PATHEXT","OS","PROCESSOR_ARCHITECTURE") if k in os.environ}
                  env["PATH"]=str(node.parent)+os.pathsep+str(Path(env["SystemRoot"])/"System32")
                  for k in ("HOME","USERPROFILE","LOCALAPPDATA","APPDATA","TEMP","TMP"):
                      p=own/("cp-"+k.lower());p.mkdir();env[k]=str(p)
                  observations=[]
                  for version in ("0.35.0","0.36.0"):
                      cache=own/("corepack-cache-"+version);cache.mkdir()
                      isolated=env|{"COREPACK_HOME":str(cache),"COREPACK_ENABLE_NETWORK":"0","COREPACK_ENABLE_DOWNLOAD_PROMPT":"0","DEBUG":"corepack"}
                      runner=own/version/"dist/corepack.js"
                      p=subprocess.run([str(node),str(runner),"--version"],cwd=child,env=isolated,capture_output=True,timeout=40)
                      assert p.returncode==0 and p.stdout.decode("utf-8").strip()==version
                      dest=child/"never-created.tgz"
                      p=subprocess.run([str(node),str(runner),"pack","npm@11.21.3","--output",str(dest)],cwd=child,env=isolated,capture_output=True,timeout=60)
                      diagnostic=(p.stdout+p.stderr).decode("utf-8","replace")
                      assert p.returncode!=0 and not dest.exists()
                      observations.append({"version":version,"exit":p.returncode,"synthetic_env_loaded":"Successfully loaded env file" in diagnostic,"archive_created":False})
                      print("COREPACK_OFFLINE_ENV_DISCOVERY="+json.dumps(observations[-1],ensure_ascii=True),flush=True)
                  cp_result["offline_observations"]=observations
          except Exception as err:
              cp_result={"decision":"AUDIT_FAILED_KEEP_CURRENT","error":type(err).__name__}
              print("COREPACK_AUDIT_ERROR="+json.dumps(str(err)[:1000],ensure_ascii=True),flush=True)
          assert not git("status","--porcelain=v1","--untracked-files=all"),"Read-only audit changed tracked or unexpected untracked files"
          print("READ_ONLY_AUDIT_NO_CANDIDATE_WRITES=PASS",flush=True)
          print("FINAL_PROVENANCE_DECISIONS="+json.dumps({"npm":npm_result,"corepack":cp_result,"candidate_push":False},ensure_ascii=True),flush=True)
          # A completed provenance audit is not an upgrade acceptance. Fail the
          # diagnostic on actual audit exceptions; content differences are results.
          assert npm_result["decision"]!="AUDIT_FAILED_KEEP_CURRENT"
          assert cp_result["decision"]!="AUDIT_FAILED_KEEP_CURRENT"
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Read-only provenance audit incomplete; retain installed versions' }
      - name: Confirm no candidate writes
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Unexpected working tree change' }
          Write-Output 'NO_CANDIDATE_NO_RELEASE_NO_MAIN_CHANGE'
