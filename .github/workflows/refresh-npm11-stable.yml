              assert json.loads(node_old["package.json"])["version"]==(old if name=="npm" else "0.35.0")
              if name=="npm":
                  assert oids[suspect]=="a2643dd40f90ecea2e97ba052204f2625f756780"
                  full=folder.relative_to(root).as_posix()+"/"+suspect
                  assert git("cat-file","blob","HEAD:"+full)==raw[suspect]
                  filtered=git("cat-file","--filters","HEAD:"+full)
