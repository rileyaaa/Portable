          def pe(p):
              with p.open('rb') as f:
                  need(f.read(2)==b'MZ','CW_PAYLOAD_PE')
                  f.seek(60); off=struct.unpack('<I',f.read(4))[0]
                  need(64<=off<=SIZE-24,'CW_PAYLOAD_PE')
                  f.seek(off); h=f.read(24)
                  need(h[:4]==b'PE\0\0' and len(h)==24,'CW_PAYLOAD_PE')
                  machine,sections,_,_,_,opt,flags=struct.unpack('<HHIIIHH',h[4:])
                  need(machine==0x8664 and 1<=sections<=96 and opt>=112 and off+24+opt+40*sections<=SIZE and flags&2 and not flags&0x2000,'CW_PAYLOAD_X64')
                  need(f.read(2)==b'\x0b\x02','CW_PAYLOAD_PE32_PLUS')


          def official_url(url, batch=False):
              need(type(url) is str and 0<len(url)<=8192 and all(33<=ord(c)<127 for c in url) and '\\' not in url and '#' not in url,'CW_LFS_URL_FORMAT')
              p=urlsplit(url)
              need(p.scheme=='https' and p.username is None and p.password is None and p.netloc==p.hostname and p.path.startswith('/') and not p.path.startswith('//'),'CW_LFS_URL_SCOPE')
              need(url==BATCH if batch else p.hostname in STORAGE_HOSTS,'CW_LFS_HOST_SCOPE')
              return p.hostname,p.path+('?' + p.query if p.query else '')


          def request(url, method, body=None):
              batch=method=='POST'
              need((batch and body is not None) or (method=='GET' and body is None),'CW_LFS_METHOD')
              host,target=official_url(url,batch)
              # Direct TLS, no proxy, cookies, auth, Git credential helper, client cert or retries.
              conn=http.client.HTTPSConnection(host,443,timeout=25,context=ssl.create_default_context())
              headers={'User-Agent':'Portable-CW-single-object/1','Accept-Encoding':'identity','Connection':'close'}
              if batch: headers.update({'Accept':MIME,'Content-Type':MIME})
              else: headers['Accept']='application/octet-stream'
              try:
                  conn.request(method,target,body=body,headers=headers)
                  r=conn.getresponse()
                  print(('CW_LFS_BATCH_HTTP=' if batch else 'CW_LFS_GET_HTTP=')+str(r.status),flush=True)
                  need(r.status not in (401,403,407) and not r.getheader('WWW-Authenticate') and not r.getheader('Proxy-Authenticate'),'CW_LFS_AUTH_REQUIRED')
                  return conn,r
              except BaseException:
                  conn.close(); raise


          def unique_json(raw):
              def unique(pairs):
                  d=dict(pairs); need(len(d)==len(pairs),'CW_LFS_DUPLICATE_KEY'); return d
              try: return json.loads(raw.decode('utf-8','strict'),object_pairs_hook=unique)
              except (ValueError,UnicodeError): raise RuntimeError('CW_LFS_JSON') from None


          def download_action():
              body=json.dumps({'operation':'download','transfers':['basic'],'hash_algo':'sha256','objects':[{'oid':OID,'size':SIZE}]},separators=(',',':')).encode('ascii')
              c,r=request(BATCH,'POST',body)
              try:
                  need(r.status==200,'CW_LFS_BATCH_REJECTED')
                  need(r.getheader('Content-Type','').split(';',1)[0].strip().lower()==MIME and r.getheader('Content-Encoding','identity').lower()=='identity','CW_LFS_BATCH_TYPE')
                  raw=r.read(65537); need(len(raw)<=65536,'CW_LFS_BATCH_BOUND')
                  doc=unique_json(raw)
              finally: c.close()
              need(type(doc) is dict and set(doc)<= {'transfer','hash_algo','objects'} and doc.get('transfer','basic')=='basic' and doc.get('hash_algo','sha256')=='sha256','CW_LFS_BATCH_SCHEMA')
              rows=doc.get('objects')
              need(type(rows) is list and len(rows)==1 and type(rows[0]) is dict,'CW_LFS_BATCH_NOT_SINGLE')
              row=rows[0]
              need(row.get('oid')==OID and type(row.get('size')) is int and row['size']==SIZE,'CW_LFS_BATCH_IDENTITY')
              if 'error' in row:
                  err=row['error']; need(not (type(err) is dict and err.get('code') in (401,403,407)),'CW_LFS_AUTH_REQUIRED')
                  raise RuntimeError('CW_LFS_OBJECT_REJECTED')
              need(set(row)<= {'oid','size','authenticated','actions'} and type(row.get('authenticated',False)) is bool,'CW_LFS_OBJECT_SCHEMA')
              actions=row.get('actions')
              need(type(actions) is dict and set(actions)=={'download'} and type(actions['download']) is dict,'CW_LFS_ACTION')
              action=actions['download']
              need(set(action)<= {'href','header','expires_at','expires_in'},'CW_LFS_ACTION_SCHEMA')
              need(action.get('header',{})=={},'CW_LFS_ACTION_HEADERS_REQUIRED')
              url=action.get('href'); official_url(url)
              print('CW_LFS_BATCH_SINGLE=PASS',flush=True)
              return url


          def fetch_official(storage):
              need(not os.path.lexists(storage),'CW_LFS_STORAGE_EXISTS')
              storage.mkdir(); part=storage/'payload.part'
              deadline=time.monotonic()+240
              try:
                  url=download_action(); seen=set()
                  for hop in range(3):
                      need(time.monotonic()<deadline and url not in seen,'CW_LFS_DEADLINE_OR_REDIRECT_LOOP')
                      seen.add(url)
                      c,r=request(url,'GET')
                      try:
                          if r.status in (301,302,303,307,308):
                              need(hop<2 and len(r.headers.get_all('Location',[]))==1,'CW_LFS_REDIRECT_LIMIT')
                              url=r.getheader('Location'); official_url(url)
                              print('CW_LFS_STORAGE_REDIRECT='+str(hop+1),flush=True)
                              continue
                          need(r.status==200,'CW_LFS_GET_REJECTED')
                          need(r.getheader('Content-Encoding','identity').lower()=='identity' and not r.getheader('Transfer-Encoding') and r.getheader('Content-Length')==str(SIZE),'CW_LFS_RESPONSE_SIZE')
                          total=0; h=hashlib.sha256()
                          with part.open('xb') as f:
                              while True:
                                  need(time.monotonic()<deadline,'CW_LFS_DEADLINE')
                                  chunk=r.read(min(1048576,SIZE-total+1))
                                  if not chunk: break
                                  total+=len(chunk); need(total<=SIZE,'CW_LFS_SIZE_OVERFLOW')
                                  h.update(chunk); f.write(chunk)
                          need(total==SIZE and h.hexdigest()==OID,'CW_LFS_STREAM_IDENTITY')
                          need(set(storage.iterdir())=={part} and verified(part),'CW_LFS_PAYLOAD_MISSING_OR_MISMATCH')
                          pe(part)
                          print('CW_LFS_SINGLE_OBJECT=PASS',flush=True)
                          return part
                      finally: c.close()
                  raise RuntimeError('CW_LFS_REDIRECT_LIMIT')
              except RuntimeError:
                  if part.exists(): part.unlink()
                  raise
              except Exception:
                  if part.exists(): part.unlink()
                  raise RuntimeError('CW_LFS_TRANSPORT_OR_IO') from None


