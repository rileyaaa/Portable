                  r=subprocess.run([sys.executable,'-I','-S','-B',str(Path(__file__).absolute()),'--worker',str(scope),str(repo),head,gitexe],cwd=scope,env=env(win,cmd,ps,scope/'harness'),stdin=subprocess.DEVNULL,capture_output=True,startupinfo=startup,creationflags=subprocess.CREATE_NEW_CONSOLE,timeout=620)
              except subprocess.TimeoutExpired as exc:
