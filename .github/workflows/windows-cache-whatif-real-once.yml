                  print('CW_BAT_STATUS='+('INCONCLUSIVE' if started else 'NOT_RUN'),flush=True)
                  raise RuntimeError('CW_WORKER_TIMEOUT') from None
              # Worker records are ASCII; do not re-emit arbitrary stderr or double CRLF.
              lines=r.stdout.decode('ascii').splitlines()
              for line in lines:
                  if line.startswith(('CW_','OG_','LS_')): print(line,flush=True)
              if r.returncode or r.stderr:
                  labels=re.findall(rb'(?m)^RuntimeError: ((?:CW|OG|LS)_[A-Z0-9_]+)\r?$',r.stderr)
                  print('CW_BAT_STATUS='+('FAILED_OR_INCONCLUSIVE' if any(x.startswith('CW_BAT_START=') for x in lines) else 'NOT_RUN'),flush=True)
                  raise RuntimeError(labels[-1].decode() if labels else 'CW_WORKER_FAILED_OR_TIMEOUT')
              need([json.loads(x[8:])['case'] for x in lines if x.startswith('CW_CASE=')]==['package_busy','package_released','browser_busy','browser_released'] and lines[-1]=='CW_REAL_BAT_GATE=PASS','CW_OUTPUT_GATE')
              snap(scope); shutil.rmtree(scope); need(not scope.exists(),'CW_OWNED_CLEANUP')
              print('CW_OWNED_CLEANUP=PASS',flush=True); print('CW_OUTPUT_GATE=PASS',flush=True)
