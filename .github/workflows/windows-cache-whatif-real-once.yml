          def main(scope, repo, head, gitexe):
              scope, repo = plain(scope), plain(repo)
              need(scope.parent==plain(os.environ['RUNNER_TEMP']) and scope.name.startswith('cache-whatif-') and set(scope.iterdir())=={Path(__file__).absolute()},'CW_OWNED_SCOPE')
              for sub in ('harness','outside'):
