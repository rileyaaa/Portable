name: Stop superseded release and remove verified audit snapshot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  protect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the superseded release if it is still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40174253552")
          test "$(printf '%s' "$run_json" | jq -r .head_sha)" = 'fd915c83521bf7b1de786ac9334a6c9d8749c580'
          status=$(printf '%s' "$run_json" | jq -r .status)
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/40174253552/cancel"
            echo 'SUPERSEDED_RELEASE_CANCEL_REQUESTED=40174253552'
          else
            echo 'SUPERSEDED_RELEASE_ALREADY_COMPLETED_NO_CHANGE'
          fi
      - name: Delete only this downloaded and SHA-verified source artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12591598149")
          test "$(printf '%s' "$info" | jq -r .name)" = 'current-audit-source-fd915c8'
          test "$(printf '%s' "$info" | jq -r .workflow_run.id)" = '40175077262'
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/12591598149"
          echo 'OWNED_SOURCE_ARTIFACT_DELETED=12591598149'
