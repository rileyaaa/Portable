name: Finalize reviewed source and request full Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SOURCE: 6cf2e4d618beec24350643224f5aa4c0e6e0f7fe
      VERSION: v2026.10.25.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          fetch-depth: 1
      - name: Verify independent review, private repository and unchanged production tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GH_REPO/actions/runs/40159566531" --jq '{status,conclusion,head_sha}'
          test "$(gh api "repos/$GH_REPO/actions/runs/40159566531" --jq '[.status,.conclusion,.head_sha]|join(" ")')" = 'completed success 741b7f35e954ea8d703d51128592313badf23370'
          git fetch --no-tags --depth=1 origin "$VERIFIED_SOURCE"
          python3 -B - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['VERIFIED_SOURCE'],'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/review-three-pass-once.yml'], changed
          expected = {'tool/refresh-python-cli-shims.py':'d306913f0fc971850aa59f9d583a0f0aa4df9aeb','tests/test_python_cli_shims.py':'cdf4d3c9fd8a77afa52976ce6f12e6bf86325253','tool/codex-instruct.py':'d5047c6131562d21794d5b8cd9bc0166944b262d','.github/workflows/release.yml':'fa42137dd0c29138a7280126d3833ab514c9da96'}
          for name, sha in expected.items():
              actual = subprocess.check_output(['git','rev-parse','HEAD:'+name], text=True).strip()
              assert actual == sha, name
          PY
          test -z "$(git ls-remote --tags origin "refs/tags/$VERSION")"
          test -z "$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[]|select(.tag_name == "v2026.10.25.1")|.id')"
          test "$(gh api "repos/$GH_REPO/actions/runs/40158618545/artifacts" --jq '.artifacts|length')" = 0
      - name: Record completed source reviews without claiming an unrun Windows release
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path('DEVELOPMENT.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## 2026-10-25：Python 辅助工具的数据保护复查（本地修复）\n')
          end = text.index('## 2026-10-25：SQLite 归属检查与发布复查\n', start)
          section = '''## 2026-10-25：Python 辅助工具修复与三轮复查

          **原因与范围：** 从 `acfd419106cfc9f256dff84314dd38cb0983356f` 复现命令刷新覆盖同名用户 CMD、指令安装在无效本地配置被拒绝前已覆盖旧指令两类问题，修复已在 `88967f671569296a3fdcc5b8c155201f53805582` 入库。命令刷新在暂存前和替换前核对生成内容归属，保留用户改写并以既有状态码 3 报告未完成项；指令安装先预检本地配置，并在写入及替换前拒绝链接、硬链接和非普通输出。原 30 项回归通过；新增 23 项后未修复版本有 19 项失败，修复后 53 项通过，另有 13 个独立进程合成场景通过。

          **本轮新增修复：** 继续复查时发现命令刷新器从包根向上检查祖先，祖先为链接时会先查询链接下的目录再拒绝。`6cf2e4d618beec24350643224f5aa4c0e6e0f7fe` 将顺序改为从文件系统根向下，再访问包内路径。父级和更高层链接两项新增回归在旧代码稳定失败，修复后命令刷新 24 项与指令安装 31 项全部通过。没有改变正常 CMD 模板、认证、普通/YOLO 权限、Fast、扩展开关、模式副本或官方 0.164.0 工件。

          **修复后重新计数的三轮复查：** 第一轮在核对 Git blob 的源码副本上运行 128 项 Python 回归和 8 项浏览器策略测试，解析 101 份 Python 源码并核对 573 个导出文件。第二轮以独立 Python 子进程执行 13 个合成场景，另通过 11 组代理请求边界、凭据头剥离、流水线请求隔离、发行私密路径及运行身份检查，核对全部 6,941 个原始跟踪路径的客户清单。第三轮 Actions `40159566531` 在全新 Linux runner 检出同一修复提交，逆序运行 129 项源码回归（失败、错误和跳过均为 0）、8 项浏览器策略测试和账号转换器检查，解析 101 份 Python 与 41 份 PowerShell 文件，并通过 33 项模型参数、12 项权限显示、9 项登录输入保护、7 项浏览器登录流程及共享 URL 契约检查。三轮均未发现新的可复现问题；129 与 128 的差异为完整 Git checkout 额外执行了实际跟踪清单测试，不是复用同一日志。

          **发布门禁与边界：** 三轮源码复查不冒充 Windows 原生验收。仅清理临时审核工作流并更新本记录后，由既有 `release.yml` 对最终提交执行 `check_set=full`，Windows PowerShell 5.1、原生启动链、中文/空格路径、MCP、浏览器、完整 Python/Node、干净源码打包与上传附件回读全部成功后，才允许发布 `v2026.10.25.1`；实际来源提交和运行链接以对应 Release 为准，不覆盖已有 `v2026.10.25`。本次临时私有源码 artifact 已主动删除，不保留自动触发入口。测试仅用合成账号/传输/设备输入，真实账号刷新、全部在线 Agent/Host、提权沙箱及真实设备仍未测。配置预检不构成跨两个文件的事务保证，三轮通过也不是所有场景绝对无 Bug 的保证。

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.split('\n'))
          path.write_text(text[:start]+section+text[end:], encoding='utf-8', newline='')
          PY
          git diff --check
          git rm -- .github/workflows/review-three-pass-once.yml
          git add -- DEVELOPMENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record three clean review passes and remove temporary automation'
          git push origin HEAD:main
          echo "RELEASE_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_REVIEWED_COMMIT=$(git rev-parse HEAD)"
      - name: Retire non-publishing baseline without hiding an actual failure
        shell: bash
        run: |
          set -euo pipefail
          failures=$(gh api "repos/$GH_REPO/actions/runs/40159303860/jobs" --jq '[.jobs[].steps[]|select(.conclusion == "failure" or .conclusion == "timed_out")]|length')
          test "$failures" = 0
          state=$(gh api "repos/$GH_REPO/actions/runs/40159303860" --jq .status)
          if [ "$state" = completed ]; then
            test "$(gh api "repos/$GH_REPO/actions/runs/40159303860" --jq .conclusion)" = success
          else
            gh run cancel 40159303860
            echo 'Non-publishing baseline superseded by the complete final-commit release run; not counted as a completed Windows acceptance.'
          fi
      - name: Request unchanged full Windows release gates on the clean final commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SOURCE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" = 2
          gh workflow run release.yml --ref main -f version="$VERSION" -f publish_release=true -f check_set=full
          echo "REQUESTED_RELEASE_VERSION=$VERSION"
          echo "REQUESTED_RELEASE_SOURCE=$RELEASE_SOURCE"
          echo 'Publication still requires every existing Windows, packaging and remote read-back gate; this handoff is not a release-success assertion.'
