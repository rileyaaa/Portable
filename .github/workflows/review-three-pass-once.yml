            (62,63,r'''$('#vaultFileInput').onchange=e=>{const f=e.target.files&&e.target.files[0]; if(!f)return; const revision=++inputRevision; const r=new FileReader(); r.onload=async()=>{if(revision!==inputRevision)return;try{const pass=$('#vaultPass').value; if(!pass) throw new Error('请输入密码'); const v=JSON.parse(String(r.result)); const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)); const key=await keyFromPass(pass,bin(v.salt)); const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(v.iv)},key,bin(v.data)); const obj=JSON.parse(new TextDecoder().decode(plain)); if(revision!==inputRevision)return; const canon=checkedVaultCanon(obj); const outputs=AccountConverter.convertAll(canon); const restoredInput=JSON.stringify(canon.accounts,null,2); state={canon,outputs,active:0}; input.value=restoredInput; render(); showToast('vault 已解密导入');}catch(err){if(revision===inputRevision)showToast('vault 解密失败：'+err.message)}}; r.readAsText(f,'utf-8');};
