name: Review native packaging without extra wrappers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          lfs: false
      - name: Apply only requested simplification and update existing documentation
        id: apply
        shell: bash
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          repo=os.environ['GITHUB_REPOSITORY']
          base='ae2d3f2237edb6edb8cef99853510f382444808e'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert repo=='rileyaaa/Codex-Portable'
          assert git('rev-parse','HEAD^')==base, 'Review baseline moved'
          assert git('status','--porcelain')=='', 'Checkout is not clean'
          expected={
           'tool/bin/portable-python-cli.py':'a58b0b05ae4dedcd0392a112ccb0240f04697125',
           'tool/bin/pyinstaller.cmd':'8010f832e747abb6da008c8b5ee809d0905caae9',
           'tests/test_pyinstaller_portable.py':'a5a1e9c5edfa34d14a01015acc5c93caf61454c4',
           'tests/test_python_runtime_dependencies.py':'9587d484d2d7962a3cdff2489ec673e2ec7f1224',
           'README.md':'95c642fb287e20d61d156fbc54db18bc83c551ac',
           'DEVELOPMENT.md':'f01103fa5c0871e492fecbdddb61a37c4252a116',
          }
          notes=json.loads(__import__('zlib').decompress(base64.b64decode('')))
          expected[notes['tool_path']]='b1efca5dc7487337b228c28a7d320053aeecf094'
          for path,sha in expected.items():
           assert git('rev-parse','HEAD:'+path)==sha, 'Unexpected baseline file: '+path
          original=subprocess.check_output(['git','show','ea68ed98de7a1e92a8ccccb4430347917dab0dc9:tool/bin/portable-python-cli.py'])
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='6c8ec9f327fc3cfd6dd0461d88a5cf3b8a294563'
          (root/'tool/bin/portable-python-cli.py').write_bytes(original)
          for path in ['tool/bin/pyinstaller.cmd','tests/test_pyinstaller_portable.py']:
           (root/path).unlink()
          path=root/'tests/test_python_runtime_dependencies.py'
          text=path.read_bytes().decode('utf-8')
          old="             str(ROOT / 'tool/bin/portable-python-cli.py'), 'pyinstaller', '--version'],"
          assert text.count(old)==1
          text=text.replace(old,"             '-m', 'PyInstaller', '--version'],")
          path.write_bytes(text.encode('utf-8'))
          def replace_once(text,old,new):
           assert text.count(old)==1, 'Documentation anchor must match exactly once'
           return text.replace(old,new,1)
          for edit in notes['edits']:
           path=root/edit['path']
           text=path.read_bytes().decode('utf-8')
           if edit.get('end'):
            assert text.count(edit['old'])==1 and text.count(edit['end'])==1
            start=text.index(edit['old']);end=text.index(edit['end'],start)
            text=text[:start]+edit['new']+text[end:]
           else:
            text=replace_once(text,edit['old'],edit['new'])
           path.write_bytes(text.encode('utf-8'))
          path=root/'DEVELOPMENT.md';text=path.read_bytes().decode('utf-8')
          assert text.count('REVIEW_ONCE_PENDING_20261025')==0
          start=text.index('\n## 2026-10-25:') if '\n## 2026-10-25:' in text else text.index('\n## 2026-10-25')
          text=text[:start]+'\n'+notes['record']+'\n'+text[start:]
          path.write_bytes(text.encode('utf-8'))
          changed=set(subprocess.check_output(['git','-c','core.quotepath=false','diff','--name-only'],text=True).splitlines())
          assert changed==set(expected), sorted(changed)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','commit','-m','refactor: remove redundant PyInstaller wrapper and use native module'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          sha=git('rev-parse','HEAD')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+sha+'\n')
          print('REVIEW_SOURCE_COMMIT='+sha)
          PY

  source-review:
    name: Source review - ${{ matrix.order }}
    needs: prepare
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        order: [forward, reverse, shuffle]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      REVIEW_SHA: ${{ needs.prepare.outputs.sha }}
      REVIEW_ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: false
          persist-credentials: false
      - name: Independent regression and source integrity review
        shell: bash
        run: |
          python3 -B - <<'PY'
          import ast,json,os,pathlib,random,subprocess,sys,unittest
          root=pathlib.Path.cwd()
          sys.path.insert(0,str(root/'tool/python/Lib/site-packages'))
          sys.path.insert(0,str(root/'tests'))
          sys.dont_write_bytecode=True
          order=os.environ['REVIEW_ORDER']
          exclude={'test_runtime_package','test_optional_python_payload','test_pip_config_isolation','test_pdf_library'}
          exclude_cases={
           'test_browser_install.BrowserInstallTests.test_pinned_browser_inventory_matches_installed_official_bytes',
           'test_python_runtime_dependencies.PythonRuntimeDependencyTests.test_bundled_pyinstaller_version_without_compilation',
          }
          def flatten(suite):
           for case in suite:
            if isinstance(case,unittest.TestSuite):yield from flatten(case)
            else:yield case
          cases=[]
          for path in sorted((root/'tests').glob('test_*.py')):
           if path.stem not in exclude:
            cases.extend(c for c in flatten(unittest.defaultTestLoader.loadTestsFromName(path.stem)) if c.id() not in exclude_cases)
          if order=='reverse':cases.reverse()
          elif order=='shuffle':random.Random(20261025).shuffle(cases)
          else:assert order=='forward'
          def offline(event,args):
           if event=='socket.connect':raise AssertionError('External networking is not part of source review')
          sys.addaudithook(offline)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases))
          summary={'order':order,'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'commit':os.environ['REVIEW_SHA'],'deferred_modules':sorted(exclude),'deferred_cases':sorted(exclude_cases)}
          print('SOURCE_REVIEW_RESULT='+json.dumps(summary),flush=True)
          assert result.wasSuccessful() and not result.skipped and result.testsRun>=160
          count=0
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
           if not raw:continue
           name=raw.decode('utf-8')
           if name.endswith('.py') and not name.startswith(('tool/python/','tool/git/','tool/node/')) and '/node_modules/' not in name:
            ast.parse((root/name).read_text(encoding='utf-8-sig'),filename=name);count+=1
          print('FIRST_PARTY_PYTHON_PARSED='+str(count))
          copies=[(root/f'home/skills/{kind}/scripts/office/helpers/__init__.py').read_bytes() for kind in ('docx','pptx','xlsx')]
          assert len(set(copies))==1
          assert not (root/'tool/bin/pyinstaller.cmd').exists()
          assert not (root/'tests/test_pyinstaller_portable.py').exists()
          assert subprocess.check_output(['git','hash-object','tool/bin/portable-python-cli.py'],text=True).strip()=='6c8ec9f327fc3cfd6dd0461d88a5cf3b8a294563'
          print('NATIVE_PACKAGER_WITHOUT_CUSTOM_WRAPPER=PASS')
          subprocess.run(['git','diff','--exit-code'],check=True)
          PY
          node --test --test-name-pattern='unselected|path guards|browser configuration|persistent browser owner|tool policy|transport strips|browser_close|a disconnected' tests/test_automation.js
          node 'Version_History/AI account format conversion/test/smoke.js'
          node 'Version_History/AI account format conversion/test/static-audit.js'
      - name: PowerShell syntax and offline production contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $names=& git -c core.quotepath=false ls-files
          if($LASTEXITCODE -ne 0){throw 'Could not enumerate source'}
          $count=0
          foreach($name in $names){
            if($name -notlike '*.ps1' -or $name -match '^(tool/(python|git|node)/)' -or $name -match '/node_modules/'){continue}
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('PowerShell parse failure: '+$name)}
            $count++
          }
          Write-Output ('FIRST_PARTY_POWERSHELL_PARSED='+$count)
          foreach($name in @('test_cli_model_options','test_permission_display','test_login_input_errors','test_browser_login_flow')){
            & pwsh -NoLogo -NoProfile -NonInteractive -File "tests/$name.ps1"
            if($LASTEXITCODE -ne 0){throw ('Offline contract failure: '+$name)}
          }
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Tests altered tracked files'}

  finalize:
    needs: [prepare, source-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          lfs: false
      - name: Record actual clean passes, remove this workflow, request full Windows gate
        shell: bash
        run: |
          python3 -B - <<'PY'
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['REVIEW_SHA']
          notes=json.loads(r'''{"result": "Actions `{run}` 的三个全新 Linux runner 分别以正序、逆序及固定随机顺序检查相同源码提交 `{sha}`，Python 源码／元数据回归分别为 {counts} 项，失败、错误和跳过均为 0；每轮浏览器离线策略、账号转换器、源码语法与 PowerShell 离线契约均通过。Windows 原生组件等不适用项目明确留到完整 Windows 发布门禁。本次三轮在所测范围内未发现新的可复现问题，不构成全部场景绝对无 Bug 的保证。"}''')
          def api(path):return json.loads(subprocess.check_output(['gh','api',path]))
          assert api(f'repos/{repo}/git/ref/heads/main')['object']['sha']==sha, 'Main changed during review'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==sha
          jobs=api(f'repos/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}/jobs?per_page=100')['jobs']
          reports=[]
          for order in ('forward','reverse','shuffle'):
           matches=[j for j in jobs if j['name']=='Source review - '+order]
           assert len(matches)==1 and matches[0]['conclusion']=='success', 'Source review did not complete'
           log=subprocess.check_output(['gh','api',f'repos/{repo}/actions/jobs/{matches[0]["id"]}/logs']).decode('utf-8-sig')
           valid=[]
           for line in log.splitlines():
            marker='SOURCE_REVIEW_RESULT='
            if marker not in line:continue
            try: result=json.loads(line.split(marker,1)[1])
            except json.JSONDecodeError:continue
            valid.append(result)
           assert len(valid)==1
           result=valid[0]
           assert result['commit']==sha and result['order']==order and result['tests']>=160
           assert result['failures']==result['errors']==result['skips']==0
           reports.append(result)
          text=(root/'DEVELOPMENT.md').read_bytes().decode('utf-8')
          assert text.count('REVIEW_ONCE_PENDING_20261025')==1
          record=notes['result'].format(run=os.environ['GITHUB_RUN_ID'],sha=sha,counts='/'.join(str(r['tests']) for r in reports))
          (root/'DEVELOPMENT.md').write_bytes(text.replace('REVIEW_ONCE_PENDING_20261025',record).encode())
          workflow='.github/workflows/review-three-pass-once.yml'
          (root/workflow).unlink()
          changed=set(subprocess.check_output(['git','-c','core.quotepath=false','diff','--name-only'],text=True).splitlines())
          assert changed=={'DEVELOPMENT.md',workflow}
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','DEVELOPMENT.md',workflow],check=True)
          subprocess.run(['git','commit','-m','docs: record three clean reviews and remove temporary review workflow'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          final_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert api(f'repos/{repo}/git/ref/heads/main')['object']['sha']==final_sha
          assert sorted(p.name for p in (root/'.github/workflows').glob('*.yml'))==['download-browser.yml','release.yml']
          refs=api(f'repos/{repo}/git/matching-refs/tags/v2026.10.25')
          releases=api(f'repos/{repo}/releases?per_page=100')
          used={r['ref'].removeprefix('refs/tags/') for r in refs}|{r['tag_name'] for r in releases}
          n=4
          while f'v2026.10.25.{n}' in used:n+=1
          version=f'v2026.10.25.{n}'
          body={'ref':'main','inputs':{'version':version,'publish_release':True,'check_set':'full'}}
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/workflows/release.yml/dispatches','--input','-'],input=json.dumps(body).encode(),check=True)
          print('FINAL_SOURCE_COMMIT='+final_sha)
          print('FULL_RELEASE_REQUESTED='+version)
          print('THREE_SOURCE_REVIEWS='+json.dumps(reports))
          PY
