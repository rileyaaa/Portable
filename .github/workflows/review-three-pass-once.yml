name: Finalize renewed three-pass review and request full Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SOURCE: 3c0f043b2f3749c1492f30c87fa9d0925c7e121c
      VERSION: v2026.10.25.1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          fetch-depth: 1
      - name: Require successful independent source and real Windows browser reviews
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir -p tmp/finalize-reviewed-release
          gh api "repos/$GH_REPO/actions/runs/40161313406" > tmp/finalize-reviewed-release/run.json
          gh api "repos/$GH_REPO/actions/runs/40161313406/jobs" > tmp/finalize-reviewed-release/jobs.json
          python3 -B - <<'PY'
          import json,pathlib
          root=pathlib.Path('tmp/finalize-reviewed-release')
          run=json.loads((root/'run.json').read_text())
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='a3df79faa409ccea212811c2d92e22f83ad51274'
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          assert {j['name'] for j in jobs}=={'repair','source-review','windows-browser'}
          assert all(j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          assert all(s['conclusion']=='success' for j in jobs for s in j['steps'])
          PY
          gh run view 40161313406 --job 121073349906 --log > tmp/finalize-reviewed-release/windows.log
          grep -F 'PASS real converter UI escapes imported types and emits UTF-8 ZIP filenames' tmp/finalize-reviewed-release/windows.log
          grep -F 'PASS explicit cache cleanup removes browser profile while preserving work output' tmp/finalize-reviewed-release/windows.log
          git fetch --no-tags --depth=1 origin "$VERIFIED_SOURCE"
          python3 -B - <<'PY'
          import os,subprocess
          changed=subprocess.check_output(['git','diff','--name-only',os.environ['VERIFIED_SOURCE'],'HEAD'],text=True).splitlines()
          assert changed==['.github/workflows/review-three-pass-once.yml'],changed
          expected={
              'tool/refresh-python-cli-shims.py':'d306913f0fc971850aa59f9d583a0f0aa4df9aeb',
              'tests/test_python_cli_shims.py':'cdf4d3c9fd8a77afa52976ce6f12e6bf86325253',
              'tool/codex-instruct.py':'d5047c6131562d21794d5b8cd9bc0166944b262d',
              'Version_History/AI account format conversion/app/app.js':'84709ae43ca5b17521855e076973e4b87189a034',
              'Version_History/AI account format conversion/test/static-audit.js':'10da6c1e18f0236e0001f45b4cf1694c9458f9ad',
              'tests/test_browser_smoke.ps1':'9edda6e55c6725fb1a7cf7e6f0ceafab01f89953',
              '.github/workflows/release.yml':'fa42137dd0c29138a7280126d3833ab514c9da96',
          }
          for name,sha in expected.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()==sha,name
          PY
          test -z "$(git ls-remote --tags origin "refs/tags/$VERSION")"
          test -z "$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[]|select(.tag_name == "v2026.10.25.1")|.id')"
          test "$(gh api "repos/$GH_REPO/actions/runs/40158618545/artifacts" --jq '.artifacts|length')" = 0
      - name: Consolidate the actual final review record and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT.md');text=p.read_text(encoding='utf-8')
          start=text.index('## 2026-10-25：Python 辅助工具修复与三轮复查\n')
          end=text.index('## 2026-10-25：SQLite 归属检查与发布复查\n',start)
          section='''## 2026-10-25：辅助工具、账号转换器修复与三轮复查

          **Python 用户文件保护：** `88967f671569296a3fdcc5b8c155201f53805582` 修复刷新器覆盖同名用户 CMD，以及指令安装在无效本地配置被拒绝前覆盖旧指令的问题。刷新前和原子替换前核对生成内容归属；用户修改保留，并以既有状态码 3 报告未完成项。指令安装先预检本地配置，再写入指令；写入和替换前拒绝链接、硬链接及非普通输出。原 30 项测试通过；新增 23 项后旧实现有 19 项失败，修复后 53 项通过。配置预检不等于跨两个文件的事务保证，也不声称完全消除并发竞争。

          **本轮祖先检查修复：** `6cf2e4d618beec24350643224f5aa4c0e6e0f7fe` 修复命令刷新器从包根向上检查、先查询链接后方目录再拒绝的问题；改为从文件系统根向下检查。两项父级/更高层链接回归在旧代码稳定失败，修复后命令刷新 24 项及指令安装 31 项全部通过。正常 CMD 模板、认证、普通/YOLO 权限、Fast、扩展开关、模式副本和官方 0.164.0 工件均未改变。

          **本轮账号转换器修复：** `3c0f043b2f3749c1492f30c87fa9d0925c7e121c` 修复导入账号 `type` 直接进入识别区域 HTML，以及 ZIP 的 UTF-8 文件名字节未设置编码标志、中文名被误解码的问题。仅补现有 HTML 转义及 ZIP 本地头/中央目录的 UTF-8 标志，不更改账号内容或转换格式。新增四项真实页面处理函数/ZIP 回归，旧代码稳定失败两项、修复后全部通过。既有 Windows 浏览器测试增加真实页面文本显示、无注入节点及 Unicode ZIP 检查，并保留原版本、渲染、截图、跨进程 Cookie 持久化和显式缓存清理检查。

          **最终重新计数的三轮复查：** 发现转换器问题后停止尚未打包的 `40159811138`，此前三轮不再作为新修改的最终验收。第一轮对最新修复的源码副本重新执行 128 项 Python 回归、8 项浏览器策略、账号转换器 smoke 和四项 UI/ZIP 检查，均通过。第二轮重新执行 13 个独立 Python 进程场景、11 组代理/路径/发行清单边界；另以独立 Python HTML 解析器检查九类导入字段，以标准 ZIP 解码器检查八种多语言路径、原始内容和 CRC，全部通过。第三轮 Actions `40161313406` 在全新 Linux 和 Windows runner 检出上述同一转换器修复提交：129 项源码回归无失败/错误/跳过，8 项浏览器策略、转换器测试、101 份 Python 与 41 份 PowerShell 解析，以及 33 项模型参数、12 项权限显示、9 项登录输入保护、7 项登录流程和共享 URL 契约检查均通过；Windows PowerShell 5.1 和真实配套 Chromium 的新增页面/ZIP、截图、Cookie 持久化与清理检查也通过。129 与 128 的差异为完整 Git checkout 额外执行实际跟踪清单测试，不是重复引用旧日志。三轮均未发现新的可复现问题。

          **发布门禁与边界：** 清理临时审核工作流并更新本记录后，既有 `release.yml` 必须对最终提交重新执行 `check_set=full`；完整 Windows 启动链、中文/空格路径、权限、MCP、Python/Node、浏览器、干净 Git/LFS 打包及上传附件回读全部通过后，才允许发布 `v2026.10.25.1`。实际发布状态、来源提交和完整验证链接以对应 Release 为准，不覆盖 `v2026.10.25`。本次私有源码 artifact 已主动删除，不长期保留自动触发入口。测试只使用合成账号/传输/设备输入；真实账号刷新、全部在线 Agent/Host、提权沙箱及真实设备仍未测。三轮通过不代表所有场景绝对没有 Bug。

          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.split('\n'))
          p.write_text(text[:start]+section+text[end:],encoding='utf-8',newline='')
          PY
          git diff --check
          git rm -- .github/workflows/review-three-pass-once.yml
          git add -- DEVELOPMENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize three clean review passes and remove temporary workflow'
          git push origin HEAD:main
          echo "RELEASE_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_REVIEWED_COMMIT=$(git rev-parse HEAD)"
      - name: Dispatch unchanged full Windows release gates for final clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SOURCE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" = 2
          git diff --exit-code "$VERIFIED_SOURCE" HEAD -- . ':!DEVELOPMENT.md' ':!.github/workflows/review-three-pass-once.yml'
          gh workflow run release.yml --ref main -f version="$VERSION" -f publish_release=true -f check_set=full
          echo "REQUESTED_RELEASE_VERSION=$VERSION"
          echo "REQUESTED_RELEASE_SOURCE=$RELEASE_SOURCE"
          echo 'Publication still requires every full Windows, package and remote read-back gate.'
      - name: Remove only finalizer scratch
        if: always()
        shell: bash
        run: rm -rf -- tmp/finalize-reviewed-release
