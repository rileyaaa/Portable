name: Independent third source review of repaired code

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6cf2e4d618beec24350643224f5aa4c0e6e0f7fe
          lfs: false
          fetch-depth: 1
          persist-credentials: false
      - name: Verify repaired file identities and parse first-party sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/third-source-review
          python3 -B - <<'PY'
          import ast, hashlib, json, pathlib, subprocess
          expected = {
              'tool/refresh-python-cli-shims.py': 'd306913f0fc971850aa59f9d583a0f0aa4df9aeb',
              'tests/test_python_cli_shims.py': 'cdf4d3c9fd8a77afa52976ce6f12e6bf86325253',
              'tool/codex-instruct.py': 'd5047c6131562d21794d5b8cd9bc0166944b262d',
              'tests/test_instruction_installer.py': '615d3e7bf0f74f59004606926e3ca461aeafb3eb',
          }
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha, name
          count = 0
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:
                  continue
              name = raw.decode('utf-8')
              if name.endswith('.py') and not name.startswith(('tool/python/', 'tool/git/', 'tool/node/', 'tool/automation/node_modules/')) and '/node_modules/' not in name:
                  ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'), filename=name)
                  count += 1
          print('FIRST_PARTY_PYTHON_PARSED='+str(count))
          print('CHECKED_SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
      - name: Reverse-order source regression suite in a fresh runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, pathlib, sys, unittest
          root = pathlib.Path.cwd()
          # Pure-Python HTTP imports come from this exact checkout; the tests
          # replace transport, and no Windows native wheel is executed here.
          sys.path.insert(0, str(root/'tool/python/Lib/site-packages'))
          sys.path.insert(0, str(root/'tests'))
          excluded_modules = {'test_runtime_package','test_optional_python_payload','test_python_runtime_dependencies','test_pip_config_isolation','test_pdf_library'}
          excluded_cases = {'test_browser_install.BrowserInstallTests.test_pinned_browser_inventory_matches_installed_official_bytes','test_python_lock.PythonLockTests.test_runtime_repair_accepts_current_defaults_and_missing_packages'}
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          selected = []
          for source in sorted((root/'tests').glob('test_*.py')):
              if source.stem in excluded_modules:
                  continue
              selected.extend(case for case in flatten(unittest.defaultTestLoader.loadTestsFromName(source.stem)) if case.id() not in excluded_cases)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(reversed(selected)))
          print('THIRD_SOURCE_RESULT='+json.dumps({'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'native_groups_deferred_to_full_windows':sorted(excluded_modules),'native_cases_deferred':sorted(excluded_cases)}))
          if not result.wasSuccessful() or result.skipped or result.testsRun != 129:
              raise SystemExit(1)
          PY
      - name: Browser policy tests and converter regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-name-pattern='unselected|path guards|browser configuration|persistent browser owner|tool policy|transport strips|browser_close|a disconnected' tests/test_automation.js
          node 'Version_History/AI account format conversion/test/smoke.js'
          node 'Version_History/AI account format conversion/test/static-audit.js'
      - name: Parse every first-party PowerShell source without executing startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $count = 0
          $names = & git -c core.quotepath=false ls-files
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate tracked files.' }
          foreach ($name in $names) {
            if ($name -notlike '*.ps1' -or $name -match '^(tool/(python|git|node)/|tool/automation/node_modules/)' -or $name -match '/node_modules/') { continue }
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ('PowerShell parse failure: ' + $name) }
            $count++
          }
          Write-Output ('FIRST_PARTY_POWERSHELL_PARSED=' + $count)
      - name: Exercise offline production policy functions in separate processes
        shell: bash
        run: |
          set -euo pipefail
          for name in test_cli_model_options test_permission_display test_login_input_errors test_browser_login_flow; do
            pwsh -NoLogo -NoProfile -NonInteractive -File "tests/$name.ps1"
          done
          git diff --exit-code
          echo 'THIRD_INDEPENDENT_SOURCE_REVIEW=PASS'
          echo 'WINDOWS_NATIVE_VALIDATION_IS_A_SEPARATE_REQUIRED_GATE=40159303860'
      - name: Remove only this review staging
        if: always()
        shell: bash
        run: rm -rf -- tmp/third-source-review
