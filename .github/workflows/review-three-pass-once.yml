  source-review:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: false
          persist-credentials: false
      - name: Third pass in a fresh runner with shuffled source regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast,json,pathlib,random,subprocess,sys,unittest
          root=pathlib.Path.cwd()
          sys.path.insert(0,str(root/'tool/python/Lib/site-packages'))
          sys.path.insert(0,str(root/'tests'))
          exclude={'test_runtime_package','test_optional_python_payload','test_python_runtime_dependencies','test_pip_config_isolation','test_pdf_library'}
          cases_exclude={'test_browser_install.BrowserInstallTests.test_pinned_browser_inventory_matches_installed_official_bytes','test_python_lock.PythonLockTests.test_runtime_repair_accepts_current_defaults_and_missing_packages'}
          def flatten(suite):
              for case in suite:
                  if isinstance(case,unittest.TestSuite): yield from flatten(case)
                  else: yield case
          cases=[]
          for source in sorted((root/'tests').glob('test_*.py')):
              if source.stem not in exclude:
                  cases.extend(c for c in flatten(unittest.defaultTestLoader.loadTestsFromName(source.stem)) if c.id() not in cases_exclude)
          random.Random(20261025).shuffle(cases)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases))
          print('THIRD_SOURCE_RESULT='+json.dumps({'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'deferred_native_modules':sorted(exclude),'deferred_native_cases':sorted(cases_exclude)}))
          assert result.wasSuccessful() and not result.skipped and result.testsRun==129
          count=0
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              name=raw.decode('utf-8')
              if name.endswith('.py') and not name.startswith(('tool/python/','tool/git/','tool/node/')) and '/node_modules/' not in name:
                  ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'),filename=name);count+=1
          print('FIRST_PARTY_PYTHON_PARSED='+str(count))
          print('CHECKED_SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          node --test --test-name-pattern='unselected|path guards|browser configuration|persistent browser owner|tool policy|transport strips|browser_close|a disconnected' tests/test_automation.js
          node 'Version_History/AI account format conversion/test/smoke.js'
          node 'Version_History/AI account format conversion/test/static-audit.js'
      - name: PowerShell parse and offline production policy contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          $names=& git -c core.quotepath=false ls-files
          if($LASTEXITCODE -ne 0){throw 'Cannot enumerate source.'}
          foreach($name in $names){
            if($name -notlike '*.ps1' -or $name -match '^(tool/(python|git|node)/|tool/automation/node_modules/)' -or $name -match '/node_modules/'){continue}
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('Parse failed: '+$name)}
            $count++
          }
          Write-Output ('FIRST_PARTY_POWERSHELL_PARSED='+$count)
          foreach($name in @('test_cli_model_options','test_permission_display','test_login_input_errors','test_browser_login_flow')){
            & pwsh -NoLogo -NoProfile -NonInteractive -File "tests/$name.ps1"
            if($LASTEXITCODE -ne 0){throw ('Offline contract failed: '+$name)}
          }
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Review changed tracked source.'}
          Write-Output 'THIRD_INDEPENDENT_SOURCE_REVIEW=PASS'

  windows-browser:
    needs: repair
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: true
          persist-credentials: false
      - name: Prepare package-local Windows test state
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:GITHUB_WORKSPACE 'tmp/vault-windows-state'
          $state=@{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';PROGRAMDATA='programdata';ALLUSERSPROFILE='programdata';TEMP='temp';TMP='temp';TMPDIR='temp';XDG_CACHE_HOME='cache';XDG_CONFIG_HOME='config';XDG_DATA_HOME='data';XDG_STATE_HOME='state';CODEX_HOME='codex-home';CODEX_SQLITE_HOME='sqlite'}
          foreach($name in $state.Keys){$path=Join-Path $base $state[$name];New-Item -ItemType Directory -Force -Path $path|Out-Null;"$name=$path"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          'PYTHONDONTWRITEBYTECODE=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'PIP_CONFIG_FILE=nul'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'POWERSHELL_TELEMETRY_OPTOUT=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $modules=Join-Path $base 'cache/modules';New-Item -ItemType Directory -Force -Path $modules|Out-Null
          "PSModulePath=$modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundled Python Node and converter regressions
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'Bundled Python regressions failed.'}
          & .\tool\node\node.exe --test .\tests\test_automation.js .\tests\test_portable_npm.js
          if($LASTEXITCODE -ne 0){throw 'Bundled Node regressions failed.'}
          & .\tool\node\node.exe 'Version_History/AI account format conversion/test/smoke.js'
          if($LASTEXITCODE -ne 0){throw 'Converter smoke failed.'}
          & .\tool\node\node.exe 'Version_History/AI account format conversion/test/static-audit.js'
          if($LASTEXITCODE -ne 0){throw 'Converter vault regressions failed.'}
          & .\tool\python\python.exe -B .\tool\automation\install-browser.py --check
          if($LASTEXITCODE -ne 0){throw 'Pinned browser verification failed.'}
      - name: Real Windows Chromium Web Crypto and FileReader verification
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
          if($LASTEXITCODE -ne 0){throw 'Actual browser vault regression failed.'}
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Windows review changed tracked source.'}
          Write-Output 'THIRD_WINDOWS_VAULT_REVIEW=PASS'
      - name: Remove only own Windows staging
        if: always()
        run: |
          $path=Join-Path $env:GITHUB_WORKSPACE 'tmp/vault-windows-state'
          if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force}

  finalize:
    needs: [repair, source-review, windows-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: false
      - name: Record successful third pass and remove this temporary workflow
        env:
          VERIFIED_COMMIT: ${{ needs.repair.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$VERIFIED_COMMIT"
          python3 -B - <<'PY'
          import os,pathlib
          path=pathlib.Path('DEVELOPMENT.md');text=path.read_bytes().decode('utf-8')
          start=text.index('**待验收：** 第三轮须以本次提交')
          end=text.index('\n',start)
          replacement='**第三轮与发布门禁：** Actions `'+os.environ['GITHUB_RUN_ID']+'` 在全新 Linux/Windows runner 检出修复提交 `'+os.environ['VERIFIED_COMMIT']+'`：129 项随机顺序源码回归无失败、错误或跳过；浏览器策略、18 项转换器检查、既有包装/映射 smoke、PowerShell 解析及离线策略通过。包内 Windows Python/Node、真实 Chromium Web Crypto/FileReader、大账号库往返、错误密码保留、清空取消导入、既有 HTML/ZIP/规则映射、截图、Cookie 持久化及主动清理均通过。三轮连续未发现新的可复现问题。临时源码 artifact 已主动删除，本工作流随本记录一并移除；正式发布仍由原 release.yml 对最终提交执行 check_set=full，完整验证、打包、上传回读全部成功后才发布，不覆盖已有 Release。真实账号、在线 Agent/Host、提权沙箱及设备未测，三轮通过不等于任何场景绝对无 Bug。'
          path.write_bytes((text[:start]+replacement+text[end:]).encode('utf-8'))
          pathlib.Path('.github/workflows/review-three-pass-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- DEVELOPMENT.md .github/workflows/review-three-pass-once.yml
          git commit -m 'docs: record three verified vault review passes and remove temporary automation'
          git push origin HEAD:main
          echo "FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Request the unchanged full Windows validation and release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/vault-release-request
          git ls-remote --tags origin 'refs/tags/v2026.10.25.*' > tmp/vault-release-request/tags.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > tmp/vault-release-request/releases.txt
          python3 -B - <<'PY'
          import json,pathlib
          root=pathlib.Path('tmp/vault-release-request')
          existing=set((root/'releases.txt').read_text().splitlines())
          for line in (root/'tags.txt').read_text().splitlines():
              existing.add(line.split('\t',1)[1].removeprefix('refs/tags/').removesuffix('^{}'))
          n=2
          while 'v2026.10.25.'+str(n) in existing:n+=1
          version='v2026.10.25.'+str(n)
          (root/'request.json').write_text(json.dumps({'ref':'main','inputs':{'version':version,'publish_release':True,'check_set':'full'}}))
          print('REQUESTED_RELEASE_VERSION='+version)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" --input tmp/vault-release-request/request.json
          echo 'FULL_WINDOWS_RELEASE_DISPATCHED=true'
      - name: Remove only this release-request staging
        if: always()
        run: rm -rf -- tmp/vault-release-request
