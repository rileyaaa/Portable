          '''),
            (60,61,r'''$('#exportVaultBtn').onclick=async()=>{try{if(!state.canon) throw new Error('请先转换'); const pass=$('#vaultPass').value; if(!pass) throw new Error('请输入密码'); const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)); const plain=new TextEncoder().encode(JSON.stringify({version:1,created_at:new Date().toISOString(),canon:state.canon})); const key=await keyFromPass(pass,salt); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain)); const vault={format:'ai-account-converter-vault',version:1,kdf:'PBKDF2-SHA256-150000',cipher:'AES-GCM',salt:btoa(String.fromCharCode(...salt)),iv:btoa(String.fromCharCode(...iv)),data:bytesToBase64(ct)}; downloadText('ai-account-vault.json',JSON.stringify(vault,null,2),'application/json');}catch(e){showToast(e.message)}};
