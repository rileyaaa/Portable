name: Verify PDF staging repair before full Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Apply only the four locally verified files
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path.cwd()
          expected={
            'home/skills/pdf-library/scripts/pdf_library.py':('cc837a255ef52333ddf023d36887a4ced5831802','a69433f3625a5a56e15783c742d44bb22688bebb'),
            'tests/test_pdf_library_database.py':('1bfd66ef238a945d1731e29e94d9aa33711bb041','785baeb47b0420c607610bac78fcb085fdbd75ef'),
            'home/skills/pdf-library/SKILL.md':('65ea48cbc2dcf7363b91987f05cd26f72eca61b5','68b7d585985fd2266f6625354039b0b197ed8c0c'),
            'DEVELOPMENT.md':('befe592ce85b0c0555c68c598d9a0fce0b236513','5fa4be78dae05a63e40ce041223101b6685d0000'),
          }
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          originals={n:(root/n).read_bytes() for n in expected}
          for name,data in originals.items():assert blob(data)==expected[name][0], 'Source changed: '+name
          edits={}
          edits['home/skills/pdf-library/scripts/pdf_library.py']=[
            (180,180,'    # Keep transient writes out of persistent work/library directories.\n    scratch = _safety.prepare_output_dir(ROOT / "tmp")\n'),
            (182,183,'    handle, temporary = tempfile.mkstemp(prefix=".pdf-library-", dir=scratch)\n'),
          ]
          edits['tests/test_pdf_library_database.py']=[(135,135,r'''    def test_atomic_write_stages_only_in_package_tmp(self):
                  output = self.library / 'manuals' / 'synthetic.md'
                  created = []
                  actual = self.module.tempfile.mkstemp

                  def capture(*args, **kwargs):
                      result = actual(*args, **kwargs)
                      created.append(Path(result[1]))
                      return result

                  with mock.patch.object(self.module.tempfile, 'mkstemp', capture):
                      self.module._write(output, 'synthetic \u4e2d\u6587 markdown\n')
                  self.assertEqual(output.read_bytes(), 'synthetic \u4e2d\u6587 markdown\n'.encode())
                  self.assertEqual(len(created), 1)
                  self.assertEqual(created[0].parent, self.package / 'tmp')
                  self.assertFalse(created[0].exists())

              def test_linked_write_tmp_is_rejected_before_output_creation(self):
                  elsewhere = self.package.parent / 'synthetic unrelated directory'
                  elsewhere.mkdir()
                  sentinel = elsewhere / 'keep.txt'
                  sentinel.write_bytes(b'keep')
                  scratch = self.package / 'tmp'
                  try:
                      scratch.symlink_to(elsewhere, target_is_directory=True)
                  except (OSError, NotImplementedError) as error:
                      self.skipTest(f'Symlinks unavailable: {error}')
                  output = self.library / 'manuals' / 'synthetic.md'
                  with mock.patch.object(self.module.tempfile, 'mkstemp',
                                         wraps=self.module.tempfile.mkstemp) as create_temp:
                      with self.assertRaises(self.module._safety.PortablePathError):
                          self.module._write(output, 'synthetic replacement')
                      create_temp.assert_not_called()
                  self.assertFalse(self.library.exists())
                  self.assertEqual(sentinel.read_bytes(), b'keep')
                  self.assertEqual(list(elsewhere.iterdir()), [sentinel])

              def test_file_write_tmp_is_rejected_and_original_is_preserved(self):
                  scratch = self.package / 'tmp'
                  scratch.write_bytes(b'not a directory')
                  output = self.library / 'synthetic.md'
                  output.parent.mkdir(parents=True)
                  output.write_bytes(b'original')
                  with mock.patch.object(self.module.tempfile, 'mkstemp',
                                         wraps=self.module.tempfile.mkstemp) as create_temp:
                      with self.assertRaises((OSError, self.module._safety.PortablePathError)):
                          self.module._write(output, 'synthetic replacement')
                      create_temp.assert_not_called()
                  self.assertEqual(output.read_bytes(), b'original')
                  self.assertEqual(scratch.read_bytes(), b'not a directory')

              def test_write_replace_failure_preserves_output_and_unrelated_tmp(self):
                  scratch = self.package / 'tmp'
                  scratch.mkdir()
                  sentinel = scratch / 'unrelated.txt'
                  sentinel.write_bytes(b'keep')
                  output = self.library / 'synthetic.md'
                  output.parent.mkdir(parents=True)
                  output.write_bytes(b'original')
                  with mock.patch.object(self.module.os, 'replace', side_effect=OSError('synthetic failure')):
                      with self.assertRaisesRegex(OSError, 'synthetic failure'):
                          self.module._write(output, 'synthetic replacement')
                  self.assertEqual(output.read_bytes(), b'original')
                  self.assertEqual(sentinel.read_bytes(), b'keep')
                  self.assertEqual(list(scratch.iterdir()), [sentinel])
                  self.assertEqual(list(output.parent.iterdir()), [output])

              def test_write_encoding_failure_preserves_output_and_unrelated_tmp(self):
                  scratch = self.package / 'tmp'
                  scratch.mkdir()
                  sentinel = scratch / 'unrelated.txt'
                  sentinel.write_bytes(b'keep')
                  output = self.library / 'synthetic.md'
                  output.parent.mkdir(parents=True)
                  output.write_bytes(b'original')
                  with self.assertRaises(UnicodeEncodeError):
                      self.module._write(output, 'invalid surrogate ' + chr(0xD800))
                  self.assertEqual(output.read_bytes(), b'original')
                  self.assertEqual(sentinel.read_bytes(), b'keep')
                  self.assertEqual(list(scratch.iterdir()), [sentinel])
                  self.assertEqual(list(output.parent.iterdir()), [output])



          ''')]
          edits['home/skills/pdf-library/SKILL.md']=[(15,15,'\n- 正文及报告的原子写入暂存统一放在当前包内 `tmp`，成功或失败仅清理本次暂存文件；最终资料库及交付 ZIP 仍保存在用户指定的包内位置。\n')]
          edits['DEVELOPMENT.md']=[
            (22,22,'## 2026-10-25：PDF 资料库原子写入暂存边界\n'),
            (23,23,'**原因与范围：** 在 `adf8b0c9d3fbea5ca181b03a44f7e9512d33d989` 复现正文及报告的原子写入把 `.pdf-library-*` 暂存文件放在持久库目录，而非包内 `tmp`。现先校验并准备当前包的 `tmp`，再创建输出父目录和独占暂存文件；保留原有 UTF-8/LF 写入、原子替换及失败清理逻辑。不改变 PDF 提取、SQLite 归属、用户正文保护、账号转换器、认证、权限或运行组件。\n\n**复现与前两轮：** 原有 128 项源码回归通过，但未覆盖暂存位置。原数据库测试文件新增 5 项纯合成写入回归，旧实现共 12 项中 3 项失败，修复后 12 项全部通过。第一轮重新运行 133 项源码回归、8 项浏览器策略以及转换器 12 项输入/映射、8 项模板和 18 项界面/ZIP/账号库检查，并核对 573 份源码、6,941 个跟踪路径及 Python/JavaScript 语法；第二轮新进程逆序通过同组 133 项，并用 10 个独立子进程检查 Unicode、大文本、搬迁、链接、替换失败和编码失败，独立核对 6,893 个客户路径及 48 项开发文件排除。两轮未发现新问题；临时产物仅在本轮包内 tmp，测试未使用真实账号。\n\n**待第三轮与发布：** 须在全新 runner 检出本次修复，重新运行源码与 Windows 包内回归，三轮连续未发现新问题后才清理临时审核文件，并请求原 release.yml 的完整 Windows 验证、干净提交打包和附件回读。未完成步骤不计为通过；真实账号、在线 Agent/Host、提权沙箱及真实设备不在本轮验收范围。\n'),
          ]
          outputs={}
          for name,hunks in edits.items():
              lines=originals[name].decode('utf-8').splitlines(keepends=True)
              for start,end,replacement in reversed(hunks):lines[start:end]=[replacement]
              data=''.join(lines).encode('utf-8')
              assert blob(data)==expected[name][1], 'Patched content mismatch: '+name
              outputs[name]=data
          for name,data in outputs.items():(root/name).write_bytes(data)
          changed={n.decode() for n in subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0') if n}
          assert changed==set(expected),changed
          print('EXACT_REVIEWED_FILES='+str(len(outputs)))
          PY
          python3 -B -m unittest discover -s tests -p test_pdf_library_database.py -v
          git diff --check
      - name: Commit reviewed files without overwriting concurrent changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- home/skills/pdf-library/scripts/pdf_library.py tests/test_pdf_library_database.py home/skills/pdf-library/SKILL.md DEVELOPMENT.md
          git commit -m 'fix: stage PDF library atomic writes in package tmp'
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cleanup-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Delete only the downloaded and hash-verified review artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/rileyaaa/Codex-Portable/actions/artifacts/12595150939

  source-review:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: false
          persist-credentials: false
      - name: Third source review in a fresh runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import ast,json,pathlib,random,subprocess,sys,unittest
          root=pathlib.Path.cwd()
          sys.path.insert(0,str(root/'tool/python/Lib/site-packages'));sys.path.insert(0,str(root/'tests'))
          exclude={'test_runtime_package','test_optional_python_payload','test_python_runtime_dependencies','test_pip_config_isolation','test_pdf_library'}
          excluded_cases={'test_browser_install.BrowserInstallTests.test_pinned_browser_inventory_matches_installed_official_bytes','test_python_lock.PythonLockTests.test_runtime_repair_accepts_current_defaults_and_missing_packages'}
          def flatten(suite):
              for case in suite:
                  if isinstance(case,unittest.TestSuite):yield from flatten(case)
                  else:yield case
          cases=[]
          for source in sorted((root/'tests').glob('test_*.py')):
              if source.stem not in exclude:cases.extend(c for c in flatten(unittest.defaultTestLoader.loadTestsFromName(source.stem)) if c.id() not in excluded_cases)
          random.Random(2026102504).shuffle(cases)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases))
          print('THIRD_SOURCE_RESULT='+json.dumps({'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'deferred_modules':sorted(exclude),'deferred_cases':sorted(excluded_cases)}))
          assert result.wasSuccessful() and not result.skipped and result.testsRun==134
          count=0
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw:continue
              name=raw.decode('utf-8')
              if name.endswith('.py') and not name.startswith(('tool/python/','tool/git/','tool/node/')) and '/node_modules/' not in name:
                  ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'),filename=name);count+=1
          assert count==101
          print('FIRST_PARTY_PYTHON_PARSED='+str(count))
          print('CHECKED_SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          PY
          node --test --test-name-pattern='unselected|path guards|browser configuration|persistent browser owner|tool policy|transport strips|browser_close|a disconnected' tests/test_automation.js
          node 'Version_History/AI account format conversion/test/smoke.js'
          node 'Version_History/AI account format conversion/test/static-audit.js'
      - name: PowerShell parsing and offline production contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          $names=& git -c core.quotepath=false ls-files
          if($LASTEXITCODE -ne 0){throw 'Cannot enumerate source.'}
          foreach($name in $names){
            if($name -notlike '*.ps1' -or $name -match '^(tool/(python|git|node)/)' -or $name -match '/node_modules/'){continue}
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('Parse failed: '+$name)}
            $count++
          }
          if($count -ne 41){throw 'Unexpected PowerShell file count.'}
          foreach($name in @('test_cli_model_options','test_permission_display','test_login_input_errors','test_browser_login_flow')){
            & pwsh -NoLogo -NoProfile -NonInteractive -File "tests/$name.ps1"
            if($LASTEXITCODE -ne 0){throw ('Offline contract failed: '+$name)}
          }
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Source review changed tracked files.'}
          Write-Output 'THIRD_SOURCE_REVIEW=PASS'

  windows-review:
    needs: repair
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: true
          persist-credentials: false
      - name: Prepare isolated package-local Windows state
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:GITHUB_WORKSPACE 'tmp/pdf-review-windows-state'
          $state=@{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';PROGRAMDATA='programdata';ALLUSERSPROFILE='programdata';TEMP='temp';TMP='temp';TMPDIR='temp';XDG_CACHE_HOME='cache';XDG_CONFIG_HOME='config';XDG_DATA_HOME='data';XDG_STATE_HOME='state';CODEX_HOME='codex-home';CODEX_SQLITE_HOME='sqlite'}
          foreach($name in $state.Keys){$path=Join-Path $base $state[$name];New-Item -ItemType Directory -Force -Path $path|Out-Null;"$name=$path"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          'PYTHONDONTWRITEBYTECODE=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'PIP_CONFIG_FILE=nul'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'POWERSHELL_TELEMETRY_OPTOUT=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $modules=Join-Path $base 'cache/modules';New-Item -ItemType Directory -Force -Path $modules|Out-Null
          "PSModulePath=$modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundled native PDF Python and Node regressions
        run: |
          $ErrorActionPreference='Stop'
          & .\tool\python\python.exe -B -c "import unittest; r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests',pattern='test_*.py')); print('THIRD_WINDOWS_PYTHON_TESTS='+str(r.testsRun)); assert r.wasSuccessful() and not r.skipped and r.testsRun==159"
          if($LASTEXITCODE -ne 0){throw 'Bundled Windows Python regressions failed.'}
          & .\tool\node\node.exe --test .\tests\test_automation.js .\tests\test_portable_npm.js
          if($LASTEXITCODE -ne 0){throw 'Bundled Node regressions failed.'}
          & .\tool\node\node.exe 'Version_History/AI account format conversion/test/smoke.js'
          if($LASTEXITCODE -ne 0){throw 'Converter smoke failed.'}
          & .\tool\node\node.exe 'Version_History/AI account format conversion/test/static-audit.js'
          if($LASTEXITCODE -ne 0){throw 'Converter regressions failed.'}
      - name: Real Windows browser and cache preservation regression
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
          if($LASTEXITCODE -ne 0){throw 'Real browser regression failed.'}
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Windows review changed tracked source.'}
          Write-Output 'THIRD_WINDOWS_REVIEW=PASS'
      - name: Remove only this Windows test state
        if: always()
        run: |
          $path=Join-Path $env:GITHUB_WORKSPACE 'tmp/pdf-review-windows-state'
          if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force}

  finalize:
    needs: [repair, source-review, windows-review, cleanup-snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          lfs: false
      - name: Record verified third review and remove temporary workflow
        env:
          VERIFIED_COMMIT: ${{ needs.repair.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$VERIFIED_COMMIT"
          python3 -B - <<'PY'
          import os,pathlib
          path=pathlib.Path('DEVELOPMENT.md');text=path.read_bytes().decode('utf-8')
          start=text.index('**待第三轮与发布：**')
          end=text.index('\n',start)
          replacement='**第三轮与发布门禁：** Actions `'+os.environ['GITHUB_RUN_ID']+'` 的全新 Linux/Windows runner 检出修复提交 `'+os.environ['VERIFIED_COMMIT']+'`：134 项随机顺序源码回归无失败、错误或跳过，浏览器策略、转换器、101 份 Python 和 41 份 PowerShell 解析及离线策略通过；Windows 包内 Python 的 159 项回归（含真实 PDF 提取与本轮暂存检查）、20 项 Node 回归、真实 Chromium、账号库、Cookie 持久化和主动清理均通过。本地 133 与 CI 134 的差异为完整 Git 检出的文件清单检查。修复后三轮连续未发现新的可复现问题。已下载校验的临时源码 artifact 主动删除，本工作流随记录清理；再由未修改的 release.yml 对最终提交完整验证、打包及上传回读，成功后才发布新版本。真实账号、在线 Agent/Host、提权沙箱和真实设备未测；三轮通过不是所有场景绝对无 Bug 的保证。'
          path.write_bytes((text[:start]+replacement+text[end:]).encode('utf-8'))
          pathlib.Path('.github/workflows/review-three-pass-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- DEVELOPMENT.md .github/workflows/review-three-pass-once.yml
          git commit -m 'docs: record three PDF staging review passes and remove temporary workflow'
          git push origin HEAD:main
          echo "FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Request unchanged complete Windows validation and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pdf-review-release-request
          git ls-remote --tags origin 'refs/tags/v2026.10.25.*' > tmp/pdf-review-release-request/tags.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > tmp/pdf-review-release-request/releases.txt
          python3 -B - <<'PY'
          import json,pathlib
          root=pathlib.Path('tmp/pdf-review-release-request')
          existing=set((root/'releases.txt').read_text().splitlines())
          for line in (root/'tags.txt').read_text().splitlines():existing.add(line.split('\t',1)[1].removeprefix('refs/tags/').removesuffix('^{}'))
          n=4
          while 'v2026.10.25.'+str(n) in existing:n+=1
          version='v2026.10.25.'+str(n)
          (root/'request.json').write_text(json.dumps({'ref':'main','inputs':{'version':version,'publish_release':True,'check_set':'full'}}))
          print('REQUESTED_RELEASE_VERSION='+version)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" --input tmp/pdf-review-release-request/request.json
          echo 'FULL_WINDOWS_RELEASE_DISPATCHED=true'
      - name: Remove only this request staging
        if: always()
        run: rm -rf -- tmp/pdf-review-release-request
