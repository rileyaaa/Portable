name: Finalize template review and request complete Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: write
    env:
      VERIFIED_COMMIT: 45b8cffcbf8af8fb11c31e152180340457292833
      VERIFIED_RUN: '40179590268'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          lfs: false
      - name: Verify the successful independent review and unchanged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$VERIFIED_COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          mkdir -p tmp/template-release-request
          export GH_CONFIG_DIR="$GITHUB_WORKSPACE/tmp/template-release-request/gh"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > tmp/template-release-request/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs?per_page=100" > tmp/template-release-request/jobs.json
          python3 -B - <<'PY'
          import json,pathlib,subprocess
          staging=pathlib.Path('tmp/template-release-request')
          run=json.loads((staging/'run.json').read_text())
          assert run['head_sha']=='61aebd13f0619819f275b716ce7681667c2635aa'
          assert run['status']=='completed' and run['conclusion']=='success'
          jobs=json.loads((staging/'jobs.json').read_text())['jobs']
          assert {j['name'] for j in jobs}=={'repair','source-review'}
          assert all(j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          changed=subprocess.check_output(['git','diff','--name-only','-z','HEAD^','HEAD']).split(b'\0')
          assert [p for p in changed if p]==[b'.github/workflows/review-three-pass-once.yml']
          expected={
            'DEVELOPMENT.md':'0272beb40447f82fe8bca5ba0f93db7754300fdf',
            'Version_History/AI account format conversion/README.md':'3f99a7c037bcd2abb0eb242fa3d379efe67c81c5',
            'Version_History/AI account format conversion/app/converter.js':'9cce11460c67ed16db9777f3ad14d284f1ad030d',
            'Version_History/AI account format conversion/test/smoke.js':'4f17a8c418c95dab72aa557c6227de21162e3e5e',
            '.github/workflows/release.yml':'fa42137dd0c29138a7280126d3833ab514c9da96',
          }
          for name,sha in expected.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()
              assert actual==sha,'Reviewed source changed: '+name
          print('THREE_PASS_SOURCE_IDENTITY_CONFIRMED=true')
          PY
      - name: Record the third source pass and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import pathlib
          path=pathlib.Path('DEVELOPMENT.md')
          text=path.read_bytes().decode('utf-8')
          old='**第三轮与发布状态：** 待全新 runner 检出本次修复提交，执行独立源码、Windows 包内运行环境及浏览器回归；通过后才清理本次临时工作流并请求原 release.yml 的 check_set=full。完整 Windows 验证、干净提交打包和上传附件回读全部通过后才能发布新版本，不覆盖现有 Release。真实账号、在线 Agent/Host、提权沙箱及真实设备未测；三轮通过不是所有场景绝对无 Bug 的保证。'
          new='**第三轮与发布门禁：** Actions `40179590268` 的全新 Linux runner 检出修复提交 `45b8cffcbf8af8fb11c31e152180340457292833`：129 项随机顺序 Python 源码回归无失败、错误或跳过，8 项浏览器策略、12 项输入/映射、8 项模板和 18 项 UI/ZIP/账号库检查全部通过；101 份 Python、41 份 PowerShell 解析，以及 33 项模型参数、12 项权限显示、9 项登录保护、7 项登录流程与共享 URL 契约也通过。129 与本地 128 的差异是完整 Git checkout 额外执行实际跟踪清单检查。修复后三轮连续未发现新的可复现问题。本记录与临时审核工作流清理后，仍须由未修改的 release.yml 对最终提交执行 check_set=full；Windows 包内运行环境、PowerShell 5.1、原生启动链、浏览器、干净源码打包及上传附件回读全部通过才发布新版本，不覆盖已有 Release。实际发布状态和来源提交以新 Release 为准；本次未导出新的源码 artifact。真实账号、在线 Agent/Host、提权沙箱及真实设备未测，三轮源码复查不能冒充 Windows 验收或所有场景无 Bug 的保证。'
          assert text.count(old)==1
          path.write_bytes(text.replace(old,new,1).encode('utf-8'))
          pathlib.Path('.github/workflows/review-three-pass-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- DEVELOPMENT.md .github/workflows/review-three-pass-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'docs: record three clean template review passes and remove temporary workflow'
          git push origin HEAD:main
          echo "FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Request the original full Windows validation and publication
        shell: bash
        run: |
          set -euo pipefail
          export GH_CONFIG_DIR="$GITHUB_WORKSPACE/tmp/template-release-request/gh"
          git ls-remote --tags origin 'refs/tags/v2026.10.25.*' > tmp/template-release-request/tags.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > tmp/template-release-request/releases.txt
          python3 -B - <<'PY'
          import json,pathlib
          root=pathlib.Path('tmp/template-release-request')
          existing=set((root/'releases.txt').read_text().splitlines())
          for line in (root/'tags.txt').read_text().splitlines():
              existing.add(line.split('\t',1)[1].removeprefix('refs/tags/').removesuffix('^{}'))
          n=3
          while 'v2026.10.25.'+str(n) in existing:n+=1
          version='v2026.10.25.'+str(n)
          (root/'request.json').write_text(json.dumps({'ref':'main','inputs':{'version':version,'publish_release':True,'check_set':'full'}}))
          print('REQUESTED_RELEASE_VERSION='+version)
          PY
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" --input tmp/template-release-request/request.json
          echo 'FULL_WINDOWS_RELEASE_DISPATCHED=true'
      - name: Remove only this request staging
        if: always()
        shell: bash
        run: rm -rf -- tmp/template-release-request
