name: Repair wrapped account inputs and run independent third review
'on':
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        lfs: false
        persist-credentials: true
    - name: Reproduce eight old failures and apply exact minimal repair
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin 2eeecaf75ec32a9ba378c0e0eb3cde9f4f742d11
        python3 -B - <<'REPLAY_REVIEWED_REPAIR'
        import hashlib,subprocess,textwrap
        raw=subprocess.check_output(['git','show','2eeecaf75ec32a9ba378c0e0eb3cde9f4f742d11:.github/workflows/review-three-pass-once.yml'])
        assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='681be7a351eb9e6b1b45a18f7ce94249bedad6af'
        text=raw.decode('utf-8')
        start="        python3 -B - <<'REPAIRPY'\n"
        end='\n        REPAIRPY\n'
        assert text.count(start)==1 and text.count(end)==1
        code=textwrap.dedent(text.split(start,1)[1].split(end,1)[0])
        # Replay only the exact readable repair that reproduced the old failures.
        # It verifies every original/result blob and writes five reviewed paths.
        exec(compile(code,'<verified-repair-from-2eeecaf>','exec'))
        REPLAY_REVIEWED_REPAIR
    - name: Commit only five reviewed files
      id: commit
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'CHECKNAMES'
        import subprocess
        expected={'Version_History/AI account format conversion/app/converter.js','Version_History/AI account format conversion/test/smoke.js','tests/test_browser_smoke.ps1','Version_History/AI account format conversion/README.md','DEVELOPMENT.md'}
        actual={x.decode() for x in subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0') if x}
        assert actual==expected,actual
        CHECKNAMES
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- 'Version_History/AI account format conversion/app/converter.js' 'Version_History/AI account format conversion/test/smoke.js' tests/test_browser_smoke.ps1 'Version_History/AI account format conversion/README.md' DEVELOPMENT.md
        git -c core.whitespace=cr-at-eol diff --cached --check
        git commit -m 'fix: preserve wrapped account arrays and literal mapping keys'
        git push origin HEAD:main
        printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  source-review:
    needs: [repair]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.repair.outputs.commit }}
        fetch-depth: 1
        lfs: false
        persist-credentials: false
    - name: Independent randomized source, browser and converter regression
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'SOURCEPY'
        import ast,json,pathlib,random,subprocess,sys,unittest
        root=pathlib.Path.cwd()
        sys.path.insert(0,str(root/'tool/python/Lib/site-packages'))
        sys.path.insert(0,str(root/'tests'))
        excluded_modules={'test_runtime_package','test_optional_python_payload','test_python_runtime_dependencies','test_pip_config_isolation','test_pdf_library'}
        excluded_cases={'test_browser_install.BrowserInstallTests.test_pinned_browser_inventory_matches_installed_official_bytes','test_python_lock.PythonLockTests.test_runtime_repair_accepts_current_defaults_and_missing_packages'}
        def flatten(suite):
            for item in suite:
                if isinstance(item,unittest.TestSuite): yield from flatten(item)
                else: yield item
        cases=[]
        for source in sorted((root/'tests').glob('test_*.py')):
            if source.stem in excluded_modules: continue
            cases.extend(case for case in flatten(unittest.defaultTestLoader.loadTestsFromName(source.stem)) if case.id() not in excluded_cases)
        random.Random(202610252).shuffle(cases)
        r=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases))
        print('THIRD_SOURCE_RESULT='+json.dumps({'tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'skipped':len(r.skipped),'native_groups_deferred':sorted(excluded_modules),'native_cases_deferred':sorted(excluded_cases)}))
        assert r.wasSuccessful() and not r.skipped and r.testsRun==129
        count=0
        for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
            if not raw: continue
            name=raw.decode('utf-8')
            if name.endswith('.py') and not name.startswith(('tool/python/','tool/git/','tool/node/','tool/automation/node_modules/')) and '/node_modules/' not in name:
                ast.parse(pathlib.Path(name).read_text(encoding='utf-8-sig'),filename=name);count+=1
        print('FIRST_PARTY_PYTHON_PARSED='+str(count))
        print('CHECKED_SOURCE_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
        SOURCEPY
        node --test --test-name-pattern='unselected|path guards|browser configuration|persistent browser owner|tool policy|transport strips|browser_close|a disconnected' tests/test_automation.js
        node 'Version_History/AI account format conversion/test/smoke.js'
        node 'Version_History/AI account format conversion/test/static-audit.js'
        git diff --exit-code
    - name: PowerShell syntax and isolated offline policy functions
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $count=0
        $names=& git -c core.quotepath=false ls-files
        if($LASTEXITCODE -ne 0){throw 'Cannot enumerate tracked paths.'}
        foreach($name in $names){
          if($name -notlike '*.ps1' -or $name -match '^(tool/(python|git|node)/|tool/automation/node_modules/)' -or $name -match '/node_modules/'){continue}
          $tokens=$null;$errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $name),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('PowerShell parse failure: '+$name)}
          $count++
        }
        Write-Output ('FIRST_PARTY_POWERSHELL_PARSED='+$count)
        foreach($name in @('test_cli_model_options','test_permission_display','test_login_input_errors','test_browser_login_flow')){
          & pwsh -NoLogo -NoProfile -NonInteractive -File "tests/$name.ps1"
          if($LASTEXITCODE -ne 0){throw ('Offline regression failed: '+$name)}
        }
        & git diff --exit-code
        if($LASTEXITCODE -ne 0){throw 'Review changed tracked source.'}
        Write-Output 'THIRD_LINUX_REVIEW=PASS'
  windows-review:
    needs: [repair]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.repair.outputs.commit }}
        fetch-depth: 1
        lfs: true
        persist-credentials: false
    - name: Prepare package-local Windows test state
      run: |
        $ErrorActionPreference='Stop'
        $base=Join-Path $env:GITHUB_WORKSPACE 'tmp/renewed-windows-state'
        $state=@{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';PROGRAMDATA='programdata';ALLUSERSPROFILE='programdata';TEMP='temp';TMP='temp';TMPDIR='temp';XDG_CACHE_HOME='cache';XDG_CONFIG_HOME='config';XDG_DATA_HOME='data';XDG_STATE_HOME='state';CODEX_HOME='codex-home';CODEX_SQLITE_HOME='sqlite'}
        foreach($name in $state.Keys){$path=Join-Path $base $state[$name];New-Item -ItemType Directory -Force -Path $path|Out-Null;"$name=$path"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
        'PIP_CONFIG_FILE=nul'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        'PYTHONDONTWRITEBYTECODE=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        'POWERSHELL_TELEMETRY_OPTOUT=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        $modules=Join-Path $base 'cache/modules';New-Item -ItemType Directory -Force $modules|Out-Null
        "PSModulePath=$modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Full bundled Python and Node plus converter regressions
      timeout-minutes: 5
      run: |
        $ErrorActionPreference='Stop'
        & .\tool\python\python.exe -B -c "import unittest,json; r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests',pattern='test_*.py')); print('THIRD_WINDOWS_PYTHON='+json.dumps({'tests':r.testsRun,'failures':len(r.failures),'errors':len(r.errors),'skipped':len(r.skipped)})); raise SystemExit(0 if r.wasSuccessful() and not r.skipped else 1)"
        if($LASTEXITCODE -ne 0){throw 'Bundled Python regression failed.'}
        & .\tool\node\node.exe --test .\tests\test_automation.js .\tests\test_portable_npm.js
        if($LASTEXITCODE -ne 0){throw 'Bundled Node regression failed.'}
        & .\tool\node\node.exe 'Version_History/AI account format conversion/test/smoke.js'
        if($LASTEXITCODE -ne 0){throw 'Converter wrapper/rule regression failed.'}
        & .\tool\node\node.exe 'Version_History/AI account format conversion/test/static-audit.js'
        if($LASTEXITCODE -ne 0){throw 'Converter rendering/ZIP regression failed.'}
        & .\tool\python\python.exe -B .\tool\automation\install-browser.py --check
        if($LASTEXITCODE -ne 0){throw 'Pinned browser payload verification failed.'}
    - name: Real Chromium wrapper import, mapping, rendering, ZIP and persistence
      timeout-minutes: 5
      run: |
        $ErrorActionPreference='Stop'
        & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
        if($LASTEXITCODE -ne 0){throw 'Actual Chromium converter/browser regression failed.'}
        & git diff --exit-code
        if($LASTEXITCODE -ne 0){throw 'Windows review changed tracked source.'}
        Write-Output 'THIRD_WINDOWS_REVIEW=PASS'
    - name: Remove only this review Windows state
      if: always()
      run: |
        $path=Join-Path $env:GITHUB_WORKSPACE 'tmp/renewed-windows-state'
        if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force}
  finalize:
    needs: [repair, source-review, windows-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_COMMIT: ${{ needs.repair.outputs.commit }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.repair.outputs.commit }}
        fetch-depth: 1
        lfs: false
        persist-credentials: true
    - name: Record results, clean temporary workflow and request full release
      shell: bash
      run: |
        set -euo pipefail
        remote=$(git ls-remote origin refs/heads/main | cut -f1)
        test "$remote" = "$REVIEW_COMMIT"
        python3 -B - <<'FINALIZEPY'
        import hashlib, os, pathlib, subprocess
        path=pathlib.Path('DEVELOPMENT.md')
        data=path.read_bytes()
        assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='cf5f8c8dc929f17b56632b40e1c6742205dd36f7'
        commit=os.environ['REVIEW_COMMIT']
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==commit
        pending='第三轮全新 Linux/Windows runner 验证尚待执行，完整 Windows 发布及附件回读尚未执行；不得用此前版本的成功记录替代。'
        done=('第三轮 Actions `'+os.environ['GITHUB_RUN_ID']+'` 在全新 Linux/Windows runner 检出修复提交 `'+commit+
              '`：129 项随机顺序 Python 源码回归无失败/错误/跳过，浏览器策略、转换器及 PowerShell 解析/离线策略检查通过；Windows 包内 Python/Node、真实 Chromium 页面导入/规则映射、既有 HTML/ZIP、截图、Cookie 持久化和清理检查也通过。三轮连续未发现新的可复现问题。完整发布仍须对清理后的最终提交执行原有 `release.yml` 的 `check_set=full`，只有打包及上传附件回读通过后才发布 `v2026.10.25.2`，以对应 Release 的实际来源提交和运行结果为准。')
        assert data.count(pending.encode())==1
        path.write_bytes(data.replace(pending.encode(),done.encode(),1))
        FINALIZEPY
        gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/12590593274"
        git rm -- .github/workflows/review-three-pass-once.yml
        git add -- DEVELOPMENT.md
        python3 -B - <<'CHECKFINAL'
        import subprocess
        expected={'DEVELOPMENT.md','.github/workflows/review-three-pass-once.yml'}
        actual={x.decode() for x in subprocess.check_output(['git','diff','--cached','--name-only','-z']).split(b'\0') if x}
        assert actual==expected,actual
        CHECKFINAL
        git -c core.whitespace=cr-at-eol diff --cached --check
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'docs: record renewed three-pass review and remove temporary workflow'
        git push origin HEAD:main
        head=$(git rev-parse HEAD)
        remote=$(git ls-remote origin refs/heads/main | cut -f1)
        test "$head" = "$remote"
        gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" -f ref=main -f 'inputs[version]=v2026.10.25.2' -F 'inputs[publish_release]=true' -f 'inputs[check_set]=full'
        printf 'FINAL_REVIEWED_SOURCE=%s\n' "$head"
        echo 'FULL_WINDOWS_RELEASE_REQUESTED=v2026.10.25.2'
