name: Repair vault state protection and verify independently before release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-three-pass-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
      - name: Apply exact reviewed edits without replacing newer converter fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/vault-repair
          python3 -B - <<'PY'
          import hashlib, pathlib, subprocess
          root=pathlib.Path.cwd()
          app='Version_History/AI account format conversion/app/app.js'
          test='Version_History/AI account format conversion/test/static-audit.js'
          readme='Version_History/AI account format conversion/README.md'
          browser='tests/test_browser_smoke.ps1'
          expected={
            'DEVELOPMENT.md':('459789e9f935d379b65574756ae7115f07425770','de78a7b87f5c15bbfb8bf2076d87c038eecc465e'),
            readme:('6cf18e31699f5a1c7c7323c160a415c53d2247e3','df846f0e35d7516ba2d4d43889b878636020d0e7'),
            app:('84709ae43ca5b17521855e076973e4b87189a034','128ee2d48072d9d70fe7adf3ef898362d39c1b55'),
            test:('10da6c1e18f0236e0001f45b4cf1694c9458f9ad','1e66cdb8fb6b2a9ff913d62f61eb37c426b2c7a9'),
            browser:('cf8761456170705e94bc900a71cb8fb0e04fb9e4','fb8f02ca853467762dd79a259abc015764d6792d'),
          }
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          originals={name:(root/name).read_bytes() for name in expected}
          for name,data in originals.items():
              assert blob(data)==expected[name][0], 'Source changed: '+name
          edits={}
          edits['DEVELOPMENT.md']=[(22,22,r'''
          ## 2026-10-25：账号库与异步导入保护

          **原因与范围：** 在 `fd915c83521bf7b1de786ac9334a6c9d8749c580` 上重新复现三项尚未入库的账号库问题：大密文展开为函数参数导致导出栈溢出、异步导出读取了点击后变更的状态、无效导入在失败前已替换原状态。现分块编码 Base64、在首次 await 前固定导出快照、先校验完整导入内容再更新页面。另复现旧 FileReader/解密异步任务覆盖后续清空、编辑、转换或新文件的问题；增加输入版本标记，丢弃过期导入结果和错误提示。保留远端已修复的包装数组和规则映射代码与测试，不改动账号库 v1、PBKDF2-SHA256 150000、AES-GCM、认证、权限、Fast 或官方工件。

          **复现与验证：** 旧账号库代码在新回归中失败 5 项；仅修复账号库而未加异步保护时，新增 5 项竞争回归全部失败。最终本地版本的 18 项 UI/ZIP/账号库检查及原有 12 项 smoke 回归均通过。第一轮正序 128 项 Python 源码回归、8 项浏览器策略通过；第二轮分两个新进程逆序跑完同组 128 项，并通过独立 Python/Node 加密交叉验证：8 次解密（最大明文 1189316 字节）、16 次错误密码/篡改拒绝、10 组 Base64、1331 组包装输入、10 种无效导入保护、5 次兼容导入、21 组代理边界和 10 个 Python CLI 子进程场景。本地两轮未发现新的可复现问题，未使用真实凭据。

          **待验收：** 第三轮须以本次提交在全新 Linux/Windows runner 复查；已在原浏览器 smoke 中补入真实 Web Crypto/FileReader、大账号库、错误密码和取消导入检查，本地尚未执行 Windows 验收。三轮通过后清理临时工作流，再由原 release.yml 完整检查、打包、上传回读后发布新版，不覆盖已有 Release。真实账号、在线 Agent/Host、提权沙箱及设备未测；三轮通过不表示任何场景绝对无 Bug。
          ''')]
