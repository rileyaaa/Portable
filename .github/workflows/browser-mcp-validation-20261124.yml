name: One-time full Codex browser MCP integration (2026-11-24)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-mcp-validation-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-browser:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'test(browser): verify native Codex tool roundtrip')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve upstream bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      - name: Actual pinned Codex to browser MCP roundtrip with synthetic local model
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B .\tests\check_codex_browser_mcp.py
          if ($LASTEXITCODE -ne 0) { throw 'Native browser MCP roundtrip failed' }
