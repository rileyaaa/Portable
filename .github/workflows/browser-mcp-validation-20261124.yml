name: Browser MCP existing-function regression (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/browser-mcp-validation-20261124.yml']
permissions:
  contents: read
jobs:
  native:
    if: >-
      startsWith(github.event.head_commit.message, 'fix(browser): retain existing MCP entry')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve upstream bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          persist-credentials: false
      - name: Verify fixed runtime and mode consistency
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'LFS verification failed' }
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python regression failed' }
          & .\tool\node\node.exe --test .\tests\test_automation.js .\tests\test_portable_npm.js
          if ($LASTEXITCODE -ne 0) { throw 'Node regression failed' }
      - name: Existing launcher and extension behavior
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('test_extension_policy','test_extension_migration','test_extension_persistence','test_automation_paths','test_automation_process','test_launcher_smoke')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' ($name + '.ps1'))
            if ($LASTEXITCODE -ne 0) { throw ('Failed: ' + $name) }
          }
      - name: Native Chromium and existing MCP stdio
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Browser smoke failed' }
          & .\tool\python\python.exe -B .\tests\check_browser_mcp_stdio.py
          if ($LASTEXITCODE -ne 0) { throw 'MCP stdio failed' }
      - name: Native Codex roundtrip through existing user MCP configuration
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B .\tests\check_codex_browser_mcp.py
          if ($LASTEXITCODE -ne 0) { throw 'Native MCP roundtrip failed' }
      - name: Release input integrity only
        if: always()
        run: |
          & .\tool\python\python.exe -B .\tool\package-release.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Package input validation failed' }
