name: Native 0.172.0 browser discovery and task-local module path (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-safe-compare-0172.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-native-core-0172
  cancel-in-progress: true
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve tracked bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Existing Python CLI shim regression and new Unicode output unit tests
        run: |
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_python_cli*.py' -v
          if ($LASTEXITCODE) { throw 'Python CLI regression failed' }
      - name: Native normal mode core tools and sandbox write boundary (ADB limitation separate)
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py normal
          if ($LASTEXITCODE) { throw 'Normal-mode native diagnostic failed' }
      - name: Native unknown model core tools and Unicode path
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py unknown
          if ($LASTEXITCODE) { throw 'Unknown-model native diagnostic failed' }
      - name: Actual normal mode browser read-only discovery (no MCP or profile creation)
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser-check
          if ($LASTEXITCODE) { throw 'Normal mode browser read-only discovery failed' }
      - name: Real launcher path and missing-versus-empty header assertions
        if: always()
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_portable_paths.ps1
          if ($LASTEXITCODE) { throw 'Path/header regression failed' }
      - name: Original YOLO browser route and native MCP integration
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser
          if ($LASTEXITCODE) { throw 'YOLO browser regression failed' }
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Native MCP regression failed' }
      - name: Existing launcher smoke and runtime preflight
        if: always()
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_launcher_smoke.ps1
          if ($LASTEXITCODE) { throw 'Launcher smoke failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_runtime_preflight.ps1
          if ($LASTEXITCODE) { throw 'Runtime preflight failed' }
      - name: Current fixed runtime, mode copies and customer input integrity
        if: always()
        run: |
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_mode_copies.py' -v
          if ($LASTEXITCODE) { throw 'Mode copies failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input check failed' }
      - name: Explicit outstanding strict portability gates (not release approval)
        if: always()
        run: |
          Write-Output '::warning::ADB 37.0.1 Windows host-profile behavior remains blocked; not executed again.'
          Write-Output '::warning::PowerShell module path reconstruction must be reviewed from native probe output. Core success is not full strict portability or release approval.'
