name: Minimal native OCR source build and original launcher contracts
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/minimal-ocr-original-contracts.yml]
permissions: {}
concurrency:
  group: portable-minimal-ocr-original-contracts
  cancel-in-progress: false
jobs:
  source_review:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'da1c777ab04b2bbd0dd7c1e13ae6c2396b832931'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Verify only missing model source signature and collect exact full notices
        id: research
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p tmp/ocr-review-env
          export HOME="$PWD/tmp/ocr-review-env"
          export TMPDIR="$HOME"
          export XDG_CACHE_HOME="$HOME"
          export XDG_CONFIG_HOME="$HOME"
          export PATH=/usr/bin:/bin
          /usr/bin/python3 -I -B -c "from pathlib import Path; compile(Path('tests/check_ocr_source_decision.py').read_bytes(),'tests/check_ocr_source_decision.py','exec')"
          /usr/bin/python3 -I -B tests/check_ocr_source_decision.py "$PWD/tmp/ocr-source-decision.json"
      - name: Preserve JSON source and full license text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimal-ocr-source-evidence
          path: tmp/ocr-source-decision.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve missing-source failure status
        if: always() && steps.research.outcome != 'success'
        run: exit 1
  windows_build:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'da1c777ab04b2bbd0dd7c1e13ae6c2396b832931'
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Build fixed upstream PNG and LSTM static x64, verify actual reduced local OCR
        id: research
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          $root=$pwd.Path
          $scratch=Join-Path $root 'tmp/minimal-ocr-build-env'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          foreach ($key in @('HOME','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP','TMPDIR')) {
            [Environment]::SetEnvironmentVariable($key,$scratch,'Process')
          }
          $env:PSModuleAnalysisCachePath=Join-Path $scratch 'ps-module-cache'
          $env:PATH=(Join-Path $env:SystemRoot 'System32')
          & .\tool\python\python.exe -I -B -c "from pathlib import Path; compile(Path('tests/check_minimal_ocr_build.py').read_bytes(),'tests/check_minimal_ocr_build.py','exec')"
          if ($LASTEXITCODE) { throw 'Probe syntax failure' }
          & .\tool\python\python.exe -I -B tests/check_minimal_ocr_build.py (Join-Path $root 'tmp/minimal-ocr-build.json')
          if ($LASTEXITCODE) { throw 'Reduced source build or actual recognition incomplete' }
      - name: Preserve JSON build evidence only, no executable, model or archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minimal-ocr-build-evidence
          path: tmp/minimal-ocr-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve reduced technical failure status
        if: always() && steps.research.outcome != 'success'
        run: throw 'Reduced native technical acceptance incomplete'
  original_contracts:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'da1c777ab04b2bbd0dd7c1e13ae6c2396b832931'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Exact original ZIP and one narrow actual local launcher contract batch
        id: probe
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          $hostPython = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ([IO.Path]::GetFullPath($hostPython).StartsWith([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected orchestrator' }
          & $hostPython -I -B -c "from pathlib import Path; compile(Path('tests/check_original_release_contracts.py').read_bytes(),'tests/check_original_release_contracts.py','exec')"
          if ($LASTEXITCODE) { throw 'Original probe syntax failure' }
          & $hostPython -I -B tests/check_original_release_contracts.py (Join-Path $pwd 'tmp/original-release-contracts.json')
          if ($LASTEXITCODE) { throw 'Original targeted contract failures; preserve exact row evidence' }
      - name: Preserve original-only result JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-release-contract-evidence
          path: tmp/original-release-contracts.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original targeted failure status
        if: always() && steps.probe.outcome != 'success'
        run: throw 'Original targeted contract acceptance incomplete'
  record:
    needs: [source_review, windows_build, original_contracts]
    if: always() && github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'da1c777ab04b2bbd0dd7c1e13ae6c2396b832931'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: da1c777ab04b2bbd0dd7c1e13ae6c2396b832931
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          lfs: false
      - name: Verify immutable earlier evidence and exact research-only source scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE"
          /usr/bin/python3 -I -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"]
          expected={"tests/check_ocr_source_decision.py","tests/check_minimal_ocr_build.py",
            "tests/original_release_136_env_contracts.json","tests/check_original_release_contracts.py",
            "tests/ocr_minimal_decision_45751623105.md",".github/workflows/minimal-ocr-original-contracts.yml"}
          changed={n.decode("utf-8") for n in subprocess.check_output(["git","diff","--name-only","-z",os.environ["BASE"],"HEAD"]).split(b"\0") if n}
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          for ref,want in ((branch,start),("refs/heads/main",frozen),("refs/tags/v0.172.0-portable.1",frozen)):
              assert subprocess.check_output(["git","ls-remote","origin",ref]).decode().strip()==want+"\t"+ref
          prior=json.loads(Path("tests/locked_ocr_xmllite_45751623105.json").read_bytes())
          assert prior["native_recognition_passed"] and prior["binary_archive_signatures_verified"]==49 and prior["runtime_source_groups_inspected"]==32
          assert prior["prior_candidate_id"]=="15085655070" and prior["prior_candidate_unchanged"]
          assert not Path(".github/workflows/locked-ocr-xmllite.yml").exists()
          c=json.loads(Path("tests/original_release_136_env_contracts.json").read_bytes())
          old=json.loads(Path("tests/original_release_45739266926_coverage.json").read_bytes())
          assert c["metadata"]["frozen_source"]==frozen and c["metadata"]["original_zip_sha256"]==old["metadata"]["archive_sha256"]
          assert {x["name"] for x in c["variables"]}=={x["name"] for x in old["environment"] if x["classification"]=="\u672a\u9a8c"}
          assert len(c["variables"])==136
          print("Research-only scope and original-only static index verified")
          PY
      - name: Retrieve full source and license JSON
        id: source_result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minimal-ocr-source-evidence
          path: tmp/minimal-ocr-source-evidence
      - name: Retrieve source-built Windows JSON
        id: build_result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minimal-ocr-build-evidence
          path: tmp/minimal-ocr-build-evidence
      - name: Retrieve original-only JSON
        id: original_result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-release-contract-evidence
          path: tmp/original-release-contract-evidence
      - name: Record independent results and remove only this temporary trigger
        if: always() && steps.scope.outcome == 'success'
        shell: bash
        env:
          SOURCE_REVIEW: ${{ needs.source_review.result }}
          WINDOWS_BUILD: ${{ needs.windows_build.result }}
          ORIGINAL_CONTRACTS: ${{ needs.original_contracts.result }}
          SOURCE_RESULT: ${{ steps.source_result.outcome }}
          BUILD_RESULT: ${{ steps.build_result.outcome }}
          ORIGINAL_RESULT: ${{ steps.original_result.outcome }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import collections,json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"];run=os.environ["GITHUB_RUN_ID"]
          def git(*args):return subprocess.check_output(["git",*args])
          def rev():return git("rev-parse","HEAD").decode().strip()
          def ref(name):
              v,n=git("ls-remote","origin",name).decode().strip().split("\t")
              assert n==name
              return v
          assert rev()==ref(branch)==start and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          assert not git("status","--porcelain=v1","--untracked-files=all")
          def read(p,original=False):
              p=Path(p)
              if not p.exists():return {"completed":False,"rows":[],"report_missing":True}
              data=json.loads(p.read_bytes())
              if original:
                  assert data["metadata"]["source_commit"]==frozen and data["metadata"]["new_harness_commit"]==start
                  assert data["metadata"]["archive_sha256"]=="a406e4487bde19057491b6515f7abcab74faf2e3437366b0b23f9940af5760dc"
              else:assert data["source_commit"]==start
              return data
          source=read("tmp/minimal-ocr-source-evidence/ocr-source-decision.json")
          build=read("tmp/minimal-ocr-build-evidence/minimal-ocr-build.json")
          original=read("tmp/original-release-contract-evidence/original-release-contracts.json",True)
          model=source.get("source_evidence",{}).get("mingw-w64-tesseract-data",{})
          result={"source_commit":start,"run_id":run,"prior_run":"45751623105","prior_record":os.environ["BASE"],
              "prior_candidate_id":"15085655070","prior_candidate_unchanged":True,
              "source_review":source,"reduced_windows_build":build,"original_release_contracts":original,
              "model_source_signature_and_bytes_verified":bool(model.get("signature_verification",{}).get("verified") and model.get("model_exact_source_match") and model.get("status")=="SIGNED_SOURCE_AND_LICENSE_TEXT_INSPECTED"),
              "old_runtime_files_mapped":len(source.get("runtime_files",[])),"old_runtime_selected_for_distribution":False,
              "reduced_native_recognition":bool(build.get("technical_recognition_passed",False)),
              "original_targeted_counts":dict(collections.Counter(x["status"] for x in original.get("rows",[]))),
              "workflow_steps":{k:os.environ[k] for k in ("SOURCE_REVIEW","WINDOWS_BUILD","ORIGINAL_CONTRACTS","SOURCE_RESULT","BUILD_RESULT","ORIGINAL_RESULT")},
              "distribution_qualified":False,"ocr_integrated":False,"new_candidate_built":False,"whole_package_all_pass_claim":False}
          target=Path("tests/minimal_ocr_original_contracts_"+run+".json")
          assert not target.exists()
          target.write_text(json.dumps(result,indent=2,ensure_ascii=True)+"\n",encoding="utf-8")
          notes=Path("DEVELOPMENT.md")
          notes.write_bytes(notes.read_bytes()+("\n\n## Reduced source-built OCR research and original launcher contracts\n\n"
              "Source "+start+"; https://github.com/rileyaaa/Portable/actions/runs/"+run+". Separate actual evidence "+target.as_posix()+
              ". Model missing-source signature and byte match="+str(result["model_source_signature_and_bytes_verified"])+
              "; reduced Windows technical recognition="+str(result["reduced_native_recognition"])+
              "; original-targeted row counts="+json.dumps(result["original_targeted_counts"])+
              ". Old 41-PE graph not selected; no redistribution/integration or new customer ZIP. Prior verified candidate 15085655070 unchanged. Earlier original/ACL/SSH/course evidence not rerun or reclassified.\n").encode("utf-8"))
          workflow=".github/workflows/minimal-ocr-original-contracts.yml"
          git("rm","--",workflow);git("add","--",str(target),"DEVELOPMENT.md")
          assert {n.decode("utf-8") for n in git("diff","--cached","--name-only","-z").split(b"\0") if n}=={workflow,target.as_posix(),"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record minimal OCR and original contract evidence; remove temporary trigger")
          final=rev();assert ref(branch)==start
          subprocess.run(["git","push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("MINIMAL_OCR_FINAL_DEV="+final,flush=True)
          print("MINIMAL_OCR_RESULT="+json.dumps({"model_source":result["model_source_signature_and_bytes_verified"],"reduced_native":result["reduced_native_recognition"],"old_mapped":result["old_runtime_files_mapped"],"original_counts":result["original_targeted_counts"],"distribution":False}),flush=True)
          # Remaining redistribution/integration gate is explicitly unresolved.
          raise SystemExit(1)
          PY
