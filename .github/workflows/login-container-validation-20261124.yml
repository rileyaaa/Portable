name: Login JSON container regression (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/login-container-validation-20261124.yml']
permissions:
  contents: read
jobs:
  native:
    if: >-
      startsWith(github.event.head_commit.message, 'fix(login): preserve account container shape')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve original bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Reproduce exact old container bugs and verify fixed production functions
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_login_json_containers.ps1 -BaselineCommit 785cae66358881fb873c0162ca6ebf398dccf65e
          if ($LASTEXITCODE -ne 0) { throw 'Baseline reproduction failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_login_json_containers.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Container regression failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_login_input_errors.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Existing deletion policy regression failed' }
      - name: Fixed runtime, existing account and packaging regressions
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'LFS integrity failed' }
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python regression failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_login_flow.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Existing authentication regression failed' }
          & .\tool\python\python.exe -B .\tool\package-release.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Release input check failed' }
