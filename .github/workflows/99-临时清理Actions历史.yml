          assert os.environ.get('GITHUB_REPOSITORY') == REPOSITORY
          self_run_id = int(os.environ['GITHUB_RUN_ID'])
          assert self_run_id not in EXPECTED, 'Current run is unexpectedly an old run'
          token = os.environ['GH_TOKEN']
          assert token, 'Missing GitHub Actions token'
          
          def request(method, endpoint):
              req = Request(
                  f'https://api.github.com/repos/{REPOSITORY}/{endpoint}',
                  method=method,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'},
              )
              for attempt in range(5):
                  try:
                      with urlopen(req, timeout=40) as response:
                          return json.load(response) if method == 'GET' else response.status
                  except HTTPError as err:
                      if method == 'DELETE' and err.code == 404:
                          return 404
                      if err.code in (429, 500, 502, 503, 504) or (err.code == 403 and err.headers.get('Retry-After')):
                          pause = int(err.headers.get('Retry-After', '0') or '0')
                          pause = min(60, max(pause, 3 * (attempt + 1)))
                          print(f'Retrying {method} {endpoint}: HTTP {err.code}; sleep {pause}s', flush=True)
                          time.sleep(pause)
                          continue
                      raise
              raise RuntimeError(f'API retry limit reached: {method} {endpoint}')
          
          # Enumerate the complete repository history and match all old run IDs before deletion.
          runs = []
          for page in range(1, 12):
              response = request('GET', f'actions/runs?per_page=100&page={page}')
              part = response['workflow_runs']
              runs.extend(part)
              if len(part) < 100:
                  break
          else:
              raise SystemExit('STOP: Too many pages; no deletion attempted')
          
          current_ids = {run['id'] for run in runs}
          if len(current_ids) != len(runs) or self_run_id not in current_ids:
              raise SystemExit('STOP: Incomplete run enumeration or cleanup run not found')
          unknown = current_ids - set(EXPECTED) - {self_run_id}
          if unknown:
              raise SystemExit(f'STOP: Unknown new runs: {sorted(unknown)}; no deletion attempted')
          
          pending = []
          for item in runs:
              run_id = item['id']
              if run_id == self_run_id:
                  continue
              workflow_id, path = EXPECTED[run_id]
              if (item.get('workflow_id') != workflow_id or
                      item.get('path') != path or
                      item.get('status') != 'completed' or
                      item.get('repository', {}).get('full_name') != REPOSITORY):
                  raise SystemExit(f'STOP: Unexpected identity/status for {run_id}; no deletion attempted')
              pending.append(run_id)
          
          print(f'PRECHECK OK: {len(pending)} of 162 old runs remain; current run {self_run_id} preserved', flush=True)
          deleted = 0
          for run_id in sorted(pending, reverse=True):
              result = request('DELETE', f'actions/runs/{run_id}')
              if result not in (204, 404):
                  raise SystemExit(f'Unexpected deletion status for {run_id}: {result}')
              if result == 204:
                  deleted += 1
              print(f'CLEANUP {deleted}/{len(pending)}: {run_id} (HTTP {result})', flush=True)
              time.sleep(0.25)
          
          print(f'COMPLETE: {deleted} old runs deleted, {162-len(pending)} already absent.', flush=True)
          print(f'Cleanup run {self_run_id} is intentionally kept for manual deletion after workflow removal.', flush=True)
          PY
