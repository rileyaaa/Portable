name: "99｜一次性清理 Codex-Portable Actions 历史（临时）"

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: "勾选后永久删除已确认的162条旧执行记录；不构建、不发布、不修改分支"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: "仅清理历史运行记录（不执行任何打包任务）"
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_delete }}
