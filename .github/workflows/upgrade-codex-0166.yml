name: One-time verified Codex 0.166.0 upgrade

# Owner-authorized one-shot bootstrap. Generated commits do not modify this
# workflow, so they cannot retrigger it. Manual dispatch remains available.
on:
  push:
    branches: [main]
    paths: [.github/workflows/upgrade-codex-0166.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: portable-official-upgrade-0166
  cancel-in-progress: false

jobs:
  upgrade:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.head_commit.message == 'chore: bootstrap Codex 0.166.0 upgrade [portable-upgrade-0166]')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out trusted source and hydrate Git LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 1
          persist-credentials: true

      - name: Download pinned canonical Windows x64 release
        env:
          ARCHIVE_SHA256: d559bb88e74d471265857b93b7f19bc250dae527673b9191b33534478093f6bc
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'portable-codex-upgrade-0166'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $url = 'https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-package-x86_64-pc-windows-msvc.tar.gz'
          $archive = Join-Path $tmp 'codex-package-x86_64-pc-windows-msvc.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10 -UseBasicParsing
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne $env:ARCHIVE_SHA256) { throw 'Official canonical package digest mismatch; no changes will be committed.' }
          "UPSTREAM_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output ('OFFICIAL_ARCHIVE_SHA256=' + $hash)

      - name: Adapt official runtime, manifests and version-specific checks
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B .\.github\scripts\upgrade-codex-0166.py --repo . --archive $env:UPSTREAM_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Official runtime adaptation failed.' }
          & .\codex.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native client failed after runtime upgrade.' }
          $reported = (& .\codex.exe --version) -join "`n"
          if ($reported.Trim() -cne 'codex-cli 0.166.0') { throw ('Wrong native Codex: ' + $reported) }
          $catalog = Join-Path $env:RUNNER_TEMP 'codex-models-0166.json'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $models = & .\codex.exe debug models --bundled
          if ($LASTEXITCODE -ne 0) { throw 'Native bundled model export failed.' }
          $json = $models -join "`n"
          $null = $json | ConvertFrom-Json
          [IO.File]::WriteAllText($catalog, $json, (New-Object Text.UTF8Encoding($true)))
          "BUNDLED_MODELS_PATH=$catalog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'NATIVE_VERSION_AND_BUNDLED_MODELS=PASS'

      - name: Stage exact upgrade scope and enforce Git LFS
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            '.gitattributes', 'codex.exe', 'codex-code-mode-host.exe', 'codex-exec-server.exe',
            'codex-command-runner.exe', 'codex-windows-sandbox-setup.exe',
            'codex-package.json', 'codex-path/rg.exe', 'tool/runtime-manifest.json',
            'run-codex.ps1', 'env.ps1', 'login-json.ps1', 'README.md', 'DEVELOPMENT.md',
            'tool/工具更新说明.md', 'tool/package-release.py',
            'Version_History/常用模式专用包-run-codex.ps1',
            'Version_History/常用模式专用包-env.ps1',
            'Version_History/YOLO mode专用包-run-codex.ps1',
            'Version_History/YOLO mode专用包-env.ps1',
            'tests/test_runtime_package.py', 'tests/test_release_package.py',
            'tests/test_runtime_preflight.ps1'
          )
          & git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS is required for signed Windows runtimes.' }
          # Windows PowerShell 5.1 passes non-ASCII native argv through a legacy
          # code page. Stage tracked modifications without forwarding CJK paths;
          # stage the one new executor under an ASCII-only name.
          & git add -u
          if ($LASTEXITCODE -ne 0) { throw 'Tracked upgrade staging failed.' }
          & git add -- codex-exec-server.exe
          if ($LASTEXITCODE -ne 0) { throw 'New executor staging failed.' }
          foreach ($binary in @('codex.exe','codex-code-mode-host.exe','codex-exec-server.exe',
                                 'codex-command-runner.exe','codex-windows-sandbox-setup.exe','codex-path/rg.exe')) {
            $attr = (& git check-attr filter -- $binary) -join "`n"
            if ($attr -notmatch ': filter: lfs$') { throw "Binary is not LFS-tracked: $binary" }
            $pointer = (& git show ":$binary" | Select-Object -First 1) -join "`n"
            if ($pointer -notmatch '^version https://git-lfs.github.com/spec/v1') { throw "Expected a committed LFS pointer: $binary" }
          }
          # Decode git's NUL-delimited UTF-8 paths in bundled Python; Windows
          # PowerShell 5.1 cannot round-trip them through native stdout reliably.
          $allowBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($paths | ConvertTo-Json -Compress)))
          $checkIndex = @'
          import base64, json, subprocess, sys
          allowed = set(json.loads(base64.b64decode(sys.argv[1])))
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z'])
          changed = {part.decode('utf-8') for part in raw.split(b'\0') if part}
          required = {'tool/runtime-manifest.json', 'codex.exe', 'codex-exec-server.exe'}
          assert required.issubset(changed), 'Missing mandatory runtime files: ' + repr(required - changed)
          assert changed.issubset(allowed), 'Unexpected staged paths: ' + repr(changed - allowed)
          print('STAGED_CHANGED_FILES=' + str(len(changed)))
          '@
          & .\tool\python\python.exe -B -c $checkIndex $allowBase64
          if ($LASTEXITCODE -ne 0) { throw 'Staged index scope failed.' }
          & git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Malformed staged diff.' }

      - name: Three consecutive targeted validations after all modifications
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($round in 1..3) {
            Write-Output ("FINAL_VALIDATION_ROUND=$round")
            foreach ($suite in @('test_runtime_package.py','test_release_package.py','test_mode_copies.py','test_tui_fullscreen.py')) {
              & .\tool\python\python.exe -B -m unittest discover -s tests -p $suite -v
              if ($LASTEXITCODE -ne 0) { throw "Regression $suite failed during round $round" }
            }
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_portable_config.ps1 -BundledModelsPath $env:BUNDLED_MODELS_PATH
            if ($LASTEXITCODE -ne 0) { throw "PowerShell configuration checks failed during round $round" }
          }
          Write-Output 'THREE_CONSECUTIVE_TARGETED_ROUNDS=PASS'

      - name: Commit and push validated official upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git commit -m 'chore(runtime): upgrade pinned Codex CLI and helpers to 0.166.0'
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade commit failed.' }
          $commit = (& git rev-parse HEAD).Trim()
          & git lfs push origin HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the new official LFS payloads.' }
          & git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Remote moved or GitHub Actions lacks permission; no release dispatched.' }
          $remote = (& git ls-remote origin refs/heads/main) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not $remote.StartsWith($commit)) { throw 'Remote commit readback mismatch.' }
          Write-Output ('VERIFIED_SOURCE_COMMIT=' + $commit)

      - name: Dispatch the existing full Windows release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.166.0-portable.1'
          $tagRef = (& git ls-remote --tags origin "refs/tags/$tag") -join "`n"
          if ($LASTEXITCODE -ne 0 -or $tagRef) { throw 'Target tag already exists or cannot be checked.' }
          & gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref main -f version=$tag -f publish_release=true -f check_set=full
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade committed, but full release dispatch failed.' }
          Write-Output ('FULL_WINDOWS_RELEASE_GATE_DISPATCHED=' + $tag)

      - name: Remove this runner's downloaded archive
        if: always()
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'portable-codex-upgrade-0166'
          if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force }
