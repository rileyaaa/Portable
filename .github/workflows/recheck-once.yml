# Temporary owner-authorized repair bridge; remove before corrective release.
name: One-time final recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/recheck-once.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: true
      - name: Prepare owned package-local test state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:GITHUB_WORKSPACE 'tmp/extension-review'
          $state=@{HOME='home';USERPROFILE='home';APPDATA='appdata';LOCALAPPDATA='localappdata';PROGRAMDATA='programdata';ALLUSERSPROFILE='programdata';TEMP='temp';TMP='temp';TMPDIR='temp';XDG_CACHE_HOME='cache';XDG_CONFIG_HOME='config';XDG_DATA_HOME='data';XDG_STATE_HOME='state';CODEX_HOME='codex-home';CODEX_SQLITE_HOME='sqlite';GH_CONFIG_DIR='gh'}
          foreach($name in $state.Keys){$p=Join-Path $base $state[$name];New-Item -ItemType Directory -Force -Path $p|Out-Null;"$name=$p"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          'PYTHONDONTWRITEBYTECODE=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'PIP_CONFIG_FILE=nul'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'POWERSHELL_TELEMETRY_OPTOUT=1'|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PSModuleAnalysisCachePath=$base\cache\ModuleAnalysisCache"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$base\cache\modules"|Out-Null
          "PSModulePath=$base\cache\modules;$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply the byte-checked minimal repair
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, zlib
          packed=''
          payload=zlib.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='f24366026ce4dd8ae037861a76e7b654aaa078b77f8977fb1c938a69eb36f3c3'
          ops=json.loads(payload); root=pathlib.Path.cwd(); seen=set()
          for op in ops:
              name=op['path']; path=root/name
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              if 'create' in op:
                  assert not path.exists()
                  data=op['create'].encode('utf-8')
              else:
                  # Git's raw bytes are the reviewed source of truth, independent of
                  # Windows checkout EOL conversion. Subsequent edits use our output.
                  before=path.read_bytes() if name in seen else subprocess.check_output(['git','show','HEAD:'+name])
                  assert hashlib.sha256(before).hexdigest()==op['before'],name
                  if 'copy' in op:
                      data=(root/op['copy']).read_bytes()
                  else:
                      text=before.decode('utf-8'); crlf='\r\n' in text; text=text.replace('\r\n','\n')
                      assert text.count(op['old'])==1,name
                      text=text.replace(op['old'],op['new'],1)
                      data=(text.replace('\n','\r\n') if crlf else text).encode('utf-8')
              if 'after' in op: assert hashlib.sha256(data).hexdigest()==op['after'],name
              path.write_bytes(data); seen.add(name)
          (root/'tmp/extension-review/paths.json').write_text(json.dumps(sorted(seen)),encoding='utf-8')
          print('REPAIR_PATH_COUNT',len(seen))
      - name: Check production parsing, namespace regression and mode copies
        timeout-minutes: 4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $paths=Get-Content .\tmp\extension-review\paths.json -Raw|ConvertFrom-Json
          foreach($relative in $paths){if($relative.EndsWith('.ps1')){$tokens=$null;$errors=$null;$null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relative),[ref]$tokens,[ref]$errors);if($errors.Count){throw ($relative+': '+($errors.Message -join '; '))}}}
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_extension_policy.ps1
          if($LASTEXITCODE -ne 0){throw 'Extension regression failed.'}
          & .\tool\python\python.exe -B -m unittest discover -s tests -p test_mode_copies.py -v
          if($LASTEXITCODE -ne 0){throw 'Mode copies differ.'}
      - name: Test real offline BAT and native MCP lifecycle
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\tests\test_launcher_smoke.ps1
          if($LASTEXITCODE -ne 0){throw 'Native launcher and persistence lifecycle failed.'}
      - name: Commit only the tested repair and existing documentation
        shell: python
        run: |
          import json, pathlib, subprocess
          paths=json.loads(pathlib.Path('tmp/extension-review/paths.json').read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          staged=[p.decode('utf-8') for p in subprocess.check_output(['git','diff','--cached','--name-only','-z']).split(b'\0') if p]
          assert set(staged)==set(paths),(staged,paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','fix: preserve inactive extension settings during maintenance commands'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('VERIFIED_REPAIR_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Remove retrieved temporary source artifact
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/12551164453"
          if($LASTEXITCODE -ne 0){throw 'Review artifact cleanup requires attention.'}
      - name: Remove only owned review state
        if: always()
        shell: powershell
        run: |
          $p=Join-Path $env:GITHUB_WORKSPACE 'tmp/extension-review'
          if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force}
