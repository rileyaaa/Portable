# Temporary owner-authorized repair bridge; remove before final publication.
name: One-time final recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/recheck-once.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /run-codex.ps1
            /env.ps1
            /README.md
            /DEVELOPMENT.md
            /Version_History/*.ps1
            /tests/
            /tool/automation/portable-automation.ps1
      - name: Apply byte-guarded minimal repair
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import base64, hashlib, pathlib, zlib
          encoded = ''
          # Reject any transport change before executing the reviewed patch.
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='c935f056463107f1745452b7c33e00ba40b53b869954486aa8eced30579e6af5','Patch transport mismatch'
          scratch=pathlib.Path('tmp/migration-repair')
          scratch.mkdir(parents=True,exist_ok=False)
          (scratch/'apply.py').write_bytes(raw)
          exec(compile(raw,str(scratch/'apply.py'),'exec'),{})
      - name: Parse scripts and execute production lifecycle regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=Get-Content -LiteralPath tmp/review-patched-paths.json -Raw | ConvertFrom-Json
          foreach($path in $paths | Where-Object { $_ -like '*.ps1' }) {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($path+': '+($errors.Message -join '; '))}
          }
          foreach($test in @('test_extension_migration','test_extension_persistence','test_extension_policy','test_cli_model_options')) {
            & pwsh -NoProfile -NonInteractive -File (Join-Path $PWD ('tests/'+$test+'.ps1'))
            if($LASTEXITCODE -ne 0){throw ('Failed production regression: '+$test)}
          }
          & python -B -m unittest discover -s tests -p test_mode_copies.py -v
          if($LASTEXITCODE -ne 0){throw 'Mode-copy regression failed.'}
      - name: Commit only the verified repair and existing documentation
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('tmp/review-patched-paths.json').read_text())
          assert len(paths)==8 and len(set(paths))==8
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          subprocess.run(['git','commit','-m','fix: persist legacy extensions before fallible launcher startup'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
      - name: Remove only the downloaded source artifact and owned scratch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/migration-repair-gh
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/12553457850"
          rm -rf -- "$GITHUB_WORKSPACE/tmp/migration-repair" "$GITHUB_WORKSPACE/tmp/migration-repair-gh"
          rm -f -- "$GITHUB_WORKSPACE/tmp/review-patched-paths.json"
