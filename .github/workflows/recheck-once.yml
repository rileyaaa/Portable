# Temporary owner-authorized dispatch bridge; remove before final release checkout.
name: One-time final recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/recheck-once.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the clean reviewed source after connector removal
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/recheck-dispatch
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json, os, pathlib, subprocess, time
          repo=os.environ['GITHUB_REPOSITORY']; bridge=os.environ['GITHUB_SHA']
          scratch=pathlib.Path(os.environ['GH_CONFIG_DIR']);scratch.mkdir(parents=True,exist_ok=False)
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          for attempt in range(36):
              head=api('git/ref/heads/main')['object']['sha']
              if head!=bridge:
                  commit=api('commits/'+head)
                  assert len(commit['parents'])==1 and commit['parents'][0]['sha']==bridge
                  files=commit['files']
                  assert len(files)==1 and files[0]['filename']=='.github/workflows/recheck-once.yml' and files[0]['status']=='removed'
                  assert api('git/ref/heads/main')['object']['sha']==head
                  subprocess.run(['gh','workflow','run','release.yml','--repo',repo,'--ref','main','-f','version=v2026.10.24.1','-f','check_set=full','-f','publish_release=true'],check=True)
                  print('CORRECTIVE_FULL_RELEASE_DISPATCHED source='+head+' version=v2026.10.24.1')
                  break
              time.sleep(5)
          else:
              raise SystemExit('Temporary bridge removal was not observed within the finite deadline; nothing was dispatched.')
      - name: Remove owned dispatch state
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/recheck-dispatch"
