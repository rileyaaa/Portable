# Temporary owner-authorized finalization bridge; remove before dispatch.
name: One-time final recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/recheck-once.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DEVELOPMENT.md
      - name: Verify completed independent checks and record their exact scope
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/review-finalize/gh
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,pathlib,subprocess
          scratch=pathlib.Path('tmp/review-finalize');scratch.mkdir(parents=True,exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY']
          baseline='cb6cf06ca658b2fde7c1e432e3326066c196588f'
          changed=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines()
          assert changed==['.github/workflows/recheck-once.yml'],'Reviewed source changed'
          run=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/40078601267'],text=True))
          assert run['head_sha']==baseline and run['status']=='completed'
          jobs=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/40078601267/jobs'],text=True))['jobs']
          required={'Fresh committed-source and pinned configuration review','Fresh PowerShell parse and production regression round'}
          checks={s['name']:s['conclusion'] for j in jobs for s in j['steps'] if s['name'] in required}
          assert set(checks)==required and all(v=='success' for v in checks.values()),checks
          path=pathlib.Path('DEVELOPMENT.md');text=path.read_text(encoding='utf-8')
          lines=text.splitlines(keepends=True);key='**扩展配置生命周期复查：**'
          hits=[i for i,line in enumerate(lines) if line.startswith(key)];assert len(hits)==1
          addition='修复后从新检出的提交再次核对启动失败恢复、命名空间回写、CLI、模式副本、固定版本变量与发行门禁，源码及专项回归通过，未发现新增可复现问题；Linux/PS7 结果不替代随后完整 Windows 发布验收。'
          assert addition not in text
          i=hits[0];lines[i]=lines[i].rstrip('\n')+' '+addition+'\n'
          path.write_text(''.join(lines),encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','DEVELOPMENT.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','docs: record independent post-fix review and remaining Windows gate'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('REVIEWED_DOCUMENT_COMMIT='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
      - name: Dispatch complete Windows validation after bridge removal
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/review-finalize/gh
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          reviewed=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for attempt in range(180):
              remote=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/main'],text=True))['object']['sha']
              if remote!=reviewed:
                  subprocess.run(['git','fetch','--depth=1','origin',remote],check=True)
                  diff=subprocess.check_output(['git','diff','--name-status',reviewed,remote],text=True).strip()
                  if diff!='D\t.github/workflows/recheck-once.yml':raise SystemExit('Source changed after review; release not dispatched.')
                  releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
                  assert not any(r['tag_name']=='v2026.10.24.1' for r in releases),'Release already exists; never overwrite.'
                  payload=json.dumps({'ref':'main','inputs':{'version':'v2026.10.24.1','publish_release':'true','check_set':'full'}})
                  subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True)
                  print('FULL_WINDOWS_RELEASE_DISPATCHED source='+remote+' version=v2026.10.24.1')
                  break
              time.sleep(2)
          else:raise SystemExit('Bridge not removed within finite dispatch window.')
      - name: Remove owned finalization scratch
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/review-finalize"
