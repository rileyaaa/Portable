# Temporary owner-authorized review bridge; remove before publication.
name: One-time final recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/recheck-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Export tracked review inputs without runtime binaries or user state
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import ast, hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path.cwd()
          scratch=root/'tmp'/'independent-review-export'
          scratch.mkdir(parents=True,exist_ok=False)
          names=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-tree','-rz','--name-only','HEAD']).split(b'\0') if p]
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.html','.css','.toml','.rules','.in','.lock'}
          chosen=[p for p in names if not p.startswith(excluded) and (pathlib.PurePosixPath(p).suffix.lower() in suffixes or p in ('.gitattributes','.gitignore','tool/node/npm','tool/node/npx'))]
          forbidden=('home/auth','home/sessions/','home/config.toml','env.local.ps1','login_json/')
          assert not any(p.startswith(forbidden) for p in chosen)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in chosen)+'\n',text=True,check=True)
          inventory={}
          with zipfile.ZipFile(scratch/'review-source.zip','x',zipfile.ZIP_DEFLATED) as z:
              for p in chosen:
                  b=(root/p).read_bytes()
                  assert not b.startswith(b'version https://git-lfs.github.com/spec/v1'),p
                  inventory[p]={'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}
                  z.writestr(p,b)
              z.writestr('_review_meta.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tracked_names':names,'files':inventory},ensure_ascii=False,indent=2))
          archive=scratch/'review-source.zip'
          print('REVIEW_SOURCE_FILES='+str(len(chosen)))
          print('REVIEW_SOURCE_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-review-source
          path: tmp/independent-review-export/review-source.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Remove owned export directory
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/independent-review-export"
