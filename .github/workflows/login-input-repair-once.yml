# Owner-requested bounded source repair; no release or dispatch operations.
name: Verify login input error preservation
on:
  push:
    branches: [main]
    paths: [.github/workflows/login-input-repair-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /login-json.ps1
            /tests/test_login_input_errors.ps1
            /README.md
            /DEVELOPMENT.md
            /.github/workflows/release.yml
      - name: Reproduce the unsafe classification with synthetic function stubs
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          data=pathlib.Path('login-json.ps1').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='f3120a0ecbe865db677ab97b210af11822b7982b'
          result=subprocess.run(['pwsh','-NoLogo','-NoProfile','-File','tests/test_login_input_errors.ps1'],text=True,capture_output=True)
          diagnostic=result.stdout+result.stderr
          assert result.returncode!=0 and 'Unreadable input status' in diagnostic and 'INVALID_DELETED' in diagnostic,diagnostic
          print('BASELINE_REPRODUCED: unreadable synthetic input entered the deletion classification; no real file was deleted.')
      - name: Apply only the two failed-input branches and matching test documentation
        shell: python
        run: |
          from pathlib import Path
          source=Path('login-json.ps1')
          text=source.read_bytes().decode('utf-8')
          old='        Set-DeletedResult -Result $result -Path $Path -Message $Entry.LoadError -Entry $Entry'
          assert text.count(old)==1
          replacement='\r\n'.join([
              '        # Inspection/parse failure is not proof of an invalid credential.',
              '        # ERROR_KEPT also excludes this entry from multi-account pruning.',
              '        $result.Status = "ERROR_KEPT"',
              '        $result.Message = "credential input could not be safely read or parsed; kept file"'])
          text=text.replace(old,replacement,1)
          old='        Set-DeletedResult -Result $result -Path $Path -Message ("invalid json: " + (ConvertTo-SafeMessage $_.Exception.Message)) -Entry $Entry'
          assert text.count(old)==1
          replacement='\r\n'.join([
              '        # Includes file access errors and a missing/stale credential index.',
              '        # Do not delete a whole container when selecting one entry failed.',
              '        $result.Status = "ERROR_KEPT"',
              '        $result.Message = "credential input could not be safely read or parsed; kept file"',
              '        $result.Credential = $null'])
          text=text.replace(old,replacement,1)
          source.write_bytes(text.encode('utf-8'))
          workflow=Path('.github/workflows/release.yml')
          text=workflow.read_text(encoding='utf-8')
          marker='      - name: Windows PowerShell 5.1 - test_browser_login_flow\n'
          assert text.count(marker)==1 and 'test_login_input_errors' not in text
          offset=text.index(marker)
          end=text.index('      - name: ',offset+len(marker))
          block=text[offset:end].replace('test_browser_login_flow','test_login_input_errors')
          workflow.write_text(text[:offset]+block+text[offset:],encoding='utf-8',newline='')
          readme=Path('README.md')
          text=readme.read_bytes().decode('utf-8')
          old='网络失败不代表账号可删除。'
          assert text.count(old)==1
          text=text.replace(old,'网络失败不代表账号可删除；输入不可读、无法解析或指定索引不存在时保留原文件，不按失效凭证删除。',1)
          readme.write_bytes(text.encode('utf-8'))
          doc=Path('DEVELOPMENT.md')
          text=doc.read_bytes().decode('utf-8')
          anchor='## 2026-10-24：Windows 验证与 npm 目录边界\n\n'
          assert text.count(anchor)==1 and '**账号输入异常保留：**' not in text
          record='**账号输入异常保留：** 修正账号检查将文件访问/解析异常、缺失索引及 LoadError 统一送入失效凭据删除分支的问题；错误索引不再导致删除整个容器。两处输入失败分支改为 ERROR_KEPT，避免后续多账号 prune，并抑制异常详情；成功解析后缺少必需字段、明确服务端认证失效及网络错误的既有分类不变。9 项生产函数回归全部使用合成对象，网络与删除均为 stub；旧实现可复现错误分类，修复后专项通过。完整 Windows 验收由本轮后续双阶段复查完成后记录，不将 Linux/PS7 代作 Windows 结果。\n\n'
          doc.write_bytes(text.replace(anchor,anchor+record,1).encode('utf-8'))
      - name: Verify the repair and retained invalidation policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoLogo -NoProfile -File tests/test_login_input_errors.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Login preservation regression failed.' }
          $tokens=$null; $errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'login-json.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw 'Login source syntax failure.' }
      - name: Commit only the reviewed source, test gate and existing documents
        shell: python
        run: |
          import subprocess
          expected={'login-json.ps1','.github/workflows/release.yml','README.md','DEVELOPMENT.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==expected,changed
          # The existing PS1 stores CRLF without Git text normalization. Recognize
          # CR at line end, while continuing to reject other whitespace defects.
          subprocess.run(['git','-c','core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          subprocess.run(['git','commit','-m','fix: preserve account containers on input access, parse and selection errors'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
