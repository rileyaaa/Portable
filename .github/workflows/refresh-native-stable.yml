name: Independent verified wheel delivery and targeted LFS object recovery (one time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/refresh-native-stable.yml]
permissions: {}
concurrency:
  group: stable-tool-refresh-pair
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.event.before == '3dc13d1272fc5213bc737065cbbec625bc32ec2e' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 3dc13d1272fc5213bc737065cbbec625bc32ec2e
      TARGET_BRANCH: dev/stable-tool-refresh
    steps:
      - name: Preserve tracked bytes and isolate CI module cache
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git configuration failed' }
          $dir = Join-Path $env:RUNNER_TEMP ('http-refresh-pscache-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $dir
          ('PSModuleAnalysisCachePath=' + (Join-Path $dir 'ModuleAnalysisCache')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Confirm source candidate, frozen references and clean checkout
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -cne $env:BASE) { throw 'Wrong checkout or parent' }
          $changed = @(git diff --name-only $env:BASE HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/refresh-native-stable.yml') { throw 'Unexpected trigger changes' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved' }
          }
          $fixed = @(git diff --name-only de0c8411cd7fbe999d2113ea20542756351ccb3a HEAD -- env.ps1 run-codex.ps1 codex.exe codex-code-mode-host.exe codex-path tool/runtime-manifest.json tool/python tool/python-packages.in.txt tool/python-packages.lock.txt tool/node tool/automation/playwright tool/automation/browsers tool/automation/versions.json tool/automation/dependency-manifest.json tool/automation/browser-manifest.json Version_History)
          if ($LASTEXITCODE -ne 0 -or $fixed.Count -ne 0) { throw 'Unexpected fixed runtime change' }
          git lfs install --local
          if ($LASTEXITCODE) { throw 'LFS hooks unavailable' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS verification failed' }
      - name: Deliver exact prior packaging tree independently, no new LFS objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, os, subprocess, sys, time
          def git(*a):return subprocess.check_output(["git",*a]).decode("utf-8").strip()
          def run(*a):subprocess.run(list(a),check=True)
          def clean():assert not git("status","--porcelain=v1","--untracked-files=all")
          trigger=os.environ["GITHUB_SHA"]
          branch="refs/heads/dev/stable-tool-refresh"
          frozen=os.environ["FROZEN"]
          assert os.environ["GITHUB_REF"]==branch and git("rev-parse","HEAD")==trigger
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def ref(name):
              value,actual=git(*cfg,"ls-remote","origin",name).split("\t")
              assert name==actual
              return value
          assert ref(branch)==trigger and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          base="c6f33e9ddf856bc66840c3efae013da4051a9913"
          run("git","checkout","--detach",base);clean()
          env=os.environ.copy();env["GITHUB_RUN_ID"]="45643199639"
          subprocess.run([sys.executable,"-B","tests/stage_stable_batch.py"],env=env,check=True)
          original=git("rev-parse","HEAD");clean()
          assert git("rev-parse","HEAD^")==base
          assert git("rev-parse","HEAD^{tree}")=="a5716887b9d4f3a87896b0345d9411eb87816242"
          print("EXACT_PRIOR_PACKAGING_TREE=PASS "+original,flush=True)
          assert not git("diff","--name-only",base,original,"--","tool/automation","tool/node",".gitattributes","codex.exe","codex-path")
          run("git","checkout","--detach",trigger)
          run("git","-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","cherry-pick",original)
          head=git("rev-parse","HEAD");clean()
          assert git("diff","--name-only",original,head)==".github/workflows/refresh-native-stable.yml"
          run(sys.executable,"-B","tool/package-release.py","--check")
          run("git","lfs","fsck")
          assert ref(branch)==trigger
          for delay in (0,10,30):
              if delay:time.sleep(delay)
              result=subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch])
              if ref(branch)==head:break
              assert ref(branch)==trigger
          assert ref(branch)==head and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          run("git",*cfg,"fetch","--no-tags","origin",branch)
          assert git("rev-parse","FETCH_HEAD")==head
          assert git("rev-parse","FETCH_HEAD^{tree}")==git("rev-parse","HEAD^{tree}")
          print("PACKAGING_REMOTE_COMMIT="+head,flush=True)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:
              f.write("PACKAGING_HEAD="+head+"\nORIGINAL_PACKAGING="+original+"\n")
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Independent packaging delivery failed' }
      - name: Reconstruct prior browser bytes only, no repeat native suite
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os, subprocess, sys
          from pathlib import Path
          def git(*a):return subprocess.check_output(["git",*a]).decode("utf-8").strip()
          assert git("rev-parse","HEAD")==os.environ["PACKAGING_HEAD"]
          subprocess.run(["git","checkout","--detach",os.environ["ORIGINAL_PACKAGING"]],check=True)
          path=Path("tests/stage_browser_stable.py")
          source=path.read_text(encoding="utf-8")
          def cut(a,b):
              global source
              assert source.count(a)==1
              i=source.index(a);j=source.index(b,i+len(a))
              source=source[:i]+source[j:]
          # These are only previously completed native execution checks.
          # Keep npm signatures, archive SHA/generation, exact extraction,
          # manifests, installation integrity and scoped Git staging intact.
          cut("        # Prove the corrected native fixture","        new_node,dep_manifest=stage_node")
          cut("        work=own/","        new_chrome,manifest=stage_chrome")
          cut("        output=run([NODE,ROOT/","        versions=old_versions")
          cut('            run([NODE,"--test","tests/test_automation.js"]','            expected=set(old_deps)')
          source=source.replace("BROWSER_STABLE_STAGE_PASS=","BROWSER_BYTES_RECONSTRUCTED_LOCAL=")
          previous=os.environ["GITHUB_RUN_ID"]
          try:
              # Preserve historical validation note, not a claim of new tests.
              os.environ["GITHUB_RUN_ID"]="45643199639"
              exec(compile(source,str(path),"exec"),{"__name__":"__main__","__file__":str(path)})
          finally:os.environ["GITHUB_RUN_ID"]=previous
          original=git("rev-parse","HEAD")
          assert git("rev-parse","HEAD^")==os.environ["ORIGINAL_PACKAGING"]
          assert git("rev-parse","HEAD^{tree}")=="4381bd0c2343b5855cb522aa4797a44db4417f27","prior exact browser tree not reproduced"
          assert not git("status","--porcelain=v1","--untracked-files=all")
          print("EXACT_PRIOR_BROWSER_TREE=PASS "+original,flush=True)
          subprocess.run(["git","checkout","--detach",os.environ["PACKAGING_HEAD"]],check=True)
          subprocess.run(["git","-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","cherry-pick",original],check=True)
          head=git("rev-parse","HEAD")
          assert git("diff","--name-only",original,head)==".github/workflows/refresh-native-stable.yml"
          subprocess.run(["git","lfs","fsck"],check=True)
          subprocess.run([sys.executable,"-B","tool/package-release.py","--check"],check=True)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:f.write("BROWSER_CANDIDATE="+head+"\n")
          print("EXACT_BROWSER_DELIVERY_CANDIDATE="+head,flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Browser reconstruction did not prove the prior tree; packaging retained' }
      - name: Audit remote objects in empty storage and transfer only unresolved OIDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, hashlib, json, os, re, subprocess, sys, tempfile, time
          from pathlib import Path
          for s in (sys.stdout,sys.stderr):s.reconfigure(encoding="utf-8",errors="backslashreplace")
          head=os.environ["BROWSER_CANDIDATE"];pack=os.environ["PACKAGING_HEAD"]
          branch="refs/heads/dev/stable-tool-refresh";frozen=os.environ["FROZEN"]
          assert os.environ["GITHUB_REF"]==branch
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth,"-c","lfs.transfer.batchSize=8","-c","lfs.concurrenttransfers=2"]
          def git(*a):return subprocess.check_output(["git",*a])
          def ref(name):
              value,actual=git(*cfg,"ls-remote","origin",name).decode().strip().split("\t")
              assert actual==name
              return value
          def frozen_refs():assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          def net(label,*args):
              try:
                  p=subprocess.run(["git",*cfg,*args],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=360)
              except subprocess.TimeoutExpired:
                  print(label+" TIMEOUT",flush=True);return False
              msg=p.stdout.decode("utf-8","replace")
              # Do not print signed download URLs, authentication or response bodies.
              for line in msg.splitlines():
                  if re.search(r"HTTP (?:4|5)\d\d|error confirming object|error getting verify links|object does not exist|not found|Uploading LFS objects|Fetching",line,re.I):
                      print(re.sub(r"https?://\S+","[endpoint]",line).replace(auth,"***")[:400],flush=True)
              print(label+" EXIT="+str(p.returncode),flush=True)
              return p.returncode==0
          assert git("rev-parse","HEAD").decode().strip()==head and ref(branch)==pack
          frozen_refs()
          m=json.loads(Path("tool/automation/browser-manifest.json").read_bytes())
          old=json.loads(git("show",pack+":tool/automation/browser-manifest.json"))
          old_oids={v["sha256"] for v in old["files"].values()}
          assert m["fileCount"]==305 and m["uncompressedBytes"]==470523246
          objects={}
          for path,item in m["files"].items():
              oid,size=item["sha256"],item["size"]
              assert re.fullmatch("[a-f0-9]{64}",oid) and path.startswith("tool/automation/browsers/chromium-1727472/")
              assert git("cat-file","blob",head+":"+path)==("version https://git-lfs.github.com/spec/v1\noid sha256:"+oid+"\nsize "+str(size)+"\n").encode(),path
              file=Path(path)
              with file.open("rb") as f:assert file.stat().st_size==size and hashlib.file_digest(f,"sha256").hexdigest()==oid,path
              assert oid not in objects or objects[oid][1]==size
              objects[oid]=(path,size)
          print("LFS_CANDIDATE_INVENTORY="+str(len(objects))+" unique; new_vs_old="+str(len(set(objects)-old_oids)),flush=True)
          with tempfile.TemporaryDirectory(prefix="lfs-remote-audit-",dir=os.environ["RUNNER_TEMP"]) as temp:
              store=Path(temp);assert not list(store.iterdir())
              def good(oid):
                  path=store/"objects"/oid[:2]/oid[2:4]/oid
                  if not path.is_file() or path.stat().st_size!=objects[oid][1]:return False
                  with path.open("rb") as f:return hashlib.file_digest(f,"sha256").hexdigest()==oid
              def fetch(oids):
                  if not oids:return
                  paths=",".join(objects[o][0] for o in oids)
                  net("LFS_DOWNLOAD_"+str(len(oids)),"-c","lfs.storage="+str(store),"lfs","fetch","--include="+paths,"--exclude=","origin",head)
              def missing(oids):return [o for o in oids if not good(o)]
              # Start with new objects; old shared OIDs are checked too before push.
              new=sorted(set(objects)-old_oids)
              old_shared=sorted(set(objects)&old_oids)
              for group in (new,old_shared):
                  for i in range(0,len(group),16):fetch(group[i:i+16])
              unresolved=missing(list(objects))
              print("REMOTE_INITIAL_UNRETRIEVED="+str(len(unresolved)),flush=True)
              for oid in unresolved:
                  print("OID_READBACK_RETRY "+oid+" "+str(objects[oid]),flush=True)
                  fetch([oid])
              unresolved=missing(list(objects))
              for oid in unresolved:
                  print("REMOTE_UNRETRIEVED_OID "+oid+" "+str(objects[oid]),flush=True)
              # If the service broadly fails, stop instead of re-uploading a batch.
              assert len(unresolved)<=4,"multiple remote objects unavailable; retain old browser without batch reupload"
              for oid in unresolved:
                  for n in range(2):
                      if good(oid):break
                      print("TARGETED_LFS_UPLOAD "+oid+" "+str(objects[oid]),flush=True)
                      net("LFS_UPLOAD_"+oid,"lfs","push","--object-id","origin",oid)
                      fetch([oid])
                      if not good(oid) and n==0:time.sleep(15)
              unresolved=missing(list(objects))
              for oid in unresolved:print("RETAINED_UNRETRIEVED_OID "+oid+" "+str(objects[oid]),flush=True)
              assert not unresolved,"specific LFS objects still cannot be downloaded and verified"
              print("REMOTE_LFS_FRESH_DOWNLOAD=PASS files=305 unique_objects="+str(len(objects))+" bytes="+str(sum(v[1] for v in objects.values())),flush=True)
              # This is the normal push with the normal LFS hook, not an
              # unchecked pointer-only ref update. Recheck frozen refs first.
              frozen_refs();assert ref(branch)==pack
              for delay in (0,15,30):
                  if delay:time.sleep(delay)
                  net("NORMAL_GIT_PUSH","push","origin","HEAD:"+branch)
                  if ref(branch)==head:break
                  assert ref(branch)==pack
              assert ref(branch)==head,"normal push still failed after all objects were read back"
              assert net("REMOTE_GIT_FETCH","fetch","--no-tags","origin",branch)
              assert git("rev-parse","FETCH_HEAD").decode().strip()==head
              assert git("rev-parse","FETCH_HEAD^{tree}")==git("rev-parse","HEAD^{tree}")
              frozen_refs()
              print("BROWSER_REMOTE_COMMIT="+head,flush=True)
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:f.write("BROWSER_REMOTE_HEAD="+head+"\n")
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Targeted remote recovery incomplete; inspect exact OID output; independent packaging already delivered' }
      - name: Record verified independent result and retire this one-time trigger
        if: always() && env.PACKAGING_HEAD != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";frozen=os.environ["FROZEN"]
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def git(*a):return subprocess.check_output(["git",*a]).decode("utf-8").strip()
          def ref(name):
              value,actual=git(*cfg,"ls-remote","origin",name).split("\t")
              assert actual==name
              return value
          pack=os.environ["PACKAGING_HEAD"];browser=os.environ.get("BROWSER_REMOTE_HEAD")
          head=ref(branch)
          assert head==(browser or pack),"unexpected remote state; do not rewrite it"
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          git("checkout","--detach",head)
          assert not git("status","--porcelain=v1","--untracked-files=all")
          note=("\n## Stable payload delivery closeout\n\n"
                "AC 45643199639 passed all native gates but LFS returned 502. AC 45650347051 reproduced exact prior trees "
                "a5716887b9d4f3a87896b0345d9411eb87816242 and 4381bd0c2343b5855cb522aa4797a44db4417f27; "
                "the final LFS upload reported 78/79 and error confirming object. Packaging 26.4 independently landed at "+pack+". "
                +("Browser/MCP exact prior payload landed at "+browser+" after all 305 browser paths were downloaded from remote LFS into empty storage and checked against the manifest. "
                  if browser else "Browser/MCP stable candidate retained locally only; current legacy browser stays unchanged. See exact reconstruction/remote OID or push failure in recovery job. ")
                +"No repeat full native suite, no main/tag/Release change; actual accounts, devices, SSH and optional rendering remain untested. "
                "Recovery: https://github.com/rileyaaa/Portable/actions/runs/"+os.environ["GITHUB_RUN_ID"]+"\n")
          path=Path("DEVELOPMENT.md");path.write_bytes(path.read_bytes()+note.encode())
          workflow=".github/workflows/refresh-native-stable.yml"
          git("rm","--",workflow);git("add","--","DEVELOPMENT.md")
          assert set(git("diff","--cached","--name-only").splitlines())=={workflow,"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record verified independent delivery and remove one-time recovery workflow")
          final=git("rev-parse","HEAD");assert ref(branch)==head
          subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("FINAL_DEV_COMMIT="+final+" packaging="+pack+" browser="+(browser or "RETAINED"),flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Cleanup or remote closeout readback failed; preserve actual remote state' }
