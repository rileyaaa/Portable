name: Recover previously validated stable payload and LFS delivery (one time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/refresh-native-stable.yml]
permissions: {}
concurrency:
  group: stable-tool-refresh-pair
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.event.before == 'c6f33e9ddf856bc66840c3efae013da4051a9913' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: c6f33e9ddf856bc66840c3efae013da4051a9913
      TARGET_BRANCH: dev/stable-tool-refresh
    steps:
      - name: Preserve tracked bytes and isolate CI module cache
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git configuration failed' }
          $dir = Join-Path $env:RUNNER_TEMP ('http-refresh-pscache-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $dir
          ('PSModuleAnalysisCachePath=' + (Join-Path $dir 'ModuleAnalysisCache')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Confirm source candidate, frozen references and clean checkout
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -cne $env:BASE) { throw 'Wrong checkout or parent' }
          $changed = @(git diff --name-only $env:BASE HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/refresh-native-stable.yml') { throw 'Unexpected trigger changes' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved' }
          }
          $fixed = @(git diff --name-only de0c8411cd7fbe999d2113ea20542756351ccb3a HEAD -- env.ps1 run-codex.ps1 codex.exe codex-code-mode-host.exe codex-path tool/runtime-manifest.json tool/python tool/python-packages.in.txt tool/python-packages.lock.txt tool/node tool/automation/playwright tool/automation/browsers tool/automation/versions.json tool/automation/dependency-manifest.json tool/automation/browser-manifest.json Version_History)
          if ($LASTEXITCODE -ne 0 -or $fixed.Count -ne 0) { throw 'Unexpected fixed runtime change' }
          git lfs install --local
          if ($LASTEXITCODE) { throw 'LFS hooks unavailable' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS verification failed' }
      - name: Restore original validation source and rebuild pinned official payloads
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout --detach $env:BASE
          if ($LASTEXITCODE) { throw 'Original checkout failed' }
          $run = $env:GITHUB_RUN_ID
          try {
            # Preserve the exact historical validation links in rebuilt docs.
            $env:GITHUB_RUN_ID = '45643199639'
            & .\tool\python\python.exe -B tests/stage_stable_batch.py
            if ($LASTEXITCODE -or (git rev-parse 'HEAD^').Trim() -cne $env:BASE) { throw 'Packaging reconstruction failed' }
            $a = (git rev-parse HEAD).Trim()
            & .\tool\python\python.exe -B tests/stage_browser_stable.py
            if ($LASTEXITCODE -or (git rev-parse 'HEAD^').Trim() -cne $a) { throw 'Browser reconstruction failed' }
          } finally { $env:GITHUB_RUN_ID = $run }
          ('REBUILT_PACKAGING=' + $a) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          ('REBUILT_BROWSER=' + (git rev-parse HEAD).Trim()) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prove original tested Git tree or require full native fallback
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os,subprocess,hashlib,re
          from datetime import datetime
          def git(*a):return subprocess.check_output(["git",*a])
          def identity(current,expected,parent,stamp):
              header,message=git("cat-file","commit",current).split(b"\n\n",1)
              assert header.count(b"\nparent ")==1 and b"\ngpgsig " not in header
              lines=re.sub(rb"(?m)^parent [0-9a-f]{40}$",b"parent "+parent.encode(),header).split(b"\n")
              ids={}
              for i,line in enumerate(lines):
                  m=re.fullmatch(rb"(author|committer) (.+) ([0-9]+) ([+-][0-9]{4})",line)
                  if m:ids[m[1]]=(i,m[1]+b" "+m[2],m[4])
              ia,a,az=ids[b"author"];ic,c,cz=ids[b"committer"]
              t0=int(datetime.fromisoformat(stamp.replace("Z","+00:00")).timestamp())
              for t in range(t0-180,t0+11):
                  for d in (0,-1,1,-2,2,-3,3):
                      lines[ia]=a+b" "+str(t+d).encode()+b" "+az
                      lines[ic]=c+b" "+str(t).encode()+b" "+cz
                      raw=b"\n".join(lines)+b"\n\n"+message
                      if hashlib.sha1(b"commit "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==expected:
                          print("EXACT_PRIOR_COMMIT_IDENTITY="+expected+" tree="+git("rev-parse",current+"^{tree}").decode().strip(),flush=True)
                          return True
              print("PRIOR_IDENTITY_NOT_REPRODUCED="+expected,flush=True)
              return False
          a="87cf53424025fd450c066c17dc82afdc74cec20c"
          b="7465a542aa7b20928463f5b1f48cbc989172f653"
          pa=identity(os.environ["REBUILT_PACKAGING"],a,os.environ["BASE"],"2026-11-25T15:18:35Z")
          pb=identity(os.environ["REBUILT_BROWSER"],b,a,"2026-11-25T15:25:15Z")
          result=str(pa and pb).lower()
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:f.write("EXACT_PRIOR_TREE="+result+"\n")
          print("EXACT_PRIOR_TREE="+result,flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Identity proof failed' }
      - name: Full existing Python and Node regression suite on actual staged or retained payload
        if: env.EXACT_PRIOR_TREE != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Full Python regression failed' }
          foreach ($test in @('test_portable_npm.js','test_automation.js')) {
            & .\tool\node\node.exe --test (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Node regression failed: $test" }
          }
      - name: Existing Windows PowerShell path isolation and setup regressions
        if: env.EXACT_PRIOR_TREE != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_python_setup.ps1','test_portable_paths.ps1','test_launcher_smoke.ps1','test_runtime_preflight.ps1','test_npm_entrypoints.ps1','test_automation_paths.ps1','test_automation_process.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Windows regression failed: $test" }
          }
      - name: Actual common-mode and relocated tools with read-only browser discovery
        if: env.EXACT_PRIOR_TREE != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('normal','unknown','browser-check')) {
            & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py $mode
            if ($LASTEXITCODE) { throw "Native common-mode probe failed: $mode" }
          }
      - name: Complete native document gate when prior identity cannot be established
        if: env.EXACT_PRIOR_TREE != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py documents
          if ($LASTEXITCODE) { throw 'Native Office/PDF failed' }
          Write-Output 'REBUILT_FULL_NATIVE_GATES=PASS'
      - name: Customer integrity and exact payload transplant onto current dev
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:REBUILT_BROWSER) { throw 'Unexpected rebuilt HEAD' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS fsck failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer integrity failed' }
          git checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE) { throw 'Trigger checkout failed' }
          foreach ($commit in @($env:REBUILT_PACKAGING,$env:REBUILT_BROWSER)) {
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' cherry-pick $commit
            if ($LASTEXITCODE) { throw 'Candidate transplant failed' }
          }
          $changed = @(git diff --name-only --no-renames $env:REBUILT_BROWSER HEAD)
          if ($LASTEXITCODE -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/refresh-native-stable.yml') { throw 'Recovered payload tree differs' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'Transplanted LFS check failed' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty checkout' }
          Write-Output ('DELIVERY_CANDIDATE=' + (git rev-parse HEAD).Trim())
      - name: Normal LFS pre-upload, normal dev push and independent fresh LFS download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/dev/stable-tool-refresh') { throw 'Wrong branch' }
          $current = (git rev-parse HEAD).Trim()
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          $cfg = @('-c',"http.https://github.com/.extraheader=AUTHORIZATION: basic $auth",'-c','lfs.transfer.batchSize=12','-c','lfs.concurrenttransfers=3')
          function Invoke-Transfer([string[]]$gitArgs) {
            foreach ($delay in @(0,10,30,60)) {
              if ($delay) { Start-Sleep -Seconds $delay }
              $ErrorActionPreference = 'Continue'
              $out = @(& git @cfg @gitArgs 2>&1)
              $rc = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              $out | ForEach-Object { Write-Output $_.ToString() }
              if ($rc -eq 0) { return }
              if (($out | Out-String) -notmatch '\b(429|502|503|504)\b|timed out|connection reset|temporarily unavailable|unexpected EOF') { throw 'Non-transient transfer failure' }
              Write-Output 'Transient Git/LFS failure; bounded retry'
            }
            throw 'Git/LFS retry budget exhausted'
          }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Ref moved' }
          }
          git merge-base --is-ancestor $env:GITHUB_SHA HEAD
          if ($LASTEXITCODE) { throw 'Non-fast-forward candidate' }
          try {
            Invoke-Transfer @('lfs','push','origin','HEAD')
            Write-Output 'LFS_PREUPLOAD=PASS'
            Invoke-Transfer @('push','origin',"HEAD:refs/heads/$env:TARGET_BRANCH")
            $remote = (git ls-remote origin "refs/heads/$env:TARGET_BRANCH") -join ''
            if ($LASTEXITCODE -or $remote -cne ($current + [char]9 + "refs/heads/$env:TARGET_BRANCH")) { throw 'Remote dev readback mismatch' }
            Write-Output "REMOTE_DEV_COMMIT=$current"
            Invoke-Transfer @('fetch','origin',"refs/heads/$env:TARGET_BRANCH")
            if ((git rev-parse FETCH_HEAD).Trim() -cne $current) { throw 'Fetched remote commit mismatch' }
            $env:READBACK = Join-Path $env:RUNNER_TEMP ('lfs-readback-' + [Guid]::NewGuid().ToString('N'))
            $null = New-Item -ItemType Directory -Path $env:READBACK
            Invoke-Transfer @('-c',"lfs.storage=$env:READBACK",'lfs','fetch','--refetch','--include=tool/automation/browsers/chromium-1727472/**','--exclude=','origin',$current)
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.loads(Path("tool/automation/browser-manifest.json").read_bytes())
          assert m["fileCount"]==305 and m["uncompressedBytes"]==470523246
          objects={}
          for path,v in m["files"].items():
              oid,size=v["sha256"],v["size"]
              pointer=subprocess.check_output(["git","cat-file","blob","HEAD:"+path])
              assert pointer==("version https://git-lfs.github.com/spec/v1\noid sha256:"+oid+"\nsize "+str(size)+"\n").encode(),path
              p=Path(os.environ["READBACK"])/"objects"/oid[:2]/oid[2:4]/oid
              assert p.is_file() and p.stat().st_size==size,oid
              with p.open("rb") as f:assert hashlib.file_digest(f,"sha256").hexdigest()==oid,oid
              objects[oid]=size
          print("REMOTE_LFS_FRESH_DOWNLOAD=PASS files=305 unique_objects="+str(len(objects))+" bytes="+str(sum(objects.values())),flush=True)
          '@ | & .\tool\python\python.exe -B -
            if ($LASTEXITCODE) { throw 'Remote LFS object integrity failed' }
            foreach ($ref in @('refs/heads/main','refs/tags/v0.172.0-portable.1')) {
              $remote = (git ls-remote origin $ref) -join ''
              if ($LASTEXITCODE -or $remote -cne ($env:FROZEN + [char]9 + $ref)) { throw 'Frozen ref changed' }
            }
            Write-Output "VALIDATED_DEV_COMMIT=$current"
            Write-Output 'RECOVERY_READBACK_PASS; no Release, main/tag change or Artifact'
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
          }
