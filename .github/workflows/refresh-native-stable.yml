name: Verified release-source wheel and scalar-yield native acceptance (one time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/refresh-native-stable.yml]
permissions: {}
concurrency:
  group: stable-tool-refresh-pair
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.event.before == '0f872d25cf22779081dc2c4bf62bb7eda0fffac7' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 0f872d25cf22779081dc2c4bf62bb7eda0fffac7
      TARGET_BRANCH: dev/stable-tool-refresh
    steps:
      - name: Preserve tracked bytes and isolate CI module cache
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git configuration failed' }
          $dir = Join-Path $env:RUNNER_TEMP ('http-refresh-pscache-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $dir
          ('PSModuleAnalysisCachePath=' + (Join-Path $dir 'ModuleAnalysisCache')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Confirm source candidate, frozen references and clean checkout
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -cne $env:BASE) { throw 'Wrong checkout or parent' }
          $changed = @(git diff --name-only $env:BASE HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/refresh-native-stable.yml') { throw 'Unexpected trigger changes' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved' }
          }
          $fixed = @(git diff --name-only de0c8411cd7fbe999d2113ea20542756351ccb3a HEAD -- env.ps1 run-codex.ps1 codex.exe codex-code-mode-host.exe codex-path tool/runtime-manifest.json tool/python tool/python-packages.in.txt tool/python-packages.lock.txt tool/node tool/automation/playwright tool/automation/browsers tool/automation/versions.json tool/automation/dependency-manifest.json tool/automation/browser-manifest.json Version_History)
          if ($LASTEXITCODE -ne 0 -or $fixed.Count -ne 0) { throw 'Unexpected fixed runtime change' }
          git lfs install --local
          if ($LASTEXITCODE) { throw 'LFS hooks unavailable' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS verification failed' }
      - name: Exact source and targeted PDF and staging regressions before any payload changes
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ast, subprocess
          from pathlib import Path
          fixed="de0c8411cd7fbe999d2113ea20542756351ccb3a"
          changed=set(subprocess.check_output(["git","diff","--name-only","--no-renames","-z",fixed,"HEAD"]).decode("utf-8").split("\0"))-{""}
          expected=set([".github/workflows/refresh-native-stable.yml",".github/workflows/refresh-stable-pair.yml","DEVELOPMENT.md","home/skills/pdf-library/scripts/pdf_library.py","tests/check_codex_browser_mcp.py","tests/check_codex_tool_discovery.py","tests/check_packaging_stable_refresh.py","tests/stage_browser_stable.py","tests/stage_office_data_stable_refresh.py","tests/stage_stable_batch.py","tests/test_native_fixture_continuation.py","tests/test_pdf_library_database.py"])
          assert changed==expected,(changed^expected)
          for p in sorted(p for p in expected if p.endswith('.py')):
              ast.parse(Path(p).read_text(encoding="utf-8"),filename=p)
          print("SOURCE_SCOPE_AND_AST=PASS")
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Source scope or syntax failed' }
          & .\tool\node\node.exe --check tests/check_browser_stable_pair.js
          if ($LASTEXITCODE) { throw 'Browser pair probe syntax failed' }
          foreach ($test in @('test_native_fixture_continuation.py','test_pdf_library_database.py','test_pdf_library.py','test_browser_stage_metadata.py')) {
            & .\tool\python\python.exe -B -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE) { throw "Targeted source regression failed: $test" }
          }
          & .\tool\node\node.exe --test tests/test_automation.js
          if ($LASTEXITCODE) { throw 'Legacy MCP policy regression failed' }
          Write-Output 'PDF_EXPORT_AND_NATIVE_CONTINUATION_SOURCE=PASS'
      - name: Independent packaging candidate, retain old payload if exact stage rejects
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/stage_stable_batch.py
          if ($LASTEXITCODE) { throw 'Independent wheel rollback or integrity failed' }
          $current = (git rev-parse HEAD).Trim()
          $count = [int](git rev-list --count "$env:GITHUB_SHA..HEAD")
          if ($LASTEXITCODE -ne 0 -or $count -gt 1) { throw 'Unexpected wheel commit count' }
          if ($count -eq 1) {
            ('PACKAGING_PREVALIDATED_HEAD=' + $current) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } elseif ($current -cne $env:GITHUB_SHA) { throw 'Unexpected wheel HEAD' }
      - name: Targeted stable browser retry, independently restore only a rejected browser candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os, subprocess, sys
          from pathlib import Path
          for stream in (sys.stdout,sys.stderr):stream.reconfigure(encoding="utf-8",errors="backslashreplace")
          def git(*args):return subprocess.check_output(["git",*args])
          assert not git("status","--porcelain=v1","--untracked-files=all")
          before=git("rev-parse","HEAD").decode().strip()
          # Print raw child logs, retain a failed browser group only if its
          # candidate rollback is exact. The Python groups are independent.
          p=subprocess.Popen([sys.executable,"-B","tests/stage_browser_stable.py"],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          legacy=False
          for line in iter(p.stdout.readline,b""):
              msg=line.decode("utf-8","backslashreplace").rstrip("\r\n")
              print(msg,flush=True)
              legacy |= msg == "LEGACY_NATIVE_YOLO_CELL_WAIT=PASS"
          rc=p.wait()
          after=git("rev-parse","HEAD").decode().strip()
          assert not git("status","--porcelain=v1","--untracked-files=all"),"browser group left a dirty checkout"
          if rc:
              assert after==before,"browser failure changed candidate HEAD"
              if legacy:
                  with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:
                      f.write("LEGACY_BROWSER_PREVALIDATED_HEAD="+after+"\n")
              print("GROUP_RETAINED=browser (actual first failure above)",flush=True)
          else:
              assert after!=before and git("rev-parse","HEAD^").decode().strip()==before
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:
                  f.write("BROWSER_PREVALIDATED_HEAD="+after+"\n")
              print("GROUP_STAGE_PASS=browser",flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Browser group integrity or rollback failed; do not push' }
      - name: Full existing Python and Node regression suite on actual staged or retained payload
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Full Python regression failed' }
          foreach ($test in @('test_portable_npm.js','test_automation.js')) {
            & .\tool\node\node.exe --test (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Node regression failed: $test" }
          }
      - name: Existing Windows PowerShell path isolation and setup regressions
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_python_setup.ps1','test_portable_paths.ps1','test_launcher_smoke.ps1','test_runtime_preflight.ps1','test_npm_entrypoints.ps1','test_automation_paths.ps1','test_automation_process.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Windows regression failed: $test" }
          }
      - name: Actual common-mode and relocated tools with read-only browser discovery
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('normal','unknown','browser-check')) {
            & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py $mode
            if ($LASTEXITCODE) { throw "Native common-mode probe failed: $mode" }
          }
      - name: Exact browser gate coverage and actual normal-mode Office PDF
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BROWSER_PREVALIDATED_HEAD) {
            if ((git rev-parse HEAD).Trim() -cne $env:BROWSER_PREVALIDATED_HEAD) { throw 'Browser-tested candidate changed' }
            Write-Output 'NATIVE_BROWSER_GATES_ALREADY_PASSED_ON_EXACT_CANDIDATE'
          } else {
            $expected = $env:GITHUB_SHA
            if ($env:PACKAGING_PREVALIDATED_HEAD) { $expected = $env:PACKAGING_PREVALIDATED_HEAD }
            if ((git rev-parse HEAD).Trim() -cne $expected) { throw 'Rejected browser changed candidate HEAD' }
            $changed = @(git diff --name-only de0c8411cd7fbe999d2113ea20542756351ccb3a HEAD -- tool/automation/playwright tool/automation/browsers tool/automation/versions.json tool/automation/dependency-manifest.json tool/automation/browser-manifest.json tool/node env.ps1 run-codex.ps1 codex.exe codex-path tool/runtime-manifest.json Version_History)
            if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 0) { throw 'Unexpected retained browser or frozen runtime difference' }
            Write-Output 'BROWSER_PAYLOAD_RETAINED_EXACT_PREVIOUS_NATIVE_TREE'
            # The prior run already verified the unchanged retained MCP bridge.
            # With a new Python wheel, however, exercise both real MCP consumers.
            if ($env:PACKAGING_PREVALIDATED_HEAD) {
              & .\tool\python\python.exe -B tests/check_browser_mcp_stdio.py
              if ($LASTEXITCODE) { throw 'Retained actual MCP stdio compatibility failed' }
              & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
              if ($LASTEXITCODE) { throw 'Retained actual Codex MCP failed' }
              Write-Output 'RETAINED_BROWSER_NATIVE_MCP_POLICY=PASS'
            }
          }
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py documents
          if ($LASTEXITCODE) { throw 'Native Office/PDF probe failed' }
          Write-Output 'PDF_SOURCE_WINDOWS_NATIVE_VALIDATION=PASS'
          # Keep the independent PDF/native evidence even if the retained YOLO fixture fails.
          # The final integrity and acceptance step still requires the exact legacy/new native proof.
      - name: Final LFS and customer input integrity, no archive or artifact
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.\Microsoft\Windows\PowerShell\ModuleAnalysisCache') { throw 'Unexpected checkout PowerShell module cache after native tests' }
          $dirty = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Candidate worktree became dirty during native regression' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS gate failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input integrity failed' }
          Write-Output 'CUSTOMER_INPUT_AND_INDEPENDENT_NATIVE_GATES=PASS'
          if ($env:BROWSER_PREVALIDATED_HEAD) { Write-Output 'STABLE_BROWSER_FULL_NATIVE_VALIDATION=PASS' }
          elseif ($env:LEGACY_BROWSER_PREVALIDATED_HEAD) { Write-Output 'PDF_AND_LEGACY_MCP_SOURCE_VALIDATION=PASS; browser retained' }
          else { throw 'Corrected retained native YOLO fixture still did not pass; no payload push. See the actual first failure, independent gates logged above.' }
          Write-Output 'Real Windows processes with synthetic model/inputs; no real account, devices, optional renderers or formula calculation tested.'
      - name: Push only validated fast-forward development commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne "refs/heads/$env:TARGET_BRANCH" -or $env:TARGET_BRANCH -cne 'dev/stable-tool-refresh') { throw 'Wrong target branch' }
          $current = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $env:GITHUB_SHA HEAD
          if ($LASTEXITCODE) { throw 'Candidate not descended from exact trigger' }
          $count = [int](git rev-list --count "$env:GITHUB_SHA..HEAD")
          if ($LASTEXITCODE -ne 0 -or $count -gt 2) { throw 'Unexpected local commit count' }
          if ($count -eq 0) { Write-Output 'NO_PAYLOAD_CANDIDATE_PUSHED; corrected legacy fixture and PDF source gates passed'; return }
          $expected = $env:PACKAGING_PREVALIDATED_HEAD
          if ($env:BROWSER_PREVALIDATED_HEAD) { $expected = $env:BROWSER_PREVALIDATED_HEAD }
          if (-not $expected -or $current -cne $expected) { throw 'Unvalidated payload candidate' }
          if (-not $env:BROWSER_PREVALIDATED_HEAD -and $env:LEGACY_BROWSER_PREVALIDATED_HEAD -cne $current) { throw 'Legacy native proof is not from exact wheel candidate' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved before push' }
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          try {
            # Git LFS pre-push hook transfers only committed payload objects; no Release or Actions artifact.
            & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
            if ($LASTEXITCODE) { throw 'Validated development-only push failed' }
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
          }
          $after = (git ls-remote origin "refs/heads/$env:TARGET_BRANCH") -join ''
          if ($LASTEXITCODE -ne 0 -or $after -cne ($current + [char]9 + "refs/heads/$env:TARGET_BRANCH")) { throw 'Development push readback mismatch' }
          foreach ($ref in @('refs/heads/main','refs/tags/v0.172.0-portable.1')) {
            $remote = (git ls-remote origin $ref) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:FROZEN + [char]9 + $ref)) { throw 'Frozen ref changed' }
          }
          Write-Output "VALIDATED_DEV_COMMIT=$current"
          Write-Output 'NO_RELEASE_NO_ARTIFACT_NO_MAIN_CHANGE'
