name: "04 - Branch cleanup (manual purge and closed PR)"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_ALL_EXCEPT_MAIN to delete every other remote branch"
        required: true
        type: string
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: codex-portable-branch-cleanup
  cancel-in-progress: false

jobs:
  purge_non_main:
    name: Manually delete all non-main branches without touching tags or LFS
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DELETE_ALL_EXCEPT_MAIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Recheck repository, open PRs and delete only non-main refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          if [[ "$default_branch" != "main" ]]; then
            echo 'Refusing cleanup: default branch is not main.' >&2
            exit 1
          fi
          open_prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=1" --jq 'length')"
          if [[ "$open_prs" != "0" ]]; then
            echo 'Refusing bulk cleanup while an open PR exists.' >&2
            exit 1
          fi
          branches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          if [[ -z "$branches" ]]; then
            echo 'Refusing cleanup: GitHub returned no branches.' >&2
            exit 1
          fi
          deleted=0
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            [[ "$branch" == "main" ]] && continue
            encoded="$(BRANCH_NAME="$branch" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH_NAME"],safe="/"))')"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" > /dev/null
            echo "BRANCH_PURGED=$branch"
            deleted=$((deleted + 1))
          done <<< "$branches"
          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          if [[ "$remaining" != "main" ]]; then
            echo "Unexpected branches after cleanup: $remaining" >&2
            exit 1
          fi
          echo "BRANCH_CLEANUP_RESULT=PASS;deleted=$deleted;remaining=main"
          echo "BRANCH_CLEANUP_RESULT=PASS;deleted=$deleted;remaining=main;no tags/releases/LFS touched" >> "$GITHUB_STEP_SUMMARY"

  cleanup_closed_pr:
    name: Remove a same-repository PR branch when its PR closes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify exact closed PR head and remove its branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ -n "$BRANCH" && "$BRANCH" != "main" ]] || exit 0
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          if [[ "$state" != "closed" ]]; then
            echo 'PR was reopened; keeping its branch.'
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"
          query="$(BRANCH_NAME="$BRANCH" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH_NAME"],safe=""))')"
          open_uses="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=1&head=$owner%3A$query" --jq 'length')"
          if [[ "$open_uses" != "0" ]]; then
            echo 'Another open PR uses this branch; keeping it.'
            exit 0
          fi
          encoded="$(BRANCH_NAME="$BRANCH" python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["BRANCH_NAME"],safe="/"))')"
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" --jq '.object.sha' 2>&1)"; then
            if [[ "$current" == *"404"* ]]; then
              echo 'PR branch was already deleted.'
              exit 0
            fi
            echo 'Cannot verify PR branch; refusing deletion.' >&2
            exit 1
          fi
          if [[ "$current" != "$EXPECTED_HEAD_SHA" ]]; then
            echo 'PR head moved since closure; keeping the branch.'
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" > /dev/null
          echo "BRANCH_CLEANUP_RESULT=PASS;deleted=$BRANCH"
