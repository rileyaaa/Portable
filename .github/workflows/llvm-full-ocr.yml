name: Full LLVM-MinGW reduced OCR and actual link evidence
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/llvm-full-ocr.yml]
permissions: {}
concurrency:
  group: portable-llvm-full-ocr
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '893253e08d3f9c1ce7c5c8b7b30d3c93f077513c'
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: true
      - name: Build exact reduced source graph with LLVM and test new binary
        id: build
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          New-Item -ItemType Directory -Path tmp -Force | Out-Null
          $report=Join-Path $pwd 'tmp/llvm-full-ocr.json'
          [IO.File]::WriteAllText($report,(@{source_commit=$env:GITHUB_SHA;completed=$false;distribution_qualified=$false;ocr_built=$false;rows=@()} | ConvertTo-Json -Compress),(New-Object Text.UTF8Encoding($false)))
          git lfs pull --include="tool/node/node.exe" --exclude=""
          if ($LASTEXITCODE) { throw 'Pinned Node LFS unavailable' }
          $scratch=Join-Path $pwd 'tmp/llvm-full-env'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          foreach ($key in @('HOME','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP','TMPDIR')) {
            [Environment]::SetEnvironmentVariable($key,$scratch,'Process')
          }
          $env:PATH=Join-Path $env:SystemRoot 'System32'
          & .\tool\python\python.exe -I -B -c "from pathlib import Path; compile(Path('tests/check_llvm_mingw_ocr_build.py').read_bytes(),'tests/check_llvm_mingw_ocr_build.py','exec')"
          if ($LASTEXITCODE) { throw 'Probe syntax failed' }
          & .\tool\python\python.exe -I -B tests/check_llvm_mingw_ocr_build.py $report
          if ($LASTEXITCODE) { throw 'LLVM full OCR technical/link gate incomplete' }
      - name: Evidence only (never upload binary, model, reproducer or private ZIP)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llvm-full-ocr-evidence
          path: |
            tmp/llvm-full-ocr.json
            tmp/llvm-ocr-link-map.txt
            tmp/llvm-ocr-link-reading.txt
          if-no-files-found: error
          retention-days: 14
      - if: always() && steps.build.outcome != 'success'
        run: throw 'LLVM full OCR technical gate incomplete'
  record:
    needs: [windows]
    if: always() && github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '893253e08d3f9c1ce7c5c8b7b30d3c93f077513c'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 893253e08d3f9c1ce7c5c8b7b30d3c93f077513c
      WINDOWS: ${{ needs.windows.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          lfs: false
      - name: Download exact evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: llvm-full-ocr-evidence
          path: tmp/llvm-full-ocr-evidence
      - name: Preserve actual result and remove only one-time trigger
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"];run=os.environ["GITHUB_RUN_ID"]
          def git(*a):return subprocess.check_output(["git",*a])
          def rev():return git("rev-parse","HEAD").decode().strip()
          def ref(n):
              v,k=git("ls-remote","origin",n).decode().strip().split("\t");assert k==n
              return v
          workflow=".github/workflows/llvm-full-ocr.yml"
          assert rev()==ref(branch)==start and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          assert git("rev-parse","HEAD^").decode().strip()==os.environ["BASE"]
          assert {n.decode() for n in git("diff","--name-only","-z","HEAD^","HEAD").split(b"\0") if n}=={workflow,"tests/check_llvm_mingw_ocr_build.py"}
          assert not git("status","--porcelain=v1","--untracked-files=all")
          folder=Path("tmp/llvm-full-ocr-evidence");report=folder/"llvm-full-ocr.json"
          data=json.loads(report.read_bytes()) if report.is_file() else {"source_commit":start,"completed":False,"rows":[],"report_missing":True}
          assert data["source_commit"]==start and not data.get("distribution_qualified",False)
          for name,field in (("llvm-ocr-link-map.txt","map_sha256"),("llvm-ocr-link-reading.txt","reading_sha256")):
              p=folder/name
              if p.is_file():
                  got=hashlib.sha256(p.read_bytes()).hexdigest()
                  data.setdefault("artifact_readback",{})[name]={"sha256":got,"size":p.stat().st_size,"matches_report":got==data.get("actual_link",{}).get(field)}
          data.update(run_id=run,windows_job=os.environ["WINDOWS"],distribution_qualified=False,customer_candidate_built=False,
              prior_candidate_id="15085655070",prior_candidate_unchanged=True,original_index_unchanged=True)
          target=Path("tests/llvm_full_ocr_"+run+".json");assert not target.exists()
          target.write_text(json.dumps(data,ensure_ascii=True,indent=2)+"\n",encoding="utf-8")
          notes=Path("DEVELOPMENT.md")
          notes.write_bytes(notes.read_bytes()+("\n\n## Full reduced LLVM-MinGW OCR evidence\n\nRun "+run+"; "+target.as_posix()+
              ". Windows="+data["windows_job"]+"; full build="+str(data.get("ocr_built",False))+
              "; actual link evidence="+str(data.get("link_evidence_complete",False))+
              "; private product="+str(data.get("product_contract_passed",False))+
              ". No distribution clearance or customer ZIP. Prior MSVC product/map retained; original ZIP, Office and dual-window not rerun. Prior candidate unchanged.\n").encode("utf-8"))
          git("rm","--",workflow);git("add","--",str(target),"DEVELOPMENT.md")
          assert {n.decode() for n in git("diff","--cached","--name-only","-z").split(b"\0") if n}=={workflow,target.as_posix(),"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record full LLVM OCR actual evidence; remove one-time trigger")
          final=rev();assert ref(branch)==start
          subprocess.run(["git","push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("LLVM_FULL_FINAL="+final,flush=True)
          print("LLVM_FULL_RESULT="+json.dumps({k:data.get(k,False) for k in ("ocr_built","link_evidence_complete","product_contract_passed","runtime_module_sample_passed","distribution_qualified")}),flush=True)
          PY
