name: Scoped pip and certifi trust-anchor security acceptance (one time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/refresh-pip-certifi-security.yml]
permissions: {}
concurrency:
  group: stable-tool-refresh-pair
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.event.before == 'd488f12fa8997998770bb4466cb81fe7038d2834' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 829de6e9f50bd2a3b5499aa683134a30df88fbe0
      PARENT: d488f12fa8997998770bb4466cb81fe7038d2834
      TARGET_BRANCH: dev/stable-tool-refresh
    steps:
      - name: Preserve tracked bytes and CI cache isolation
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git configuration failed' }
          $dir = Join-Path $env:RUNNER_TEMP ('pip-ca-pscache-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $dir
          ('PSModuleAnalysisCachePath=' + (Join-Path $dir 'ModuleAnalysisCache')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Check exact developer scope and already accepted production tree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -cne $env:PARENT -or (git rev-parse 'HEAD^^').Trim() -cne $env:BASE) { throw 'Unexpected source history' }
          $changed = @(git diff --name-only $env:BASE HEAD)
          if ($LASTEXITCODE -or $changed.Count -ne 2 -or '.github/workflows/refresh-pip-certifi-security.yml' -cnotin $changed -or 'tests/stage_pip_certifi_security.py' -cnotin $changed) { throw 'Unexpected trigger changes' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Unexpected remote refs' }
          }
          git lfs install --local
          if ($LASTEXITCODE) { throw 'LFS hook unavailable' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'Prior accepted LFS tree verification failed' }
          & .\tool\python\python.exe -B tool/python-lock.py validate --requirements tool/python-packages.in.txt --lock tool/python-packages.lock.txt
          if ($LASTEXITCODE) { throw 'Old lock validation failed' }
          & .\tool\python\python.exe -B tool/python-lock.py validate-runtime --requirements tool/python-packages.in.txt
          if ($LASTEXITCODE) { throw 'Old runtime validation failed' }
          'SCOPE_CONFIRMED=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Official fixed wheels, old and new DER roots, isolated real CLI and installation parity
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B -c "from pathlib import Path; p=Path('tests/stage_pip_certifi_security.py'); compile(p.read_bytes(),str(p),'exec')"
          if ($LASTEXITCODE) { throw 'Stage source syntax failed' }
          & .\tool\python\python.exe -B tests/stage_pip_certifi_security.py
          if ($LASTEXITCODE) { throw 'Security wheel staging or trust proof failed' }
          & .\tool\python\python.exe -B tool/python-lock.py validate --requirements tool/python-packages.in.txt --lock tool/python-packages.lock.txt
          if ($LASTEXITCODE) { throw 'New lock validation failed' }
          & .\tool\python\python.exe -B tool/python-lock.py validate-runtime --requirements tool/python-packages.in.txt
          if ($LASTEXITCODE) { throw 'New runtime validation failed' }
      - name: Commit only two official payloads, exact pins and relevant tests locally
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import subprocess,sys
          def git(*a):return subprocess.check_output(["git",*a])
          def names(*a):return set(git(*a).decode("utf-8").split("\0"))-{""}
          site="tool/python/Lib/site-packages/"
          prefixes=tuple(site+x+"/" for x in ("pip","certifi","pip-26.1.2.dist-info","pip-26.3.dist-info","certifi-2026.5.20.dist-info","certifi-2026.11.20.dist-info"))
          exact={"tool/python-packages.in.txt","tool/python-packages.lock.txt","tests/test_pip_config_isolation.py","tests/check_pip_certifi_security.py","tests/check_codex_tool_discovery.py"}
          changed=names("diff","--no-renames","--name-only","-z")|names("ls-files","--others","--exclude-standard","-z")
          assert exact<=changed and all(p in exact or p.startswith(prefixes) for p in changed),sorted(p for p in changed if p not in exact and not p.startswith(prefixes))
          git("add","-A","--",*[p[:-1] for p in prefixes],*sorted(exact))
          assert names("diff","--cached","--no-renames","--name-only","-z")==changed
          assert not git("diff","--name-only","-z") and not names("ls-files","--others","--exclude-standard","-z")
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Refresh official pip and certifi to remove compromised CA trust anchor")
          assert not git("status","--porcelain=v1","--untracked-files=all")
          print("LOCAL_CA_SECURITY_CANDIDATE="+git("rev-parse","HEAD").decode().strip()+" changed_files="+str(len(changed)),flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Candidate scope or commit failed' }
      - name: Targeted Python dependency, CLI, setup and continuation regressions
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_python_lock.py','test_pip_config_isolation.py','test_python_runtime_dependencies.py','test_python_cli_shims.py','test_python_cli_output.py','test_mode_copies.py','test_native_fixture_continuation.py')) {
            & .\tool\python\python.exe -B -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE) { throw "Targeted Python regression failed: $test" }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_python_setup.ps1
          if ($LASTEXITCODE) { throw 'Existing Python setup contract failed' }
      - name: Actual relocated common and YOLO mode CA consumers and retained MCP
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('unknown','browser')) {
            & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py $mode
            if ($LASTEXITCODE) { throw "Native CA/pip probe failed: $mode" }
          }
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Native MCP integration failed' }
          Write-Output 'CA_SECURITY_TARGETED_NATIVE_ACCEPTANCE=PASS'
      - name: Verify unchanged production boundary and customer input integrity
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.\Microsoft\Windows\PowerShell\ModuleAnalysisCache') { throw 'Unexpected checkout PowerShell cache' }
          if (@(git status --porcelain=v1 --untracked-files=all).Count -ne 0) { throw 'Dirty candidate' }
          $fixed = @(git diff --name-only $env:BASE HEAD -- env.ps1 run-codex.ps1 Version_History tool/runtime-manifest.json codex.exe codex-path tool/automation tool/node tool/bin tool/portable-process.ps1 tool/setup-tools.ps1 tool/python/python314._pth .gitattributes .github/workflows/release.yml .github/workflows/import-round12.yml)
          if ($LASTEXITCODE -or $fixed.Count -ne 0) { throw 'Existing production boundary changed' }
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS check failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input integrity failed' }
          'CANDIDATE_READY=true' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Normal Git push and exact remote tree readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,os,subprocess
          branch="refs/heads/dev/stable-tool-refresh";trigger=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"]
          assert os.environ["GITHUB_REF"]==branch and os.environ["CANDIDATE_READY"]=="true"
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def git(*a):return subprocess.check_output(["git",*a]).decode("utf-8").strip()
          def ref(name):
              v,n=git(*cfg,"ls-remote","origin",name).split("\t")
              assert n==name
              return v
          head=git("rev-parse","HEAD")
          assert git("rev-parse","HEAD^")==trigger and ref(branch)==trigger
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==head
          subprocess.run(["git",*cfg,"fetch","--no-tags","origin",branch],check=True)
          assert git("rev-parse","FETCH_HEAD")==head and git("rev-parse","FETCH_HEAD^{tree}")==git("rev-parse","HEAD^{tree}")
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8",newline="\n") as f:f.write("CA_REMOTE_HEAD="+head+"\n")
          print("CA_SECURITY_REMOTE_COMMIT="+head,flush=True)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Normal candidate delivery failed' }
      - name: Record actual result and retire one-time files in clean worktree
        if: always() && env.SCOPE_CONFIRMED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,os,subprocess,tempfile
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";frozen=os.environ["FROZEN"]
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def git(*a,cwd=None):return subprocess.check_output(["git",*a],cwd=cwd).decode("utf-8").strip()
          def ref(name):
              value,actual=git(*cfg,"ls-remote","origin",name).split("\t")
              assert name==actual
              return value
          head=ref(branch)
          delivered=os.environ.get("CA_REMOTE_HEAD")
          assert head==(delivered or os.environ["GITHUB_SHA"]),"Unexpected remote state; do not rewrite it"
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          with tempfile.TemporaryDirectory(prefix="pip-ca-closeout-",dir=os.environ["RUNNER_TEMP"]) as d:
              work=Path(d)/"verified-dev"
              git("worktree","add","--detach",str(work),head)
              try:
                  def local(*a):return git(*a,cwd=work)
                  assert not local("status","--porcelain=v1","--untracked-files=all")
                  runurl="https://github.com/rileyaaa/Portable/actions/runs/"+os.environ["GITHUB_RUN_ID"]
                  note=("\n## 2026-11-26: targeted trust-store security closeout\n\n"
                        "GHSA-6q48-6c7w-9gw2 (https://github.com/advisories/GHSA-6q48-6c7w-9gw2): both the bundled standalone certifi 2026.5.20 and pip 26.1.2 vendor certifi 2026.2.25 contained the affected emSign ECC Root CA - G3 (DER SHA-256 86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b). "
                        +("Official pip 26.3 and certifi 2026.11.20 (pip-vendored 2026.10.23) passed fixed-wheel/source/RECORD checks, actual old/new CLI and install guard, DER trust-anchor exclusion, targeted native common/YOLO and MCP, closure and customer-input validation; delivered "+delivered+". "
                          if delivered else "Candidate not delivered; retain prior exact payload. Known trust-anchor security issue remains unresolved; do not claim security closeout. See actual first failure in the job. ")
                        +"Earlier exact browser/packaging proof and successful fresh LFS download of all 305 paths in AC 45655675826 retained. No repeat full native suite, change to environment/approval/extension policy, main/tag/Release or optional tools. Real accounts, devices, SSH, optional rendering/recalculation and OS trust-store state remain outside these tests. Recovery: "+runurl+"\n")
                  path=work/"DEVELOPMENT.md";path.write_bytes(path.read_bytes()+note.encode())
                  doc=work/"tool/\u5de5\u5177\u66f4\u65b0\u8bf4\u660e.md"
                  raw=doc.read_bytes()
                  def replace(a,b):
                      global raw
                      a=a.encode();b=b.encode()
                      assert raw.count(a)==1,repr(a[:100])
                      raw=raw.replace(a,b,1)
                  replace("\u6d4f\u89c8\u5668/MCP \u8f7d\u8377\u5c1a\u672a\u66f4\u6362\u3002","\u6d4f\u89c8\u5668/MCP \u5df2\u5728 3e7bbbb6 \u843d\u5730 Playwright 1.65.1 / Chrome Stable 158.0.8127.88\uff0cAC 45655675826 \u5b8c\u6210 LFS \u91cd\u53d6\u6821\u9a8c\u3002")
                  replace("42 \u4e2a\u76f4\u63a5\u53ca\u4f20\u9012\u4f9d\u8d56\u7248\u672c","49 \u4e2a\u76f4\u63a5\u53ca\u4f20\u9012\u4f9d\u8d56\u7248\u672c")
                  replace("\u5e76\u4fdd\u7559\u73b0\u6709 packaging 26.2","\u6062\u590d\u65f6\u4fdd\u7559 packaging 26.2\uff1b\u5f53\u524d\u5df2\u9a8c packaging 26.4")
                  replace("python -B tool/package-release.py --version v0.172.0-portable.1","python -B tool/package-release.py --version v0.172.0-portable.2")
                  replace("\u622a\u81f3 2026-11-24\uff0c\u6700\u65b0\u6b63\u5f0f Release \u4e3a \x60v0.170.0-portable.2\x60\uff082026-11-19 \u53d1\u5e03\uff09\uff0c\u65e7\u7248 \x60v0.166.0-portable.1\x60 \u4ecd\u4fdd\u7559\u3002\u4e0a\u9762\u7684 \x60.3\x60","\u622a\u81f3 2026-11-25\uff0c\u6700\u65b0\u6b63\u5f0f Release \u4e3a \x60v0.172.0-portable.1\x60\uff082026-11-25 \u53d1\u5e03\uff09\u3002\u4e0a\u9762\u7684 \x60.2\x60")
                  replace("\u4ed3\u5e93\u53ea\u7ef4\u62a4 \x60main\x60\uff0c\u4e0d\u8bbe"," \x60main\x60 \u4e3a\u6b63\u5f0f\u7ebf\uff1b\u672c\u8f6e\u4ec5\u5728\u5df2\u6388\u6743\u7684 \x60dev/stable-tool-refresh\x60 \u9a8c\u8bc1\uff0c\u4e0d\u8bbe")
                  raw+=("\n"+("Security CA refresh: pip 26.3 / certifi 2026.11.20, delivered "+delivered if delivered else "CA security candidate not delivered; old affected versions retained")+"; "+runurl+"\n").encode()
                  doc.write_bytes(raw)
                  workflow=".github/workflows/refresh-pip-certifi-security.yml";stage="tests/stage_pip_certifi_security.py"
                  local("rm","--",workflow,stage)
                  local("add","--","DEVELOPMENT.md",str(doc.relative_to(work)))
                  changes=set(local("diff","--cached","--name-only").splitlines())
                  # Git quotes non-ASCII names by default; compare with -z.
                  names=set(subprocess.check_output(["git","diff","--cached","--name-only","-z"],cwd=work).decode("utf-8").split("\0"))-{""}
                  assert names=={workflow,stage,"DEVELOPMENT.md",doc.relative_to(work).as_posix()},names
                  local("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record actual CA security outcome and retire temporary validation entry")
                  final=local("rev-parse","HEAD")
                  assert ref(branch)==head
                  subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch],cwd=work,check=True)
                  assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
                  print("FINAL_DEV_COMMIT="+final+" CA_SECURITY="+(delivered or "RETAINED_AFFECTED"),flush=True)
              finally:git("worktree","remove","--force",str(work))
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Closeout record or cleanup failed; preserve actual remote state' }
