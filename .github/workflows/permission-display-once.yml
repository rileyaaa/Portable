name: One-time permission display review
on:
  push:
    branches: [main]
    paths: [.github/workflows/permission-display-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.record.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Fresh source audit and exact production delta verification
        shell: python
        run: |
          import ast,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd()
          names=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-tree','-rz','--name-only','HEAD']).split(b'\0') if p]
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.html','.css','.toml','.rules'}
          selected=[p for p in names if not p.startswith(excluded) and pathlib.PurePosixPath(p).suffix.lower() in suffixes]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in selected)+'\n',text=True,check=True)
          baseline='b9cddb0243d5eb9410c32590892f2684bd621d8b'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',baseline],check=True)
          raw=(root/'run-codex.ps1').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='c0a3138506154c2d959ca54e3b78b30be62fb6f8'
          old=subprocess.check_output(['git','show',baseline+':run-codex.ps1']).decode('utf-8-sig')
          new=raw.decode('utf-8-sig')
          start='$WriteScopeDisplay = if ($SandboxMode -eq "danger-full-access") {'
          anchor='Write-Host "Codex Portable 严格便携模式已启动" -ForegroundColor Green'
          assert new.count(start)==1 and new.count(anchor)==1
          i=new.index(start);j=new.index(anchor,i)
          restored=new[:i]+new[j:]
          old_network=next(line for line in old.splitlines() if line.startswith('Write-Host "ShellNetwork  : '))
          old_scope=next(line for line in old.splitlines() if line.startswith('Write-Host ("写入范围'))
          current_scope=next(line for line in restored.splitlines() if line.startswith('Write-Host ("写入范围'))
          assert current_scope.endswith(' + $WriteScopeDisplay)')
          restored=restored.replace('Write-Host "ShellNetwork  : $ShellNetworkDisplay"',old_network,1).replace(current_scope,old_scope,1)
          assert restored==old,'Unexpected production logic or encoding changed'
          mode_paths=['Version_History/'+mode+'-run-codex.ps1' for mode in ('YOLO mode专用包','常用模式专用包')]
          assert all((root/p).read_bytes()==raw for p in mode_paths)
          changed={p.decode('utf-8') for p in subprocess.check_output(['git','diff','--name-only','-z',baseline,'HEAD']).split(b'\0') if p}
          expected=set(mode_paths+['run-codex.ps1','DEVELOPMENT.md','tests/test_permission_display.ps1','.github/workflows/release.yml','.github/workflows/permission-display-once.yml'])
          assert changed==expected,changed
          py=js=bats=0
          for p in selected:
              if p.endswith('.py'):ast.parse((root/p).read_text(encoding='utf-8-sig'),filename=p);py+=1
              elif p.endswith(('.js','.cjs','.mjs')):subprocess.run(['node','--check',p],capture_output=True,check=True,timeout=15);js+=1
              elif p.endswith('.bat') and '/' not in p:
                  b=(root/p).read_bytes();b.decode('ascii');assert b'\n' not in b.replace(b'\r\n',b''),p;bats+=1
          subprocess.run(['python','-B','-m','unittest','discover','-s','tests','-p','test_mode_copies.py','-v'],check=True,timeout=30)
          env=(root/'env.ps1').read_text(encoding='utf-8-sig')
          consumers=new+(root/'login-json.ps1').read_text(encoding='utf-8-sig')
          settings=re.findall(r'^\s*\$env:(CODEX_\w+)\s*=\s*"([^"]*)"',env,re.M)
          assert len(settings)==42 and all(name in consumers for name,value in settings)
          manifest=(root/'tool/runtime-manifest.json').read_bytes()
          pin=re.search(r'\$ExpectedRuntimeManifestSha256\s*=\s*"([0-9a-fA-F]{64})"',new)[1].lower()
          assert hashlib.sha256(manifest).hexdigest()==pin
          workflow=(root/'.github/workflows/release.yml').read_text()
          gate='if: $'+"{{ success() && inputs.publish_release && inputs.check_set == 'full' }}"
          assert workflow.count(gate)==2
          name='      - name: Windows PowerShell 5.1 - test_permission_display\n'
          assert workflow.count(name)==1
          section=workflow.split(name,1)[1].split('      - name:',1)[0]
          condition='if: $'+"{{ !cancelled() && steps.prepare.outcome == 'success' && inputs.check_set == 'full' }}"
          assert condition in section and 'test_permission_display.ps1' in section
          print('FRESH_REVIEW=PASS python='+str(py)+' javascript='+str(js)+' root_bat='+str(bats)+' settings='+str(len(settings))+' pinned_version='+json.loads(manifest)['version']+' production_delta=status_display_only')
      - name: Independent PowerShell parse and production regression cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($_.FullName+': '+($errors.Message -join '; '))}
            $count++
          }
          foreach($test in @('test_permission_display','test_extension_migration','test_extension_policy','test_cli_model_options')) {
            & pwsh -NoProfile -NonInteractive -File (Join-Path $PWD ('tests/'+$test+'.ps1'))
            if($LASTEXITCODE -ne 0){throw ('Independent regression failed: '+$test)}
          }
          Write-Output "FRESH_POWERSHELL=PASS parsed=$count (Windows validation remains mandatory)"
      - name: Record the independent result in the existing paragraph
        id: record
        shell: python
        run: |
          import os,pathlib,subprocess
          path=pathlib.Path('DEVELOPMENT.md');text=path.read_text(encoding='utf-8')
          old='独立复查与完整 Windows 验收作为后续补丁发布前置条件，最终结果以对应 Release 与 Actions 为准。'
          new='修复后全新检出的源码及生产函数回归再次通过，未发现新增可复现问题；完整 Windows 验收与附件回读仍为发布前置条件，最终结果以对应 Release 与 Actions 为准。'
          assert text.count(old)==1
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--','DEVELOPMENT.md'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','docs: record independent permission-status review without overstating Windows coverage'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          print('REVIEWED_SOURCE='+commit)
  dispatch:
    needs: recheck
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch full Windows gate after temporary workflow removal
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/permission-dispatch/gh
          REVIEWED_COMMIT: ${{ needs.recheck.outputs.commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,pathlib,subprocess,time
          scratch=pathlib.Path('tmp/permission-dispatch');scratch.mkdir(parents=True,exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY'];reviewed=os.environ['REVIEWED_COMMIT']
          for attempt in range(90):
              remote=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/main'],text=True))['object']['sha']
              if remote!=reviewed:
                  comparison=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/compare/'+reviewed+'...'+remote],text=True))
                  files=comparison.get('files',[])
                  assert len(files)==1 and files[0]['filename']=='.github/workflows/permission-display-once.yml' and files[0]['status']=='removed','Reviewed source changed before release'
                  releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
                  assert not any(r['tag_name']=='v2026.10.24.2' for r in releases),'Do not overwrite an existing release'
                  payload=json.dumps({'ref':'main','inputs':{'version':'v2026.10.24.2','publish_release':'true','check_set':'full'}})
                  subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True)
                  print('FULL_WINDOWS_RELEASE_DISPATCHED source='+remote+' tag=v2026.10.24.2')
                  break
              time.sleep(4)
          else:raise SystemExit('Temporary bridge removal not observed within finite window')
      - name: Remove owned dispatch material
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/permission-dispatch"
