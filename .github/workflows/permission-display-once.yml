name: One-time permission display review
on:
  push:
    branches: [main]
    paths: [.github/workflows/permission-display-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /run-codex.ps1
            /env.ps1
            /DEVELOPMENT.md
            /tests/
            /Version_History/
            /.github/workflows/release.yml
            /tool/automation/portable-automation.ps1
      - name: Recover the pinned reviewed patch without expanding generated expressions
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/permission-review/gh
        run: |
          import ast,base64,json,os,pathlib,subprocess
          scratch=pathlib.Path('tmp/permission-review');scratch.mkdir(parents=True,exist_ok=False)
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/permission-display-once.yml?ref=1371a7415b8a8ca050adf54c9d2c428da016ee02'
          record=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          assert record['sha']=='a6d560ee27cac7ab7e0b650e52b30f8062743116'
          text=base64.b64decode(record['content']).decode('utf-8')
          def extract(name):
              marker='      - name: '+name+'\n'
              assert text.count(marker)==1
              section=text.split(marker,1)[1].split('        run: |\n',1)[1]
              lines=[]
              for line in section.splitlines():
                  if line and not line.startswith('          '):break
                  lines.append(line[10:] if line else '')
              assert lines
              return '\n'.join(lines)+'\n'
          code=extract('Apply only the reviewed status display correction');ast.parse(code)
          (scratch/'apply.py').write_text(code,encoding='utf-8')
          (scratch/'commit.ps1').write_text(extract('Commit the bounded correction and existing development record'),encoding='utf-8-sig')
      - name: Apply only the reviewed status correction
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','tmp/permission-review/apply.py'],check=True)
      - name: Check production display expressions and synchronized modes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -NonInteractive -File ./tests/test_permission_display.ps1
          if($LASTEXITCODE -ne 0){throw 'Display regression failed.'}
          & python -B -m unittest discover -s tests -p test_mode_copies.py -v
          if($LASTEXITCODE -ne 0){throw 'Mode copies differ.'}
      - name: Commit the verified correction
        id: commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tmp/permission-review/commit.ps1
      - name: Remove owned patch material
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/permission-review"
  recheck:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.commit }}
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Recover the pinned independent review
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/permission-review/gh
        run: |
          import ast,base64,json,os,pathlib,subprocess
          scratch=pathlib.Path('tmp/permission-review');scratch.mkdir(parents=True,exist_ok=False)
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/.github/workflows/permission-display-once.yml?ref=1371a7415b8a8ca050adf54c9d2c428da016ee02'
          record=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          assert record['sha']=='a6d560ee27cac7ab7e0b650e52b30f8062743116'
          text=base64.b64decode(record['content']).decode('utf-8')
          def extract(name):
              marker='      - name: '+name+'\n'
              assert text.count(marker)==1
              section=text.split(marker,1)[1].split('        run: |\n',1)[1]
              lines=[]
              for line in section.splitlines():
                  if line and not line.startswith('          '):break
                  lines.append(line[10:] if line else '')
              assert lines
              return '\n'.join(lines)+'\n'
          code=extract('Fresh source audit and exact production delta verification');ast.parse(code)
          (scratch/'source-review.py').write_text(code,encoding='utf-8')
          (scratch/'regression.ps1').write_text(extract('Independent PowerShell parse and production regression cases'),encoding='utf-8-sig')
      - name: Fresh source audit and exact production delta verification
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','tmp/permission-review/source-review.py'],check=True)
      - name: Independent PowerShell parse and production regression cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./tmp/permission-review/regression.ps1
      - name: Verify the release gate still executes the new Windows regression
        shell: python
        run: |
          import pathlib
          text=pathlib.Path('.github/workflows/release.yml').read_text()
          name='      - name: Windows PowerShell 5.1 - test_permission_display\n'
          assert text.count(name)==1
          section=text.split(name,1)[1].split('      - name:',1)[0]
          expected='if: $' + "{{ !cancelled() && steps.prepare.outcome == 'success' && inputs.check_set == 'full' }}"
          assert expected in section and 'test_permission_display.ps1' in section
          assert 'if: false' not in section
          print('WINDOWS_PERMISSION_GATE=PASS')
      - name: Remove owned review material
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/permission-review"
  dispatch:
    needs: [apply, recheck]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch full Windows gate after temporary workflow removal
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/permission-dispatch/gh
          REVIEWED_COMMIT: ${{ needs.apply.outputs.commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,pathlib,subprocess,time
          scratch=pathlib.Path('tmp/permission-dispatch');scratch.mkdir(parents=True,exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY']; reviewed=os.environ['REVIEWED_COMMIT']
          for attempt in range(90):
              remote=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/main'],text=True))['object']['sha']
              if remote!=reviewed:
                  comparison=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/compare/'+reviewed+'...'+remote],text=True))
                  files=comparison.get('files',[])
                  assert len(files)==1 and files[0]['filename']=='.github/workflows/permission-display-once.yml' and files[0]['status']=='removed','Reviewed source changed before release'
                  releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
                  assert not any(r['tag_name']=='v2026.10.24.2' for r in releases),'Do not overwrite an existing release'
                  payload=json.dumps({'ref':'main','inputs':{'version':'v2026.10.24.2','publish_release':'true','check_set':'full'}})
                  subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True)
                  print('FULL_WINDOWS_RELEASE_DISPATCHED source='+remote+' tag=v2026.10.24.2')
                  break
              time.sleep(4)
          else:raise SystemExit('Temporary bridge removal not observed within finite window')
      - name: Remove owned dispatch material
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/permission-dispatch"
