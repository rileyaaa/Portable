name: Corrected reduced native OCR and frozen original launcher contracts
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/ocr-native-contract-repair.yml]
permissions: {}
concurrency:
  group: portable-ocr-native-contract-repair
  cancel-in-progress: false
jobs:
  windows_build:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '49d17f457ff2112f1475e2481031c9e4b12107bb'
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Build fixed upstream PNG and LSTM static x64, verify actual reduced local OCR
        id: research
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          $root=$pwd.Path
          $parent=Join-Path $root 'tmp'
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          $item=Get-Item -LiteralPath $parent -Force
          if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unsafe report parent' }
          $report=Join-Path $parent 'ocr-repaired-native.json'
          $startup=@{source_commit=$env:GITHUB_SHA;completed=$false;technical_recognition_passed=$false;distribution_qualified=$false;rows=@(@{item='build startup';status='NOT_COMPLETED';detail='No native evidence yet; inspect actual step logs if unchanged'})} | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($report,$startup,(New-Object Text.UTF8Encoding($false)))
          $scratch=Join-Path $root 'tmp/minimal-ocr-build-env'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null
          foreach ($key in @('HOME','USERPROFILE','APPDATA','LOCALAPPDATA','TEMP','TMP','TMPDIR')) {
            [Environment]::SetEnvironmentVariable($key,$scratch,'Process')
          }
          $env:PSModuleAnalysisCachePath=Join-Path $scratch 'ps-module-cache'
          $env:PATH=(Join-Path $env:SystemRoot 'System32')
          & .\tool\python\python.exe -I -B -c "from pathlib import Path; compile(Path('tests/check_minimal_ocr_build.py').read_bytes(),'tests/check_minimal_ocr_build.py','exec')"
          if ($LASTEXITCODE) { throw 'Probe syntax failure' }
          & .\tool\python\python.exe -I -B tests/check_minimal_ocr_build.py (Join-Path $root 'tmp/ocr-repaired-native.json')
          if ($LASTEXITCODE) { throw 'Reduced source build or actual recognition incomplete' }
      - name: Preserve JSON build evidence only, no executable, model or archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-repaired-native-evidence
          path: tmp/ocr-repaired-native.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve reduced technical failure status
        if: always() && steps.research.outcome != 'success'
        run: throw 'Reduced native technical acceptance incomplete'
  original_contracts:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '49d17f457ff2112f1475e2481031c9e4b12107bb'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve exact source bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Exact original ZIP and one narrow actual local launcher contract batch
        id: probe
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source' }
          $parent=Join-Path $pwd 'tmp'
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          $item=Get-Item -LiteralPath $parent -Force
          if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unsafe report parent' }
          $report=Join-Path $parent 'original-repaired-contracts.json'
          $startup=@{metadata=@{source_commit='4fb0b50228057cd0be41fbb191e15e065e64e368';new_harness_commit=$env:GITHUB_SHA;archive_sha256='a406e4487bde19057491b6515f7abcab74faf2e3437366b0b23f9940af5760dc';completed=$false};rows=@(@{mode='harness';item='startup';status='NOT_COMPLETED';detail='No original consumer evidence yet; inspect actual step logs if unchanged'})} | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText($report,$startup,(New-Object Text.UTF8Encoding($false)))
          $hostPython = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ([IO.Path]::GetFullPath($hostPython).StartsWith([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected orchestrator' }
          & $hostPython -I -B -c "from pathlib import Path; compile(Path('tests/check_original_release_contracts.py').read_bytes(),'tests/check_original_release_contracts.py','exec')"
          if ($LASTEXITCODE) { throw 'Original probe syntax failure' }
          & $hostPython -I -B tests/check_original_release_contracts.py (Join-Path $pwd 'tmp/original-repaired-contracts.json')
          if ($LASTEXITCODE) { throw 'Original targeted contract failures; preserve exact row evidence' }
      - name: Preserve original-only result JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-repaired-contract-evidence
          path: tmp/original-repaired-contracts.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original targeted failure status
        if: always() && steps.probe.outcome != 'success'
        run: throw 'Original targeted contract acceptance incomplete'
  record:
    needs: [windows_build, original_contracts]
    if: always() && github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '49d17f457ff2112f1475e2481031c9e4b12107bb'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
      BASE: 49d17f457ff2112f1475e2481031c9e4b12107bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          lfs: false
      - name: Verify immutable earlier evidence and exact research-only source scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE"
          /usr/bin/python3 -I -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"]
          expected={"tests/check_ocr_source_decision.py","tests/check_minimal_ocr_build.py",
            "tests/check_original_release_contracts.py","tests/ocr_native_contract_repair_45753551403.md",
            ".github/workflows/ocr-native-contract-repair.yml"}
          changed={n.decode("utf-8") for n in subprocess.check_output(["git","diff","--name-only","-z",os.environ["BASE"],"HEAD"]).split(b"\0") if n}
          assert changed==expected,(sorted(changed-expected),sorted(expected-changed))
          for ref,want in ((branch,start),("refs/heads/main",frozen),("refs/tags/v0.172.0-portable.1",frozen)):
              assert subprocess.check_output(["git","ls-remote","origin",ref]).decode().strip()==want+"\t"+ref
          prior=json.loads(Path("tests/minimal_ocr_original_contracts_45753551403.json").read_bytes())
          assert prior["model_source_signature_and_bytes_verified"] and prior["old_runtime_files_mapped"]==43
          assert prior["prior_candidate_id"]=="15085655070" and prior["prior_candidate_unchanged"]
          assert not Path(".github/workflows/minimal-ocr-original-contracts.yml").exists()
          c=json.loads(Path("tests/original_release_136_env_contracts.json").read_bytes())
          old=json.loads(Path("tests/original_release_45739266926_coverage.json").read_bytes())
          assert c["metadata"]["frozen_source"]==frozen and c["metadata"]["original_zip_sha256"]==old["metadata"]["archive_sha256"]
          assert {x["name"] for x in c["variables"]}=={x["name"] for x in old["environment"] if x["classification"]=="\u672a\u9a8c"}
          assert len(c["variables"])==136
          print("Research-only scope and original-only static index verified")
          PY
      - name: Retrieve source-built Windows JSON
        id: build_result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ocr-repaired-native-evidence
          path: tmp/ocr-repaired-native-evidence
      - name: Retrieve original-only JSON
        id: original_result
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: original-repaired-contract-evidence
          path: tmp/original-repaired-contract-evidence
      - name: Record independent results and remove only this temporary trigger
        if: always() && steps.scope.outcome == 'success'
        shell: bash
        env:
          WINDOWS_BUILD: ${{ needs.windows_build.result }}
          ORIGINAL_CONTRACTS: ${{ needs.original_contracts.result }}
          BUILD_RESULT: ${{ steps.build_result.outcome }}
          ORIGINAL_RESULT: ${{ steps.original_result.outcome }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B - <<'PY'
          import collections,json,os,subprocess
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh";start=os.environ["GITHUB_SHA"];frozen=os.environ["FROZEN"];run=os.environ["GITHUB_RUN_ID"]
          def git(*args):return subprocess.check_output(["git",*args])
          def rev():return git("rev-parse","HEAD").decode().strip()
          def ref(name):
              v,n=git("ls-remote","origin",name).decode().strip().split("\t")
              assert n==name
              return v
          assert rev()==ref(branch)==start and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          assert not git("status","--porcelain=v1","--untracked-files=all")
          def read(p,original=False):
              p=Path(p)
              if not p.exists():return {"completed":False,"rows":[],"report_missing":True}
              data=json.loads(p.read_bytes())
              if original:
                  assert data["metadata"]["source_commit"]==frozen and data["metadata"]["new_harness_commit"]==start
                  assert data["metadata"]["archive_sha256"]=="a406e4487bde19057491b6515f7abcab74faf2e3437366b0b23f9940af5760dc"
              else:assert data["source_commit"]==start
              return data
          build=read("tmp/ocr-repaired-native-evidence/ocr-repaired-native.json")
          original=read("tmp/original-repaired-contract-evidence/original-repaired-contracts.json",True)
          prior=json.loads(Path("tests/minimal_ocr_original_contracts_45753551403.json").read_bytes())
          lept=build.get("sources",{}).get("lept",{})
          model=prior["source_review"]["source_evidence"]["mingw-w64-tesseract-data"]
          result={"source_commit":start,"run_id":run,"prior_run":"45753551403","prior_record":os.environ["BASE"],
              "prior_candidate_id":"15085655070","prior_candidate_unchanged":True,
              "prior_source_review":"tests/minimal_ocr_original_contracts_45753551403.json",
              "prior_model_source_signature_and_bytes_verified":prior["model_source_signature_and_bytes_verified"],
              "prior_old_runtime_files_mapped":prior["old_runtime_files_mapped"],"old_runtime_selected_for_distribution":False,
              "leptonica_exact_source_license_verified":lept.get("primary_license",{}).get("git_blob_sha1")=="73d44c601c0746534128804c3fb0b93772897f82",
              "reduced_windows_build":build,"original_release_contracts":original,
              "reduced_native_recognition":bool(build.get("technical_recognition_passed",False)),
              "original_targeted_counts":dict(collections.Counter(x["status"] for x in original.get("rows",[]))),
              "workflow_steps":{k:os.environ[k] for k in ("WINDOWS_BUILD","ORIGINAL_CONTRACTS","BUILD_RESULT","ORIGINAL_RESULT")},
              "distribution_qualified":False,"ocr_integrated":False,"new_candidate_built":False,"whole_package_all_pass_claim":False}
          target=Path("tests/ocr_native_contract_repair_"+run+".json")
          assert not target.exists()
          target.write_text(json.dumps(result,indent=2,ensure_ascii=True)+"\n",encoding="utf-8")
          notes=Path("DEVELOPMENT.md")
          notes.write_bytes(notes.read_bytes()+("\n\n## Corrected reduced OCR native build and frozen original launcher contracts\n\n"
              "Source "+start+"; https://github.com/rileyaaa/Portable/actions/runs/"+run+". Independent result "+target.as_posix()+
              ". Prior model exact source/signature and old 43-member notice mapping retained. Leptonica exact source license="+str(result["leptonica_exact_source_license_verified"])+
              "; reduced native technical recognition="+str(result["reduced_native_recognition"])+
              "; original-targeted row counts="+json.dumps(result["original_targeted_counts"])+
              ". No redistribution clearance or integration, no new ZIP; prior candidate 15085655070 unchanged. No old matrix or unrelated suite rerun.\n").encode("utf-8"))
          workflow=".github/workflows/ocr-native-contract-repair.yml"
          git("rm","--",workflow);git("add","--",str(target),"DEVELOPMENT.md")
          assert {n.decode("utf-8") for n in git("diff","--cached","--name-only","-z").split(b"\0") if n}=={workflow,target.as_posix(),"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record corrected native OCR and original contract evidence; remove temporary trigger")
          final=rev();assert ref(branch)==start
          subprocess.run(["git","push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("OCR_REPAIR_FINAL_DEV="+final,flush=True)
          print("OCR_REPAIR_RESULT="+json.dumps({"leptonica_license":result["leptonica_exact_source_license_verified"],"reduced_native":result["reduced_native_recognition"],"original_counts":result["original_targeted_counts"],"distribution":False}),flush=True)
          # Research jobs retain their independent actual exit statuses; this
          # recording step is successful when it preserves their exact evidence.
          PY
