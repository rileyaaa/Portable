name: Publish exact verified 0.172.0 Portable r1 candidate (one time)
on:
  push:
    branches: [release-prep/v0.172.0-portable.1]
    paths:
      - .github/workflows/publish-verified-release-0172.yml

permissions: {}
concurrency:
  group: portable-publish-0172-r1-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/release-prep/v0.172.0-portable.1' && github.event_name == 'push' && github.event.before == 'f6e1f4791ced40600448854ef12a25b6a2ab1c7b' && github.event.head_commit.message == 'Correct artifact download media type for the verified 0.172.0 candidate' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify exact GitHub artifact and publish only its three verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPO = "rileyaaa/Portable"
          API = "https://api.github.com/repos/" + REPO
          SOURCE = "4fb0b50228057cd0be41fbb191e15e065e64e368"
          PREP = "1b720d7f53e2adb774ef53cec3381128f0332c4f"
          BRANCH = "release-prep/v0.172.0-portable.1"
          RUN = 45547706779
          WORKFLOW = 429877516
          ARTIFACT = 14991844256
          ARTIFACT_NAME = "Codex-Portable-v0.172.0-portable.1-windows-x64-verified-candidate"
          ARTIFACT_SHA = "1d5959543f0a13f20e81fd1fd0046511875722b2ae14fa833aaa40bd80ce0ca6"
          ARTIFACT_SIZE = 569621328
          TAG = "v0.172.0-portable.1"
          ZIP = "Codex-Portable-v0.172.0-portable.1-windows-x64.zip"
          MANIFEST = "release-manifest.json"
          SUMS = "SHA256SUMS"
          ZIP_SHA = "a406e4487bde19057491b6515f7abcab74faf2e3437366b0b23f9940af5760dc"
          MANIFEST_SHA = "1c50016f81b22cb9dd6df52b41dd1686a99d90ef63da12a0ee0c71f25a829fd8"
          ZIP_SIZE = 567888467
          TITLE = "Codex Portable 0.172.0 - Portable r1"
          TOKEN = os.environ["GH_TOKEN"]
          FILES = {ZIP, MANIFEST, SUMS}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("Unexpected metadata redirect")

          opener = urllib.request.build_opener(NoRedirect)
          headers = {
              "Authorization": "Bearer " + TOKEN,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "portable-one-time-release",
          }

          def api(path, method="GET", body=None, absent_ok=False):
              require(path == "" or (path.startswith("/") and not path.startswith("//")), "Invalid API path")
              req = urllib.request.Request(
                  API + path,
                  data=None if body is None else json.dumps(body).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json"},
                  method=method,
              )
              try:
                  with opener.open(req, timeout=60) as response:
                      require(response.status in (200, 201), "Unexpected API status")
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if absent_ok and exc.code == 404:
                      return None
                  raise RuntimeError(f"GitHub API {method} {path}: HTTP {exc.code}") from None

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def main_is_frozen():
              ref = api("/git/ref/heads/main")
              require(ref["object"]["type"] == "commit" and ref["object"]["sha"] == SOURCE,
                      "Main no longer matches frozen candidate")

          def tag_ref():
              return api("/git/ref/tags/" + TAG, absent_ok=True)

          def all_releases():
              result = []
              for page in range(1, 101):
                  batch = api(f"/releases?per_page=100&page={page}")
                  require(isinstance(batch, list), "Invalid releases response")
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise RuntimeError("Release list too large to safely check")

          def require_unoccupied():
              require(tag_ref() is None, "Tag already exists; no overwrite")
              require(api("/releases/tags/" + TAG, absent_ok=True) is None,
                      "Release already exists; no overwrite")
              require(not any(r["tag_name"] == TAG for r in all_releases()),
                      "Draft or other release already occupies tag")

          def download(path, dest):
              require(path.startswith("/actions/artifacts/") or path.startswith("/releases/assets/"),
                      "Unexpected download endpoint")
              # curl does not forward Authorization to a different redirect
              # host unless --location-trusted is used (intentionally absent).
              accept = "application/vnd.github+json" if path.startswith("/actions/artifacts/") else "application/octet-stream"
              completed = subprocess.run([
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--proto", "=https", "--proto-redir", "=https",
                  "--retry", "2", "--max-time", "900",
                  "-H", "Authorization: Bearer " + TOKEN,
                  "-H", "Accept: " + accept,
                  "-H", "X-GitHub-Api-Version: 2022-11-28",
                  "--output", str(dest), API + path,
              ], check=False)
              require(completed.returncode == 0, "GitHub download failed: curl exit " + str(completed.returncode))

          def upload(release_id, file):
              require(file.name in FILES, "Unexpected upload filename")
              url = ("https://uploads.github.com/repos/" + REPO +
                     f"/releases/{release_id}/assets?name=" + urllib.parse.quote(file.name, safe=""))
              # No retries or clobber for mutating requests.
              raw = subprocess.check_output([
                  "curl", "--fail", "--silent", "--show-error", "--max-time", "900",
                  "--proto", "=https",
                  "-X", "POST",
                  "-H", "Authorization: Bearer " + TOKEN,
                  "-H", "Accept: application/vnd.github+json",
                  "-H", "X-GitHub-Api-Version: 2022-11-28",
                  "-H", "Content-Type: application/octet-stream",
                  "--data-binary", "@" + str(file), url,
              ])
              return json.loads(raw)

          def check_assets(release, expected):
              assets = release["assets"]
              require(len(assets) == 3 and {a["name"] for a in assets} == FILES,
                      "Remote asset set differs")
              for asset in assets:
                  sha, size = expected[asset["name"]]
                  require(asset["state"] == "uploaded" and asset["size"] == size
                          and asset.get("digest") == "sha256:" + sha,
                          "Remote asset size or digest differs: " + asset["name"])
              return assets

          require(os.environ["GITHUB_REPOSITORY"] == REPO, "Wrong repository")
          require(os.environ["GITHUB_REF"] == "refs/heads/" + BRANCH, "Wrong branch")
          require(os.environ["GITHUB_RUN_ATTEMPT"] == "1", "Refuse repeated publication attempt")
          repo = api("")
          require(str(repo["id"]) == "1426337408" and repo["full_name"] == REPO
                  and repo["default_branch"] == "main" and not repo["archived"], "Repository identity mismatch")
          main_is_frozen()
          require_unoccupied()
          run = api(f"/actions/runs/{RUN}")
          require(run["id"] == RUN and run["workflow_id"] == WORKFLOW
                  and run["path"] == ".github/workflows/prepare-release-0172.yml"
                  and run["head_sha"] == PREP and run["head_branch"] == BRANCH
                  and run["repository"]["id"] == repo["id"] and run["head_repository"]["id"] == repo["id"]
                  and run["event"] == "push" and run["run_attempt"] == 1
                  and run["status"] == "completed" and run["conclusion"] == "success",
                  "Candidate run identity or success mismatch")
          artifacts = api(f"/actions/runs/{RUN}/artifacts?per_page=100")
          require(artifacts["total_count"] == 1 and len(artifacts["artifacts"]) == 1,
                  "Unexpected candidate artifact count")
          artifact = artifacts["artifacts"][0]
          require(artifact["id"] == ARTIFACT and artifact["name"] == ARTIFACT_NAME
                  and artifact["size_in_bytes"] == ARTIFACT_SIZE and not artifact["expired"]
                  and artifact["digest"] == "sha256:" + ARTIFACT_SHA
                  and artifact["workflow_run"]["id"] == RUN
                  and artifact["workflow_run"]["head_sha"] == PREP,
                  "Artifact provenance or digest mismatch")

          with tempfile.TemporaryDirectory(prefix="portable-0172-publish-", dir=os.environ["RUNNER_TEMP"]) as tmp:
              directory = Path(tmp)
              outer = directory / "transport.zip"
              local = directory / "candidate"
              local.mkdir()
              download(f"/actions/artifacts/{ARTIFACT}/zip", outer)
              require(outer.stat().st_size == ARTIFACT_SIZE and digest(outer) == ARTIFACT_SHA,
                      "Downloaded transport artifact size or digest differs")
              with zipfile.ZipFile(outer) as container:
                  entries = container.infolist()
                  require(len(entries) == 3 and {i.filename for i in entries} == FILES
                          and all(not i.is_dir() and not (i.flag_bits & 1) for i in entries),
                          "Downloaded artifact must contain exactly three files")
                  for info in entries:
                      limit = ZIP_SIZE if info.filename == ZIP else 4 * 1024 * 1024 if info.filename == MANIFEST else 1024
                      require(0 < info.file_size <= limit, "Unexpected artifact member size")
                      with container.open(info) as src, (local / info.filename).open("xb") as dest:
                          shutil.copyfileobj(src, dest, 1024 * 1024)
              require((local / ZIP).stat().st_size == ZIP_SIZE and digest(local / ZIP) == ZIP_SHA,
                      "Customer ZIP digest differs from audited Windows result")
              require(digest(local / MANIFEST) == MANIFEST_SHA, "Manifest digest differs")
              require((local / SUMS).read_bytes() == (
                  ZIP_SHA + "  " + ZIP + "\n" + MANIFEST_SHA + "  " + MANIFEST + "\n"
              ).encode("ascii"), "Checksum file differs")
              meta = json.loads((local / MANIFEST).read_bytes())
              require(meta["source_commit"] == SOURCE and meta["release_version"] == TAG
                      and meta["codex_version"] == "0.172.0" and meta["target"] == "x86_64-pc-windows-msvc"
                      and meta["package_kind"] == "customer" and meta["archive"] == ZIP
                      and meta["file_count"] == len(meta["files"]) == 9076
                      and meta["source_file_count"] == 9157
                      and meta["excluded_file_count"] == len(meta["excluded_files"]) == 81
                      and meta["uncompressed_bytes"] == 1378207498,
                      "Verified manifest identity mismatch")
              require(not set(meta["files"]).intersection(meta["excluded_files"]), "Manifest exclusion mismatch")
              with zipfile.ZipFile(local / ZIP) as customer:
                  require(customer.namelist() == ["Codex/" + name for name in meta["files"]],
                          "Customer ZIP member inventory differs")
                  runtime = json.loads(customer.read("Codex/tool/runtime-manifest.json"))
                  require(runtime["version"] == "0.172.0" and runtime["target"] == meta["target"],
                          "Internal runtime identity differs")
              expected = {name: (digest(local / name), (local / name).stat().st_size) for name in sorted(FILES)}
              print("DOWNLOADED_ARTIFACT_AND_ALL_THREE_FILES=PASS", flush=True)
              for name, (sha, size) in expected.items():
                  print(f"VERIFIED_ASSET {name} sha256={sha} bytes={size}", flush=True)
              print("VERIFIED_CANDIDATE_SOURCE=" + SOURCE, flush=True)

              # The only mutating operations begin after exact byte verification.
              main_is_frozen()
              require_unoccupied()
              notes = (
                  "Windows x64 portable Codex 0.172.0, Portable r1.\n\n"
                  f"Source commit: {SOURCE}\n"
                  f"Verified Windows candidate: https://github.com/{REPO}/actions/runs/{RUN}\n"
                  f"ZIP SHA-256: {ZIP_SHA}\n\n"
                  "Official Codex archive and five retained executables were independently verified. "
                  "The Windows candidate passed the existing release regressions, two reproducible builds, "
                  "per-member integrity checks, and private-state exclusion checks. "
                  "The existing Python, Node, browser and MCP dependencies are retained; "
                  "the pinned MCP includes an alpha Playwright dependency, not a new all-stable tool stack. "
                  "The package is not newly code-signed; rg and Chromium report NotSigned, "
                  "with pinned content hashes verified. One SSH dependency-gated test was skipped.\n\n"
                  "Earlier native core and Office/PDF runs on the reviewed source are recorded in DEVELOPMENT.md. "
                  "Synthetic offline fixtures do not prove real-account login, real online model decisions, "
                  "interactive approvals, devices, actual Office rendering or formula recalculation. "
                  "Known ADB host-profile and PowerShell module-path limitations remain. "
                  "Verify the ZIP and release-manifest.json against SHA256SUMS.\n"
              )
              draft = api("/releases", method="POST", body={
                  "tag_name": TAG, "target_commitish": SOURCE, "name": TITLE,
                  "body": notes, "draft": True, "prerelease": False, "make_latest": "false",
              })
              rid = draft["id"]
              require(isinstance(rid, int) and rid > 0 and draft["tag_name"] == TAG
                      and draft["target_commitish"] == SOURCE and draft["draft"] is True
                      and draft["prerelease"] is False and not draft["assets"],
                      "Unexpected newly created draft; publication refused")
              print(f"DRAFT_CREATED id={rid}", flush=True)
              for name in (ZIP, MANIFEST, SUMS):
                  item = upload(rid, local / name)
                  sha, size = expected[name]
                  require(item["name"] == name and item["state"] == "uploaded"
                          and item["size"] == size and item.get("digest") == "sha256:" + sha,
                          "Uploaded asset identity differs")
              remote_draft = api(f"/releases/{rid}")
              require(remote_draft["draft"] is True and remote_draft["tag_name"] == TAG
                      and remote_draft["target_commitish"] == SOURCE, "Draft identity changed")
              remote = directory / "readback"
              remote.mkdir()
              for asset in check_assets(remote_draft, expected):
                  name = asset["name"]
                  download(f"/releases/assets/{asset['id']}", remote / name)
                  require((digest(remote / name), (remote / name).stat().st_size) == expected[name],
                          "Remote draft asset readback differs: " + name)
              print("DRAFT_THREE_ASSETS_REMOTE_READBACK=PASS", flush=True)
              main_is_frozen()
              ref = tag_ref()
              require(ref is None or (ref["object"]["type"] == "commit" and ref["object"]["sha"] == SOURCE),
                      "Tag appeared at a different commit; leave draft")
              require([r["id"] for r in all_releases() if r["tag_name"] == TAG] == [rid],
                      "Release identity changed; leave draft")
              final = api(f"/releases/{rid}", method="PATCH", body={
                  "draft": False, "prerelease": False, "make_latest": "true",
              })
              require(final["id"] == rid and final["tag_name"] == TAG
                      and final["draft"] is False and final["prerelease"] is False,
                      "Publication response mismatch")
              # Independently re-read the published release and exact tag.
              published = api("/releases/tags/" + TAG)
              ref = tag_ref()
              require(published["id"] == rid and published["draft"] is False
                      and published["prerelease"] is False
                      and published["target_commitish"] == SOURCE and published["name"] == TITLE
                      and ref is not None and ref["object"]["type"] == "commit"
                      and ref["object"]["sha"] == SOURCE, "Published tag or release mismatch")
              check_assets(published, expected)
              require(api("/releases/latest")["id"] == rid, "Published release is not latest")
              print("FORMAL_RELEASE_PUBLISHED_AND_READ_BACK=PASS", flush=True)
              print("RELEASE_URL=" + published["html_url"], flush=True)
              print("PUBLISHED_TAG_COMMIT=" + SOURCE, flush=True)
              print("PUBLISHED_ZIP_SHA256=" + ZIP_SHA, flush=True)
          PY
