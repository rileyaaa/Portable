name: Course assistant hard Windows candidate and targeted original audit followup
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths: [.github/workflows/course-assistant-candidate.yml]
permissions: {}
concurrency:
  group: portable-course-assistant-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'rileyaaa/Portable' && github.ref == 'refs/heads/dev/stable-tool-refresh' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: powershell
    env:
      FROZEN: 4fb0b50228057cd0be41fbb191e15e065e64e368
    steps:
      - name: Preserve source bytes
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'Git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Confirm original audit ended and candidate-only dev diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected checkout' }
          $prior = Invoke-RestMethod -Uri 'https://api.github.com/repos/rileyaaa/Portable/actions/runs/45739266926' -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'User-Agent'='portable-course-candidate'}
          if ($prior.status -cne 'completed' -or (Test-Path -LiteralPath '.github/workflows/audit-original-release.yml')) { throw 'Original audit is not finalized; do not disturb it' }
          $expected = @('README.md','home/skills/course-assistant/SKILL.md','home/skills/course-assistant/agents/openai.yaml','home/skills/course-assistant/references/usage.md','tool/automation/course/course.ps1','tool/automation/course/course.js','tool/automation/course/ocr.ps1','tool/automation/course/path_guard.py','tests/check_course_assistant.py','tests/test_course_policy.js','tests/original_audit_followup_consumer.py','tests/check_original_audit_followup.py','.github/workflows/course-assistant-candidate.yml')
          if ($event.before -cne '6110d4c4270f4ca2433cae5b065fad5d5fd40e94') { throw 'Unexpected candidate parent' }
          $changed = @(git diff --name-only $event.before HEAD)
          if ($LASTEXITCODE -or $changed.Count -ne $expected.Count -or @(Compare-Object $expected $changed).Count) { throw 'Unexpected changed paths' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@('refs/heads/dev/stable-tool-refresh',$env:GITHUB_SHA))) {
            $actual = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -or $actual -cne ($pair[1]+[char]9+$pair[0])) { throw 'Frozen or developer ref changed' }
          }
          git diff --exit-code d58d62ef3657e34d8d8d145be452d5408585fc19 HEAD -- tool/automation/browser-bridge.js tool/automation/start-browser.ps1 tool/automation/browser-task.js tool/automation/portable-automation.ps1 tool/portable-process.ps1 tool/package-release.py run-codex.ps1 env.ps1 Version_History tool/python-packages.in.txt tool/python-packages.lock.txt
          if ($LASTEXITCODE) { throw 'Existing production boundary or fixed dependency changed' }
          git diff --exit-code 1c3ecf64174db0f26b295da9104ca9a6de59aac1 HEAD -- tests/release_audit_v0.172.0-portable.1.json tests/release_audit_v0.172.0-portable.1-wrapper-corrected.json
          if ($LASTEXITCODE) { throw 'Original audit evidence changed' }
          'COURSE_SCOPE_CONFIRMED=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "COURSE_REPORT=$(Join-Path $env:RUNNER_TEMP ('course-report-'+$env:GITHUB_RUN_ID+'.json'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ORIGINAL_FOLLOWUP_REPORT=$(Join-Path $env:RUNNER_TEMP ('original-followup-'+$env:GITHUB_RUN_ID+'.json'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "COURSE_BUILD=$(Join-Path $env:RUNNER_TEMP ('course-build-'+$env:GITHUB_RUN_ID+'.json'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native source syntax and scoped policy checks
        id: policy
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs fsck
          if ($LASTEXITCODE) { throw 'Missing pinned LFS payload' }
          & .\tool\node\node.exe --check tool/automation/course/course.js
          if ($LASTEXITCODE) { throw 'Course JS syntax failed' }
          & .\tool\node\node.exe tests/test_course_policy.js
          if ($LASTEXITCODE) { throw 'Course policy test failed' }
          & .\tool\python\python.exe -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in (Path('tool/automation/course/path_guard.py'),Path('tests/check_course_assistant.py'),Path('tests/check_original_audit_followup.py'),Path('tests/original_audit_followup_consumer.py'))]"
          if ($LASTEXITCODE) { throw 'Python syntax failed' }
          foreach ($file in @('tool/automation/course/course.ps1','tool/automation/course/ocr.ps1')) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax failed' }
          }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input validation failed' }
      - name: Build actual customer candidate ZIP locally, no release
        id: build
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $json = & .\tool\python\python.exe -B tool/package-release.py --version v0.172.0-portable.2
          if ($LASTEXITCODE) { throw 'Candidate ZIP build failed' }
          $joined = $json -join [Environment]::NewLine
          $value = $joined | ConvertFrom-Json
          if ($value.source_commit -cne $env:GITHUB_SHA) { throw 'Wrong candidate source' }
          $joined | Set-Content -LiteralPath $env:COURSE_BUILD -Encoding UTF8
          Write-Output ("CANDIDATE_ZIP_SHA256=" + $value.archive_sha256 + " files=" + $value.file_count)
          foreach ($key in @('archive','manifest','checksums')) {
            "$key=$($value.$key)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Actual moved ZIP synthetic course acceptance
        id: course
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/check_course_assistant.py $env:COURSE_BUILD $env:COURSE_REPORT
          if ($LASTEXITCODE) { throw 'Course consumer failure or incomplete audit' }
      - name: Confirm actual extracted candidate integrity before making it downloadable
        id: verified
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:COURSE_REPORT)) { throw 'No actual moved ZIP integrity evidence' }
          $report = Get-Content -LiteralPath $env:COURSE_REPORT -Raw | ConvertFrom-Json
          $built = Get-Content -LiteralPath $env:COURSE_BUILD -Raw | ConvertFrom-Json
          if ($report.metadata.zip_verified -ne $true -or $report.metadata.source_commit -cne $env:GITHUB_SHA -or $report.metadata.archive_sha256 -cne $built.archive_sha256) { throw 'No verified exact moved candidate ZIP' }
          'COURSE_ZIP_VERIFIED=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload only the verified pristine candidate ZIP and its exact metadata (not a release)
        id: upload
        if: env.COURSE_ZIP_VERIFIED == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Codex-Portable-0.172.0-course-candidate-${{ github.run_id }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.manifest }}
            ${{ steps.build.outputs.checksums }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download the exact uploaded candidate for independent digest readback
        id: download
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Codex-Portable-0.172.0-course-candidate-${{ github.run_id }}
          path: tmp/course-artifact-readback-${{ github.run_id }}
      - name: Verify uploaded candidate readback exact file set and hashes
        id: readback
        if: steps.download.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $built = Get-Content -LiteralPath $env:COURSE_BUILD -Raw | ConvertFrom-Json
          $read = Join-Path $pwd ('tmp/course-artifact-readback-'+$env:GITHUB_RUN_ID)
          $all = @(Get-ChildItem -LiteralPath $read -Recurse -Force -File)
          if ($all.Count -ne 3) { throw 'Unexpected downloaded candidate members' }
          foreach ($key in @('archive','manifest','checksums')) {
            $source = $built.$key
            $name = Split-Path -Leaf $source
            $target = Join-Path $read $name
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'Missing downloaded candidate member' }
            if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash) { throw 'Downloaded candidate member differs' }
          }
          Write-Output 'COURSE_ARTIFACT_READBACK=PASS'
      - name: Targeted original audit followup on separately extracted candidate copies
        id: followup
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/check_original_audit_followup.py $env:COURSE_BUILD $env:ORIGINAL_FOLLOWUP_REPORT
          if ($LASTEXITCODE) { throw 'Original audit followup has unresolved failures; independent evidence retained' }
      - name: Original browser direct task and stdio regression
        id: direct
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test_browser_smoke.ps1
          if ($LASTEXITCODE) { throw 'Original browser task regression' }
          & .\tool\python\python.exe -B tests/check_browser_mcp_stdio.py
          if ($LASTEXITCODE) { throw 'Original browser stdio regression' }
      - name: Original normal read-only discovery and new skill discovery
        id: normal
        continue-on-error: true
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser-check
          if ($LASTEXITCODE) { throw 'Normal browser discovery failed' }
      - name: Original YOLO actual native browser
        id: yolo
        continue-on-error: true
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser
          if ($LASTEXITCODE) { throw 'YOLO browser regression failed' }
      - name: Original explicit user MCP actual native Codex
        id: mcp
        continue-on-error: true
        run: |
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Native Codex MCP regression failed' }
      - name: Record distinct candidate results and remove only one-time trigger
        if: always() && env.COURSE_SCOPE_CONFIRMED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY: ${{ steps.policy.outcome }}
          BUILD: ${{ steps.build.outcome }}
          COURSE: ${{ steps.course.outcome }}
          DIRECT: ${{ steps.direct.outcome }}
          NORMAL: ${{ steps.normal.outcome }}
          YOLO: ${{ steps.yolo.outcome }}
          MCP: ${{ steps.mcp.outcome }}
          VERIFIED: ${{ steps.verified.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          READBACK: ${{ steps.readback.outcome }}
          FOLLOWUP: ${{ steps.followup.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,json,os,subprocess,sys
          from pathlib import Path
          branch="refs/heads/dev/stable-tool-refresh"
          frozen=os.environ["FROZEN"];start=os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REF"]==branch
          auth=base64.b64encode(("x-access-token:"+os.environ.pop("GH_TOKEN")).encode()).decode()
          print("::add-mask::"+auth,flush=True)
          cfg=["-c","http.https://github.com/.extraheader=AUTHORIZATION: basic "+auth]
          def git(*args):return subprocess.check_output(["git",*args])
          def rev(ref="HEAD"):return git("rev-parse",ref).decode().strip()
          def ref(name):
              v,n=git(*cfg,"ls-remote","origin",name).decode().strip().split("\t")
              assert n==name
              return v
          assert rev()==ref(branch)==start
          assert ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          assert not git("status","--porcelain=v1","--untracked-files=all")
          report=Path(os.environ["COURSE_REPORT"])
          result=json.loads(report.read_bytes()) if report.exists() else {"metadata":{"completed":False},"rows":[]}
          steps={k:os.environ.get(k,"unknown") for k in ("POLICY","BUILD","COURSE","DIRECT","NORMAL","YOLO","MCP","VERIFIED","UPLOAD","DOWNLOAD","READBACK","FOLLOWUP")}
          result["workflow_steps"]=steps
          result["run_id"]=os.environ["GITHUB_RUN_ID"]
          result["source_commit"]=start
          result["artifact"]={"id":os.environ.get("ARTIFACT_ID",""),"url":os.environ.get("ARTIFACT_URL",""),"readback":steps["READBACK"],"retention_days":14,"kind":"unreleased candidate; exact pristine customer ZIP and metadata only"}
          result["limitations"]=["No real platform/account/exam/interactive approval tested.",
              "Host cache/temp comparison is targeted metadata observation, not exhaustive kernel write attribution; no host cleanup or elevation.",
              "Chinese/English OCR without installed language is a blocked case, not successful recognition.",
              "Course client uses existing pinned Playwright runtime and MCP stdio SDK through restricted course facade; original browser-debug separately exercised.",
              "Candidate artifact is not a formal Release; consult native rows before using."]
          follow_path=Path(os.environ["ORIGINAL_FOLLOWUP_REPORT"])
          follow=json.loads(follow_path.read_bytes()) if follow_path.exists() else {"metadata":{"completed":False},"rows":[]}
          follow["run_id"]=os.environ["GITHUB_RUN_ID"]
          follow["source_commit"]=start
          follow["workflow_step"]=steps["FOLLOWUP"]
          follow["original_frozen_evidence"]="tests/release_audit_v0.172.0-portable.1-wrapper-corrected.json"
          follow_target=Path("tests/original_followup_candidate_"+os.environ["GITHUB_RUN_ID"]+".json")
          assert not follow_target.exists()
          follow_target.write_text(json.dumps(follow,indent=2,ensure_ascii=True)+"\n",encoding="utf-8")
          blocked=any(r["status"].startswith("BLOCKED") or r["status"]=="FAIL" for r in result["rows"])
          result["course_candidate_qualified"]=bool(result["metadata"].get("completed") and not blocked and all(steps[k]=="success" for k in steps if k!="FOLLOWUP"))
          result["original_followup_has_unresolved"]=bool(steps["FOLLOWUP"]!="success" or not follow["metadata"].get("completed") or any(r["status"]=="FAIL" for r in follow["rows"]))
          result["whole_package_all_pass_claim"]=False
          target=Path("tests/course_candidate_"+os.environ["GITHUB_RUN_ID"]+".json")
          assert not target.exists()
          target.write_text(json.dumps(result,indent=2,ensure_ascii=True)+"\n",encoding="utf-8")
          notes=Path("DEVELOPMENT.md")
          url="https://github.com/rileyaaa/Portable/actions/runs/"+os.environ["GITHUB_RUN_ID"]
          notes.write_bytes(notes.read_bytes()+("\n\n## Course assistant candidate Windows acceptance\n\n"
              "Independent of the frozen original ZIP audit. Candidate source "+start+"; "+url+
              ". Results: "+target.as_posix()+"; step outcomes "+json.dumps(steps,sort_keys=True)+
              ". Candidate artifact (not Release): "+json.dumps(result["artifact"],sort_keys=True)+
              ". Course qualified="+str(result["course_candidate_qualified"])+
              ". Separate targeted original followup: "+follow_target.as_posix()+
              ". Original release evidence unchanged; no official release, tag, main or fixed dependency change. No whole-package all-pass claim.\n").encode())
          workflow=".github/workflows/course-assistant-candidate.yml"
          git("rm","--",workflow);git("add","--",str(target),str(follow_target),"DEVELOPMENT.md")
          assert set(git("diff","--cached","--name-only","-z").decode().split("\0"))-{""}=={workflow,target.as_posix(),follow_target.as_posix(),"DEVELOPMENT.md"}
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Record course candidate evidence and remove temporary trigger")
          final=rev();assert ref(branch)==start
          subprocess.run(["git",*cfg,"push","origin","HEAD:"+branch],check=True)
          assert ref(branch)==final and ref("refs/heads/main")==ref("refs/tags/v0.172.0-portable.1")==frozen
          print("COURSE_CANDIDATE_FINAL_DEV="+final,flush=True)
          print("COURSE_CANDIDATE_STEP_RESULTS="+json.dumps(steps,sort_keys=True),flush=True)
          if not result["course_candidate_qualified"] or result["original_followup_has_unresolved"]:raise SystemExit(1)
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Course candidate incomplete or failed; inspect actual evidence' }
