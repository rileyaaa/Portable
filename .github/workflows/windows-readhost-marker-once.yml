name: Windows synthetic Read-Host boundary (one-time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths:
      - .github/workflows/windows-readhost-marker-once.yml
permissions: {}
jobs:
  readhost-marker:
    runs-on: windows-2025
    timeout-minutes: 3
    env:
      RH_BASE: 3feb044d7957af4a0c23c3ca7ce7f11907284382
    steps:
      - name: Synthetic console and pipe observations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_REPOSITORY -cne 'rileyaaa/Portable' -or
              $env:GITHUB_REF -cne 'refs/heads/dev/stable-tool-refresh' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              $PSVersionTable.PSEdition -cne 'Core' -or -not [Environment]::Is64BitProcess -or
              $e.ref -cne $env:GITHUB_REF -or $e.before -cne $env:RH_BASE -or
              $e.after -cne $env:GITHUB_SHA -or $e.head_commit.id -cne $env:GITHUB_SHA -or
              $e.created -ne $false -or $e.deleted -ne $false -or $e.forced -ne $false) {
            throw 'RH_TRIGGER_OR_ENV_INCONCLUSIVE'
          }
          $python = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          Write-Output 'RH_TRIGGER=PASS'
          Write-Output "RH_RUNNER=Windows/X64;pwsh=$($PSVersionTable.PSVersion);ImageOS=$env:ImageOS;ImageVersion=$env:ImageVersion"
          $cursor = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          while ($cursor) {
            $item = Get-Item -LiteralPath $cursor -Force
            if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'RH_UNSAFE_PARENT' }
            $cursor = [IO.Path]::GetDirectoryName($cursor.TrimEnd('\'))
          }
          $owned = Join-Path $env:RUNNER_TEMP ('readhost-marker-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $owned -ErrorAction Stop
          $script = Join-Path $owned 'probe.py'
          $probe = @'
          import ctypes as C, json, msvcrt, os, re, shutil, stat, struct, subprocess, sys, time
          from ctypes import wintypes as W
          from pathlib import Path

          K = C.WinDLL('kernel32', use_last_error=True)
          CASES = ('RAW_N', 'HOST_N', 'HOST_EOF')

          def need(ok, label):
              if not ok:
                  raise RuntimeError(label)

          def api(name, result, *args):
              f = getattr(K, name)
              f.restype, f.argtypes = result, args
              return f

          def plain_dir(path):
              p = Path(path).absolute()
              need(re.fullmatch(r'[A-Za-z]:', p.drive) and '..' not in p.parts and ':' not in str(p)[2:], 'RH_LOCAL_PATH')
              for item in (*reversed(p.parents), p):
                  s = item.lstat()
                  need(stat.S_ISDIR(s.st_mode) and not getattr(s, 'st_file_attributes', 0) & 0x400, 'RH_UNSAFE_DIRECTORY')
              return p

          def system_dir():
              buf = C.create_unicode_buffer(32768)
              n = api('GetSystemWindowsDirectoryW', W.UINT, W.LPWSTR, W.UINT)(buf, len(buf))
              need(0 < n < len(buf), 'RH_SYSTEM_DIRECTORY')
              return Path(buf.value)

          class Coord(C.Structure):
              _fields_ = [('x', C.c_short), ('y', C.c_short)]
          class Rect(C.Structure):
              _fields_ = [(s, C.c_short) for s in ('left','top','right','bottom')]
          class ScreenInfo(C.Structure):
              _fields_ = [('size', Coord), ('cursor', Coord), ('attributes', W.WORD), ('window', Rect), ('maximum', Coord)]
          class JobBasic(C.Structure):
              _fields_ = [('process_time', C.c_longlong), ('job_time', C.c_longlong), ('flags', W.DWORD),
                          ('min_ws', C.c_size_t), ('max_ws', C.c_size_t), ('active_limit', W.DWORD),
                          ('affinity', C.c_size_t), ('priority', W.DWORD), ('schedule', W.DWORD)]
          class JobLimits(C.Structure):
              _fields_ = [('basic', JobBasic), ('io', C.c_ulonglong * 6), ('memory', C.c_size_t * 4)]
          class JobAccounting(C.Structure):
              _fields_ = [('times', C.c_longlong * 4), ('faults', W.DWORD), ('total', W.DWORD),
                          ('active', W.DWORD), ('terminated', W.DWORD)]

          def private_job():
              job = api('CreateJobObjectW', W.HANDLE, C.c_void_p, W.LPCWSTR)(None, None)
              need(job, 'RH_JOB_CREATE')
              limit = JobLimits()
              limit.basic.flags = 0x2000
              need(api('SetInformationJobObject', W.BOOL, W.HANDLE, C.c_int, C.c_void_p, W.DWORD)(job, 9, C.byref(limit), C.sizeof(limit)), 'RH_JOB_LIMIT')
              need(api('AssignProcessToJobObject', W.BOOL, W.HANDLE, W.HANDLE)(job, api('GetCurrentProcess', W.HANDLE)()), 'RH_JOB_ASSIGN')
              return job

          def idle(job):
              info = JobAccounting()
              need(api('QueryInformationJobObject', W.BOOL, W.HANDLE, C.c_int, C.c_void_p, W.DWORD, C.c_void_p)(job, 1, C.byref(info), C.sizeof(info), None)
                   and info.active == 1, 'RH_DESCENDANTS_NOT_FINISHED')

          def open_private_console():
              ids = (W.DWORD * 4)()
              need(api('GetConsoleProcessList', W.DWORD, C.POINTER(W.DWORD), W.DWORD)(ids, len(ids)) == 1 and ids[0] == os.getpid(), 'RH_PRIVATE_CONSOLE_REQUIRED')
              need(api('SetConsoleCP', W.BOOL, W.UINT)(65001) and api('SetConsoleOutputCP', W.BOOL, W.UINT)(65001)
                   and api('GetConsoleCP', W.UINT)() == 65001 and api('GetConsoleOutputCP', W.UINT)() == 65001, 'RH_PRIVATE_CONSOLE_CODEPAGE')
              h = api('CreateFileW', W.HANDLE, W.LPCWSTR, W.DWORD, W.DWORD, C.c_void_p, W.DWORD, W.DWORD, W.HANDLE)('CONOUT$', 0x80000000, 3, None, 3, 0, None)
              need(h not in (None, 0, C.c_void_p(-1).value), 'RH_CONOUT_UNAVAILABLE')
              return h

          def read_screen(h):
              info = ScreenInfo()
              need(api('GetConsoleScreenBufferInfo', W.BOOL, W.HANDLE, C.POINTER(ScreenInfo))(h, C.byref(info)), 'RH_CONSOLE_INFO')
              count = info.size.x * (info.cursor.y + 1)
              need(0 < count <= 65536, 'RH_CONSOLE_BOUND')
              buf, actual = C.create_unicode_buffer(count + 1), W.DWORD()
              need(api('ReadConsoleOutputCharacterW', W.BOOL, W.HANDLE, W.LPWSTR, W.DWORD, Coord, C.POINTER(W.DWORD))(h, buf, count, Coord(0, 0), C.byref(actual)), 'RH_CONSOLE_READ')
              return buf[:actual.value]

          def peek(fd):
              n = W.DWORD()
              if not api('PeekNamedPipe', W.BOOL, W.HANDLE, C.c_void_p, W.DWORD, C.c_void_p, C.POINTER(W.DWORD), C.c_void_p)(msvcrt.get_osfhandle(fd), None, 0, None, C.byref(n), None):
                  error = C.get_last_error()
                  if error in (109, 232):
                      return None
                  raise OSError(error, 'RH_PEEK_FAILED')
              return n.value

          def drain(stream, target):
              for _ in range(16):
                  n = peek(stream.fileno())
                  if not n:
                      return
                  target.extend(os.read(stream.fileno(), min(n, 4096)))
                  need(len(target) <= 16384, 'RH_OUTPUT_BOUND')

          def child_env(root, win):
              env = {'SystemRoot': str(win), 'WINDIR': str(win), 'SystemDrive': win.drive,
                     'PATH': str(win / 'System32'), 'COMSPEC': str(win / 'System32/cmd.exe'),
                     'PSModulePath': str(win / 'System32/WindowsPowerShell/v1.0/Modules'),
                     'POWERSHELL_TELEMETRY_OPTOUT': '1'}
              for name in ('HOME','USERPROFILE','APPDATA','LOCALAPPDATA','PROGRAMDATA','ALLUSERSPROFILE','PUBLIC','TEMP','TMP','TMPDIR'):
                  env[name] = str(root)
              env.update(HOMEDRIVE=root.drive, HOMEPATH=str(root)[len(root.drive):], PSModuleAnalysisCachePath=str(root / 'module-cache'))
              return env

          def run_case(case, root):
              screen_handle = open_private_console()
              job = private_job()
              win = system_dir()
              ps = win / 'System32/WindowsPowerShell/v1.0/powershell.exe'
              need(ps.is_file(), 'RH_PS51_UNAVAILABLE')
              token = 'RH_PROMPT_' + case
              prompt = token + '\u6d4b\u8bd5'
              need(token not in read_screen(screen_handle), 'RH_STALE_CONSOLE_MARKER')
              read = '[Console]::ReadLine()' if case == 'RAW_N' else "Read-Host ('" + token + "'+[char]0x6d4b+[char]0x8bd5)"
              code = (
                  "$ErrorActionPreference='Stop'; "
                  "if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1 -or -not [Environment]::Is64BitProcess) { exit 20 }; "
                  "[Console]::WriteLine('RH_VERSION='+$PSVersionTable.PSVersion.ToString()); "
                  "[Console]::WriteLine('RH_INPUT_REDIRECTED='+[Console]::IsInputRedirected); "
                  "[Console]::WriteLine('RH_BEFORE'); [Console]::Out.Flush(); "
                  "try { $a=" + read + " } catch { [Console]::WriteLine(); [Console]::WriteLine('RH_RETURN=EXCEPTION'); [Console]::Out.Flush(); exit 12 }; "
                  "if ($null -eq $a) { $result='NULL' } elseif ($a -ceq 'N') { $result='N' } elseif ($a -ceq '') { $result='EMPTY' } else { $result='OTHER' }; "
                  "[Console]::WriteLine(); [Console]::WriteLine('RH_RETURN='+$result); [Console]::Out.Flush(); exit 0"
              )
              rd, wr = os.pipe()
              msvcrt.setmode(rd, os.O_BINARY); msvcrt.setmode(wr, os.O_BINARY)
              out, err = bytearray(), bytearray()
              seen = dict.fromkeys(('stdout_ascii','stdout_utf8','stderr_ascii','console_ascii','console_unicode'), False)
              screen_sample = ''
              prompt_before_action = None
              before_at, action, timed_out, p = None, 'NONE', False, None

              def observe():
                  nonlocal screen_sample
                  drain(p.stdout, out); drain(p.stderr, err)
                  screen = read_screen(screen_handle)
                  seen['stdout_ascii'] |= token.encode('ascii') in out
                  seen['stdout_utf8'] |= prompt.encode('utf-8') in out
                  seen['stderr_ascii'] |= token.encode('ascii') in err
                  seen['console_ascii'] |= token in screen
                  seen['console_unicode'] |= prompt in screen
                  if token in screen:
                      i = screen.index(token)
                      screen_sample = screen[i:i+len(prompt)+8]

              try:
                  p = subprocess.Popen([str(ps), '-NoLogo', '-NoProfile', '-Command', code], cwd=root,
                                       env=child_env(root, win), stdin=rd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  deadline = time.monotonic() + 10
                  while True:
                      observe()
                      now = time.monotonic()
                      if b'RH_BEFORE' in out and before_at is None:
                          before_at = now
                      if p.poll() is not None:
                          break
                      if now >= deadline:
                          timed_out = True
                          p.kill(); p.wait(timeout=3)
                          break
                      if before_at is not None and action == 'NONE':
                          visible = seen['stdout_ascii'] or seen['stderr_ascii'] or seen['console_ascii']
                          if case == 'RAW_N':
                              prompt_before_action = dict(seen)
                              need(os.write(wr, b'N\r\n') == 3, 'RH_N_WRITE')
                              action = 'RAW_N_AFTER_BEFORE'
                          elif visible or now - before_at >= 2:
                              prompt_before_action = dict(seen)
                              basis = 'PROMPT_OBSERVED' if visible else 'PRE_MARKER_ONLY'
                              if case == 'HOST_N':
                                  need(os.write(wr, b'N\r\n') == 3, 'RH_N_WRITE')
                                  action = 'N_' + basis
                              else:
                                  os.close(wr); wr = None
                                  action = 'EOF_' + basis
                      time.sleep(.05)
                  idle(job)
                  observe()
                  remaining = peek(rd) if wr is not None else None
                  output_eof = peek(p.stdout.fileno()) is None and peek(p.stderr.fileno()) is None
                  returned = re.findall(rb'(?m)^RH_RETURN=([A-Z]+)\r?$', out)
                  version = re.findall(rb'(?m)^RH_VERSION=(5\.1\.\d+\.\d+)\r?$', out)
                  result = {'case': case, 'ps51': version[0].decode('ascii') if len(version) == 1 else None,
                            'input_redirected': b'RH_INPUT_REDIRECTED=True' in out, 'before_seen': before_at is not None,
                            'prompt_before_action': prompt_before_action, 'prompt': seen, 'console_sample_utf16le_hex': screen_sample.encode('utf-16le').hex(),
                            'input_action': action, 'stdin_remaining': remaining,
                            'returned': returned[0].decode('ascii') if len(returned) == 1 else None,
                            'return_marker_count': len(returned), 'timeout': timed_out, 'rc': p.returncode,
                            'output_eof': output_eof, 'stdout_hex': bytes(out).hex(), 'stderr_hex': bytes(err).hex()}
                  print(json.dumps(result, ensure_ascii=True), flush=True)
              finally:
                  if p is not None:
                      if p.poll() is None:
                          p.kill(); p.wait(timeout=3)
                      p.stdout.close(); p.stderr.close()
                  if wr is not None:
                      os.close(wr)
                  os.close(rd)
                  api('CloseHandle', W.BOOL, W.HANDLE)(screen_handle)
                  # Keep the sole job handle until worker exit; never kill unrelated processes.
                  _ = job

          def classify(r):
              if r['case'] == 'HOST_EOF':
                  if not r['input_action'].startswith('EOF_'):
                      return 'DIFFERENT_OBSERVATION'
                  if r['timeout']:
                      return 'EOF_TIMEOUT'
                  if (r['returned'], r['rc']) in (('NULL',0),('EMPTY',0),('EXCEPTION',12)):
                      return 'EOF_' + r['returned']
                  return 'DIFFERENT_OBSERVATION'
              accepted = (r['returned'] == 'N' and r['rc'] == 0 and not r['timeout'] and r['stdin_remaining'] == 0 and not r['stderr_hex'])
              s, pre = r['prompt'], r['prompt_before_action']
              if r['input_action'] == 'N_PROMPT_OBSERVED' and accepted and pre is not None:
                  if pre['stdout_utf8']:
                      return 'NOT_REPRODUCED'
                  if pre['console_ascii'] and not s['stdout_ascii'] and not s['stderr_ascii']:
                      return 'CONSOLE_ONLY_N_CONSUMED'
                  if pre['stdout_ascii'] and not s['stdout_utf8']:
                      return 'STDOUT_PROMPT_BYTES_DIFFER'
                  return 'DIFFERENT_OBSERVATION'
              if r['input_action'] == 'N_PRE_MARKER_ONLY' and accepted:
                  return 'N_CONSUMED_WITHOUT_PRIOR_PROMPT'
              if r['timeout'] and r['input_action'].startswith('N_'):
                  return 'N_UNREAD_TIMEOUT' if r['stdin_remaining'] == 3 else 'TIMEOUT_AFTER_N'
              return 'DIFFERENT_OBSERVATION'

          def main():
              need(os.name == 'nt' and struct.calcsize('P') == 8 and sys.flags.isolated and sys.dont_write_bytecode, 'RH_WINDOWS_X64_REQUIRED')
              if len(sys.argv) == 4 and sys.argv[1] == '--worker':
                  need(sys.argv[2] in CASES, 'RH_UNKNOWN_CASE')
                  run_case(sys.argv[2], plain_dir(sys.argv[3]))
                  return
              need(len(sys.argv) == 2, 'RH_ARGS')
              root = plain_dir(sys.argv[1])
              need(root.parent == plain_dir(os.environ['RUNNER_TEMP']) and root.name.startswith('readhost-marker-') and set(root.iterdir()) == {Path(__file__).absolute()}, 'RH_OWNED_SCOPE')
              print('RH_PYTHON=' + sys.version.split()[0], flush=True)
              for case in CASES:
                  owned = root / case
                  owned.mkdir()
                  startup = subprocess.STARTUPINFO()
                  startup.dwFlags |= subprocess.STARTF_USESHOWWINDOW
                  startup.wShowWindow = 0
                  try:
                      r = subprocess.run([sys.executable, '-I', '-S', '-B', str(Path(__file__).absolute()), '--worker', case, str(owned)],
                                         cwd=owned, env=child_env(owned, system_dir()), stdin=subprocess.DEVNULL, capture_output=True,
                                         startupinfo=startup, creationflags=subprocess.CREATE_NEW_CONSOLE, timeout=20)
                  except subprocess.TimeoutExpired:
                      raise RuntimeError('RH_WORKER_TIMEOUT') from None
                  if r.returncode or r.stderr:
                      labels = re.findall(rb'(?m)^RuntimeError: (RH_[A-Z0-9_]+)\r?$', r.stderr)
                      raise RuntimeError(labels[-1].decode('ascii') if labels else 'RH_WORKER_FAILED_OR_INCONCLUSIVE')
                  report = json.loads(r.stdout.decode('ascii'))
                  print('RH_CASE=' + json.dumps(report, ensure_ascii=True), flush=True)
                  need(report['case'] == case and report['ps51'] and report['input_redirected'] and report['before_seen'] and report['output_eof'], 'RH_TELEMETRY_INCOMPLETE')
                  if case == 'RAW_N':
                      need(report['rc'] == 0 and not report['timeout'] and report['returned'] == 'N' and report['return_marker_count'] == 1
                           and report['stdin_remaining'] == 0 and report['input_action'] == 'RAW_N_AFTER_BEFORE' and not report['stderr_hex'], 'RH_RAW_PIPE_BASELINE_FAILED')
                      print('RH_RAW_PIPE_BASELINE=PASS', flush=True)
                  else:
                      print('RH_' + case + '_OBSERVATION=' + classify(report), flush=True)
              for directory, dirs, files in os.walk(root, followlinks=False):
                  plain_dir(directory)
                  for name in dirs + files:
                      s = (Path(directory) / name).lstat()
                      need(not getattr(s, 'st_file_attributes', 0) & 0x400 and not stat.S_ISLNK(s.st_mode) and
                           (stat.S_ISDIR(s.st_mode) or (stat.S_ISREG(s.st_mode) and s.st_nlink == 1)), 'RH_UNSAFE_CLEANUP_TREE')
              shutil.rmtree(root)
              need(not root.exists(), 'RH_CLEANUP_FAILED')
              print('RH_OWNED_CLEANUP=PASS', flush=True)
              print('RH_DIAGNOSTIC_COMPLETE=YES', flush=True)

          if __name__ == '__main__':
              main()
          '@
          [IO.File]::WriteAllText($script, $probe, [Text.UTF8Encoding]::new($false))
          & $python -I -S -B $script $owned
          if ($LASTEXITCODE -ne 0) { throw 'RH_BLOCKED_OR_INCONCLUSIVE; owned scope retained when possible' }
