# Draft only. NOT submitted, triggered, or executed.
#
# Proposed path:
# .github/workflows/candidate-temp-preflight.yml
#
# Repository: rileyaaa/Portable
# Branch: dev/stable-tool-refresh
#
# Reviewed parent and ONLY candidate source:
# 10464597e5c0934bd150390e4dd002a70ee5542b
#
# Trigger requires a separately authorized commit that adds ONLY this workflow.
# Do not commit this file merely to save the proposal: doing so would trigger it.
#
# No main changes, release, tag, installation, account login, SSH,
# external service tests, launcher tests, or PATH consumer tests.
#
# GitHub network use is limited to:
#   1. Read-only trigger commit metadata.
#   2. Checkout of the fixed reviewed source and its existing LFS objects.
#   3. Upload of one short-lived, explicitly enumerated artifact.
#
# No repository secrets or PATs.
# Checkout uses the built-in read-only job token without persisting credentials.
# Artifact upload uses the standard Actions artifact runtime.
#
# Both action SHAs have been checked against their official repository tags.
# This YAML has not been executed on Windows.

name: One-time Windows candidate ZIP and TEMP preflight

on:
  push:
    branches:
      - dev/stable-tool-refresh
    paths:
      - .github/workflows/candidate-temp-preflight.yml

permissions:
  contents: read

concurrency:
  group: portable-candidate-temp-preflight-10464597
  cancel-in-progress: false

jobs:
  preflight:
    name: Fixed Windows ZIP and offline TEMP validation

    # A different branch, repository, parent, forced push, branch creation,
    # deletion, or rerun must not start this job.
    if: >-
      ${{
        github.repository == 'rileyaaa/Portable' &&
        github.ref == 'refs/heads/dev/stable-tool-refresh' &&
        github.event_name == 'push' &&
        github.event.before == '10464597e5c0934bd150390e4dd002a70ee5542b' &&
        github.event.after == github.sha &&
        github.event.created == false &&
        github.event.deleted == false &&
        github.event.forced == false &&
        github.run_attempt == '1'
      }}

    runs-on: windows-2025
    timeout-minutes: 90

    defaults:
      run:
        shell: powershell

    env:
      SOURCE_COMMIT: '10464597e5c0934bd150390e4dd002a70ee5542b'
      SOURCE_DIRECTORY: candidate-source
      WORKFLOW_PATH: .github/workflows/candidate-temp-preflight.yml
      ARCHIVE_NAME: Codex-Portable-v0.172.0-portable.2-windows-x64.zip
      EXPECTED_FILE_COUNT: '9185'
      EXPECTED_TEST_BLOB: '5f35b7f53d0934c17c5ed5c46ca087943e304444'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      # ---------------------------------------------------------------
      # 1. Create an owned, small evidence directory.
      #
      # This directory is outside the candidate checkout.
      # Raw process logs are temporary and will NEVER be uploaded.
      # ---------------------------------------------------------------
      - name: Initialize owned evidence directory
        id: init
        run: |
          $ErrorActionPreference = 'Stop'

          $Report = Join-Path $env:GITHUB_WORKSPACE (
              'preflight-report-' +
              $env:GITHUB_RUN_ID + '-' +
              $env:GITHUB_RUN_ATTEMPT
          )

          if (Test-Path -LiteralPath $Report) {
              throw 'Evidence directory already exists'
          }

          New-Item -ItemType Directory -Path $Report | Out-Null

          "directory=$Report" |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append

      # ---------------------------------------------------------------
      # 2. Verify that the triggering commit has exactly one parent,
      #    and that its only change is addition of this workflow.
      #
      # Public GitHub metadata GET only.
      # No checkout of the triggering workflow commit.
      # No authentication header, secrets, PAT, or permission escalation.
      #
      # If this guard cannot be verified, STOP before checkout.
      # ---------------------------------------------------------------
      - name: Verify exact trigger commit
        id: guard
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
              throw 'Invalid trigger commit SHA'
          }

          $Uri = (
              'https://api.github.com/repos/rileyaaa/Portable/commits/' +
              $env:GITHUB_SHA +
              '?per_page=2'
          )

          $Commit = Invoke-RestMethod `
              -Method Get `
              -Uri $Uri `
              -TimeoutSec 30 `
              -Headers @{
                  Accept = 'application/vnd.github+json'
              }

          if ($Commit.sha -cne $env:GITHUB_SHA) {
              throw 'Trigger commit identity mismatch'
          }

          if (@($Commit.parents).Count -ne 1 -or
              $Commit.parents[0].sha -cne $env:SOURCE_COMMIT) {
              throw 'Trigger must be the direct child of reviewed source'
          }

          if (@($Commit.files).Count -ne 1) {
              throw 'Trigger must change exactly one file'
          }

          if ($Commit.files[0].filename -cne $env:WORKFLOW_PATH -or
              $Commit.files[0].status -cne 'added') {
              throw 'Only addition of the designated workflow is allowed'
          }

          Write-Output 'PASS exact trigger commit guard'

      # ---------------------------------------------------------------
      # 3. Checkout ONLY the reviewed source.
      #
      # Official actions/checkout v7.0.1, immutable commit.
      # No checkout of main or a moving branch.
      # No checkout of the new workflow commit.
      # No submodules, tags, full history, or persistent credentials.
      #
      # LFS hydration is part of source preparation.
      # Missing Git/LFS tools or payloads must fail; do not install tools.
      # ---------------------------------------------------------------
      - name: Checkout fixed reviewed candidate
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rileyaaa/Portable
          ref: '10464597e5c0934bd150390e4dd002a70ee5542b'
          path: candidate-source
          fetch-depth: 2
          fetch-tags: false
          lfs: true
          submodules: false
          clean: true
          persist-credentials: false

      # ---------------------------------------------------------------
      # 4. Execute the already committed independent preflight script.
      #
      # The script alone is responsible for:
      #   - Existing packager --check.
      #   - Building ONE candidate ZIP.
      #   - SHA256SUMS and manifest verification.
      #   - Every ZIP member size, digest and CRC.
      #   - Fresh Unicode/space-path extraction.
      #   - Verification of extracted file contents.
      #   - The fixed six TEMP/TMP/TMPDIR cases using extracted Python.
      #   - Cleaning its own extraction directory.
      #   - Rechecking the retained ZIP after testing.
      #
      # Do not rerun on failure.
      # Do not call any other project test.
      #
      # Capture the script exit code independently from its JSON evidence.
      # ---------------------------------------------------------------
      - name: Build verify and run offline TEMP preflight
        id: native
        env:
          REPORT_DIRECTORY: ${{ steps.init.outputs.directory }}
          GIT_NO_LAZY_FETCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'

          $Root = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_DIRECTORY
          $Report = $env:REPORT_DIRECTORY

          $Head = git -C $Root rev-parse HEAD

          if ($LASTEXITCODE -ne 0 -or
              $Head -cne $env:SOURCE_COMMIT) {
              throw 'Candidate checkout SHA mismatch'
          }

          $Script = Join-Path $Root 'tests\run_candidate_temp_preflight.ps1'

          $Blob = git -C $Root hash-object -- $Script

          if ($LASTEXITCODE -ne 0 -or
              $Blob -cne '649806543623b8e8b6be342fc7b921f2e2b513db') {
              throw 'Reviewed preflight script bytes differ'
          }

          # Require a fresh build area. Never adopt an earlier candidate.
          $Tmp = Join-Path $Root 'tmp'

          if (Test-Path -LiteralPath $Tmp) {
              $Existing = @(
                  Get-ChildItem -LiteralPath $Tmp `
                      -Directory -Filter 'release-*'
              )

              if ($Existing.Count -ne 0) {
                  throw 'Unexpected pre-existing candidate directory'
              }
          }

          'fresh_build_area=true' |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append

          $Engine = Join-Path $env:SystemRoot (
              'System32\WindowsPowerShell\v1.0\powershell.exe'
          )

          $Arguments = @(
              '-NoLogo'
              '-NoProfile'
              '-NonInteractive'
              '-File'
              ('"{0}"' -f $Script)
              '-SourceRoot'
              ('"{0}"' -f $Root)
              '-ExpectedSourceCommit'
              $env:SOURCE_COMMIT
          )

          $Process = Start-Process `
              -FilePath $Engine `
              -ArgumentList $Arguments `
              -WorkingDirectory $Root `
              -RedirectStandardOutput (Join-Path $Report 'native.stdout') `
              -RedirectStandardError (Join-Path $Report 'native.stderr') `
              -Wait `
              -PassThru

          $Code = $Process.ExitCode

          "exit_code=$Code" |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append

          Write-Output "Native preflight exit code: $Code"

          # Failure does not suppress the following evidence collection.
          exit $Code

      # ---------------------------------------------------------------
      # 5. Collect a SMALL summary and determine whether the ZIP is usable.
      #
      # Independent states:
      #
      # ZIP_VERIFIED:
      #   Existing script verified the complete archive, and this step
      #   independently rechecks the three retained files.
      #
      # TEMP_PASS_NATIVE_SYNTHETIC:
      #   All six fixed tests passed using extracted Windows Python.
      #
      # TEMP_FAIL / TEMP_NOT_RUN:
      #   Do not promote the old Windows coverage records.
      #
      # A verified ZIP may be retained even if TEMP or extraction fails.
      # An unverified or absent ZIP must NEVER be uploaded.
      #
      # All stdout/stderr logs remain local and are discarded.
      # ---------------------------------------------------------------
      - name: Collect bounded evidence and select upload files
        id: collect
        if: >-
          ${{
            always() &&
            !cancelled() &&
            steps.init.outcome == 'success'
          }}
        env:
          REPORT_DIRECTORY: ${{ steps.init.outputs.directory }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          NATIVE_EXIT_CODE: ${{ steps.native.outputs.exit_code }}
          FRESH_BUILD_AREA: ${{ steps.native.outputs.fresh_build_area }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Root = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_DIRECTORY
          $Report = $env:REPORT_DIRECTORY
          $SummaryPath = Join-Path $Report 'preflight-summary.json'

          $Summary = [ordered]@{
              repository = 'rileyaaa/Portable'
              branch = 'dev/stable-tool-refresh'
              source_commit = $env:SOURCE_COMMIT
              workflow_commit = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              scope = 'Windows candidate ZIP and synthetic TEMP only'
              guard_outcome = $env:GUARD_OUTCOME
              checkout_outcome = $env:CHECKOUT_OUTCOME
              native_outcome = $env:NATIVE_OUTCOME
              native_exit_code = $null
              zip_status = 'ZIP_UNVERIFIED'
              temp_status = 'TEMP_NOT_RUN'
              temp_exit_code = $null
              extraction_cleanup = 'NOT_RUN'
              archive_sha256 = $null
              manifest_sha256 = $null
              checksums_sha256 = $null
              file_count = $null
              temp_test_blob = $env:EXPECTED_TEST_BLOB
              accepted = $false
          }

          if ($env:NATIVE_EXIT_CODE -match '^-?[0-9]+$') {
              $Summary.native_exit_code = [int]$env:NATIVE_EXIT_CODE
          }

          $Candidate = $null
          $Verified = $false

          function Get-LowerSHA256 {
              param([string]$Path)

              return (
                  Get-FileHash -LiteralPath $Path -Algorithm SHA256
              ).Hash.ToLowerInvariant()
          }

          function Limit-Text {
              param([object]$Value)

              $Text = [string]$Value

              if ($Text.Length -gt 600) {
                  return $Text.Substring(0, 600)
              }

              return $Text
          }

          try {
              if ($env:GUARD_OUTCOME -ne 'success' -or
                  $env:CHECKOUT_OUTCOME -ne 'success') {
                  throw 'Trigger guard or source preparation failed'
              }

              $Stdout = Join-Path $Report 'native.stdout'

              if (-not (Test-Path -LiteralPath $Stdout -PathType Leaf)) {
                  throw 'No native preflight evidence was produced'
              }

              if ((Get-Item -LiteralPath $Stdout).Length -gt 32768) {
                  throw 'Native evidence exceeds expected size'
              }

              $Evidence = Get-Content `
                  -LiteralPath $Stdout -Raw -Encoding UTF8 |
                  ConvertFrom-Json

              if ($Evidence.source_commit -cne $env:SOURCE_COMMIT -or
                  $Evidence.test_blob -cne $env:EXPECTED_TEST_BLOB) {
                  throw 'Native evidence identity mismatch'
              }

              $Summary.reported_zip_status = $Evidence.zip_status
              $Summary.reported_temp_status = $Evidence.temp_status
              $Summary.temp_exit_code = $Evidence.temp_exit_code
              $Summary.extraction_cleanup = $Evidence.cleanup_status
              $Summary.windows_version = $Evidence.windows_version
              $Summary.powershell_version = $Evidence.powershell_version
              $Summary.python_version = $Evidence.python_version

              if ($Evidence.failure) {
                  $Summary.native_failure = Limit-Text $Evidence.failure
              }

              if ($Evidence.cleanup_error) {
                  $Summary.extraction_cleanup_error = Limit-Text `
                      $Evidence.cleanup_error
              }

              if (-not $Evidence.output_dir) {
                  throw 'No candidate output directory was produced'
              }

              if ($env:FRESH_BUILD_AREA -cne 'true') {
                  throw 'Fresh candidate ownership was not established'
              }

              # Admit only the packager-created release-* directory
              # directly under this fresh checkout's tmp directory.
              $Path = [IO.Path]::GetFullPath(
                  [string]$Evidence.output_dir
              )

              $ExpectedParent = Join-Path $Root 'tmp'

              if (-not [string]::Equals(
                      (Split-Path -Parent $Path),
                      $ExpectedParent,
                      [StringComparison]::OrdinalIgnoreCase
                  ) -or
                  (Split-Path -Leaf $Path) -cnotmatch '^release-[a-z0-9_]+$') {
                  throw 'Unexpected candidate output directory'
              }

              $Item = Get-Item -LiteralPath $Path

              if (-not $Item.PSIsContainer -or
                  ($Item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw 'Candidate must be an ordinary directory'
              }

              $Candidate = $Path

              # Save the exact owned directory for later local cleanup.
              "owned_candidate=$Candidate" |
                  Out-File -FilePath $env:GITHUB_OUTPUT `
                      -Encoding utf8 -Append

              # Confirm the persisted evidence agrees with stdout.
              $EvidencePath = Join-Path $Candidate 'preflight-evidence.json'

              if ((Get-Item -LiteralPath $EvidencePath).Length -gt 32768) {
                  throw 'Persisted evidence exceeds expected size'
              }

              $Persisted = Get-Content `
                  -LiteralPath $EvidencePath -Raw -Encoding UTF8 |
                  ConvertFrom-Json

              foreach ($Field in @(
                  'source_commit',
                  'test_blob',
                  'output_dir',
                  'zip_status',
                  'archive_sha256',
                  'manifest_sha256',
                  'checksums_sha256',
                  'file_count',
                  'temp_status',
                  'temp_exit_code',
                  'cleanup_status'
              )) {
                  if ($Persisted.$Field -cne $Evidence.$Field) {
                      throw "Persisted evidence differs: $Field"
                  }
              }

              if ($Evidence.zip_status -cne 'ZIP_VERIFIED') {
                  throw 'The existing script did not verify the ZIP'
              }

              if ($Evidence.file_count -ne [int]$env:EXPECTED_FILE_COUNT) {
                  throw 'Candidate inventory count mismatch'
              }

              # ONLY these three candidate files can be selected.
              $Zip = Join-Path $Candidate $env:ARCHIVE_NAME
              $Manifest = Join-Path $Candidate 'release-manifest.json'
              $Sums = Join-Path $Candidate 'SHA256SUMS'

              foreach ($File in @($Zip, $Manifest, $Sums)) {
                  $Entry = Get-Item -LiteralPath $File

                  if ($Entry.PSIsContainer -or
                      ($Entry.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                      throw 'Unexpected candidate file type'
                  }
              }

              $ZipSHA = Get-LowerSHA256 $Zip
              $ManifestSHA = Get-LowerSHA256 $Manifest
              $SumsSHA = Get-LowerSHA256 $Sums

              if ($ZipSHA -cne $Evidence.archive_sha256 -or
                  $ManifestSHA -cne $Evidence.manifest_sha256 -or
                  $SumsSHA -cne $Evidence.checksums_sha256) {
                  throw 'Retained candidate digest mismatch'
              }

              $Lines = @(
                  Get-Content -LiteralPath $Sums -Encoding ASCII
              )

              if ($Lines.Count -ne 2 -or
                  $Lines[0] -cne ($ZipSHA + '  ' + $env:ARCHIVE_NAME) -or
                  $Lines[1] -cne ($ManifestSHA + '  release-manifest.json')) {
                  throw 'SHA256SUMS content mismatch'
              }

              # ZIP verification is independent of the TEMP outcome.
              $Verified = $true

              $Summary.zip_status = 'ZIP_VERIFIED'
              $Summary.archive_sha256 = $ZipSHA
              $Summary.manifest_sha256 = $ManifestSHA
              $Summary.checksums_sha256 = $SumsSHA
              $Summary.archive_bytes = (Get-Item -LiteralPath $Zip).Length
              $Summary.file_count = $Evidence.file_count

              $Summary.python_sha256 = $Evidence.python_sha256
              $Summary.temp_test_sha256 = $Evidence.test_sha256

              switch -CaseSensitive ($Evidence.temp_status) {
                  'TEMP_PASS_NATIVE_SYNTHETIC' {
                      if ($Evidence.temp_exit_code -eq 0 -and
                          $Evidence.python_sha256 -cmatch '^[0-9a-f]{64}$' -and
                          $Evidence.test_sha256 -cmatch '^[0-9a-f]{64}$') {
                          $Summary.temp_status = 'TEMP_PASS_NATIVE_SYNTHETIC'
                          $Summary.temp_cases_passed = 6
                          $Summary.temp_cases_expected = 6
                      } else {
                          $Summary.temp_status = 'TEMP_EVIDENCE_INVALID'
                      }
                  }

                  'TEMP_FAIL' {
                      $Summary.temp_status = 'TEMP_FAIL'
                  }

                  'TEMP_NOT_RUN' {
                      $Summary.temp_status = 'TEMP_NOT_RUN'
                  }

                  default {
                      $Summary.temp_status = 'TEMP_EVIDENCE_INVALID'
                  }
              }

              $Summary.accepted = (
                  $Summary.zip_status -ceq 'ZIP_VERIFIED' -and
                  $Summary.temp_status -ceq 'TEMP_PASS_NATIVE_SYNTHETIC' -and
                  $Summary.extraction_cleanup -ceq 'PASS' -and
                  $Summary.native_exit_code -eq 0 -and
                  $env:NATIVE_OUTCOME -ceq 'success'
              )

          } catch {
              $Summary.collection_failure = Limit-Text $_.Exception.Message

              if (-not $Verified -and
                  $Summary.reported_temp_status -eq 'TEMP_PASS_NATIVE_SYNTHETIC') {
                  $Summary.temp_status = 'TEMP_UNATTRIBUTED'
              }

              $Summary.accepted = $false
          }

          # Always produce a small summary, including when no ZIP exists.
          $Json = $Summary | ConvertTo-Json -Depth 5

          [IO.File]::WriteAllText(
              $SummaryPath,
              $Json + [Environment]::NewLine,
              (New-Object Text.UTF8Encoding($false))
          )

          if ((Get-Item -LiteralPath $SummaryPath).Length -gt 16384) {
              throw 'Summary exceeds the 16 KiB retention limit'
          }

          # EXACT upload allowlist:
          #
          # Always:
          #   preflight-report-<run-id>-<attempt>/preflight-summary.json
          #
          # ONLY if ZIP_VERIFIED:
          #   candidate-source/tmp/release-*/Codex-Portable-v0.172.0-portable.2-windows-x64.zip
          #   candidate-source/tmp/release-*/release-manifest.json
          #   candidate-source/tmp/release-*/SHA256SUMS
          #
          # The release-* notation above describes the directory name only.
          # Actual action input uses the exact resolved paths, not wildcards.

          $UploadPaths = @($SummaryPath)

          if ($Verified) {
              $UploadPaths += @($Zip, $Manifest, $Sums)
          }

          $OutputLines = @('upload_paths<<PORTABLE_UPLOAD_PATHS')
          $OutputLines += $UploadPaths
          $OutputLines += 'PORTABLE_UPLOAD_PATHS'

          $OutputLines |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append

          "accepted=$($Summary.accepted.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append

          Write-Output "ZIP: $($Summary.zip_status)"
          Write-Output "TEMP: $($Summary.temp_status)"
          Write-Output "Extraction cleanup: $($Summary.extraction_cleanup)"

      # ---------------------------------------------------------------
      # 6. Upload ONE artifact at most.
      #
      # Official actions/upload-artifact v4.6.2, immutable commit.
      #
      # Successful ZIP:
      #   one original ZIP + its manifest + checksum file + small summary.
      #
      # Failed or absent ZIP:
      #   small summary ONLY.
      #
      # No extraction copy, complete logs, LFS checkout, source tree,
      # duplicate ZIP, dependency cache, or additional diagnostic artifact.
      #
      # No staging copy of the large ZIP is created.
      # No publication or artifact-to-Release promotion.
      # ---------------------------------------------------------------
      - name: Retain one candidate or summary only
        id: upload
        if: >-
          ${{
            always() &&
            !cancelled() &&
            steps.collect.outcome == 'success'
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-0172-temp-preflight-10464597-${{ github.run_id }}
          path: ${{ steps.collect.outputs.upload_paths }}
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      # ---------------------------------------------------------------
      # 7. Clean only directories created by this run.
      #
      # The independent preflight script already cleans its extraction.
      #
      # After the upload attempt, remove:
      #   - The exact owned release-* output directory, if established.
      #   - The exact owned evidence directory, including raw local logs.
      #
      # Never recursively delete the entire source checkout, tmp, work,
      # cache, LFS store, or any unrelated directory.
      #
      # If ownership cannot be established, leave the unknown output
      # to disposal of the ephemeral GitHub-hosted runner.
      #
      # Cancellation/runner loss cannot guarantee cleanup-step execution.
      # No repository cleanup commit or artifact deletion is performed.
      # ---------------------------------------------------------------
      - name: Clean owned local preflight outputs
        id: cleanup
        if: >-
          ${{
            always() &&
            steps.init.outcome == 'success'
          }}
        env:
          REPORT_DIRECTORY: ${{ steps.init.outputs.directory }}
          OWNED_CANDIDATE: ${{ steps.collect.outputs.owned_candidate }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Root = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_DIRECTORY

          if ($env:OWNED_CANDIDATE) {
              $Candidate = [IO.Path]::GetFullPath(
                  $env:OWNED_CANDIDATE
              )

              if (-not [string]::Equals(
                      (Split-Path -Parent $Candidate),
                      (Join-Path $Root 'tmp'),
                      [StringComparison]::OrdinalIgnoreCase
                  ) -or
                  (Split-Path -Leaf $Candidate) -cnotmatch '^release-[a-z0-9_]+$') {
                  throw 'Refusing unexpected cleanup target'
              }

              if (Test-Path -LiteralPath $Candidate) {
                  Remove-Item -LiteralPath $Candidate -Recurse -Force
              }

              if (Test-Path -LiteralPath $Candidate) {
                  throw 'Owned candidate cleanup failed'
              }
          }

          $ExpectedReport = Join-Path $env:GITHUB_WORKSPACE (
              'preflight-report-' +
              $env:GITHUB_RUN_ID + '-' +
              $env:GITHUB_RUN_ATTEMPT
          )

          if ($env:REPORT_DIRECTORY -cne $ExpectedReport) {
              throw 'Unexpected evidence cleanup target'
          }

          if (Test-Path -LiteralPath $ExpectedReport) {
              Remove-Item -LiteralPath $ExpectedReport -Recurse -Force
          }

          if (Test-Path -LiteralPath $ExpectedReport) {
              throw 'Owned evidence cleanup failed'
          }

          Write-Output 'PASS owned local output cleanup'

      # ---------------------------------------------------------------
      # 8. Final job decision.
      #
      # A completed harness is NOT an all-pass result.
      #
      # Success requires all of:
      #   - Verified original candidate ZIP.
      #   - Six native Python synthetic TEMP cases passed.
      #   - Successful extraction cleanup.
      #   - Native script exit code 0.
      #   - Successful evidence/artifact upload.
      #   - Successful local output cleanup.
      #
      # ZIP_VERIFIED + TEMP_FAIL still retains the usable ZIP,
      # but this job must remain failed.
      #
      # No automatic retry, publishing, branch update, or workflow removal.
      # ---------------------------------------------------------------
      - name: Enforce independent ZIP and TEMP acceptance
        if: ${{ always() && !cancelled() }}
        env:
          ACCEPTED: ${{ steps.collect.outputs.accepted }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:ACCEPTED -cne 'true') {
              throw 'Scoped ZIP/TEMP acceptance did not pass'
          }

          if ($env:UPLOAD_OUTCOME -cne 'success') {
              throw 'Verified candidate is not retained successfully'
          }

          if ($env:CLEANUP_OUTCOME -cne 'success') {
              throw 'Owned local cleanup did not pass'
          }

          Write-Output 'PASS scoped Windows ZIP and synthetic TEMP preflight'
          Write-Output 'NOT a full Portable regression or release approval'
