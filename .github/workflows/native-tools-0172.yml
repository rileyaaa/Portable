name: Native skill discovery and tool environment audit (one time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-tools-0172.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Preserve original bytes
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw 'git config failed' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Normal mode actual model-visible skills and bundled tools
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py normal
          if ($LASTEXITCODE) { throw 'Normal mode native discovery or tool execution failed' }
      - name: Latest model and existing YOLO browser task without MCP
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser
          if ($LASTEXITCODE) { throw 'Browser task native discovery or execution failed' }
      - name: Unknown third-party model and actual normal-mode shell
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py unknown
          if ($LASTEXITCODE) { throw 'Unknown model native discovery or execution failed' }
      - name: Original real Codex and enabled browser MCP regression
        if: always()
        run: |
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Existing native MCP integration failed' }
      - name: Fixed runtime and customer input integrity
        if: always()
        run: |
          & .\tool\python\python.exe -B -m unittest discover -s tests -p 'test_runtime_package.py' -v
          if ($LASTEXITCODE) { throw 'Runtime identity failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input check failed' }
