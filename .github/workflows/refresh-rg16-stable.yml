              ('        assert expected in evidence, "Real tool output did not contain success marker: " + expected',
               '        assert expected in evidence, "Real tool output did not contain success marker: " + expected\n        if mode in {"normal", "unknown", "browser"}:\n            assert "NATIVE_RG16_SEARCH_AND_DISCOVERY=PASS" in evidence, "Missing actual rg 16 search evidence"')])
          print("RG16_EXE_SHA256="+newsha,flush=True)
          print("RG16_ARCHIVE_AND_PE_IDENTITY=PASS",flush=True)
          print("CODEX_PINNED_RG_UNCHANGED=PASS",flush=True)
          '@ | & .\tool\python\python.exe -B -
            if ($LASTEXITCODE) { throw 'Pinned rg payload or targeted source edit failed' }
          } finally {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
            Remove-Item Env:RG_ARCHIVE -ErrorAction SilentlyContinue
