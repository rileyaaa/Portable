      - name: Commit exact seven-file candidate locally, never push before validation
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib,subprocess
          root=pathlib.Path.cwd()
          expected={"tool/bin/rg.exe","tool/cli-versions.json",".github/maintenance/03-verify-cli-versions.py","tool/\u5de5\u5177\u66f4\u65b0\u8bf4\u660e.md","DEVELOPMENT.md","tests/test_cli_version_verifier.py","tests/check_codex_tool_discovery.py"}
          def git(*args):
              return subprocess.check_output(["git",*args],cwd=root)
          def names(*args):
              return set(git(*args).decode("utf-8").strip("\0").split("\0"))- {""}
          assert names("diff","--name-only","-z")==expected
          git("add","--",*sorted(expected))
          assert names("diff","--cached","--name-only","-z")==expected
          assert not git("diff","--name-only","-z")
          git("-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","commit","-m","Refresh standalone ripgrep to verified stable 16.0.0")
          print("LOCAL_CANDIDATE_COMMIT="+git("rev-parse","HEAD").decode().strip(),flush=True)
          assert not git("status","--porcelain=v1","--untracked-files=no")
          '@ | & .\tool\python\python.exe -B -
          if ($LASTEXITCODE) { throw 'Candidate diff or local commit failed' }

      - name: Fixed runtime, CLI manifest, isolation, path and release regressions
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in @('test_cli_version_verifier.py','test_runtime_package.py','test_mode_copies.py','test_release_package.py','test_pdf_library*.py','test_office_output_boundaries.py')) {
            & .\tool\python\python.exe -B -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE) { throw "Regression failed: $test" }
          }
          foreach ($test in @('test_portable_paths.ps1','test_launcher_smoke.ps1','test_runtime_preflight.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'tests' $test)
            if ($LASTEXITCODE) { throw "Windows regression failed: $test" }
          }
      - name: Actual common-mode core tools and Chinese relocation
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('normal','unknown','browser-check')) {
            & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py $mode
            if ($LASTEXITCODE) { throw "Actual native common-mode probe failed: $mode" }
          }
      - name: Actual YOLO tool and browser, native MCP and real Office PDF chain
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py browser
          if ($LASTEXITCODE) { throw 'YOLO rg/browser probe failed' }
          & .\tool\python\python.exe -B tests/check_codex_browser_mcp.py
          if ($LASTEXITCODE) { throw 'Native MCP integration failed' }
          & .\tool\python\python.exe -B tests/check_codex_tool_discovery.py documents
          if ($LASTEXITCODE) { throw 'Native Office/PDF probe failed' }
      - name: Final clean source and customer input gate (no archive upload)
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs fsck
          if ($LASTEXITCODE) { throw 'LFS gate failed' }
          & .\tool\python\python.exe -B tool/package-release.py --check
          if ($LASTEXITCODE) { throw 'Customer input integrity failed' }
          Write-Output 'RG16_WINDOWS_NATIVE_VALIDATION=PASS'
          Write-Output 'Synthetic API only; ADB host profile, PSModulePath startup, online account/approvals, device and optional renderers remain separate.'
      - name: Push only the validated fast-forward development candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne "refs/heads/$env:TARGET_BRANCH" -or $env:TARGET_BRANCH -cne 'dev/stable-tool-refresh') { throw 'Wrong target branch' }
          $current = (git rev-parse HEAD).Trim()
          if ((git rev-parse 'HEAD^').Trim() -cne $env:GITHUB_SHA) { throw 'Candidate not direct child' }
          foreach ($pair in @(@('refs/heads/main',$env:FROZEN),@('refs/tags/v0.172.0-portable.1',$env:FROZEN),@("refs/heads/$env:TARGET_BRANCH",$env:GITHUB_SHA))) {
            $remote = (git ls-remote origin $pair[0]) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($pair[1] + [char]9 + $pair[0])) { throw 'Frozen ref or development branch moved before push' }
          }
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Output "::add-mask::$auth"
          try {
            & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
            if ($LASTEXITCODE) { throw 'Validated development-only push failed' }
          } finally {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $auth = $null
          }
          $after = (git ls-remote origin "refs/heads/$env:TARGET_BRANCH") -join ''
          if ($LASTEXITCODE -ne 0 -or $after -cne ($current + [char]9 + "refs/heads/$env:TARGET_BRANCH")) { throw 'Development push readback mismatch' }
          foreach ($ref in @('refs/heads/main','refs/tags/v0.172.0-portable.1')) {
            $remote = (git ls-remote origin $ref) -join ''
            if ($LASTEXITCODE -ne 0 -or $remote -cne ($env:FROZEN + [char]9 + $ref)) { throw 'Frozen ref changed' }
          }
          Write-Output "VALIDATED_DEV_COMMIT=$current"
          Write-Output 'NO_RELEASE_NO_ARTIFACT_NO_MAIN_CHANGE'
