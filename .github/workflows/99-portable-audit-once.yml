name: "99 - One-time Actions record cleanup"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/99-portable-audit-once.yml"
permissions:
  contents: read
  actions: write
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete historical audit runs, then attempt deleting this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'rileyaaa/Codex-Portable' && "$GITHUB_REF" == 'refs/heads/main' ]] || exit 1
          mapfile -t ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq ".workflow_runs[].id")
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
            ok=0
            for attempt in 1 2 3 4; do
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1; then
                ok=1
                echo "Deleted run $id"
                break
              fi
              sleep 3
            done
            [[ "$ok" -eq 1 ]] || { echo "Unable to delete run $id" >&2; exit 1; }
          done
          echo "Previous records removed; attempting self-cleanup."
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null 2>&1 || true
