          def build_stage(line):
              if line <= 348: return 'source_checkout'
              if line == 349: return 'ocr_notice_identity'
              if line == 350: return 'runtime_identity'
              if line == 351: return 'browser_identity'
              if line == 352: return 'release_label'
              if line <= 387: return 'zip_write'
              if line <= 389: return 'source_recheck'
              if line == 390: return 'zip_verify'
              if line <= 415: return 'metadata_write'
              return 'packager_cleanup'


          def packager_failure(stderr, exit_code):
              # First concrete traceback, not a later chained cleanup exception. Inspect at most 16 KiB.
              # Unknown/malformed diagnostics remain unclassified, never echo a guessed raw reason.
              frames = []
              active = False
              fallback = {'stage':'packager','code':'PACKAGER_NONZERO_UNCLASSIFIED','exit_code':exit_code,
                          'diagnostic_prefix_truncated':len(stderr)>16384}
              for line in stderr[:16384].decode('utf-8', 'replace').splitlines():
                  if line == 'Traceback (most recent call last):':
                      active = True; frames = []; continue
                  if not active:
                      continue
                  match = re.fullmatch(r'\s*File "([^"\r\n]+)", line ([0-9]{1,6}), in (\w+|<module>)\s*', line)
                  if match:
                      path, number, fn = match.groups(); path = path.replace('\\','/').lower()
                      number = int(number)
                      if path.endswith('/tool/package-release.py') and 1 <= number <= 450:
                          frames.append(('packager', number, fn))
                      elif path.endswith('/tool/automation/install-browser.py') and 1 <= number <= 239:
                          frames.append(('browser_verifier', number, fn))
                      continue
                  error = re.match(r'^([A-Za-z_][A-Za-z0-9_.]*)(?::|$)', line)
                  if error and not line.startswith('Traceback '):
                      if not frames:
                          active = False; continue
                      # The deepest recognized source frame supplies the code; the nearest enclosing
                      # known stage supplies context (e.g. ordinary() under runtime_identity()).
                      stage = 'packager'
                      for source, number, fn in frames:
                          if source == 'browser_verifier': stage = 'browser_identity'
                          elif fn == 'build_release': stage = build_stage(number)
                          elif fn in PACKAGER_STAGES: stage = PACKAGER_STAGES[fn]
                      source, number, _ = frames[-1]
                      exc = error[1].rsplit('.',1)[-1]
                      code = (PACKAGER_CODES if source == 'packager' else BROWSER_CODES).get(number) if exc == 'ValueError' else None
                      return {'stage':stage,'code':code or ERROR_CODES.get(exc,'PACKAGER_EXCEPTION'),
                              'source':source,'line':number,'exit_code':exit_code}
              return fallback


          def build_candidate(summary):
