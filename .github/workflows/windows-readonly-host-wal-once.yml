# REVIEW ONLY. Do not commit, dispatch or run without separate authorization.
# New independent scope: one fixed customer ZIP, a read-only Host positive,
# and a separate synthetic Unicode WAL Backup API / bundled CLI positive.
# Not an Office/R3 retry, release, full regression or permission change.
name: Fixed Windows candidate read-only Host and WAL (one-time)
on:
  push:
    branches: [dev/stable-tool-refresh]
    paths:
      - .github/workflows/windows-readonly-host-wal-once.yml
permissions:
  contents: read
concurrency:
  group: portable-readonly-host-wal-e9f70bce
  cancel-in-progress: false
jobs:
  directed:
    if: >-
      github.repository == 'rileyaaa/Portable' &&
      github.ref == 'refs/heads/dev/stable-tool-refresh' &&
      github.event_name == 'push' &&
      github.event.before == 'e9f70bce6c01ff43aa0761f0e3c89d77bb0b96cb' &&
      github.event.after == github.sha &&
      !github.event.created && !github.event.deleted && !github.event.forced &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: verify fixed Windows candidate read-only Host and WAL snapshot'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      # Process-scoped Git setting: preserve raw committed bytes. No global config edit.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_COMMIT: e9f70bce6c01ff43aa0761f0e3c89d77bb0b96cb
      SOURCE_TREE: 75dbced2a61741f3d452cb344f0e6be4bb3851f4
    steps:
      - name: Verify single approved workflow-only trigger before LFS
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $BaseUrl = "$env:GITHUB_API_URL/repos/rileyaaa/Portable"
          $Commit = Invoke-RestMethod -Uri "$BaseUrl/commits/$env:GITHUB_SHA" -Headers $Headers
          $Head = Invoke-RestMethod -Uri "$BaseUrl/git/ref/heads/dev/stable-tool-refresh" -Headers $Headers
          $Files = @($Commit.files)
          if ($Head.object.sha -cne $env:GITHUB_SHA -or $Commit.sha -cne $env:GITHUB_SHA -or
              @($Commit.parents).Count -ne 1 -or $Commit.parents[0].sha -cne $env:SOURCE_COMMIT -or
              $Commit.commit.message -cne 'ci: verify fixed Windows candidate read-only Host and WAL snapshot' -or
              $Files.Count -ne 1 -or $Files[0].status -cne 'added' -or
              $Files[0].filename -cne '.github/workflows/windows-readonly-host-wal-once.yml') {
            throw 'STOP: unexpected trigger commit or branch HEAD'
          }
          Write-Output 'TRIGGER_GATE=PASS_ACTUAL'
      - name: Checkout exact old source without LFS hydration
        id: checkout
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rileyaaa/Portable
          ref: e9f70bce6c01ff43aa0761f0e3c89d77bb0b96cb
          path: candidate-source
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          clean: true
          persist-credentials: false
      - name: Verify exact checkout before any LFS request
        id: checkout_gate
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $Root = Join-Path $env:GITHUB_WORKSPACE 'candidate-source'
            $Git = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
            # Local metadata only: never print arbitrary Git errors or remote strings.
            $Head = & $Git -C $Root rev-parse HEAD 2>$null
            if ($LASTEXITCODE -ne 0 -or $Head -cne $env:SOURCE_COMMIT) { throw 'Wrong source' }
            $Tree = & $Git -C $Root rev-parse 'HEAD^{tree}' 2>$null
            if ($LASTEXITCODE -ne 0 -or $Tree -cne $env:SOURCE_TREE) { throw 'Wrong source tree' }
            $Remote = & $Git -C $Root remote get-url origin 2>$null
            if ($LASTEXITCODE -ne 0 -or $Remote -cnotin @('https://github.com/rileyaaa/Portable','https://github.com/rileyaaa/Portable.git')) {
              throw 'Wrong fixed remote'
            }
          } catch { throw 'CHECKOUT_IDENTITY_FAILED' }
      - name: Hydrate only the fixed repository LFS objects
        id: hydration
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_NO_LAZY_FETCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Stage = 'prerequisites'; $Code = 'LFS_PREREQUISITE_FAILED'; $ExitCode = $null
          try {
            $Root = Join-Path $env:GITHUB_WORKSPACE 'candidate-source'
            $Git = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
            if (-not $Git -or -not $env:GH_TOKEN -or $env:GITHUB_SERVER_URL -cne 'https://github.com') {
              throw 'LFS prerequisite failed'
            }
            # Same local LFS filter setup and fetch as checkout's lfs:true path.
            # No global config, credential persistence, alternate origin or proxy override.
            function Invoke-Lfs([string]$Arguments, [bool]$Authenticated) {
              $Info = New-Object Diagnostics.ProcessStartInfo
              $Info.FileName = $Git; $Info.Arguments = $Arguments; $Info.WorkingDirectory = $Root
              $Info.UseShellExecute = $false; $Info.CreateNoWindow = $true
              $Info.RedirectStandardOutput = $true; $Info.RedirectStandardError = $true
              $Info.EnvironmentVariables.Remove('GH_TOKEN')
              if ($Authenticated) {
                # Match the pinned checkout action's Basic auth convention, only in this child.
                $Credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:' + $env:GH_TOKEN))
                $Info.EnvironmentVariables['GIT_CONFIG_COUNT'] = '2'
                $Info.EnvironmentVariables['GIT_CONFIG_KEY_1'] = 'http.https://github.com/.extraheader'
                $Info.EnvironmentVariables['GIT_CONFIG_VALUE_1'] = 'AUTHORIZATION: basic ' + $Credential
              }
              $Process = New-Object Diagnostics.Process
              try {
                $Process.StartInfo = $Info
                if (-not $Process.Start()) { throw 'LFS child did not start' }
                # Drain both streams without retaining or printing arbitrary remote diagnostics.
                $OutTask = $Process.StandardOutput.BaseStream.CopyToAsync([IO.Stream]::Null)
                $ErrTask = $Process.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)
                $Process.WaitForExit()
                [void]$OutTask.GetAwaiter().GetResult(); [void]$ErrTask.GetAwaiter().GetResult()
                return [int]$Process.ExitCode
              } finally {
                $Info.EnvironmentVariables.Remove('GIT_CONFIG_VALUE_1')
                $Process.Dispose()
              }
            }
            $Stage = 'local_setup'; $Code = 'LFS_LOCAL_SETUP_FAILED'
            $ExitCode = Invoke-Lfs 'lfs install --local' $false
            if ($ExitCode -ne 0) { throw 'Local LFS filter setup failed' }
            $Stage = 'fetch'; $Code = 'LFS_FETCH_FAILED'; $ExitCode = $null
            $ExitCode = Invoke-Lfs ('lfs fetch origin ' + $env:SOURCE_COMMIT) $true
            if ($ExitCode -ne 0) { throw 'Fixed LFS fetch failed' }
            $Stage = 'checkout_objects'; $Code = 'LFS_CHECKOUT_FAILED'; $ExitCode = $null
            # git lfs checkout materializes local objects; it does not download.
            $ExitCode = Invoke-Lfs 'lfs checkout' $false
            if ($ExitCode -ne 0) { throw 'Local LFS checkout failed' }
            $Stage = 'complete'; $Code = 'OK'
          } catch {
            # Never serialize the exception, process environment or remote output.
            throw 'Fixed LFS hydration failed; see bounded stage/code summary'
          } finally {
            @("stage=$Stage", "code=$Code", "exit_code=$ExitCode") |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Verify raw Python before executing it; build one ZIP and run independent positives
        id: native
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'candidate-source'
          $Git = (Get-Command git.exe -CommandType Application | Select-Object -First 1).Source
          if (-not $Git) { throw 'Runner Git prerequisite missing' }
          if ((& $Git -C $Root rev-parse HEAD).Trim() -cne $env:SOURCE_COMMIT -or
              $LASTEXITCODE -ne 0) { throw 'Source SHA mismatch' }
          if ((& $Git -C $Root rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE -or
              $LASTEXITCODE -ne 0) { throw 'Source tree mismatch' }
          if ((& $Git -C $Root rev-parse 'HEAD:tool/python').Trim() -cne '0acf1ab379c88add26bac05c5af3923e5c6798eb' -or
              $LASTEXITCODE -ne 0) { throw 'Bundled Python tree mismatch' }
          # Python must be an ordinary, exact, fully populated source tree before use.
          function Check-Directory([string]$Path) {
            $Item = Get-Item -LiteralPath $Path -Force
            if (-not $Item.PSIsContainer -or ($Item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "Unsafe input directory: $Path"
            }
          }
          $PythonRoot = Join-Path $Root 'tool\python'
          $Cursor = $PythonRoot
          while ($Cursor) {
            Check-Directory $Cursor
            $Cursor = [IO.Path]::GetDirectoryName($Cursor.TrimEnd('\'))
          }
          $Lines = @(& $Git -C $Root -c core.quotepath=false ls-tree -r --full-tree HEAD -- tool/python)
          if ($LASTEXITCODE -ne 0 -or $Lines.Count -ne 6132) { throw 'Python inventory mismatch' }
          $Names = New-Object 'System.Collections.Generic.List[string]'
          $Blobs = New-Object 'System.Collections.Generic.List[string]'
          $Expected = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::Ordinal)
          foreach ($Line in $Lines) {
            if ($Line -cnotmatch '^(100644|100755) blob ([0-9a-f]{40})\t(tool/python/[ -~]+)$') { throw 'Unexpected Python tree entry' }
            $Blob = $Matches[2]; $Name = $Matches[3]
            if ($Name.Contains('"') -or $Name.Contains('\') -or $Name.Contains(':') -or
                @($Name.Split('/') | Where-Object { $_ -in @('', '.', '..') }).Count -ne 0 -or
                -not $Expected.Add($Name)) { throw 'Unsafe Python tree entry' }
            $Names.Add($Name); $Blobs.Add($Blob)
          }
          $Actual = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::Ordinal)
          $Pending = New-Object 'System.Collections.Generic.Stack[string]'
          $Pending.Push($PythonRoot)
          while ($Pending.Count -gt 0) {
            $Dir = $Pending.Pop(); Check-Directory $Dir
            foreach ($Item in @(Get-ChildItem -LiteralPath $Dir -Force)) {
              if ($Item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Linked Python tree entry' }
              if ($Item.PSIsContainer) { $Pending.Push($Item.FullName); continue }
              if ($null -eq $Item.PSObject.Properties['LinkType'] -or $Item.LinkType -or ([string]$Item.Mode).Contains('l')) {
                throw 'Linked/invalid Python file'
              }
              $Name = $Item.FullName.Substring($Root.Length + 1).Replace('\','/')
              if (-not $Expected.Contains($Name) -or -not $Actual.Add($Name)) { throw 'Extra Python file' }
            }
          }
          if (-not $Actual.SetEquals($Expected)) { throw 'Missing Python file' }
          $Raw = @($Names | & $Git -C $Root hash-object --no-filters --stdin-paths)
          if ($LASTEXITCODE -ne 0 -or $Raw.Count -ne $Blobs.Count) { throw 'Cannot verify raw Python bytes' }
          for ($i=0; $i -lt $Raw.Count; $i++) {
            if ($Raw[$i] -cne $Blobs[$i]) { throw "Raw Python blob mismatch: $($Names[$i])" }
          }
          Write-Output 'BUNDLED_PYTHON_GATE=PASS_ACTUAL files=6132'
          $Python = Join-Path $PythonRoot 'python.exe'
          # ASCII inline Python, avoiding a new tracked helper or host Python.
          $Code = @'
          # Inline review-only supervisor. No repository writes or publication.
          import contextlib
          import ctypes as C
          from ctypes import wintypes as W
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import threading
          import uuid
          import zipfile

          BASE = 'e9f70bce6c01ff43aa0761f0e3c89d77bb0b96cb'
          TREE = '75dbced2a61741f3d452cb344f0e6be4bb3851f4'
          COUNTS = (9350, 165, 9185)
          LABEL = 'v0.172.0-portable.2'  # local filename only
          ROOT = Path(sys.argv[1]).absolute()
          GIT = sys.argv[2]
          PYTHON = ROOT / 'tool/python/python.exe'
          LFS_SINGLE = {'codex.exe', 'codex-code-mode-host.exe', 'codex-command-runner.exe',
                        'codex-windows-sandbox-setup.exe', 'codex-path/rg.exe', 'tool/node/node.exe'}
          PINS = {
              '.gitattributes': 'f6e24317bd3cbf5157715b7d304ecbef3361a0a9',
              '.github/workflows/import-round12.yml': '4b6deae44ab11e353c37a653389317832cbab526',
              '.github/workflows/local-native-tool-paths-once.yml': 'bd2fda2a557880b2a32c0bda092f6c9ae7262feb',
              '.github/workflows/release.yml': '066f09832bb131bed784b82ad16776857fa8e38c',
              'tool/package-release.py': '77b287ca329f52ff5e7ecdbe9d429819fd6e576a',
              'tool/automation/install-browser.py': '5d3f6b1682fb679c1dfaf15b336d4913987ead98',
              'tool/runtime-manifest.json': 'c3677d5962ec02f0c6d755d775052d0d907c2a06',
              'tool/automation/browser-manifest.json': '42d9ff6498a4db108cdced21df0128f4f62d2b65',
              'run-codex.ps1': '2eaac598eaf07eadf725a58308d8e81672a3e2bb',
              'env.ps1': 'fee7920e3e12a56c9f5a7f3693de360c1f49a760',
              'tool/portable-process.ps1': '3e659ab70c0ef7f72b24911dccb74a14f1c0d2fd',
              '\u542f\u52a8Codex.bat': '918453e080c0c93e7298bac6ef371f0a293359f0',
              'tests/audit_release_zip.py': '16c13ea90f050bc3b5b89f88b19fa7fb7adf852e',
              'tests/check_codex_tool_discovery.py': 'c0a8fbae020de5d90b431bb09c78de7fc3af4565',
              'tests/check_codex_browser_mcp.py': 'f044fe65b8fc58521c118afbd5138d687a82ec2d',
              'tests/check_browser_mcp_stdio.py': '4ecc8f2631eafd7fc2832b4cd359c7a8d81e56a7',
              'tool/python/_sqlite3.pyd': '03e85b39712522d52ec8436d8f40d64eafae7591',
              'tool/python/sqlite3.dll': '286e815b65925a71caf38666788e7bcab9b7d4f3',
              'tool/android/platform-tools/sqlite3.exe': '24f88e45539330b50a4f6fa15de190db6c2a2442',
          }


          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)


          def git(*args, data=None):
              return subprocess.run([GIT, '-C', str(ROOT), *args], input=data,
                                    stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                    check=True, timeout=240).stdout


          def ordinary(p, directory=False):
              s = p.lstat()
              require(not (stat.S_ISLNK(s.st_mode) or getattr(s, 'st_file_attributes', 0) & 0x400),
                      'Linked path: ' + str(p))
              require(stat.S_ISDIR(s.st_mode) if directory else stat.S_ISREG(s.st_mode) and s.st_nlink == 1,
                      'Unexpected path type/link count: ' + str(p))
              return s


          def sha(p):
              ordinary(p)
              with p.open('rb') as f:
                  return hashlib.file_digest(f, 'sha256').hexdigest()


          def raw_blob(p):
              s = ordinary(p)
              h = hashlib.sha1(b'blob ' + str(s.st_size).encode('ascii') + b'\0', usedforsecurity=False)
              with p.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()


          def scan_owned(p):
              # Validate the entire new tree before cleanup; never follow a reparse point.
              ordinary(p, True)
              for entry in p.iterdir():
                  s = entry.lstat()
                  require(not (stat.S_ISLNK(s.st_mode) or getattr(s, 'st_file_attributes', 0) & 0x400),
                          'Unexpected link in owned tree')
                  if stat.S_ISDIR(s.st_mode):
                      scan_owned(entry)
                  else:
                      ordinary(entry)


          def read_pointers(blobs):
              keys = sorted(set(blobs))
              out = git('cat-file', '--batch', data=('\n'.join(keys) + '\n').encode('ascii'))
              pos = 0
              records = {}
              for oid in keys:
                  end = out.index(b'\n', pos)
                  header = out[pos:end].decode('ascii').split()
                  require(len(header) == 3 and header[:2] == [oid, 'blob'], 'Missing pinned LFS pointer')
                  size = int(header[2]); pos = end + 1
                  require(0 < size <= 256, 'Unexpected LFS pointer size')
                  body = out[pos:pos+size]
                  require(out[pos+size:pos+size+1] == b'\n', 'Malformed cat-file response')
                  pos += size + 1
                  match = re.fullmatch(rb'version https://git-lfs.github.com/spec/v1\noid sha256:([0-9a-f]{64})\nsize ([0-9]+)\n', body)
                  require(match is not None, 'Invalid fixed LFS pointer ' + oid)
                  require(hashlib.sha1(b'blob ' + str(size).encode() + b'\0' + body,
                                       usedforsecurity=False).hexdigest() == oid, 'Pointer blob mismatch')
                  records[oid] = (match[1].decode(), int(match[2]))
              require(pos == len(out), 'Extra cat-file output')
              return records


          def verify_lfs_payloads(records, lfs, pointers, checked_file, summary):
              for name in sorted(lfs):
                  expected, length = pointers[records[name][1]]
                  # Names and OIDs come only from the validated fixed tree/pointer.
                  failure = {'code': 'LFS_PAYLOAD_UNSAFE_OR_MISSING', 'path': name,
                             'expected_sha256': expected, 'expected_size': length}
                  summary['lfs_identity_error'] = failure
                  try:
                      p, st = checked_file(name)
                  except FileNotFoundError:
                      failure['code'] = 'LFS_PAYLOAD_MISSING'; raise
                  failure['code'] = 'LFS_SIZE_MISMATCH'
                  require(st.st_size == length, 'Fixed LFS payload size mismatch')
                  failure['code'] = 'LFS_DIGEST_MISMATCH_OR_UNREADABLE'
                  require(sha(p) == expected, 'Fixed LFS payload digest mismatch')
              summary['lfs_identity'] = 'PASS_ACTUAL'
              del summary['lfs_identity_error']


          def source_gate(summary):
              require(sys.platform == 'win32' and sys.version_info[:3] == (3, 14, 10)
                      and sys.maxsize > 2**32 and Path(sys.executable).resolve() == PYTHON.resolve(),
                      'Fixed bundled Windows x64 Python required')
              require(git('rev-parse', 'HEAD').decode().strip() == BASE, 'Wrong source commit')
              require(git('rev-parse', 'HEAD^{tree}').decode().strip() == TREE, 'Wrong source tree')
              records = {}
              for line in git('ls-tree', '-rz', '--full-tree', 'HEAD').split(b'\0'):
                  if not line:
                      continue
                  header, rawname = line.split(b'\t', 1)
                  mode, kind, oid = header.decode('ascii').split()
                  name = rawname.decode('utf-8')
                  require(kind == 'blob' and mode in ('100644', '100755') and name not in records,
                          'Unexpected Git entry')
                  require(all(x not in ('', '.', '..') for x in name.split('/')) and '\\' not in name
                          and ':' not in name and not Path(name).is_absolute(), 'Invalid tracked path')
                  records[name] = (mode, oid)
              require(len(records) == COUNTS[0], 'Source count mismatch')
              require(all(records.get(n, (None, None))[1] == oid for n, oid in PINS.items()), 'Fixed blob mismatch')
              index = {}
              for line in git('ls-files', '--stage', '-z').split(b'\0'):
                  if line:
                      header, name = line.split(b'\t', 1)
                      mode, oid, stage = header.decode('ascii').split()
                      name = name.decode('utf-8')
                      require(stage == '0' and name not in index, 'Unexpected index stage')
                      index[name] = (mode, oid)
              require(index == records and all(x.startswith(b'H ') for x in git('ls-files','-v','-z').split(b'\0') if x), 'Index mismatch')
              # Hydration is already complete; distinguish exact LFS identity from raw Git checks.
              summary['lfs_identity'] = 'FAIL'
              summary['lfs_identity_error'] = {'code': 'LFS_INVENTORY_MISMATCH'}
              lfs = {n for n in records if n in LFS_SINGLE or n.startswith('tool/automation/browsers/')}
              require(LFS_SINGLE <= lfs and len(lfs) == 311, 'Fixed LFS inventory mismatch')
              summary['lfs_identity_error'] = {'code': 'LFS_FILTER_POLICY_MISMATCH'}
              attrs = git('check-attr', '-z', '--stdin', 'filter', data=b'\0'.join(n.encode('utf-8') for n in records) + b'\0').split(b'\0')
              require(len(attrs) == 3 * len(records) + 1 and attrs[-1] == b'', 'Attribute response mismatch')
              attrmap = {attrs[i].decode('utf-8'): attrs[i+2] for i in range(0, len(attrs)-1, 3)}
              require(set(attrmap) == set(records) and all(v == (b'lfs' if n in lfs else b'unspecified')
                      for n, v in attrmap.items()), 'Unexpected worktree filter')
              summary['lfs_identity_error'] = {'code': 'LFS_POINTER_INVALID'}
              pointers = read_pointers(records[n][1] for n in lfs)
              summary['lfs_identity_error'] = {'code': 'LFS_TOTAL_BYTES_MISMATCH'}
              require(sum(pointers[records[n][1]][1] for n in lfs) == 1099802486, 'LFS bytes mismatch')
              checked_dirs = set()

              def checked_file(name):
                  p = ROOT / name
                  for parent in reversed(p.parents):
                      if parent not in checked_dirs:
                          ordinary(parent, True); checked_dirs.add(parent)
                  return p, ordinary(p)

              verify_lfs_payloads(records, lfs, pointers, checked_file, summary)
              for name, (_, oid) in records.items():
                  if name not in lfs:
                      p, _ = checked_file(name)
                      require(raw_blob(p) == oid, 'Raw Git blob differs: ' + name)
              require(not git('status', '--porcelain=v1', '--untracked-files=no'), 'Tracked source dirty')
              print('SOURCE_GATE=PASS_ACTUAL files=9350 lfs_paths=311 lfs_bytes=1099802486', flush=True)
              return records


          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod


          def verify_member(package, name, rec):
              p = package / name
              require(ordinary(p).st_size == rec['size'] and sha(p) == rec['sha256'], 'Extracted bytes differ: ' + name)


          # Read-only Windows process observations, only matching owned descendants.
          class Entry(C.Structure):
              _fields_ = [('dwSize', W.DWORD), ('cntUsage', W.DWORD), ('th32ProcessID', W.DWORD),
                          ('th32DefaultHeapID', C.c_size_t), ('th32ModuleID', W.DWORD),
                          ('cntThreads', W.DWORD), ('th32ParentProcessID', W.DWORD),
                          ('pcPriClassBase', W.LONG), ('dwFlags', W.DWORD), ('szExeFile', W.WCHAR * 260)]


          def observe_owned(root_pid, stop, observations, errors):
              k = C.WinDLL('kernel32', use_last_error=True)
              k.CreateToolhelp32Snapshot.argtypes = [W.DWORD, W.DWORD]; k.CreateToolhelp32Snapshot.restype = W.HANDLE
              k.Process32FirstW.argtypes = [W.HANDLE, C.POINTER(Entry)]; k.Process32FirstW.restype = W.BOOL
              k.Process32NextW.argtypes = [W.HANDLE, C.POINTER(Entry)]; k.Process32NextW.restype = W.BOOL
              k.OpenProcess.argtypes = [W.DWORD, W.BOOL, W.DWORD]; k.OpenProcess.restype = W.HANDLE
              k.QueryFullProcessImageNameW.argtypes = [W.HANDLE, W.DWORD, W.LPWSTR, C.POINTER(W.DWORD)]
              k.QueryFullProcessImageNameW.restype = W.BOOL
              k.CloseHandle.argtypes = [W.HANDLE]; k.CloseHandle.restype = W.BOOL
              wanted = {'codex.exe', 'codex-code-mode-host.exe', 'python.exe'}
              try:
