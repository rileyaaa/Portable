                  require(sums.read_text(encoding='ascii').splitlines()==[hashes[p.name]+'  '+p.name for p in (archive,manifest)],'Checksum list mismatch')
                  meta=json.loads(manifest.read_bytes()); files=meta['files']
                  require((meta['source_commit'],meta['target'],meta['codex_version'],meta['package_kind'],meta['release_version'])==
                          (BASE,'x86_64-pc-windows-msvc','0.172.0','customer',LABEL),'Manifest identity mismatch')
                  require(list(files)==names and meta['excluded_files']==excluded and tuple(meta[k] for k in
                          ('source_file_count','excluded_file_count','file_count'))==COUNTS,'Manifest inventory mismatch')
                  # IMPORTANT: normal inherited extraction ACL, not under mkdtemp(0700) release output.
                  owned=scratch/('host-wal-'+uuid.uuid4().hex); owned.mkdir(); ordinary(owned,True)
                  extraction=owned/'\u4e2d\u6587 \u7a7a\u683c'; extraction.mkdir(); package=extraction/'Codex'
                  with zipfile.ZipFile(archive) as z:
                      require(z.namelist()==['Codex/'+n for n in names],'ZIP member list mismatch')
                      z.extractall(extraction)  # producer's safe names already checked; extraction reads CRC
                  scan_owned(package)
                  require({p.relative_to(package).as_posix() for p in package.rglob('*') if p.is_file()}==set(names),'Extraction inventory mismatch')
                  for name,rec in files.items():
                      verify_member(package,name,rec)
                      source=ROOT/name
                      require(ordinary(source).st_size==rec['size'] and sha(source)==rec['sha256'],'ZIP differs from fixed source: '+name)
                  summary.update(zip='ZIP_VERIFIED',archive_sha256=hashes[archive.name],archive_bytes=archive.stat().st_size,
                                 manifest_sha256=hashes[manifest.name],checksums_sha256=hashes[sums.name],file_count=len(files))
                  print('ZIP_VERIFIED '+json.dumps({k:summary[k] for k in ('source_commit','archive_sha256','archive_bytes','manifest_sha256','file_count')}),flush=True)
                  a=load('review_existing_audit',ROOT/'tests/audit_release_zip.py')
                  core=load('review_existing_continuation',ROOT/'tests/check_codex_tool_discovery.py')
                  # Independent WAL first, so a failed Host session cannot contaminate its result.
                  for key,fn in [('wal',lambda:wal_case(package,a,files)),('host',lambda:host_case(package,a,core,files))]:
                      try:
                          # Existing continuation logs may include raw Responses; retain only case evidence.
                          with open(os.devnull,'w',encoding='utf-8') as sink, contextlib.redirect_stdout(sink):
                              summary[key+'_evidence']=fn()
                          summary[key]='PASS_ACTUAL'
                      except Exception as e:
                          summary[key]='FAIL'; summary[key+'_error']=safe_case_error(e)
                  if {p.name:sha(p) for p in (archive,manifest,sums)}!=hashes:
                      summary['zip']='FAIL'; raise RuntimeError('Pristine ZIP/metadata changed')
                  gate_stage='source_postcheck'
                  if git('rev-parse','HEAD').decode().strip()!=BASE or git('status','--porcelain=v1','--untracked-files=no'):
                      summary['source_gate']='FAIL'; raise RuntimeError('Source changed')
              except Exception as e:
                  summary['gate_error']={**safe_case_error(e), 'stage':gate_stage}
                  if summary['source_gate']=='NOT_RUN': summary['source_gate']='FAIL'
                  elif summary['zip']=='NOT_RUN': summary['zip']='FAIL'
              finally:
                  try:
                      for p in (owned,out):
                          if p is not None:
                              scan_owned(p); shutil.rmtree(p); require(not p.exists(),'Owned cleanup failed')
                      summary['cleanup']='PASS_ACTUAL' if owned is not None and out is not None else 'NOT_RUN'
                  except Exception as e:
                      summary['cleanup']='FAIL'; summary['cleanup_error']=safe_case_error(e)
              ok=(summary['source_gate'],summary['lfs_identity'],summary['packager'],summary['zip'],summary['host'],summary['wal'],summary['cleanup'])==(
                  'PASS_ACTUAL','PASS_ACTUAL','PASS_ACTUAL','ZIP_VERIFIED','PASS_ACTUAL','PASS_ACTUAL','PASS_ACTUAL') and 'gate_error' not in summary
              summary['scoped_batch']='PASS_ACTUAL' if ok else 'INCOMPLETE_OR_FAIL'
              payload=json.dumps(summary,ensure_ascii=True,sort_keys=True,separators=(',',':'))
              require(len(payload.encode('ascii'))<=8192, 'Scoped summary exceeds limit')
              # The always step merges actual step outcomes even if checkout or LFS fails.
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8',newline='\n') as stream:
                  stream.write('summary='+payload+'\n')
              return 0 if ok else 1


          if __name__=='__main__':
              sys.exit(main())
          '@
          $Code | & $Python -I -B - $Root $Git
          if ($LASTEXITCODE -ne 0) { throw 'Scoped read-only Host/WAL gate failed; no retry or upload' }
      - name: Report scoped checkout, LFS, packager, WAL and Host result
        if: ${{ always() && !cancelled() }}
        env:
          TRIGGER_OUTCOME: ${{ steps.trigger.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKOUT_GATE_OUTCOME: ${{ steps.checkout_gate.outcome }}
          HYDRATION_OUTCOME: ${{ steps.hydration.outcome }}
          HYDRATION_STAGE: ${{ steps.hydration.outputs.stage }}
          HYDRATION_CODE: ${{ steps.hydration.outputs.code }}
          HYDRATION_EXIT_CODE: ${{ steps.hydration.outputs.exit_code }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          NATIVE_SUMMARY: ${{ steps.native.outputs.summary }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Outcome([string]$Value) {
            switch ($Value) { 'success' { 'PASS_ACTUAL' }; 'failure' { 'FAIL' }; default { 'NOT_RUN' } }
          }
          $Summary = [ordered]@{
            source_commit = $env:SOURCE_COMMIT
            trigger = (Outcome $env:TRIGGER_OUTCOME)
            checkout_action = (Outcome $env:CHECKOUT_OUTCOME)
            checkout_gate = (Outcome $env:CHECKOUT_GATE_OUTCOME)
            checkout = 'NOT_RUN'
            lfs_hydration = (Outcome $env:HYDRATION_OUTCOME)
            lfs_identity = 'NOT_RUN'; source_gate = 'NOT_RUN'; packager = 'NOT_RUN'; zip = 'NOT_RUN'
            wal = 'NOT_RUN'; host = 'NOT_RUN'; cleanup = 'NOT_RUN'; scoped_batch = 'INCOMPLETE_OR_FAIL'
            not_run = @('SAFE/YOLO/maintenance repeats','TUI/resume/fork','write-denial/ACL','ETW/full OS I/O','ADB','Office','full package regression','release')
          }
          if ($Summary.checkout_action -ceq 'FAIL' -or $Summary.checkout_gate -ceq 'FAIL') {
            $Summary.checkout = 'FAIL'
            $Summary.checkout_code = if ($Summary.checkout_action -ceq 'FAIL') { 'CHECKOUT_ACTION_FAILED' } else { 'CHECKOUT_IDENTITY_FAILED' }
          } elseif ($Summary.checkout_action -ceq 'PASS_ACTUAL' -and $Summary.checkout_gate -ceq 'PASS_ACTUAL') {
            $Summary.checkout = 'PASS_ACTUAL'
          }
          if ($env:HYDRATION_OUTCOME -in @('success','failure')) {
            # Only enum values and numeric exit status from the fixed hydration step.
            $Summary.lfs_stage = if ($env:HYDRATION_STAGE -cin @('prerequisites','local_setup','fetch','checkout_objects','complete')) { $env:HYDRATION_STAGE } else { 'unknown' }
            $Summary.lfs_code = if ($env:HYDRATION_CODE -cin @('LFS_PREREQUISITE_FAILED','LFS_LOCAL_SETUP_FAILED','LFS_FETCH_FAILED','LFS_CHECKOUT_FAILED','OK')) { $env:HYDRATION_CODE } else { 'LFS_UNCLASSIFIED' }
            if ($env:HYDRATION_EXIT_CODE -match '^-?[0-9]{1,10}$') { $Summary.lfs_exit_code = [long]$env:HYDRATION_EXIT_CODE }
          }
          $Summary.native_step = (Outcome $env:NATIVE_OUTCOME)
          $Valid = $false
          if ($env:NATIVE_SUMMARY -and $env:NATIVE_SUMMARY.Length -le 8192) {
            try {
              $Native = $env:NATIVE_SUMMARY | ConvertFrom-Json -ErrorAction Stop
              if ($Native.source_commit -cne $env:SOURCE_COMMIT) { throw 'Wrong summary source' }
              # Fields originate solely from the fixed inline supervisor, not raw child output.
              foreach ($Key in @('lfs_identity','source_gate','packager','zip','wal','host','cleanup')) {
                $Value = $Native.$Key
                if ($Value -cnotin @('PASS_ACTUAL','ZIP_VERIFIED','FAIL','NOT_RUN')) { throw 'Invalid scoped status' }
                $Summary[$Key] = $Value
              }
              foreach ($Key in @('lfs_identity_error','packager_error','gate_error','cleanup_error','wal_error','host_error','archive_sha256','archive_bytes','manifest_sha256','checksums_sha256','file_count','wal_evidence','host_evidence','not_run')) {
                if ($null -ne $Native.PSObject.Properties[$Key]) { $Summary[$Key] = $Native.$Key }
              }
              $Valid = $Native.scoped_batch -ceq 'PASS_ACTUAL'
            } catch {
              $Summary.native_summary_error = 'INVALID_NATIVE_SUMMARY'
            }
          } elseif ($env:NATIVE_OUTCOME -in @('success','failure')) {
            $Summary.native_summary_error = 'NATIVE_SUMMARY_ABSENT_OR_OVERSIZE'
          }
          $Passed = $Valid -and $Summary.trigger -ceq 'PASS_ACTUAL' -and $Summary.checkout -ceq 'PASS_ACTUAL' -and
            $Summary.lfs_hydration -ceq 'PASS_ACTUAL' -and $Summary.lfs_code -ceq 'OK' -and $Summary.native_step -ceq 'PASS_ACTUAL' -and
            $Summary.lfs_identity -ceq 'PASS_ACTUAL' -and $Summary.source_gate -ceq 'PASS_ACTUAL' -and
            $Summary.packager -ceq 'PASS_ACTUAL' -and $Summary.zip -ceq 'ZIP_VERIFIED' -and
            $Summary.wal -ceq 'PASS_ACTUAL' -and $Summary.host -ceq 'PASS_ACTUAL' -and $Summary.cleanup -ceq 'PASS_ACTUAL'
          if ($Passed) { $Summary.scoped_batch = 'PASS_ACTUAL' }
          $Json = $Summary | ConvertTo-Json -Depth 8 -Compress
          if ([Text.Encoding]::UTF8.GetByteCount($Json) -gt 16384) { throw 'Scoped summary too large' }
          Write-Output ('HOST_WAL_SUMMARY=' + $Json)
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ('```json' + "`n" + $Json + "`n" + '```' + "`n"), (New-Object Text.UTF8Encoding($false)))
          if (-not $Passed) { throw 'Scoped gate incomplete or failed; no retry or upload' }
