                                          capture_output=True,timeout=1500,check=False)
              except subprocess.TimeoutExpired:
                  summary['packager_error'] = {'stage':'packager','code':'PACKAGER_TIMEOUT'}
                  raise RuntimeError('Packager deadline; see packager_error') from None
              except OSError:
                  summary['packager_error'] = {'stage':'packager','code':'PACKAGER_START_FAILED'}
                  raise RuntimeError('Packager start failed; see packager_error') from None
              if result.returncode != 0:
                  summary['packager_error'] = packager_failure(result.stderr, result.returncode)
                  raise RuntimeError('Packager nonzero; see packager_error')
              try:
                  info = json.loads(result.stdout)
