# One-time cleanup of this review's artifact; no source or release changes.
name: Remove temporary source review artifact
on:
  push:
    branches: [main]
    paths: [.github/workflows/review-two-pass-once.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify artifact identity and delete only this review export
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/review-cleanup-gh
        run: |
          import json,os,pathlib,subprocess
          scratch=pathlib.Path(os.environ['GH_CONFIG_DIR'])
          scratch.mkdir(parents=True,exist_ok=False)
          endpoint='repos/rileyaaa/Codex-Portable/actions/artifacts/12570072067'
          result=subprocess.run(['gh','api',endpoint],text=True,capture_output=True)
          if result.returncode:
              if 'HTTP 404' not in result.stderr: raise SystemExit('Could not verify the review artifact.')
              print('REVIEW_ARTIFACT_ALREADY_ABSENT=12570072067')
          else:
              record=json.loads(result.stdout)
              assert record['id']==12570072067
              assert record['name']=='verified-source-final-review'
              assert record['workflow_run']['id']==40117796342
              assert record['workflow_run']['head_sha']=='8335864e85fc17df416318ba9d99177d5d2f1447'
              subprocess.run(['gh','api','--method','DELETE',endpoint],check=True,capture_output=True)
              check=subprocess.run(['gh','api',endpoint],text=True,capture_output=True)
              assert check.returncode and 'HTTP 404' in check.stderr,'Artifact removal could not be confirmed.'
              print('REVIEW_ARTIFACT_DELETED=12570072067')
      - name: Remove owned cleanup state
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/review-cleanup-gh"
