# Temporary owner-requested source inspection; no publication or production changes.
name: Export current source for review
on:
  push:
    branches: [main]
    paths: [.github/workflows/review-two-pass-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b83d72740dc26709475aa3f8c8bd3ff60988fefe
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Export tracked non-vendor source with exact byte identities
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert commit=='b83d72740dc26709475aa3f8c8bd3ff60988fefe'
          records=[]
          for entry in subprocess.check_output(['git','ls-tree','-rz','--full-tree','HEAD']).split(b'\0'):
              if not entry: continue
              metadata,path=entry.split(b'\t',1)
              mode,kind,sha=metadata.decode('ascii').split()
              records.append({'path':path.decode('utf-8'),'mode':mode,'kind':kind,'blob':sha})
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.psd1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.rules','.toml','.css','.html','.sh'}
          selected=[r for r in records if r['kind']=='blob' and r['mode'] in ('100644','100755') and not r['path'].startswith(excluded) and (pathlib.PurePosixPath(r['path']).suffix.lower() in suffixes or r['path'] in ('.gitignore','.gitattributes'))]
          for r in selected:
              p=r['path']; parts=p.lower().split('/')
              assert parts[0] not in ('tmp','work','logs','cache','appdata','localappdata','sqlite','home-runtime')
              assert not any(x in ('env.local.ps1','auth.json','auth-account-json.json','auth-browser.json') for x in parts)
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+r['path'] for r in selected)+'\n',text=True,check=True)
          scratch=root/'tmp'/'source-review-export'
          scratch.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(scratch/'source-review.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for r in selected:
                  data=(root/r['path']).read_bytes()
                  assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==r['blob'],r['path']
                  r['sha256']=hashlib.sha256(data).hexdigest()
                  archive.writestr('source/'+r['path'],data)
              archive.writestr('inventory.json',json.dumps({'commit':commit,'tracked':records,'selected':selected},ensure_ascii=False,indent=2))
          print('EXPORTED_SOURCE_COMMIT='+commit+' FILES='+str(len(selected)))
      - name: Retain review transfer for at most one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-source-review
          path: tmp/source-review-export/source-review.zip
          retention-days: 1
          if-no-files-found: error
      - name: Remove only the owned export directory
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/source-review-export"
