name: One-time CLI order review
on:
  push:
    branches: [main]
    paths: [.github/workflows/cli-order-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /run-codex.ps1
            /env.ps1
            /DEVELOPMENT.md
            /tests/
            /Version_History/
            /tool/automation/portable-automation.ps1
      - name: Reproduce model selection after a positional TUI prompt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          . ./tests/test_cli_model_options.ps1
          $inputArgs=New-Object 'System.Collections.Generic.List[string]'
          foreach($token in @('Inspect this project','-m=portable-order-model','--version')){$inputArgs.Add($token)}
          $null=Test-AndNormalizeCodexCliArgs -InputArgs $inputArgs
          if($script:CliModelOverride -cne ''){throw 'Baseline behavior differs from the reviewed defect.'}
          Write-Output 'REPRODUCED: prompt-first -m is forwarded to native CLI but absent from launcher model state.'
      - name: Stop publication of the superseded candidate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/cli-order-review/gh
        run: |
          import json,os,pathlib,subprocess
          pathlib.Path('tmp/cli-order-review').mkdir(parents=True,exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY']
          data=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/40081278730'],text=True))
          assert data['head_sha']=='401c10f4ec440af905c1d20ff19e864bf5494b01'
          if data['status']!='completed':
              subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/runs/40081278730/cancel'],check=True)
          releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
          assert not any(r['tag_name']=='v2026.10.24.2' for r in releases),'Do not overwrite a release or draft'
      - name: Correct only root prompt classification and add regression coverage
        shell: python
        run: |
          import hashlib,pathlib,subprocess
          root=pathlib.Path.cwd();path=root/'run-codex.ps1';raw=path.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='c0a3138506154c2d959ca54e3b78b30be62fb6f8'
          text=raw.decode('utf-8-sig');nl='\r\n' if '\r\n' in text else '\n'
          def once(old,new):
              global text
              assert text.count(old)==1,old
              text=text.replace(old,new,1)
          once('    $rootCommand = ""','    $rootCommand = ""'+nl+'    $rootIsPrompt = $false')
          once('$modelOptionApplies = [string]::IsNullOrWhiteSpace($rootCommand)','$modelOptionApplies = $rootIsPrompt -or [string]::IsNullOrWhiteSpace($rootCommand)')
          commands="'agents','tcp-tunnel','exec','e','review','login','logout','mcp','plugin','app-server','remote-control','app','completion','update','doctor','sandbox','debug','execpolicy','apply','a','resume','queue','archive','delete','migrate-rollouts','migrate-nfs-db','unarchive','fork','cloud','cloud-tasks','responses-api-proxy','stdio-to-uds','exec-server','features','mcp-server','help'"
          line='            $rootCommand = $lower'
          extra=nl+'            # A positional TUI prompt is not a subcommand; later -m still applies.'+nl+'            # Match the pinned CLI command spelling case-sensitively, not prompt text.'+nl+'            $rootIsPrompt = $arg -cnotin @('+commands+')'
          once(line,line+extra)
          output=(b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b'')+text.encode('utf-8')
          for p in [path]+[root/'Version_History'/(mode+'-run-codex.ps1') for mode in ('YOLO mode专用包','常用模式专用包')]:p.write_bytes(output)
          path=root/'tests/test_cli_model_options.ps1';text=path.read_text(encoding='utf-8')
          anchor="    @{ Name = 'empty short equals'; Tokens = @('-m='); Reject = $true },"
          assert text.count(anchor)==1
          cases=[
              "    @{ Name = 'prompt then short separate'; Tokens = @('Inspect this project', '-m', 'after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'prompt then short attached'; Tokens = @('Inspect this project', '-mafter-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'prompt then short equals'; Tokens = @('Inspect this project', '-m=after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'prompt then long separate'; Tokens = @('Inspect this project', '--model', 'after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'prompt then long equals'; Tokens = @('Inspect this project', '--model=after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'model before and after prompt'; Tokens = @('-m=before', 'Inspect this project', '--model=after'); Value = 'after' },",
              "    @{ Name = 'exec prompt then model'; Tokens = @('exec', 'Inspect this project', '-m=after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'case-sensitive positional prompt'; Tokens = @('Review', '-m=after-prompt'); Value = 'after-prompt' },",
              "    @{ Name = 'prompt terminator preserves literal'; Tokens = @('Inspect this project', '--', '-m=literal'); Value = '' },",
              "    @{ Name = 'prompt then empty model'; Tokens = @('Inspect this project', '-m='); Reject = $true },",
              "    @{ Name = 'prompt then missing model'; Tokens = @('Inspect this project', '--model'); Reject = $true },",
          ]
          path.write_text(text.replace(anchor,'\n'.join(cases)+'\n'+anchor,1),encoding='utf-8')
          path=root/'tests/test_launcher_smoke.ps1';raw=path.read_bytes()
          old=b"$modelArgument = if ($expectedModel) { ' -m=' + $expectedModel } else { '' }"
          new=b"$modelArgument = if ($expectedModel) { ' \"Synthetic offline prompt\" -m=' + $expectedModel } else { '' }"
          assert raw.count(old)==1
          path.write_bytes(raw.replace(old,new,1))
          path=root/'DEVELOPMENT.md';text=path.read_text(encoding='utf-8')
          old='增加 16 项生产解析回归，并在中文搬迁场景验证短参数、生成配置与原生客户端的一致性。'
          new='继续修正先写 TUI 提示词再写模型参数时启动器漏读覆盖的问题：按固定版本命令名区分子命令与提示词，保留插件 marketplace 参数和 `--` 边界。27 项生产解析回归覆盖参数形式、提示词前后顺序与空值拒绝；中文搬迁场景同时验证提示词在前的短参数、生成配置与原生客户端的一致性。修复后重新执行独立复查，再进入完整 Windows 发布验收。'
          assert text.count(old)==1
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--check'],check=True)
      - name: Verify production parser and mode copies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & pwsh -NoProfile -NonInteractive -File ./tests/test_cli_model_options.ps1
          if($LASTEXITCODE -ne 0){throw 'Production argument regression failed.'}
          & pwsh -NoProfile -NonInteractive -File ./tests/test_permission_display.ps1
          if($LASTEXITCODE -ne 0){throw 'Permission display regression failed.'}
          & python -B -m unittest discover -s tests -p test_mode_copies.py -v
          if($LASTEXITCODE -ne 0){throw 'Mode copies differ.'}
      - name: Commit only the reproduced fix and its coverage
        id: commit
        shell: python
        run: |
          import os,pathlib,subprocess
          paths=['run-codex.ps1','tests/test_cli_model_options.ps1','tests/test_launcher_smoke.ps1','DEVELOPMENT.md']
          paths += ['Version_History/'+mode+'-run-codex.ps1' for mode in ('YOLO mode专用包','常用模式专用包')]
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--']+paths,check=True)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          subprocess.run(['git','commit','-m','fix: honor model options after a positional TUI prompt'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          print('REPAIRED_COMMIT='+commit)
      - name: Remove owned review state
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/cli-order-review"
  recheck:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair.outputs.commit }}
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /DEVELOPMENT.md
      - name: Independently inspect the complete first-party source and bounded changes
        shell: python
        run: |
          import ast,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path.cwd()
          paths=[p.decode('utf-8') for p in subprocess.check_output(['git','ls-tree','-rz','--name-only','HEAD']).split(b'\0') if p]
          excluded=('tool/python/','tool/node/node_modules/','tool/automation/playwright/','tool/automation/browsers/')
          suffixes={'.ps1','.psm1','.py','.js','.cjs','.mjs','.bat','.cmd','.md','.json','.yml','.yaml','.txt','.html','.css','.toml','.rules'}
          selected=[p for p in paths if not p.startswith(excluded) and pathlib.PurePosixPath(p).suffix.lower() in suffixes]
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join('/'+p for p in selected)+'\n',text=True,check=True)
          base='401c10f4ec440af905c1d20ff19e864bf5494b01'
          subprocess.run(['git','fetch','--filter=blob:none','--depth=1','origin',base],check=True)
          changed={p.decode('utf-8') for p in subprocess.check_output(['git','diff','--name-only','-z',base,'HEAD']).split(b'\0') if p}
          expected={'run-codex.ps1','tests/test_cli_model_options.ps1','tests/test_launcher_smoke.ps1','DEVELOPMENT.md','.github/workflows/cli-order-once.yml'}
          expected.update('Version_History/'+mode+'-run-codex.ps1' for mode in ('YOLO mode专用包','常用模式专用包'))
          assert changed==expected,changed
          old=subprocess.check_output(['git','show',base+':run-codex.ps1']).decode('utf-8-sig')
          text=(root/'run-codex.ps1').read_bytes().decode('utf-8-sig');nl='\r\n' if '\r\n' in old else '\n'
          additions=[line for line in text.splitlines() if line.strip()=='$rootIsPrompt = $false' or line.lstrip().startswith(('# A positional TUI prompt is not a subcommand;', '# Match the pinned CLI command spelling case-sensitively,', '$rootIsPrompt = $arg -cnotin @('))]
          assert len(additions)==4
          restored=text
          for line in additions:assert restored.count(line+nl)==1;restored=restored.replace(line+nl,'',1)
          restored=restored.replace('$modelOptionApplies = $rootIsPrompt -or [string]::IsNullOrWhiteSpace($rootCommand)','$modelOptionApplies = [string]::IsNullOrWhiteSpace($rootCommand)',1)
          assert restored==old,'Unrelated production behavior changed'
          py=js=bats=0
          for p in selected:
              if p.endswith('.py'):ast.parse((root/p).read_text(encoding='utf-8-sig'),filename=p);py+=1
              elif p.endswith(('.js','.cjs','.mjs')):subprocess.run(['node','--check',p],check=True,capture_output=True,timeout=15);js+=1
              elif p.endswith('.bat') and '/' not in p:
                  b=(root/p).read_bytes();b.decode('ascii');assert b'\n' not in b.replace(b'\r\n',b''),p;bats+=1
          subprocess.run(['python','-B','-m','unittest','discover','-s','tests','-p','test_mode_copies.py','-v'],check=True)
          settings=re.findall(r'^\s*\$env:(CODEX_\w+)\s*=\s*"([^"]*)"',(root/'env.ps1').read_text(encoding='utf-8-sig'),re.M)
          consumers=text+(root/'login-json.ps1').read_text(encoding='utf-8-sig')
          assert len(settings)==42 and all(name in consumers for name,value in settings)
          manifest=(root/'tool/runtime-manifest.json').read_bytes()
          pin=re.search(r'\$ExpectedRuntimeManifestSha256\s*=\s*"([0-9a-fA-F]{64})"',text)[1].lower()
          assert hashlib.sha256(manifest).hexdigest()==pin
          workflow=(root/'.github/workflows/release.yml').read_text()
          assert workflow.count('if: $'+"{{ success() && inputs.publish_release && inputs.check_set == 'full' }}")==2
          for test in ('test_permission_display','test_cli_model_options','test_launcher_smoke','test_extension_migration'):
              assert workflow.count('      - name: Windows PowerShell 5.1 - '+test+'\n')==1
          print('INDEPENDENT_SOURCE_REVIEW=PASS python='+str(py)+' javascript='+str(js)+' root_bat='+str(bats)+' settings='+str(len(settings)))
      - name: Fresh production behavior regression and complete PowerShell parsing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$count=0
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]tmp[\\/]' } | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($_.FullName+': '+($errors.Message -join '; '))};$count++
          }
          foreach($name in @('test_cli_model_options','test_permission_display','test_extension_policy','test_extension_migration')) {
            & pwsh -NoProfile -NonInteractive -File (Join-Path $PWD ('tests/'+$name+'.ps1'))
            if($LASTEXITCODE -ne 0){throw ('Independent regression failure: '+$name)}
          }
          Write-Output "INDEPENDENT_BEHAVIOR_REVIEW=PASS parsed=$count (Windows execution remains mandatory)"
  dispatch:
    needs: [repair, recheck]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch final full Windows validation after bridge removal
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ github.workspace }}/tmp/cli-order-dispatch/gh
          REVIEWED_COMMIT: ${{ needs.repair.outputs.commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          import json,os,pathlib,subprocess,time
          pathlib.Path('tmp/cli-order-dispatch').mkdir(parents=True,exist_ok=True)
          repo=os.environ['GITHUB_REPOSITORY'];reviewed=os.environ['REVIEWED_COMMIT']
          for attempt in range(90):
              remote=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/main'],text=True))['object']['sha']
              if remote!=reviewed:
                  diff=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/compare/'+reviewed+'...'+remote],text=True))['files']
                  assert len(diff)==1 and diff[0]['filename']=='.github/workflows/cli-order-once.yml' and diff[0]['status']=='removed'
                  releases=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'],text=True))
                  assert not any(r['tag_name']=='v2026.10.24.2' for r in releases)
                  payload=json.dumps({'ref':'main','inputs':{'version':'v2026.10.24.2','publish_release':'true','check_set':'full'}})
                  subprocess.run(['gh','api','--method','POST','repos/'+repo+'/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True)
                  print('FINAL_WINDOWS_DISPATCHED='+remote);break
              time.sleep(4)
          else:raise SystemExit('Temporary bridge was not removed within the finite wait')
      - name: Remove owned dispatch state
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/tmp/cli-order-dispatch"
